  background:var(--grad);color:#fff;

  box-shadow:0 2px 10px rgba(15,30,60,.18)
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow>div{min-width:0;flex:1;overflow:hidden}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:11.5px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn{background:#d6e1fa;border:none;color:#1e40af;border-radius:10px;

.header-logo{width:36px;height:36px;border-radius:50%;flex-shrink:0;object-fit:cover;
  box-shadow:0 0 0 2px rgba(255,255,255,.5)}
main{flex:1;padding:16px;overflow-y:auto}
.hidden{display:none!important}

/* dashboard */
.stats-block{position:relative;cursor:pointer}
.stats-block:active{opacity:.85}
.stats-arrow{position:absolute;top:6px;right:0;font-size:20px;color:var(--sub);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}

.stat .l{font-size:11px;color:var(--sub);margin-top:2px}

/* màn hình Thống kê (FR_012) */
.stats-hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);text-align:center}
.stats-hero .n{font-size:44px;font-weight:800;color:var(--brand)}
.stats-hero .l{font-size:13px;color:var(--sub);margin-top:4px}
.heatmap-grid{display:inline-grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;gap:3px}
.heatmap-cell{width:12px;height:12px;border-radius:3px;background:var(--line)}
.heatmap-cell.future{background:transparent}
.heatmap-cell.l1{background:#bbf7d0}
.heatmap-cell.l2{background:#4ade80}
.heatmap-cell.l3{background:#15803d}
.forecast-chart{display:flex;align-items:flex-end;gap:8px;margin:14px 0 4px}
.forecast-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center}
.forecast-bar{width:100%;border-radius:6px 6px 0 0;background:var(--brand2);min-height:4px}
.forecast-bar.today{background:var(--brand)}
.forecast-num{font-size:12px;font-weight:700;margin-bottom:4px;color:var(--ink);font-variant-numeric:tabular-nums}
.forecast-label{font-size:10.5px;color:var(--sub);margin-top:6px}
.progwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.progwrap .t{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:8px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#22c55e);border-radius:99px;transition:width .5s}

.sectitle{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin:6px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{background:var(--card);border:1.5px solid var(--line);color:var(--sub);border-radius:99px;
  padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pager-btn{background:var(--soft);border:1.5px solid var(--line);color:var(--brand);border-radius:50%;
  width:34px;height:34px;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;padding:0}
.pager-btn:disabled{opacity:.3;cursor:default}
.deck-grid-wrap{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.deck-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;min-width:0}
.deck-card{background:var(--brand);border:none;color:#fff;border-radius:14px;padding:10px 8px;

.deck-card .deck-icons{font-size:13px;line-height:1;min-height:14px;max-height:14px;overflow:hidden;flex-shrink:0}

.deck-card.done{background:#16a34a}
.deck-card.on{background:#dbeafe;color:#1e40af;box-shadow:0 0 0 2px var(--brand) inset}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 14px;
  cursor:pointer;box-shadow:var(--shadow);transition:.15s;text-align:left;position:relative;overflow:hidden}
.mode:active{transform:scale(.97)}

.mode.new-tag::before{content:'MỚI';position:absolute;top:10px;right:10px;background:var(--accent);
  color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:2px 8px}

/* generic button */
.btn{border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;transition:.12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:#fff;width:100%}

.row{display:flex;gap:10px}

/* card / flashcard */

/* điền từ vào câu (FR_009) */

  background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:14px}

/* phản xạ 3 giây (FR_010) */
.reflex-ring-wrap{position:relative;width:104px;height:104px;margin:18px auto}

/* speaking / mic */
.mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--brand);color:#fff;font-size:40px;

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}70%{box-shadow:0 0 0 22px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}

/* reading / kaiwa */
.sent-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:20px;margin-bottom:14px}
.sent-jp{font-size:22px;font-weight:700;line-height:1.6;letter-spacing:.5px}

.sent-controls{display:flex;gap:10px;margin-top:12px;align-items:center}
.sent-controls .speaker{margin:0;width:44px;height:44px;font-size:20px}
.speed-btn{background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;
  font-size:13px;font-weight:600;color:var(--brand);cursor:pointer}
.speed-btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}

.kaiwa-bubble{border-radius:16px;padding:14px 16px;margin-bottom:10px;max-width:85%;position:relative;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kaiwa-bubble.left{background:#eff6ff;border:1px solid #bfdbfe;align-self:flex-start;border-bottom-left-radius:4px}
.kaiwa-bubble.right{background:#f0fdf4;border:1px solid #bbf7d0;align-self:flex-end;border-bottom-right-radius:4px}
.kaiwa-role{font-size:11px;font-weight:700;margin-bottom:4px}

.kaiwa-text{font-size:18px;font-weight:600;line-height:1.6}
.kaiwa-vi{font-size:13px;color:var(--sub);margin-top:4px}
.kaiwa-container{display:flex;flex-direction:column;gap:4px}
.kaiwa-highlight{background:rgba(37,99,235,.12);border-radius:4px;padding:0 2px}

.mic-sm{width:40px;height:40px;border-radius:50%;border:none;background:var(--brand);color:#fff;

.mic-sm.rec{background:var(--bad);animation:pulse 1.2s infinite}

.fb{text-align:center;font-size:16px;font-weight:700;margin-top:14px;min-height:24px}

  background:rgba(30,41,59,.94);color:#fff;font-size:13px;font-weight:600;
  padding:10px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:52px} .done h2{margin:10px 0 6px}

/* mic permission banner */
.mic-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:12px;padding:12px 14px;margin-bottom:14px;
  font-size:13px;color:#856404;line-height:1.5}
.mic-banner button{background:#ffc107;border:none;border-radius:8px;padding:8px 14px;font-size:13px;
  font-weight:700;color:#856404;cursor:pointer;margin-top:8px}

footer{text-align:center;font-size:11px;color:var(--sub);padding:14px}

/* settings */
.settings-btn{background:#d6e1fa;border:none;color:#1e40af;border-radius:10px;
  padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;
  white-space:nowrap;flex-shrink:0}
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.settings-panel{background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:560px;
  max-height:85vh;overflow-y:auto;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.settings-panel h3{margin:0 0 16px;font-size:17px}
.settings-panel label{font-size:13px;font-weight:600;color:var(--sub);display:block;margin-bottom:4px}
.settings-panel select{width:100%;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:10px;font-size:14px;margin-bottom:14px;background:var(--bg)}
.settings-panel .hint{font-size:11px;color:var(--sub);margin:-10px 0 14px;line-height:1.4}
.tts-status{font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:14px}
.tts-ok{background:#dcfce7;color:#166534}
.tts-no{background:var(--soft);color:var(--sub)}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.slider-row input[type=range]{flex:1;height:6px}
.slider-row .slider-val{min-width:36px;text-align:center;font-weight:700;font-size:14px;color:var(--brand)}
.gender-btns{display:flex;gap:8px;margin-bottom:14px}
.gender-btn{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;
  font-weight:600;cursor:pointer;text-align:center;background:var(--bg);color:var(--sub)}
.gender-btn.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.reflex-btns{display:flex;gap:8px;margin-bottom:14px}
.reflex-btn{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;
  font-weight:600;cursor:pointer;text-align:center;background:var(--bg);color:var(--sub)}
.reflex-btn.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

/* xuất / nhập tiến độ (FR_011) */
.export-summary{font-size:12.5px;color:var(--sub);margin:-8px 0 12px;line-height:1.5}
.export-area{width:100%;min-height:110px;font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;
  padding:10px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;resize:vertical;background:var(--bg);color:var(--ink)}
.compare-table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.compare-table td,.compare-table th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.compare-table th:first-child,.compare-table td:first-child{text-align:left;color:var(--sub);font-weight:600}

/* topic selection */
.topics{display:flex;flex-direction:column;gap:12px}
.topic-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px 16px;
  cursor:pointer;box-shadow:var(--shadow);transition:.15s;display:flex;align-items:center;gap:14px;position:relative}
.topic-card:active{transform:scale(.98)}
.topic-card .tc-icon{font-size:32px;min-width:42px;text-align:center}
.topic-card .tc-body{flex:1}
.topic-card .tc-title{font-size:16px;font-weight:700}
.topic-card .tc-sub{font-size:12.5px;color:var(--sub);margin-top:2px}

/* IT業務編 — audio player + transcript */
.player-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:22px 20px;text-align:center;margin-bottom:14px}

<body>
<div class="app">
  <header>
    <div class="hrow">
      <button class="backbtn hidden" id="backBtn">← 戻る</button>
      <img class="header-logo hidden" id="headerLogo" alt="Kokoro Nihongo">
      <div>
        <h1 id="hTitle">ココロ日本語</h1>
        <div class="sub" id="hSub">Kokoro Nihongo · <span id="hCount">__COUNT__</span> từ</div>
      </div>
      <button class="settings-btn" id="settingsBtn" title="Cài đặt">⚙️ 設定</button>
    </div>
  </header>
  <main id="main"></main>
  <footer>Kokoro Nihongo v2.0 · __GEN_DATE__ · Dữ liệu từ 日本語の辞書.xlsx</footer>
</div>

<script>
/* ═══════════════ DATA ═══════════════ */
const VOCAB = /*__VOCAB__*/[];
const GYOUMU = /*__GYOUMU__*/[];
const GEN_DATE = "__GEN_DATE__";

/* ═══════════════ STORAGE / SRS ═══════════════ */
const LS_KEY = "jp_learn_v1";
const INTERVALS = [0, 1, 2, 4, 7, 15, 30];
let store = load();
if(!store.deckDone) store.deckDone={}; // migrate: user cũ chưa có field này
if(!store.favorites) store.favorites={}; // migrate: user cũ chưa có field này
if(!store.stats.history) store.stats.history={}; // migrate: user cũ chưa có field này (FR_012)
function load(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || defaultStore(); }
  catch(e){ return defaultStore(); }
}
function defaultStore(){ return {cards:{},stats:{studied:0,streak:0,lastDay:null,history:{}},deckDone:{},favorites:{}}; }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
function today(){ return new Date().toISOString().slice(0,10); }
function cardState(id){
  if(!store.cards[id]) store.cards[id] = {box:0, due:today(), correct:0, seen:0, mastered:false};
  return store.cards[id];
}
function isMastered(id){ var c=store.cards[id]; return !!(c && c.mastered); }
function toggleMastered(id){ var c=cardState(id); c.mastered=!c.mastered; save(); return c.mastered; }
function isFavorite(id){ return !!store.favorites[id]; }
function toggleFavorite(id){
  if(store.favorites[id]) delete store.favorites[id]; else store.favorites[id]=true;
  save();
  return isFavorite(id);
}
function isDue(id){
  const c = store.cards[id];
  if(!c) return true;
  return c.due <= today();
}
function reviewCard(id, quality){
  const c = cardState(id);
  c.seen++;
  if(quality===0){ c.box=Math.max(0,c.box-1); }
  else if(quality===1){ /* stay */ }
  else if(quality===2){ c.box=Math.min(INTERVALS.length-1,c.box+1); c.correct++; }
  else { c.box=Math.min(INTERVALS.length-1,c.box+2); c.correct++; }
  const d = new Date(); d.setDate(d.getDate()+INTERVALS[c.box]);
  c.due = d.toISOString().slice(0,10);
  bumpStudied();
  save();
}

/* ═══════════════ SPEECH (Google Translate TTS + Device fallback) ═══════════════ */
let allJaVoices=[];
let jaVoice=null;
let currentAudio=null;
let currentGyoumuAudio=null;

function loadJaVoices(){
  if(!('speechSynthesis' in window)) return;
  var vs=speechSynthesis.getVoices();
  allJaVoices = vs.filter(function(v){return v.lang==='ja-JP'||v.lang.startsWith('ja');});
  pickVoiceByGender();
}
function pickVoiceByGender(){
  if(allJaVoices.length===0){ jaVoice=null; return; }
  // Try to use saved voiceName first
  if(ttsSettings.voiceName){
    var saved = allJaVoices.find(function(v){return v.name===ttsSettings.voiceName;});
    if(saved){ jaVoice=saved; return; }
  }
  // Heuristic: female names often contain keywords
  var femaleKw = ['female','woman','haruka','kyoko','nanami','o-ren','misaki','ren','女'];
  var maleKw = ['male','man','ichiro','keita','otoya','takumi','男'];
  var kw = ttsSettings.gender==='male' ? maleKw : femaleKw;
  var match = allJaVoices.find(function(v){
    var n=v.name.toLowerCase();
    return kw.some(function(k){return n.indexOf(k)>=0;});
  });
  jaVoice = match || allJaVoices[0];
}
if('speechSynthesis' in window){
  loadJaVoices();
  speechSynthesis.onvoiceschanged=loadJaVoices;
  setTimeout(loadJaVoices, 500);
}

function stopSpeech(){
  if(currentAudio){ try{currentAudio.pause();currentAudio.currentTime=0;}catch(e){} currentAudio=null; }
  if(currentGyoumuAudio){ try{currentGyoumuAudio.pause();}catch(e){} }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(isNativeApp() && nativeTTS()){ try{ nativeTTS().stop(); }catch(e){} }
}

/* Google Translate TTS — 2 endpoint biến thể (client=gtx / client=tw-ob) — dùng làm dự phòng cho nhau
   vì endpoint không chính thức, có thể bị chặn/giới hạn khác nhau tuỳ mạng/thiết bị */
function gTranslateTTSUrl(text, speed, variant){
  var t = encodeURIComponent(text.substring(0,200));
  var spd = speed || ttsSettings.speed || 0.9;
  if(variant==='tw-ob') return 'https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&ttsspeed='+spd+'&q='+t;
  return 'https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=ja&client=gtx&ttsspeed='+spd+'&q='+t;
}

/* Split long text into chunks for Google TTS (max ~200 chars per request) */
function splitText(text, maxLen){
  if(text.length<=maxLen) return [text];
  var chunks=[], remaining=text;
  while(remaining.length>0){
    if(remaining.length<=maxLen){ chunks.push(remaining); break; }
    var cut=remaining.lastIndexOf('。', maxLen);
    if(cut<1) cut=remaining.lastIndexOf('、', maxLen);
    if(cut<1) cut=remaining.lastIndexOf(' ', maxLen);
    if(cut<1) cut=maxLen;
    else cut=cut+1;
    chunks.push(remaining.substring(0,cut));
    remaining=remaining.substring(cut);
  }
  return chunks;
}

/* Timeout mặc định cho 1 request Google TTS — tránh treo vô thời hạn nếu WebView
   (đặc biệt Android native) chặn network tới translate.googleapis.com mà không bắn onerror.
   Tăng lên 8s (từ 5s) vì mạng di động/WebView có thể chậm hơn dự kiến — ưu tiên tránh
   fallback nhầm khi mạng chỉ chậm tạm thời, hơn là timeout gấp gây báo lỗi oan. */
const TTS_TIMEOUT_MS = 8000;
function playAudioUrl(url, timeoutMs){
  timeoutMs = timeoutMs || TTS_TIMEOUT_MS;
  return new Promise(function(resolve){
    stopSpeech();
    currentAudio = new Audio(url);
    var settled=false;
    var timer=setTimeout(function(){
      if(settled) return; settled=true;
      if(currentAudio){ try{currentAudio.pause();}catch(e){} }
      currentAudio=null;
      resolve('error:timeout');
    }, timeoutMs);
    currentAudio.onended = function(){ if(settled)return; settled=true; clearTimeout(timer); currentAudio=null; resolve('ok'); };
    currentAudio.onerror = function(){
      if(settled)return; settled=true; clearTimeout(timer);
      var code = (currentAudio && currentAudio.error) ? currentAudio.error.code : '?';
      currentAudio=null; resolve('error:media'+code);
    };
    currentAudio.play().catch(function(e){ if(settled)return; settled=true; clearTimeout(timer); resolve('error:play('+(e&&e.name||'?')+')'); });
  });
}

/* Toast ngắn — dùng khi cả 2 đường phát âm (Google TTS + device TTS) đều thất bại */
let toastTimer=null;
function showToast(msg, duration){
  duration = duration || 2500;
  var el = document.getElementById('kokoroToast');
  if(!el){
    el = document.createElement('div');
    el.id='kokoroToast';
    el.className='toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, duration);
}

/* Device voice (offline) — applies speed, pitch, voice settings. Trả về false nếu speechSynthesis không khả dụng (VD Android WebView) */
function deviceSpeak(text, rateOverride){
  if(!('speechSynthesis' in window)||!text) return false;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';
  u.rate = rateOverride || ttsSettings.speed || 0.9;
  u.pitch = ttsSettings.pitch || 1.0;
  if(jaVoice) u.voice=jaVoice;
  speechSynthesis.speak(u);
  return true;
}
function deviceSpeakAsync(text, rateOverride){
  return new Promise(function(resolve){
    if(!('speechSynthesis' in window)||!text){ resolve(false); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';
    u.rate = rateOverride || ttsSettings.speed || 0.9;
    u.pitch = ttsSettings.pitch || 1.0;
    if(jaVoice) u.voice=jaVoice;
    u.onend=function(){resolve(true);}; u.onerror=function(){resolve(true);};
    speechSynthesis.speak(u);
  });
}

/* Thử phát 1 chunk qua Google TTS, tự thử lại với endpoint dự phòng (client=tw-ob) nếu endpoint chính (gtx) lỗi.
   Trả về 'ok' hoặc chuỗi lỗi cụ thể ('error:timeout'/'error:media2'/'error:play(NotAllowedError)'...) để hiển thị chẩn đoán. */
async function playTTSChunk(text, speed){
  var result = await playAudioUrl(gTranslateTTSUrl(text, speed, 'gtx'));
  if(result.indexOf('error')===0){
    result = await playAudioUrl(gTranslateTTSUrl(text, speed, 'tw-ob'));
  }
  return result;
}

/* Main speak: trên app native (APK) → dùng thẳng TextToSpeech hệ thống, không qua mạng (đáng tin cậy nhất).
   Trên web/browser → Google TTS (tự thử 2 endpoint) → device fallback (speechSynthesis). Nếu tất cả đều thất bại → toast kèm mã lỗi, không im lặng */
async function speak(text, rateOverride){
  if(!text) return;
  stopSpeech();
  var speed = rateOverride || ttsSettings.speed || 0.9;
  if(isNativeApp() && nativeTTS()){
    if(await nativeSpeak(text, speed)) return;
    showToast('Không phát được âm thanh. Kiểm tra máy đã cài giọng đọc Tiếng Nhật (Cài đặt → Ngôn ngữ → Chuyển văn bản thành giọng nói).');
    return;
  }
  if(ttsSettings.mode==='google'){
    var chunks = splitText(text, 200);
    var result = await playTTSChunk(chunks[0], speed);
    if(result.indexOf('error')===0){
      if(!deviceSpeak(text, speed)) showToast('Không phát được âm thanh ('+result+'). Kiểm tra kết nối mạng.');
      return;
    }
    for(var ci=1; ci<chunks.length; ci++){
      await playTTSChunk(chunks[ci], speed);
    }
    return;
  }
  if(!deviceSpeak(text, speed)) showToast('Không phát được âm thanh, kiểm tra kết nối mạng');
}

async function speakAsync(text, rateOverride){
  if(!text) return;
  stopSpeech();
  var speed = rateOverride || ttsSettings.speed || 0.9;
  if(isNativeApp() && nativeTTS()){
    if(await nativeSpeak(text, speed)) return;
    showToast('Không phát được âm thanh. Kiểm tra máy đã cài giọng đọc Tiếng Nhật (Cài đặt → Ngôn ngữ → Chuyển văn bản thành giọng nói).');
    return;
  }
  if(ttsSettings.mode==='google'){
    var chunks = splitText(text, 200);
    for(var ci=0; ci<chunks.length; ci++){
      var result = await playTTSChunk(chunks[ci], speed);
      if(result.indexOf('error')===0){
        if(!(await deviceSpeakAsync(text, speed))) showToast('Không phát được âm thanh ('+result+'). Kiểm tra kết nối mạng.');
        return;
      }
    }
    return;
  }
  if(!(await deviceSpeakAsync(text, speed))) showToast('Không phát được âm thanh, kiểm tra kết nối mạng');
}

function buildExportPayload(){

    app:'kokoro_nihongo',
    version:1,
    exportedAt:new Date().toISOString(),
    wordCount:VOCAB.length,
    data:{
      jp_learn_v1:localStorage.getItem('jp_learn_v1'),

    }

function exportSummaryLine(){
  var withProgress=Object.keys(store.cards).length;
  var learned=learnedCount();
  var streak=store.stats.streak||0;
  return 'Đã xuất: '+withProgress+' từ có tiến độ · '+learned+' từ đã thuộc · streak '+streak+' ngày';
}
function copyToClipboard(text, cb){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){cb(true);}).catch(function(){fallbackCopyFromArea(cb);});
  } else {
    fallbackCopyFromArea(cb);
  }
}
function fallbackCopyFromArea(cb){
  try{
    var ta=document.getElementById('exportArea');
    if(!ta){ cb(false); return; }
    ta.focus(); ta.select();
    cb(document.execCommand('copy'));
  }catch(e){ cb(false); }
}
async function renderExportBox(){
  var payload=buildExportPayload();
  var json=JSON.stringify(payload);
  var box=document.getElementById('pmBox');
  var d=new Date().toISOString().slice(0,10);
  var filename='kokoro_tien_do_'+d+'.json';
  if(isNativeApp()){
    var fs=nativeFilesystem(), sh=nativeShare();
    if(fs && sh){
      box.innerHTML='<div class="export-summary">'+exportSummaryLine()+'</div><div class="hint">Đang tạo file...</div>';
      try{
        var res=await fs.writeFile({path:filename, data:json, directory:'CACHE', encoding:'utf8'});

/* ═══════════════ MICROPHONE / SPEECH RECOGNITION ═══════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micPermission = 'unknown'; // 'unknown' | 'granted' | 'denied' | 'unsupported'

async function checkMicPermission(){
  if(!SR){ micPermission='unsupported'; return micPermission; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    // Older browser or file:// protocol — try SR directly
    micPermission='unknown';
    return micPermission;
  }
  try{
    const result = await navigator.permissions.query({name:'microphone'});
    micPermission = result.state; // 'granted','denied','prompt'
    result.onchange = ()=>{ micPermission=result.state; };
    return micPermission;
  }catch(e){
    // permissions API not supported, try directly
    micPermission='unknown';
    return micPermission;
  }
}

async function requestMicPermission(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    // Fallback: try starting SR directly — it will prompt
    return new Promise(resolve=>{
      if(!SR){ micPermission='unsupported'; resolve(false); return; }
      const test = new SR();
      test.lang='ja-JP';
      test.onresult=()=>{ micPermission='granted'; test.stop(); resolve(true); };
      test.onerror=(e)=>{
        if(e.error==='not-allowed') micPermission='denied';
        resolve(e.error!=='not-allowed');
      };
      test.onend=()=>resolve(micPermission==='granted');
      try{ test.start(); setTimeout(()=>{try{test.stop();}catch(e){}},2000); }
      catch(e){ resolve(false); }
    });
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop()); // release immediately
    micPermission='granted';
    return true;
  }catch(e){
    micPermission='denied';
    return false;
  }
}

/* Android WebView (app đóng gói Capacitor) không hề implement Web Speech API —
   dùng native plugin @capgo/capacitor-speech-recognition khi chạy trong app,
   fallback Web Speech API khi chạy trên trình duyệt (desktop/Android Chrome/iOS Safari) */
function isNativeApp(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
function nativeSR(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechRecognition; }
/* Xuất tiến độ ra file thật (FR_011, bản sửa 2026-09-12): ghi vào bộ nhớ đệm riêng của app rồi
   mở hộp thoại Chia sẻ hệ thống để người dùng chọn nơi lưu (Files/Drive/Zalo/Mail...) —
   tránh phải xin quyền lưu trữ ngoài (Android scoped storage từ API 29+ hạn chế việc này). */
function nativeFilesystem(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem; }
function nativeShare(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share; }
/* TTS native (Android APK) — dùng thẳng engine TextToSpeech của hệ điều hành, không qua mạng/Google Translate
   endpoint. Thay thế hoàn toàn đường Google TTS (vốn không đáng tin cậy trong WebView đóng gói) khi chạy native. */
function nativeTTS(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech; }
async function nativeSpeak(text, rateOverride){
  var tts = nativeTTS();
  if(!tts || !text) return false;
  try{
    await tts.speak({text:text, lang:'ja-JP', rate:rateOverride||ttsSettings.speed||0.9, pitch:ttsSettings.pitch||1.0, volume:1.0});
    return true;
  }catch(e){ return false; }
}
let activeWebRec=null;

async function ensureMicReady(){
  if(isNativeApp() && nativeSR()){
    var p=nativeSR();
    var perm = await p.checkPermissions();
    if(perm.speechRecognition==='granted') return true;
    perm = await p.requestPermissions();
    return perm.speechRecognition==='granted';
  }
  if(micPermission==='granted') return true;
  return await requestMicPermission();
}

/* Ghi âm 1 câu, trả về Promise<string[]> danh sách transcript ứng viên */
async function recognizeOnce(lang){
  if(isNativeApp() && nativeSR()){
    var res = await nativeSR().start({language:lang, maxResults:3, partialResults:false, popup:false});
    return res.matches || [];
  }
  return new Promise(function(resolve,reject){
    if(!SR){ reject('unsupported'); return; }
    var rec=new SR(); rec.lang=lang; rec.interimResults=false; rec.maxAlternatives=3; rec.continuous=false;
    activeWebRec=rec;
    rec.onresult=function(e){ resolve([].slice.call(e.results[0]).map(function(r){return r.transcript;})); };
    rec.onerror=function(e){ reject(e.error); };
    rec.onend=function(){ activeWebRec=null; };
    try{ rec.start(); }catch(err){ reject('start-failed'); }
  });
}
function cancelRecognition(){
  if(isNativeApp() && nativeSR()){ try{ nativeSR().stop(); }catch(e){} }
  else if(activeWebRec){ try{ activeWebRec.stop(); }catch(e){} activeWebRec=null; }
}

function hasSR(){ return !!SR || (isNativeApp() && !!nativeSR()); }

  if(micPermission==='granted' || micPermission==='unsupported') return '';
  if(micPermission==='denied') return '<div class="mic-banner">Quyền microphone bị từ chối. Vào <b>Cài đặt trình duyệt → Quyền trang web</b> để bật lại mic cho trang này.</div>';

}

/* text similarity for pronunciation scoring */
function normJa(s){ return (s||'').replace(/[、。「」『』（）\(\)\s.,!?！？・ー〜~]/g,''); }
function similarity(a,b){
  a=normJa(a); b=normJa(b);
  if(!a||!b) return 0;
  if(a===b) return 100;
  const m=a.length,n=b.length,dp=Array(n+1).fill(0);
  for(let i=1;i<=m;i++){let prev=0;for(let j=1;j<=n;j++){const t=dp[j];dp[j]=a[i-1]===b[j-1]?prev+1:Math.max(dp[j],dp[j-1]);prev=t;}}
  return Math.round(dp[n]/Math.max(m,n)*100);
}

/* ═══════════════ ÂM THANH PHẢN HỒI CHẤM ĐIỂM PHÁT ÂM (Web Audio API — không cần file âm thanh ngoài) ═══════════════ */
let sfxCtx=null;
function getSfxCtx(){
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!sfxCtx) sfxCtx = new AC();
  if(sfxCtx.state==='suspended') sfxCtx.resume();
  return sfxCtx;
}
function beep(freq, startTime, duration, gain){
  var ctx=getSfxCtx(); if(!ctx) return;
  var osc=ctx.createOscillator(), g=ctx.createGain();
  osc.type='sine'; osc.frequency.value=freq;
  var t0=ctx.currentTime+startTime;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain||0.2, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+duration+0.02);
}
/* Âm thanh theo mức điểm phát âm (LCS similarity): <50 nhắc thử lại (2 nốt trầm) · 51-89 khá tốt (1 nốt) · 90-100 xuất sắc (chuỗi 3 nốt lên) */
function playScoreSound(score){
  try{
    if(score>=90){ beep(784,0,0.12,0.22); beep(988,0.1,0.12,0.22); beep(1175,0.2,0.2,0.24); }
    else if(score>=51){ beep(660,0,0.18,0.2); }
    else { beep(311,0,0.16,0.18); beep(233,0.15,0.2,0.18); }
  }catch(e){}
}

/* ═══════════════ ĐIỀN TỪ VÀO CÂU — dò ô trống (FR_009) ═══════════════ */
/* Sinh các dạng chữ có thể xuất hiện trong câu ví dụ, dài trước ngắn sau */
function clozeCandidates(w){
  var base = w.replace(/[（(][^）)]*[)）]/g,'').replace(/　/g,' ').trim();
  var seeds = {}; seeds[base]=1; seeds[w.trim()]=1;
  base.split(/[\/／=＝]/).forEach(function(p){ p=p.trim(); if(p) seeds[p]=1; });
  var out = {};
  Object.keys(seeds).forEach(function(t){
    t = t.replace(/^[〜～]+/,'').trim(); if(!t) return;
    out[t]=1;
    ['する','です','ます','な','い'].forEach(function(suf){
      if(t.length>suf.length && t.slice(-suf.length)===suf) out[t.slice(0,-suf.length)]=1;
    });
    var m = t.match(/^[一-鿿]{1,6}/); if(m) out[m[0]]=1;
  });
  return Object.keys(out).filter(function(t){return t.length>0 && t.indexOf('✙')<0;})
                         .sort(function(a,b){return b.length-a.length;});
}
/* Trả về [vị trí, độ dài] đoạn cần che trong v.ex, hoặc null nếu không dò được */
function findCloze(v){
  var ex = v.ex||''; if(!ex) return null;
  var cands = clozeCandidates(v.w);
  for(var i=0;i<cands.length;i++){
    var t=cands[i], p=ex.indexOf(t);
    if(p<0) continue;
    if(t.length===1 && !/[一-鿿]/.test(t)) continue;   // 1 ký tự kana thì bỏ, quá dễ nhầm
    return [p,t.length];
  }
  var y=(v.r||'').replace(/[（(][^）)]*[)）]/g,'').trim();
  var ys=[y].concat(y.split(/[\/／・]/)).map(function(s){return s.trim();})
            .filter(function(s){return s.length>=2;})
            .sort(function(a,b){return b.length-a.length;});
  for(var j=0;j<ys.length;j++){ var q=ex.indexOf(ys[j]); if(q>=0) return [q,ys[j].length]; }
  return null;
}

/* Chia đều một mảng thành các "bộ" ~DECK_SIZE phần tử, dồn số dư rải đều thay vì dồn hết bộ cuối.
   Không còn lời gọi nào từ FR_008 (Luyện đọc/Kaiwa dùng hàm này đã bị gỡ) — cố ý giữ lại, xem FR_008 mục 4.3. */
function splitDecks(arr, target){
  target = target || DECK_SIZE;
  var n = arr.length;
  if(n===0) return [];
  var numDecks = Math.max(1, Math.round(n/target));
  var base = Math.floor(n/numDecks), extra = n % numDecks;
  var decks = [], idx = 0;
  for(var i=0;i<numDecks;i++){
    var size = base + (i<extra?1:0);
    decks.push(arr.slice(idx, idx+size));
    idx += size;
  }
  return decks;
}
/* Chia CỐ ĐỊNH mỗi bộ đúng target từ, bắt đầu từ #1, bộ cuối = phần dư còn lại — dùng cho IT専門
   (đơn giản, dễ đoán vị trí, không dồn/san đều số dư như splitDecks()) */
function splitDecksStrict(arr, target){
  target = target || DECK_SIZE;
  var decks=[];
  for(var i=0;i<arr.length;i+=target) decks.push(arr.slice(i,i+target));
  return decks;
}
function deckPool(){
  var p = pool();
  if(curDeck==='ALL') return p;
  var decks = splitDecksStrict(p);
  return decks[parseInt(curDeck,10)] || p;
}
/* Nhãn "Bộ N (start-end)" dùng cho header Flashcard khi đang học theo 1 Bộ cụ thể (rỗng nếu học "Tất cả") */
function curDeckRangeLabel(){
  if(curDeck==='ALL') return '';
  var decks = splitDecksStrict(pool());
  var idx = parseInt(curDeck,10);
  var d = decks[idx];
  if(!d) return '';
  var offset=0;
  for(var k=0;k<idx;k++) offset+=decks[k].length;
  return 'Bộ '+(idx+1)+' ('+(offset+1)+'-'+(offset+d.length)+')';
}

const DECK_GRID_PAGE_SIZE=4;
/* Lưới thẻ bộ dùng chung (IT専門 dashboard + Reading/Kaiwa library) — items:[{key,label,icons:[{icon,done}]}]
   Thẻ tự chuyển xanh lá (.done) khi TẤT CẢ icon truyền vào đều đã hoàn thành (IT専門: đủ 4 mode; Reading/Kaiwa: mode duy nhất của nó) */
function deckGridHTML(idPrefix, items, page){

      pageItems.map(function(it){
        var icons = it.icons.filter(function(i){return i.done;}).map(function(i){return '<span>'+i.icon+'</span>';}).join('');
        var allDone = it.icons.every(function(i){return i.done;});
        return '<button class="deck-card'+(allDone?' done':'')+(it.selected?' on':'')+'" data-key="'+it.key+'">'+
          '<div class="deck-icons">'+icons+'</div>'+
          '<div class="deck-label">'+it.label+'</div>'+
        '</button>';
      }).join('')+
    '</div>'+
    '<button class="pager-btn" id="'+idPrefix+'Next"'+(page>=totalPages-1?' disabled':'')+'>›</button>'+
  '</div>';
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n,exclude){ return shuffle(arr.filter(x=>x!==exclude)).slice(0,n); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ═══════════════ THỐNG KÊ VÀ LỊCH SỬ HỌC (FR_012) ═══════════════ */
function heatmapTier(n){
  if(n<=0) return '';
  if(n<=7) return 'l1';
  if(n<=19) return 'l2';
  return 'l3';
}
function buildHeatmapHTML(){
  var todayStr=today();
  var now=new Date();
  var dow=now.getDay();
  var daysSinceMonday=(dow+6)%7;
  var curMonday=new Date(now); curMonday.setDate(curMonday.getDate()-daysSinceMonday);
  var startMonday=new Date(curMonday); startMonday.setDate(startMonday.getDate()-12*7);
  var cellsHtml='';
  for(var c=0;c<13;c++){
    for(var r=0;r<7;r++){
      var d=new Date(startMonday); d.setDate(d.getDate()+c*7+r);
      var ds=d.toISOString().slice(0,10);
      if(ds>todayStr){
        cellsHtml+='<div class="heatmap-cell future"></div>';
      } else {
        var n=store.stats.history[ds]||0;
        cellsHtml+='<div class="heatmap-cell '+heatmapTier(n)+'" title="'+ds+': '+n+' lượt"></div>';
      }
    }
  }
  return '<div style="overflow-x:auto"><div class="heatmap-grid">'+cellsHtml+'</div></div>';
}
/* Mỗi từ chỉ đếm vào đúng 1 nhóm — thứ tự ưu tiên: Đã thuộc > Từ khó > Đang học > Chưa học (tổng luôn = VOCAB.length) */
function computeDistribution(){
  var daxthuoc=0, tukhoi=0, danghoc=0, chuahoc=0;
  VOCAB.forEach(function(v){
    var c=store.cards[v.id];
    if(!c){ chuahoc++; return; }
    if(c.box>=3 || c.mastered){ daxthuoc++; return; }
    if(c.seen>=5 && (c.correct/c.seen)<0.5){ tukhoi++; return; }
    danghoc++;
  });
  return {daxthuoc:daxthuoc, tukhoi:tukhoi, danghoc:danghoc, chuahoc:chuahoc};
}
function buildDistBarsHTML(dist){
  var total=VOCAB.length||1;
  var rows=[
    {label:'Đã thuộc', n:dist.daxthuoc, color:'var(--good)'},
    {label:'Đang học', n:dist.danghoc, color:'var(--brand)'},
    {label:'Từ khó', n:dist.tukhoi, color:'#ea580c'},
    {label:'Chưa học', n:dist.chuahoc, color:'var(--sub)'}
  ];
  return rows.map(function(r){
    var pct=Math.round(r.n/total*100);
    return '<div style="margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">'+
        '<span>'+r.label+'</span><span style="color:var(--sub)">'+r.n+' ('+pct+'%)</span>'+
      '</div>'+
      '<div class="bar"><i style="width:'+pct+'%;background:'+r.color+'"></i></div>'+
    '</div>';
  }).join('');
}
/* Số thẻ due mỗi ngày trong 7 ngày tới — thẻ quá hạn gộp hết vào cột Hôm nay */
function computeForecast(){
  var todayStr=today();
  var dayStrs=[];
  for(var k=0;k<7;k++){
    var d=new Date(); d.setDate(d.getDate()+k);
    dayStrs.push(d.toISOString().slice(0,10));
  }
  var counts=[0,0,0,0,0,0,0], overdue=0;
  Object.keys(store.cards).forEach(function(id){
    var c=store.cards[id];
    if(!c || !c.due) return;
    if(c.due<todayStr){ overdue++; counts[0]++; return; }
    var idx=dayStrs.indexOf(c.due);
    if(idx>=0) counts[idx]++;
  });
  return {counts:counts, overdue:overdue};
}
function statsScreen(){
  onBack=home;
  setHeader('Thống kê', 'Thống kê và lịch sử học', true);
  var totalDaysStudied=Object.keys(store.stats.history).length;
  var dist=computeDistribution();
  var fc=computeForecast();
  var maxCount=Math.max(1, fc.counts.reduce(function(a,b){return Math.max(a,b);},0));
  var dayLabels=['Hôm nay','+1','+2','+3','+4','+5','+6'];

  main.innerHTML=
    '<div class="stats-hero">'+
      '<div class="n">'+(store.stats.streak||0)+'</div>'+
      '<div class="l">ngày liên tiếp · tổng '+totalDaysStudied+' ngày có học</div>'+
    '</div>'+

    '<div class="sectitle">Lịch sử 12 tuần</div>'+
    buildHeatmapHTML()+
    '<div class="hint" style="margin-top:8px">Lịch sử bắt đầu ghi từ ngày cập nhật app, các ngày trước đó không có dữ liệu.</div>'+

    '<div class="sectitle" style="margin-top:18px">Phân bố từ theo trạng thái</div>'+
    buildDistBarsHTML(dist)+

    '<div class="sectitle" style="margin-top:18px">Dự báo tải ôn 7 ngày tới</div>'+
    '<div class="forecast-chart">'+
      fc.counts.map(function(n,idx){
        var h=Math.round(n/maxCount*90)+10;
        return '<div class="forecast-bar-wrap">'+
          '<div class="forecast-num">'+n+'</div>'+
          '<div class="forecast-bar'+(idx===0?' today':'')+'" style="height:'+h+'px"></div>'+
          '<div class="forecast-label">'+dayLabels[idx]+'</div>'+
        '</div>';
      }).join('')+
    '</div>'+
    (fc.overdue>0?'<div class="hint">Trong đó <b>'+fc.overdue+'</b> thẻ đã quá hạn</div>':'');
}

function gyoumuUnits(){
  var units=[], seen={};
  GYOUMU.forEach(function(t){
    var key=t.chapter+'-'+t.unit;
    if(!seen[key]){
      seen[key]=true;
      units.push({
        chapter:t.chapter, unit:t.unit, unitJp:t.unitJp, unitVi:t.unitVi,
        tracks:GYOUMU.filter(function(x){return x.chapter===t.chapter && x.unit===t.unit;})
      });
    }
  });
  units.sort(function(a,b){ return a.chapter-b.chapter || a.unit-b.unit; });
  return units;
}

function gyoumuTrackDetail(trackId){
  var track = GYOUMU.find(function(t){return t.track===trackId;});
  if(!track){ gyoumuDashboard(); return; }
  onBack=function(){ gyoumuTrackList(track.chapter, track.unit); };
  setHeader('Track '+track.track, esc(track.unitJp)+' · '+esc(track.type), true);

  var fname=(track.track<10?'0':'')+track.track+' Track '+track.track+'.mp3';
  var src=encodeURI('audio/'+fname);
  var showTranscript=false;

  function fmtTime(s){
    if(!isFinite(s)) return '0:00';
    var m=Math.floor(s/60), sec=Math.floor(s%60);
    return m+':'+(sec<10?'0':'')+sec;
  }

  var transcriptHtml = track.hasTranscript ?
    track.lines.map(function(l){
      return '<div class="transcript-line">'+(l.spk?'<b>'+esc(l.spk)+'：</b>':'')+esc(l.t)+'</div>';
    }).join('') : '';

  main.innerHTML=
    '<div class="player-card">'+
      '<span class="tag">'+esc(track.type)+'</span>'+
      (track.chars?'<div style="font-size:13px;color:var(--sub);margin-top:6px">'+esc(track.chars)+'</div>':'')+
      '<div><button class="play-btn" id="playBtn">▶️</button></div>'+
      '<div class="progress-row">'+
        '<span class="ptime" id="curT">0:00</span>'+
        '<input type="range" id="seek" min="0" max="1000" value="0">'+
        '<span class="ptime" id="durT">0:00</span>'+
      '</div>'+
      '<div class="player-controls">'+
        '<button class="speed-btn" data-rate="0.75">0.75x</button>'+
        '<button class="speed-btn on" data-rate="1">1x</button>'+
        '<button class="speed-btn" data-rate="1.25">1.25x</button>'+
        '<button class="btn btn-ghost" id="replayBtn" style="padding:8px 12px;font-size:13px;width:auto">↺ Nghe lại</button>'+
      '</div>'+
    '</div>'+
    '<button class="btn btn-ghost" id="toggleTranscript" style="width:100%"'+(track.hasTranscript?'':' disabled')+'>'+
      (track.hasTranscript ? '🔒 Hiện transcript' : '🔒 Transcript không khả dụng') +
    '</button>'+
    (track.hasTranscript ?
      '<div class="transcript-panel hidden" id="transcriptPanel">'+transcriptHtml+'</div>'
      : '<div class="note">Transcript không khả dụng cho track này (thiếu trang trong bản scan gốc). Bạn vẫn có thể nghe audio bình thường.</div>')+
    (track.hasTranscript ?
      '<button class="btn btn-primary" id="toReading" style="margin-top:16px">🎤 Luyện đọc câu</button>'
      : '')+
    '<audio id="gaEl" preload="none"></audio>';

  var audioEl=$('#gaEl'), playBtn=$('#playBtn'), seek=$('#seek'), curT=$('#curT'), durT=$('#durT');
  audioEl.src=src;
  currentGyoumuAudio=audioEl;
  var seeking=false;

  audioEl.addEventListener('loadedmetadata',function(){ durT.textContent=fmtTime(audioEl.duration); });
  audioEl.addEventListener('timeupdate',function(){
    if(seeking) return;
    curT.textContent=fmtTime(audioEl.currentTime);
    if(audioEl.duration) seek.value=Math.round(audioEl.currentTime/audioEl.duration*1000);
  });
  audioEl.addEventListener('ended',function(){
    playBtn.textContent='▶️';
    var wasListened=!!gyStore.listened[track.track];
    gyStore.listened[track.track]=true; saveGyoumu();
    /* Tính vào streak/lịch sử (không tính vào store.stats.studied — đó là lượt ôn thẻ SRS riêng) — chỉ lần đầu nghe xong track này */
    if(!wasListened){ bumpStreak(); save(); }
  });
  audioEl.addEventListener('error',function(){
    $('.player-card').insertAdjacentHTML('beforeend',
      '<div class="note">Không tải được file audio. Kiểm tra thư mục audio/ có nằm cạnh file HTML không.</div>');
  });

  playBtn.onclick=function(){
    if(audioEl.paused){ stopSpeech(); currentGyoumuAudio=audioEl; audioEl.play(); playBtn.textContent='⏸'; }
    else { audioEl.pause(); playBtn.textContent='▶️'; }
  };
  seek.addEventListener('input',function(){
    seeking=true;
    curT.textContent=fmtTime(seek.value/1000*(audioEl.duration||0));
  });
  seek.addEventListener('change',function(){
    if(audioEl.duration) audioEl.currentTime=seek.value/1000*audioEl.duration;
    seeking=false;
  });
  $('#replayBtn').onclick=function(){ audioEl.currentTime=0; audioEl.play(); playBtn.textContent='⏸'; };
  main.querySelectorAll('.speed-btn').forEach(function(b){
    b.onclick=function(){
      main.querySelectorAll('.speed-btn').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      audioEl.playbackRate=parseFloat(b.dataset.rate);
    };
  });

  if(track.hasTranscript){
    $('#toggleTranscript').onclick=function(){
      showTranscript=!showTranscript;
      $('#transcriptPanel').classList.toggle('hidden',!showTranscript);
      $('#toggleTranscript').textContent = showTranscript? '👁 Ẩn transcript' : '🔒 Hiện transcript';
    };
    $('#toReading').onclick=function(){ audioEl.pause(); gyoumuReadingMode(track); };
  }
}

function gyoumuReadingMode(track){
  onBack=function(){ gyoumuTrackDetail(track.track); };
  var queue=track.lines.filter(function(l){return l.t && l.t.trim().length>0;});
  if(!queue.length){
    setHeader('Luyện đọc','',true);
    main.innerHTML='<div class="note">Track này không có dòng hội thoại để luyện đọc.</div>';
    return;
  }
  var i=0, total=0, sum=0, slowMode=false;

  function render(){
    if(i>=queue.length) return gyoumuReadingFinish(track, queue.length, total?Math.round(sum/total):0);
    var l=queue[i];
    setHeader('Luyện đọc',(i+1)+' / '+queue.length,true);
    var micSupport = hasSR() && micPermission!=='denied' && micPermission!=='unsupported';
    main.innerHTML=
      '<div class="counter">Nghe → Đọc to → Kiểm tra phát âm</div>'+
      '<div class="sent-card">'+
        (l.spk?'<div class="sent-word">🗣 '+esc(l.spk)+'</div>':'')+
        '<div class="sent-jp">'+esc(l.t)+'</div>'+
        '<div class="sent-controls">'+
          '<button class="speaker" id="spk" style="margin:0">🔊</button>'+
          '<button class="speed-btn '+(slowMode?'on':'')+'" id="slowBtn">🐢 Chậm</button>'+
        '</div>'+
      '</div>'+
      (micSupport?
        '<div style="text-align:center;margin-top:14px">'+
          '<button class="btn btn-primary" id="micBtn" style="display:inline-flex;align-items:center;gap:8px;width:auto;padding:14px 28px;font-size:16px;border-radius:99px">'+
            '<span style="font-size:22px">🎤</span> Luyện đọc'+
          '</button>'+
          '<div class="qhint" id="mhint">Chạm để thu giọng và chấm phát âm</div>'+
          '<div class="heard hidden" id="heard"></div>'+
          '<div class="fb" id="fb"></div>'+
        '</div>'
      :'')+
      '<div style="margin-top:16px">'+
        '<button class="btn btn-primary" id="next">Câu tiếp theo →</button>'+
      '</div>';

    $('#spk').onclick=function(){speak(l.t, slowMode?0.65:0.9);};
    setTimeout(function(){speak(l.t, slowMode?0.65:0.9);},300);
    $('#slowBtn').onclick=function(){
      slowMode=!slowMode;
      $('#slowBtn').classList.toggle('on',slowMode);
      speak(l.t, slowMode?0.65:0.9);
    };
    $('#next').onclick=function(){i++;render();};

    if(micSupport && $('#micBtn')) setupMic(l);
  }

  function setupMic(l){
    var micBtn=$('#micBtn'), hint=$('#mhint'), heard=$('#heard'), fb=$('#fb');
    var listening=false;
    micBtn.onclick=async function(){
      if(listening){ cancelRecognition(); return; }
      try{
        var ok = await ensureMicReady();
        if(!ok){ hint.textContent='Mic bị từ chối.'; return; }
        listening=true;
        micBtn.style.background='var(--bad)';
        micBtn.innerHTML='<span style="font-size:22px">⏹</span> Đang nghe...';
        hint.textContent='Hãy đọc to câu này';
        var alts = await recognizeOnce('ja-JP');
        var best=Math.max.apply(null,alts.map(function(a){return similarity(a,l.t);}));
        heard.classList.remove('hidden'); heard.textContent='Bạn đọc: '+alts[0];
        total++; sum+=best;
        playScoreSound(best);
        fb.innerHTML = best>=90?'<span class="ok">🌟 Tuyệt! '+best+' điểm</span>'
                     : best>=51?'<span class="ok">👍 Khá: '+best+' điểm</span>'
                     : '<span class="no">💪 '+best+' điểm — thử lại</span>';
      }catch(err){
        hint.textContent='Lỗi: '+err;
        if(err==='not-allowed') micPermission='denied';
      }finally{
        micBtn.style.background=''; micBtn.innerHTML='<span style="font-size:22px">🎤</span> Luyện đọc'; listening=false;
      }
    };
  }
  render();
}

function gyoumuReadingFinish(track,total,avgScore){
  var prevBest = (gyStore.read[track.track]||{}).bestAvg||0;
  var bestAvg = Math.max(prevBest, avgScore);
  gyStore.read[track.track] = {bestAvg:bestAvg, attempts:((gyStore.read[track.track]||{}).attempts||0)+1};
  saveGyoumu();
  /* Hoàn thành 1 lượt luyện đọc theo thoại cũng tính vào streak/lịch sử (không tính vào studied) */
  bumpStreak(); save();
  setHeader('Hoàn thành','',true);
  main.innerHTML=
    '<div class="done">'+
      '<div class="big">📖</div>'+
      '<h2>Xong buổi đọc!</h2>'+
      '<p>Đã luyện đọc <b>'+total+'</b> câu hội thoại</p>'+
      '<p style="color:var(--sub);font-size:14px">Điểm phát âm trung bình: <b>'+avgScore+'</b>/100 · Tốt nhất: '+bestAvg+'/100</p>'+
      '<div class="row" style="margin-top:20px">'+
        '<button class="btn btn-ghost" id="again">Đọc lại</button>'+
        '<button class="btn btn-primary" id="hm">Về danh sách track</button>'+
      '</div>'+
    '</div>';
  $('#hm').onclick=function(){ gyoumuTrackDetail(track.track); };
  $('#again').onclick=function(){ gyoumuReadingMode(track); };
}

function startMode(m){
  const list=deckPool();
  if(list.length<4){ alert('Bộ này cần ít nhất 4 từ.'); return; }
  if(m==='flash') flashMode(list);
  else if(m==='quiz')  quizMode(list);
  else if(m==='cloze') clozeMode(list);
  else if(m==='listen')listenMode(list);
  else if(m==='speak') speakModeInit(list);
  else if(m==='reflex')reflexMode(list);
}

function flashMode(list){
  onBack=homeDashboard;

  if(!list.length){ main.innerHTML='<div class="note">Bạn đã thuộc hết từ trong bộ này! 🎉</div>'; setHeader('Flashcard','',true); return; }
  const due=list.filter(function(v){return isDue(v.id);});
  const queue = curDeck==='ALL' ? (due.length?due:shuffle(list)).slice(0,20) : shuffle(list);
  var i=0, flipped=false;
  setHeader('Flashcard','SRS · '+queue.length+' thẻ',true);
  function render(){

    var v=queue[i]; flipped=false;

    setHeader('Flashcard', (deckLabel?deckLabel+' · ':'')+(i+1)+' / '+queue.length, true);

        '<span class="tag">'+v.c+' · #'+v.id+'</span>'+

          (v.ex?'<div class="ex">'+esc(v.ex)+'</div>':'')+
        '</div>'+
        '<button class="speaker" id="spk">🔊</button>'+
      '</div>'+
      '<div class="card-actions">'+
        '<button class="btn detail-btn" id="toggleDetail">👁 Chi tiết</button>'+
        '<button class="btn fav-btn" id="favBtn">'+(isFavorite(v.id)?'❤️ Yêu thích':'🤍 Yêu thích')+'</button>'+
        '<button class="btn master-btn" id="masterBtn">'+(isMastered(v.id)?'✅ Đã thuộc':'☐ Đã nhớ')+'</button>'+
        '<button class="btn next-btn" id="nextBtn">Tiếp theo →</button>'+
      '</div>';

    function setFlipped(state){
      flipped=state;
      $('#answer').classList.toggle('hidden',!flipped);
      $('#toggleDetail').textContent = flipped?'🙈 Ẩn':'👁 Chi tiết';
      if(flipped) speak(v.w);
    }
    $('#spk').onclick=function(e){e.stopPropagation();speak(v.w);};
    $('#card').onclick=function(){ setFlipped(!flipped); };
    $('#toggleDetail').onclick=function(e){ e.stopPropagation(); setFlipped(!flipped); };
    $('#favBtn').onclick=function(e){
      e.stopPropagation();
      var fav=toggleFavorite(v.id);
      $('#favBtn').textContent = fav?'❤️ Yêu thích':'🤍 Yêu thích';
    };
    $('#masterBtn').onclick=function(e){
      e.stopPropagation();
      var wasMastered = isMastered(v.id);
      var mastered=toggleMastered(v.id);
      $('#masterBtn').textContent = mastered?'✅ Đã thuộc':'☐ Đã nhớ';
      /* Đánh dấu "Đã nhớ" đồng thời tính là 1 lượt SRS mức "Được" (quality 2) — thay cho hàng nút Quên/Khó/Được/Dễ đã bỏ */
      if(mastered && !wasMastered) reviewCard(v.id, 2);
      var cnt=list.filter(function(x){return isMastered(x.id);}).length;
      $('#masteredCount').textContent=cnt;
      $('#masteredLink').classList.toggle('hidden',cnt===0);
    };
    $('#nextBtn').onclick=function(e){ e.stopPropagation(); i++; render(); };
    $('#masteredLink').onclick=function(){ masteredListScreen(list, function(){ flashMode(list); }); };
  }
  render();
}

    main.querySelectorAll('.opt').forEach(function(btn){btn.onclick=function(){
      var chosen=opts[+btn.dataset.k];
      var ok=chosen===correct;
      main.querySelectorAll('.opt').forEach(function(b){
        b.onclick=null;
        var val=opts[+b.dataset.k];
        if(val===correct)b.classList.add('correct');

        else b.classList.add('dim');

      setTimeout(function(){i++;render();}, ok?750:1600);
    };});
  }
  render();
}

/* ═══════════════ ĐIỀN TỪ VÀO CÂU (穴埋め — FR_009) ═══════════════ */
function clozeMode(list){
  onBack=homeDashboard;
  /* setHeader trước mọi return sớm — tránh header còn giữ tên màn trước đó */
  setHeader('Điền từ','',true);
  list = list.filter(function(v){return !isMastered(v.id);});
  var usable=[];
  for(var k=0;k<list.length;k++){
    var pos=findCloze(list[k]);
    if(pos) usable.push({v:list[k], pos:pos});
  }
  if(usable.length<4){
    main.innerHTML='<div class="note">Bộ này không đủ 4 từ có câu ví dụ dùng được để tạo bài Điền từ. Hãy thử Quiz hoặc Flashcard nhé!</div>';
    return;
  }
  var queue = curDeck==='ALL' ? shuffle(usable).slice(0,15) : shuffle(usable);
  var i=0, score=0;
  function render(){
    if(i>=queue.length) return finish('cloze', queue.length, score);
    var item=queue[i], v=item.v, pos=item.pos[0], len=item.pos[1];
    var before=v.ex.slice(0,pos), after=v.ex.slice(pos+len);
    setHeader('Điền từ',(i+1)+' / '+queue.length+' · '+score+'đ',true);
    var correct=v.w;
    var distract=sample(list,3,v).map(function(x){return x.w;});
    var opts=shuffle([correct].concat(distract));
    var hintLevel=0;
    main.innerHTML=
      '<div class="counter">Điền từ còn thiếu vào câu</div>'+
      '<div class="cloze-sentence">'+esc(before)+'＿＿＿'+esc(after)+'</div>'+
      '<div id="hintBox"></div>'+
      '<button class="btn btn-ghost" id="hintBtn" style="width:100%;margin-bottom:14px">💡 Gợi ý</button>'+
      '<div class="opts" id="opts">'+
        opts.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>';}).join('')+
      '</div>'+
      '<div class="fb" id="fb"></div>';

    function renderHints(){
      var lines=[];
      if(hintLevel>=1) lines.push('💡 Nghĩa: '+esc(v.vi));
      if(hintLevel>=2) lines.push('💡 Ký tự đầu: '+esc(v.w.charAt(0))+'…');
      if(hintLevel>=3) lines.push('💡 Cách đọc: '+esc(v.r));
      $('#hintBox').innerHTML = lines.map(function(l){return '<div class="note" style="margin-top:8px">'+l+'</div>';}).join('');
      if(hintLevel>=3) $('#hintBtn').classList.add('hidden');
    }
    $('#hintBtn').onclick=function(){ hintLevel++; renderHints(); };

    main.querySelectorAll('.opt').forEach(function(btn){btn.onclick=function(){
      var chosen=opts[+btn.dataset.k];
      var ok=chosen===correct;
      main.querySelectorAll('.opt').forEach(function(b){
        b.onclick=null;
        var val=opts[+b.dataset.k];
        if(val===correct)b.classList.add('correct');
        else if(b===btn)b.classList.add('wrong');
        else b.classList.add('dim');
      });
      if(ok){score++;reviewCard(v.id,2);}else{reviewCard(v.id,0);}
      $('#hintBtn').classList.add('hidden');
      var full = esc(before)+'<span class="cloze-fill">'+esc(v.ex.slice(pos,pos+len))+'</span>'+esc(after);
      var hasJp = /[぀-ヿ一-鿿]/.test(v.ex);
      $('#fb').innerHTML=
        (ok?'<span class="ok">Chính xác!</span>':'<span class="no">Đáp án: '+esc(correct)+'</span>')+
        '<div class="cloze-sentence" style="margin-top:10px">'+full+
          (hasJp?' <button class="speaker" id="clozeSpk" style="width:36px;height:36px;font-size:16px;margin:0;vertical-align:middle">🔊</button>':'')+
        '</div>';
      if(hasJp && $('#clozeSpk')) $('#clozeSpk').onclick=function(){speak(v.ex);};
      setTimeout(function(){i++;render();}, ok?750:1600);
    };});
  }
  render();
}

/* ═══════════════ LISTENING ═══════════════ */
function listenMode(list){
  onBack=homeDashboard;
  /* setHeader ngay đầu hàm (trước mọi return) — tránh header còn giữ tên màn trước đó nếu có early-return.
     Không gác cổng bằng speechSynthesis nữa: luồng nghe chính là Google TTS qua <audio>, không phụ thuộc

  setHeader('Luyện nghe','',true);

  var queue = curDeck==='ALL' ? shuffle(list).slice(0,15) : shuffle(list);
  var i=0, score=0;

    var v=queue[i];
    setHeader('Luyện nghe',(i+1)+' / '+queue.length+' · '+score+'đ',true);
    var useEx = v.ex && v.ex.length>4 && Math.random()<0.5;
    var audio = useEx? v.ex : v.w;
    var correct=v.vi;
    var distract=sample(list,3,v).map(function(x){return x.vi;});
    var opts=shuffle([correct].concat(distract));
    main.innerHTML=
      '<div class="counter">Nghe rồi chọn nghĩa đúng</div>'+
      '<div class="card" style="min-height:130px">'+
        '<button class="mic" id="play" style="animation:none;background:var(--brand)">🔊</button>'+
        '<div class="qhint">Chạm để nghe lại '+(useEx?'(câu ví dụ)':'(từ)')+'</div>'+
      '</div>'+
      '<div class="opts">'+opts.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>';}).join('')+'</div>'+
      '<div class="fb" id="fb"></div>';
    var playFn=function(){speak(audio, useEx?0.95:0.85);};
    $('#play').onclick=playFn; setTimeout(playFn,400);
    main.querySelectorAll('.opt').forEach(function(btn){btn.onclick=function(){
      var chosen=opts[+btn.dataset.k], ok=chosen===correct;
      main.querySelectorAll('.opt').forEach(function(b){b.onclick=null;var val=opts[+b.dataset.k];
        if(val===correct)b.classList.add('correct');else if(b===btn)b.classList.add('wrong');else b.classList.add('dim');});
      if(ok){score++;reviewCard(v.id,2);}else reviewCard(v.id,0);
      $('#fb').innerHTML=(ok?'<span class="ok">✓ ':'<span class="no">✗ ')+esc(v.w)+' ('+esc(v.r)+')</span>';
      setTimeout(function(){i++;render();},ok?900:1800);
    };});
  }
  render();
}

/* ═══════════════ SPEAKING (with mic permission fix) ═══════════════ */
async function speakModeInit(list){
  onBack=homeDashboard;
  if(isNativeApp()){ speakMode(list); return; }
  await checkMicPermission();
  if(micPermission!=='granted' && micPermission!=='unsupported'){
    setHeader('Luyện nói','',true);
    main.innerHTML=micBannerHTML()+
      '<div class="note">Chế độ Luyện nói cần quyền microphone để chấm điểm phát âm.<br>Nếu không cấp quyền, bạn vẫn có thể nghe mẫu và đọc theo.</div>'+
      '<button class="btn btn-primary" id="startAnyway" style="margin-top:14px">Bắt đầu luyện nói</button>';
    if($('#reqMic')) $('#reqMic').onclick=async function(){
      var ok = await requestMicPermission();
      if(ok){ speakMode(list); }
      else { main.querySelector('.mic-banner').innerHTML='Mic bị từ chối. Vào <b>Cài đặt trình duyệt → Quyền</b> để bật lại.'; }
    };
    $('#startAnyway').onclick=function(){ speakMode(list); };
    return;
  }
  speakMode(list);
}

function speakMode(list){
  onBack=homeDashboard;
  list = list.filter(function(v){return !isMastered(v.id);});
  if(!list.length){ main.innerHTML='<div class="note">Bạn đã thuộc hết từ trong bộ này! 🎉</div>'; setHeader('Luyện nói','',true); return; }
  var queue = curDeck==='ALL' ? shuffle(list).slice(0,12) : shuffle(list);
  var i=0, total=0, sum=0, listening=false;
  var supported=hasSR() && micPermission!=='denied';
  function render(){
    if(i>=queue.length) return finish('speak',queue.length, total?Math.round(sum/total):0, true);
    var v=queue[i];
    setHeader('Luyện nói',(i+1)+' / '+queue.length,true);
    main.innerHTML=
      '<div class="card" style="min-height:170px">'+
        '<span class="tag">'+v.c+'</span>'+
        '<div class="jp" style="font-size:34px">'+esc(v.w)+'</div>'+
        '<div class="reading">'+esc(v.r)+'</div>'+
        '<div class="mean" style="font-size:15px">'+esc(v.vi)+'</div>'+
        '<button class="speaker" id="spk">🔊</button>'+
      '</div>'+
      (supported?
        '<button class="mic" id="mic">🎤</button>'+
        '<div class="qhint" id="mhint">Chạm mic rồi đọc to từ này (≥90 điểm mới tự động qua từ tiếp theo)</div>'+
        '<div class="heard hidden" id="heard"></div>'+
        '<div class="fb" id="fb"></div>'
      :
        '<div class="note">Microphone không khả dụng. Hãy nghe mẫu và đọc theo (shadowing).</div>'
      )+
      '<button class="btn btn-primary" id="next" style="margin-top:14px">Tiếp theo →</button>';
    $('#spk').onclick=function(){speak(v.w);};
    setTimeout(function(){speak(v.w);},300);
    $('#next').onclick=function(){ if(listening) cancelRecognition(); i++; render(); };
    if(!supported){ return; }
    var mic=$('#mic'), hint=$('#mhint'), heard=$('#heard'), fb=$('#fb');
    mic.onclick=async function(){
      if(listening){ cancelRecognition(); return; }
      try{
        var ok = await ensureMicReady();
        if(!ok){ hint.textContent='Mic bị từ chối. Vào Cài đặt để bật.'; return; }
        listening=true; mic.classList.add('rec'); mic.textContent='⏹'; hint.textContent='Đang nghe... đọc to lên';
        var alts = await recognizeOnce('ja-JP');
        var best=Math.max.apply(null,alts.map(function(a){return Math.max(similarity(a,v.w),similarity(a,v.r));}));
        heard.classList.remove('hidden'); heard.textContent='Bạn đọc: '+alts[0];
        total++; sum+=best;
        playScoreSound(best);
        /* Chỉ tự động qua từ tiếp theo khi đạt ≥90 điểm — dưới đó phải bấm "Tiếp theo" thủ công hoặc thử lại mic */
        fb.innerHTML = best>=90?'<span class="ok">🌟 Tuyệt! '+best+' điểm — tự động qua từ tiếp theo...</span>'
                     : best>=51?'<span class="ok">👍 Khá ổn: '+best+' điểm — thử lại hoặc bấm "Tiếp theo" để qua</span>'
                     : '<span class="no">💪 '+best+' điểm — thử lại hoặc bấm "Tiếp theo" để qua</span>';
        if(best>=51)reviewCard(v.id,2);
        if(best>=90){ setTimeout(function(){i++;render();},1900); }
      }catch(err){
        hint.textContent='Không nghe được ('+err+'). Chạm mic thử lại.';
        if(err==='not-allowed') micPermission='denied';
      }finally{
        mic.classList.remove('rec');mic.textContent='🎤';listening=false;
      }
    };
  }
  render();
}

/* ═══════════════ PHẢN XẠ N GIÂY (瞬間作文 — FR_010) ═══════════════ */
function reflexMode(list){
  onBack=homeDashboard;
  /* setHeader trước mọi return sớm */
  setHeader('Phản xạ','',true);
  list = list.filter(function(v){return !isMastered(v.id);});
  if(list.length<4){ main.innerHTML='<div class="note">Bộ này cần ít nhất 4 từ chưa thuộc.</div>'; return; }
  /* Đọc phòng thủ — nếu FR_011 vì lý do gì đó chưa chạy trước, vẫn không lỗi undefined */
  var sec = (typeof uiSettings!=='undefined' && uiSettings.reflexSec) || 3;
  var queue = curDeck==='ALL' ? shuffle(list).slice(0,12) : shuffle(list);
  var i=0, score=0, timer=null;
  var R=44, C=2*Math.PI*R;

  function render(){
    if(timer){ clearInterval(timer); timer=null; }
    if(i>=queue.length) return finish('reflex', queue.length, score);
    renderPhase1(queue[i]);
  }

  function renderPhase1(v){
    setHeader('Phản xạ '+sec+' giây', (i+1)+' / '+queue.length, true);
    main.innerHTML=
      '<div class="qhint" style="text-align:center">Đọc to từ tiếng Nhật trước khi hết giờ</div>'+
      '<div class="mean" style="font-size:calc(23px * var(--fs-scale,1));text-align:center;margin:14px 0">'+esc(v.vi)+'</div>'+
      '<div class="reflex-ring-wrap">'+
        '<svg width="104" height="104" viewBox="0 0 104 104" style="transform:rotate(-90deg)">'+
          '<circle cx="52" cy="52" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="8"/>'+
          '<circle id="reflexRing" cx="52" cy="52" r="'+R+'" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="0"/>'+
        '</svg>'+
        '<div class="reflex-ring-num" id="reflexNum">'+sec+'</div>'+
      '</div>'+
      '<div style="text-align:center"><button class="btn btn-ghost" id="skipBtn">Xem đáp án ngay</button></div>';

    var start=Date.now();
    var ring=$('#reflexRing'), numEl=$('#reflexNum');
    timer=setInterval(function(){
      /* Chống chạy tiếp khi user đã rời màn — kiểm tra phần tử SVG còn trong DOM không */
      if(!document.body.contains(ring)){ clearInterval(timer); timer=null; return; }
      var elapsed=(Date.now()-start)/1000;
      var remain=Math.max(0, sec-elapsed);
      ring.setAttribute('stroke-dashoffset', C*(1-remain/sec));
      numEl.textContent=Math.ceil(remain);
      if(remain<=0){ clearInterval(timer); timer=null; renderPhase2(v); }
    }, 60);
    $('#skipBtn').onclick=function(){
      if(timer){ clearInterval(timer); timer=null; }
      renderPhase2(v);
    };
  }

  function renderPhase2(v){
    if(timer){ clearInterval(timer); timer=null; }
    setHeader('Phản xạ '+sec+' giây', (i+1)+' / '+queue.length, true);
    main.innerHTML=
      '<div class="card" style="min-height:170px">'+
        '<div class="jp" style="font-size:34px">'+esc(v.w)+'</div>'+
        '<div class="reading">'+esc(v.r)+'</div>'+
        '<div class="mean" style="font-size:15px">'+esc(v.vi)+'</div>'+
        (v.en?'<div class="en">'+esc(v.en)+'</div>':'')+
        '<button class="speaker" id="spk">🔊</button>'+
      '</div>'+
      '<div class="qhint" style="margin-top:14px;text-align:center">Anh có bật ra được từ này trong '+sec+' giây không?</div>'+
      '<div class="row" style="margin-top:12px">'+
        '<button class="btn btn-ghost" id="noBtn">Chưa bật ra được</button>'+
        '<button class="btn btn-primary" id="yesBtn">Bật ra được</button>'+
      '</div>';
    $('#spk').onclick=function(){speak(v.w);};
    setTimeout(function(){speak(v.w);},300);
    $('#noBtn').onclick=function(){ reviewCard(v.id,0); i++; render(); };
    $('#yesBtn').onclick=function(){ reviewCard(v.id,2); score++; i++; render(); };
  }

  render();
}

/* ═══════════════ FINISH SCREEN ═══════════════ */
function finish(mode,total,score,isPct){
  if(curDeck!=='ALL') markDeckDone(curCat, curDeck, mode);
  var learned=learnedCount();
  var msg='';
  if(score!==undefined){
    var val=isPct? score : Math.round(score/total*100);
    msg = isPct? 'Điểm phát âm trung bình: <b>'+score+'</b>/100'
               : 'Đúng <b>'+score+'/'+total+'</b> ('+val+'%)';
  }else msg='Đã ôn <b>'+total+'</b> thẻ';
  setHeader('Hoàn thành','',true);
  main.innerHTML=
    '<div class="done">'+
      '<div class="big">🎉</div>'+
      '<h2>Xong buổi học!</h2>'+
      '<p>'+msg+'</p>'+
      '<p style="color:var(--sub);font-size:14px">Tổng đã thuộc: '+learned+'/'+VOCAB.length+' từ · Streak '+(store.stats.streak||0)+'</p>'+
      '<div class="row" style="margin-top:20px">'+
        '<button class="btn btn-ghost" id="again">Học tiếp</button>'+
        '<button class="btn btn-primary" id="hm">Về trang chủ</button>'+
      '</div>'+
    '</div>';
  $('#hm').onclick=homeDashboard;
  $('#again').onclick=function(){startMode(mode);};
}

/* ═══════════════ INIT ═══════════════ */
checkMicPermission();
if(!VOCAB.length){ main.innerHTML='<div class="note">Chưa có dữ liệu từ vựng. Hãy chạy lại build_app.py.</div>'; }
else home();
</script>
