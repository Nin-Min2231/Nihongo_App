"unit": 8, "unitJp": "進捗状況の報告", "unitVi": "Báo cáo tiến độ", "type": "モデル会話 (Hội thoại mẫu)", "chars": "大沢 (Osawa) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "リーさん、進捗状況はどうですか。"}, {"spk": "リー", "t": "えーっと、担当モジュール四つのうち、半分は終わっています。"}, {"spk": "大沢", "t": "そうでしたね。三つ目のモジュールはどうですか。"}, {"spk": "リー", "t": "全体のコーディングは終わったんですが、単体テストはまだまだです。"}, {"spk": "大沢", "t": "試験項目は、どのぐらい終わりましたか。"}, {"spk": "リー", "t": "だいたい3割ぐらいです。"}, {"spk": "大沢", "t": "じゃ、実装段階は予定どおりに終われそうですね。"}, {"spk": "リー", "t": "そうですねえ。今のところ大きなバグも出ていないので、何とか間に合うと思います。"}, {"spk": "大沢", "t": "いいですね。その調子でがんばってください。何か困っていることはありますか。"}, {"spk": "リー", "t": "実はエクリプスに新しいプラグインを入れたら、ときどき落ちるようになってしまいました。こういう状況が続くようでしたら、外してみます。"}, {"spk": "大沢", "t": "そうですか。もし、スケジュールに影響しそうだと思ったら、遅れが出る前に教えてくださいね。"}, {"spk": "リー", "t": "わかりました。"}], "note": ""}, {"track": 24, "chapter": 2, "unit": 8, "unitJp": "進捗状況の報告", "unitVi": "Báo cáo tiến độ", "type": "聞き取り練習 (Luyện nghe)", "chars": "ラジュ (Raju) / 井出 (Ide)", "hasTranscript": true, "lines": [{"spk": "井出", "t": "ラジュさん、どのぐらい進んでいますか。"}, {"spk": "ラジュ", "t": "最初のモジュールは、試験項目が2割ほど残っているだけです。"}, {"spk": "井出", "t": "そうですか。早いですね。"}, {"spk": "ラジュ", "t": "モジュールはあと二つありますが、それほど時間はかからないと思います。"}, {"spk": "井出", "t": "全部終わるのに、どのぐらい掛かりそうですか。"}, {"spk": "ラジュ", "t": "予定より三日ぐらい早く終われると思います。"}, {"spk": "井出", "t": "それはよかった。何か問題はありませんか。"}, {"spk": "ラジュ", "t": "実はビジュアルスタジオのメニューがわかりにくくて少し困っているんですが、でも、まあ、すぐに慣れると思います。"}, {"spk": "井出", "t": "そうですね。ラジュさんなら大丈夫ですよ。でも、どうしてもわからないところは言ってください。"}, {"spk": "ラジュ", "t": "はい、お願いします。"}], "note": ""}, {"track": 25, "chapter": 2, "unit": 9, "unitJp": "遅延報告", "unitVi": "Báo cáo chậm tiến độ", "type": "モデル会話 (Hội thoại mẫu)", "chars": "リー (Li) / 井出 (Ide)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "あのう、ちょっとよろしいでしょうか。"}, {"spk": "井出", "t": "はい、何でしょうか。"}, {"spk": "リー", "t": "実は、申し訳ありませんが、今のままでは予定に遅れそうなんです。"}, {"spk": "井出", "t": "原因は何ですか。"}, {"spk": "リー", "t": "依存先のモジュールがまだ上がってこないんです。"}, {"spk": "井出", "t": "ああ、それは困りましたね。では、増員しましょう。どんな要員が必要ですか。"}, {"spk": "リー", "t": "スタブとテストデータだけでも作ってくれる人がいたら助かります。コーディングは、私一人でやるしかありませんので。"}, {"spk": "井出", "t": "スタブとテストデータですね。わかりました。この二つがあれば、予定どおりに終わりそうですか。"}, {"spk": "リー", "t": "はい。何とか終わると思います。"}, {"spk": "井出", "t": "では、スタブは、簡単な仕様だったら私が作りましょう。気分転換にいいしね。テストデータは、誰かに頼んでみます。"}, {"spk": "リー", "t": "すみません。すごく助かります。"}, {"spk": "井出", "t": "まあ、この遅れはリーさんのせいじゃないから心配しないで。じゃあ、スタブとテストデータのことは昼食後に連絡しますので。"}, {"spk": "リー", "t": "ありがとうございます。よろしくお願いします。"}], "note": ""}, {"track": 26, "chapter": 2, "unit": 9, "unitJp": "遅延報告", "unitVi": "Báo cáo chậm tiến độ", "type": "聞き取り練習 (Luyện nghe)", "chars": "ラジュ (Raju) / 井出 (Ide)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "井出さん、ちょっとよろしいですか。"}, {"spk": "井出", "t": "はい、何でしょうか。"}, {"spk": "ラジュ", "t": "実は、少し遅れが出そうで……。"}, {"spk": "井出", "t": "先週は風邪で二日も休みましたからね。どのぐらい遅れそうですか。"}, {"spk": "ラジュ", "t": "週末までの締め切りを、週明けにしていただければ助かります。"}, {"spk": "井出", "t": "土日も働くんですか。体調はもういいの？"}, {"spk": "ラジュ", "t": "まだよくないんですが、私の責任ですから。"}, {"spk": "井出", "t": "いや、週末はよく休んでください。締め切りは水曜日まで延ばせますから。"}, {"spk": "ラジュ", "t": "すみません、助かります。"}, {"spk": "井出", "t": "でも、今後は体調管理をしっかりやってくださいね。"}, {"spk": "ラジュ", "t": "わかりました。気を付けます。"}], "note": ""}, {"track": 27, "chapter": 2, "unit": 10, "unitJp": "担当モジュール完成報告", "unitVi": "Báo cáo hoàn thành module phụ trách", "type": "モデル会話 (Hội thoại mẫu)", "chars": "リー (Li) / 大沢 (Osawa)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "大沢さん、すみません。"}, {"spk": "大沢", "t": "はい。"}, {"spk": "リー", "t": "私が担当していた四つのモジュールですが、すべて単体テストが終わりました。"}, {"spk": "大沢", "t": "お疲れさまでした。早かったですね。えーっと、リーさんの担当はどこでしたっけ。"}, {"spk": "リー", "t": "店舗情報管理です。"}, {"spk": "大沢", "t": "そうでしたね。では、テスト結果報告書とバグ票の提出をお願いします。"}, {"spk": "リー", "t": "はい、これです。"}, {"spk": "大沢", "t": "それから、ラジュさんがちょっと遅れているので、彼の担当を手伝ってください。"}, {"spk": "リー", "t": "わかりました。ラジュさんの担当はどこですか。"}, {"spk": "大沢", "t": "仕入管理機能です。仕入マスタ処理はラジュさんが終わらせますから、発注データ処理の方をお願いします。"}, {"spk": "リー", "t": "仕入管理機能の発注データ処理のモジュールですね。詳細設計書をいただけますか。"}, {"spk": "大沢", "t": "ちょっと手元にないので、ラジュさんが持っているのを、自分でコピーしてください。"}, {"spk": "リー", "t": "わかりました。"}, {"spk": "大沢", "t": "じゃ、よろしく。"}], "note": ""}, {"track": 28, "chapter": 2, "unit": 10, "unitJp": "担当モジュール完成報告", "unitVi": "Báo cáo hoàn thành module phụ trách", "type": "聞き取り練習 (Luyện nghe)", "chars": "ラジュ (Raju) / 大沢 (Osawa)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "大沢さん、ちょっとよろしいですか。"}, {"spk": "大沢", "t": "はい。"}, {"spk": "ラジュ", "t": "ようやくできました。"}, {"spk": "大沢", "t": "お疲れさま。"}, {"spk": "ラジュ", "t": "1日遅れてしまいまして、申し訳ありません。"}, {"spk": "大沢", "t": "いや、体調が悪かったのに、よくがんばりましたよ。担当は仕入管理でしたよね。テスト結果報告書とバグ票をお願いします。"}, {"spk": "ラジュ", "t": "はい。こちらです。"}, {"spk": "大沢", "t": "あれ？ 発注データ処理は？"}, {"spk": "ラジュ", "t": "発注データ処理はリーさんがやってくれました。"}, {"spk": "大沢", "t": "ああ、そうそう。そうでしたね。じゃ、次は結合テストなので、とりあえずテスト仕様書を読んでおいてください。"}, {"spk": "ラジュ", "t": "はい。"}, {"spk": "大沢", "t": "それから、結合テスト結果報告書とバグ票の書式は後でメールで送ります。結合テストの後で持ってきてください。"}, {"spk": "ラジュ", "t": "わかりました。"}], "note": ""}, {"track": 29, "chapter": 2, "unit": 11, "unitJp": "結合テスト", "unitVi": "Kiểm thử tích hợp (Combination Test)", "type": "モデル会話 (Hội thoại mẫu)", "chars": "大沢 (Osawa) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "リーさん、ちょっといいですか。"}, {"spk": "リー", "t": "はい。"}, {"spk": "大沢", "t": "店舗情報管理機能を担当したのはリーさんでしたよね。"}, {"spk": "リー", "t": "はい、私です。"}, {"spk": "大沢", "t": "実は今、店舗情報管理機能と販売管理機能の結合テストをしているんですが、店舗マスターを参照するとエラーが出てしまうんです。"}, {"spk": "リー", "t": "そうなんですか。店舗情報側の問題ですか。"}, {"spk": "大沢", "t": "そうかもしれません。それでちょっと確認したいんですが、店舗マスターの主キーは店舗コードに設定されていますか。"}, {"spk": "リー", "t": "はい、そうしてあります。"}, {"spk": "大沢", "t": "そうですか。じゃ、店舗コードのデータ型は、どうなっていますか。"}, {"spk": "リー", "t": "整数型にしてあると思いますが。"}, {"spk": "大沢", "t": "仕様書ではテキスト型になっているので、仕様書のとおりにしてください。"}, {"spk": "リー", "t": "え、そうでしたか。すみません。すぐ直します。"}, {"spk": "大沢", "t": "お願いします。"}, {"spk": "リー", "t": "つまり、店舗名だけでなく、店舗コードもテキスト型にするということですね。"}, {"spk": "大沢", "t": "そのとおりです。よろしく。"}], "note": ""}, {"track": 30, "chapter": 2, "unit": 11, "unitJp": "結合テスト", "unitVi": "Kiểm thử tích hợp (Combination Test)", "type": "聞き取り練習 (Luyện nghe)", "chars": "大沢 (Osawa) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "ラジュさん、いますか。"}, {"spk": "ラジュ", "t": "はい。"}, {"spk": "大沢", "t": "あ、ラジュさん。ラジュさんは確か、在庫管理の担当でしたよね。"}, {"spk": "ラジュ", "t": "はい、そうです。"}, {"spk": "大沢", "t": "実は今、販売管理との結合テストをしているんですが、予想したデータが出てこないときがあるんですよ。"}, {"spk": "ラジュ", "t": "そうなんですか。"}, {"spk": "大沢", "t": "で、確認したいんですが、出荷データの個数は整数型にしていますよね。"}, {"spk": "ラジュ", "t": "はい、そうしています。"}, {"spk": "大沢", "t": "ショート？ ロング？"}, {"spk": "ラジュ", "t": "ショートです。"}, {"spk": "大沢", "t": "ああ、やっぱり。そこはロングにしておいてください。"}, {"spk": "ラジュ", "t": "え、ロングですか。仕様書でもそうなっていましたっけ。"}, {"spk": "大沢", "t": "そのはずですよ。"}, {"spk": "ラジュ", "t": "すみません。すぐ直します。ええっと、つまり、出荷データの個数を64ビットまで扱えるようにするということですね。"}, {"spk": "大沢", "t": "そのとおりです。よろしく。"}], "note": ""}, {"track": 31, "chapter": 2, "unit": 12, "unitJp": "デバッグ終了報告とシステムテストの準備", "unitVi": "Báo cáo hoàn thành debug và chuẩn bị System Test", "type": "モデル会話 (Hội thoại mẫu)", "chars": "ラジュ (Raju) / 大沢 (Osawa)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "大沢さん、すみません。"}, {"spk": "大沢", "t": "はい。"}, {"spk": "ラジュ", "t": "昨日のバグですが、修正が終わりました。"}, {"spk": "大沢", "t": "お疲れさま。回帰テストはしましたか。"}, {"spk": "ラジュ", "t": "はい、やってあります。これがバグ票です。"}, {"spk": "大沢", "t": "わかりました。最新版はアーカイブにチェックインしてありますね？"}, {"spk": "ラジュ", "t": "あ、まだです。"}, {"spk": "大沢", "t": "結合テストを再開しますから、すぐにチェックインしてください。"}, {"spk": "ラジュ", "t": "わかりました。"}, {"spk": "大沢", "t": "このバグがつぶせれば、結合テストは終わりです。"}, {"spk": "ラジュ", "t": "それでは、次はシステムテストですね。"}, {"spk": "大沢", "t": "そうです。ラジュさんにはストレステストを担当してもらいますから、テストデータを今日中に作っておいてください。"}, {"spk": "ラジュ", "t": "ストレステスト用のデータですね。システムテストの仕様書はありますか。"}, {"spk": "大沢", "t": "これです。"}, {"spk": "ラジュ", "t": "拝見します。"}], "note": ""}, {"track": 32, "chapter": 2, "unit": 12, "unitJp": "デバッグ終了報告とシステムテストの準備", "unitVi": "Báo cáo hoàn thành debug và chuẩn bị System Test", "type": "聞き取り練習 (Luyện nghe)", "chars": "大沢 (Osawa) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "リーさん、デバッグは終わりましたか。"}, {"spk": "リー", "t": "あ、はい、終わりました。"}, {"spk": "大沢", "t": "回帰テストは？"}, {"spk": "リー", "t": "今やっているところです。もう少しで終わります。"}, {"spk": "大沢", "t": "そうですか。じゃ、まだクリアケースにはコミットしていないんですね。"}, {"spk": "リー", "t": "ええ、まだです。終わったらすぐに入れます。"}, {"spk": "大沢", "t": "よろしく。それから、まだいくつかのモジュールで結合テストが終わっていないんですが、来週にはシステムテストに入ります。"}, {"spk": "リー", "t": "はい。あ、私はストレステストの担当でしたっけ。"}, {"spk": "大沢", "t": "いえ、ストレステストはラジュさんです。リーさんには文書テストをしてもらいます。"}, {"spk": "リー", "t": "わかりました。もうユーザーマニュアルはできているんですか。"}, {"spk": "大沢", "t": "できていますよ。その後で管理者用マニュアルも見てもらいます。後で両方とも渡しますので。"}, {"spk": "リー", "t": "わかりました。"}], "note": ""}, {"track": 33, "chapter": 2, "unit": 13, "unitJp": "システムテスト", "unitVi": "Kiểm thử hệ thống (System Test)", "type": "モデル会話 (Hội thoại mẫu)", "chars": "リー (Li) / 大沢 (Osawa) / 新山 (Niiyama)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "大沢さん、大容量テストが全部終わりました。"}, {"spk": "大沢", "t": "お疲れさま。バグはありましたか。"}, {"spk": "リー", "t": "はい、三つほどありました。これがバグ票です。あのう……バグの一つは私が作ったモジュールに原因があるかもしれないんです。"}, {"spk": "大沢", "t": "じゃ、デバッグしてください。あ、でも、コードは今、新山さんがアーカイブからチェックアウトしたままなんですよ。"}, {"spk": "リー", "t": "そうですか。じゃあ、新山さんのデバッグがいつ終わるのか、確認してみます。"}, {"spk": "大沢", "t": "よろしく。終わったら、バグ票を戻してください。"}, {"spk": "リー", "t": "バグ票を戻すんですね。わかりました。"}, {"spk": "", "t": "（リー、新山さんのところへ）"}, {"spk": "リー", "t": "あのう、新山さん。実は、大容量テストが終わったんですが、バグが見つかりまして。私が作ったモジュールに原因があるかもしれないんです。"}, {"spk": "新山", "t": "そうですか。試験項目は、全部終わったんですか。"}, {"spk": "リー", "t": "はい、終わりました。"}, {"spk": "新山", "t": "じゃあ、デバッグしたいっていうことですね。"}, {"spk": "リー", "t": "そうなんです。"}, {"spk": "新山", "t": "えーっと、こちらのデバッグはあと1時間ぐらいで終わると思いますから、もうちょっと待ってもらえますか。"}, {"spk": "リー", "t": "あと1時間ですね。ではすみませんが、終わったらお知らせいただけませんか。"}, {"spk": "新山", "t": "わかりました。"}, {"spk": "リー", "t": "よろしくお願いします。"}], "note": ""}, {"track": 34, "chapter": 2, "unit": 13, "unitJp": "システムテスト", "unitVi": "Kiểm thử hệ thống (System Test)", "type": "聞き取り練習 (Luyện nghe)", "chars": "リー (Li) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "ラジュさん、おはようございます。"}, {"spk": "ラジュ", "t": "あ、リーさん。おはようございます。"}, {"spk": "リー", "t": "実は、文書テストをしているところなんですが、私が書いたエラーメッセージが管理者用マニュアルの表記とちょっと違っていたんですよ。"}, {"spk": "ラジュ", "t": "そうですか。あ、今すぐ直したいですか？"}, {"spk": "リー", "t": "いえ、まだユーザーマニュアルの方が終わっていないので、その後でもいいです。"}, {"spk": "ラジュ", "t": "それはよかった。こちらは同期エラーが出ているんですが、まだちょっと原因が特定できなくてねえ。"}, {"spk": "リー", "t": "じゃあ、いつ終わるかわかりませんよね。"}, {"spk": "ラジュ", "t": "そうですねえ……。あ、終わったら携帯で教えますよ。"}, {"spk": "リー", "t": "ありがとうございます。"}, {"spk": "ラジュ", "t": "もし終わらなくても、とりあえず今日は帰る前にチェックインしておきますよ。"}, {"spk": "リー", "t": "じゃあ、こちらは明日の朝一で直すことにします。"}, {"spk": "ラジュ", "t": "そう？ でも一応、もっと早くデバッグできたら電話しますね。"}, {"spk": "リー", "t": "はい。お待ちしてます。"}], "note": ""}, {"track": 35, "chapter": 2, "unit": 14, "unitJp": "オペレーションデモの準備", "unitVi": "Chuẩn bị demo vận hành", "type": "モデル会話 (Hội thoại mẫu)", "chars": "大沢 (Osawa) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "リーさん、システムテストが無事に終わりましたよ。来週はオペレーションデモです。"}, {"spk": "リー", "t": "はい。私はどんなことを担当しますか。"}, {"spk": "大沢", "t": "リーさんには、在庫管理のところをユーザーさんに説明してもらいます。"}, {"spk": "リー", "t": "お客様に説明するんですね。説明にはパワーポイントを使ったりするんですか。"}, {"spk": "大沢", "t": "いや、まずリーさんがデモを見せて、その後にユーザーさんに体験してもらいます。"}, {"spk": "リー", "t": "でも、システムの移行はまだ先ですよね。うちのコピーマシンはあるんですか。"}, {"spk": "大沢", "t": "デモ用にこちらから持参します。"}, {"spk": "リー", "t": "じゃあ、そのマシンにインストールしておくんですね。それから、在庫管理のデモなら、商品マスターや倉庫マスターのデータが必要だと思うんですが……。"}, {"spk": "大沢", "t": "あ、それはね、今コンバートとクレンジングをしていますから。"}, {"spk": "リー", "t": "実際のデータが使えるんですね。"}, {"spk": "大沢", "t": "そうです。"}, {"spk": "リー", "t": "実は、お客さまに会うのは初めてなんです。うまく説明できるかなあ。"}, {"spk": "大沢", "t": "練習しておけば大丈夫ですよ。心配なら見てあげましょうか。"}, {"spk": "リー", "t": "すみません。お時間のあるときに、一度お願いします。"}], "note": ""}, {"track": 36, "chapter": 2, "unit": 14, "unitJp": "オペレーションデモの準備", "unitVi": "Chuẩn bị demo vận hành", "type": "聞き取り練習 (Luyện nghe)", "chars": "大沢 (Osawa) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "ラジュさん、システムテストが終わりましたよ。来週からユーザー教育が始まります。"}, {"spk": "ラジュ", "t": "はい。私はどんなことを担当しますか。"}, {"spk": "大沢", "t": "販売管理のところを顧客に説明してもらいます。"}, {"spk": "ラジュ", "t": "顧客に私が説明するんですね。説明にはパワーポイントを使ったりするんですか。"}, {"spk": "大沢", "t": "はい。パワーポイントと、実際のシステムの画面を入れ替えながら説明します。"}, {"spk": "ラジュ", "t": "パワーポイントでは特別なフォーマットを使うんですか。"}, {"spk": "大沢", "t": "はい。後でメールで送ります。"}, {"spk": "ラジュ", "t": "ありがとうございます。説明用のスライドを作ったら、一度見てもらえますか。"}, {"spk": "大沢", "t": "もちろん。スライドはいつまでにできますか。"}, {"spk": "ラジュ", "t": "明日までにはできると思います。"}, {"spk": "大沢", "t": "じゃあ、あさっての午前中に見てみましょう。パワーポイントのスライドだけではなくて、実際の説明も練習が必要ですから、見てあげますよ。"}, {"spk": "ラジュ", "t": "ありがとうございます。よろしくお願いいたします。"}], "note": ""}, {"track": 37, "chapter": 2, "unit": 15, "unitJp": "オペレーションデモ", "unitVi": "Demo vận hành", "type": "モデル会話 (Hội thoại mẫu)", "chars": "リー (Li) / ユーザー (Khách hàng)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "では、次に売上データを追加してみましょうか。まず、メニューバーから「データ追加」をお選びください。画面の左上のところです。"}, {"spk": "ユーザー", "t": "あ、何か出てきましたね。「売上」を選ぶんですか。"}, {"spk": "リー", "t": "そうです。はい、今クリックして出てきたのが「売上データ追加画面」です。"}, {"spk": "ユーザー", "t": "どこから入力するんですか。"}, {"spk": "リー", "t": "得意先から入力してみましょう。今は練習ですので、このプルダウンメニューから、どれでもお好きな得意先になさってください。"}, {"spk": "ユーザー", "t": "じゃあ、「林檎ラボ」にしましょう。（クリック）お、担当者も選べるんですね。とりあえず橋本さんにしておくか。"}, {"spk": "リー", "t": "はい。次は商品コードです。これはバーコードリーダーでも読めるんですが、何かバーコードのついた商品はお手元にございますか。"}, {"spk": "ユーザー", "t": "困ったな。今ちょっとないんですよ。"}, {"spk": "リー", "t": "では、キーボードからも入力できますよ。商品は何になさいますか。"}, {"spk": "ユーザー", "t": "いつもの「冷凍とんかつ」にしておきましょう（コードをキーボードで入力する）。お、コードを入れると、品名と値段も出てくるんですね。"}, {"spk": "リー", "t": "そうです。数量はいくつになさいますか。"}, {"spk": "ユーザー", "t": "じゃあ、いつもどおり5個にしておくかな。お、売上金額が出ましたね。"}, {"spk": "リー", "t": "そうです。もしほかに売上がない場合は、登録ボタンをクリックなさってください。"}, {"spk": "ユーザー", "t": "はい。（クリック）ああ、これでまた別の得意先の売上が登録できるんですね。"}, {"spk": "リー", "t": "そうです。"}], "note": ""}, {"track": 38, "chapter": 2, "unit": 15, "unitJp": "オペレーションデモ", "unitVi": "Demo vận hành", "type": "聞き取り練習 (Luyện nghe)", "chars": "ラジュ (Raju) - độc thoại (thuyết trình)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "では、仕入データの追加方法をご説明いたします。まず、仕入年月日の欄は、インストールしたパソコンの内部時計を参照していますので、時計が間違って設定されていると、正しく表示されません。ご注意ください。次の仕入先名の欄は、プルダウンメニューの中から選ぶことができます。このリストは仕入先マスタを参照していますので、マスタが間違っていますと、こちらも正しく表示されません。次に……（※中略）そして最後に、仕入の入力が終わったら、伝票を発行します。見積依頼書の場合は「見積依頼印字」ボタン、受領書の場合は「受領印字」ボタンを押してください。そして最後に「登録」ボタンを押すと、この仕入先の入力が終わり、他の仕入先のデータを入力することができます。以上で、仕入データ追加の説明を終わります。"}], "note": ""}];
const SHADOW = /*__SHADOW__*/[{"unit": 1, "titleJp": "家族・夫婦・恋人との会話", "titleVi": "Hội thoại với gia đình, vợ chồng, người yêu", "sections": [{"section": 1, "level": "中級", "tracks": [{"track": "1-02", "disk": 1, "no": 2, "audio": "sd_1-02.mp3", "dur": 79.12, "pages": [20], "level": "中級", "section": 1, "segments": [{"id": "1-02-1", "no": 1, "page": 20, "start": 0.0, "end": 14.79, "dur": 14.79, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "早くかたづけなさい。", "vi": "Mau dọn dẹp đi!"}, {"spk": "B", "jp": "わかってるって。今やろうって思ったのに！", "vi": "Con biết rồi. Con đang định dọn!"}, {"spk": "A", "jp": "いつもそう言うだけじゃない。", "vi": "Lúc nào con cũng chỉ nói vậy."}, {"spk": "B", "jp": "だって、いつもそう思ってるときに言うから。", "vi": "Tại mẹ toàn nói vào lúc con định làm thế."}]}, {"id": "1-02-2", "no": 2, "page": 20, "start": 14.19, "end": 25.25, "dur": 11.06, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "雨降ってきそうだよ。傘持ってったら？", "vi": "Trời có vẻ sắp mưa đấy! Sao anh không mang ô đi?"}, {"spk": "B", "jp": "いいよ、めんどくさいし。", "vi": "Không cần. Lằng nhằng lắm."}, {"spk": "A", "jp": "ほら、折りたたみだから。", "vi": "Đây, gấp được vào mà."}, {"spk": "B", "jp": "いい、いい。そんなにどしゃぶりにはならないでしょ。", "vi": "Không cần, không cần. Chắc không mưa to đâu."}]}, {"id": "1-02-3", "no": 3, "page": 20, "start": 24.65, "end": 36.56, "dur": 11.91, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ほら、この人どう？", "vi": "Này, con thấy người này thế nào?"}, {"spk": "B", "jp": "いやだー。私の趣味じゃない。", "vi": "Không đời nào. Không phải gu của con."}, {"spk": "A", "jp": "でもほら、年収だってこんなにあんのよ。", "vi": "Nhưng mà thu nhập của cậu ấy từng này cơ mà."}, {"spk": "B", "jp": "お金があればいいってもんじゃないでしょ～。", "vi": "Đâu phải cứ có tiền là tốt đâu."}]}, {"id": "1-02-4", "no": 4, "page": 20, "start": 35.96, "end": 47.24, "dur": 11.28, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "さすが、一流ホテルだけのことはあるね。", "vi": "Đúng là khách sạn loại một có khác nhỉ!"}, {"spk": "B", "jp": "何感心してんの？", "vi": "Anh trầm trồ gì vậy?"}, {"spk": "A", "jp": "見てよ。あのシャンデリアの大きさ！", "vi": "Nhìn xem! Chùm đèn lớn chưa kìa!"}, {"spk": "B", "jp": "本当！　直径5メートルはあるね。", "vi": "Đúng thế thật! Đường kính phải đến 5 mét ấy nhỉ!"}]}, {"id": "1-02-5", "no": 5, "page": 20, "start": 46.64, "end": 61.28, "dur": 14.64, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ぐずぐずしてないでさっさと出かけなさい。", "vi": "Đừng lần chần nữa, mau ra khỏi nhà đi!"}, {"spk": "B", "jp": "ちょっとおなかが痛くて…。", "vi": "Con hơi đau bụng…"}, {"spk": "A", "jp": "大丈夫。いつもどおりテストが終われば、すぐ治るから。", "vi": "Không sao, làm bài kiểm tra xong là hết đau ngay như mọi khi thôi."}, {"spk": "B", "jp": "違うってば～。今日は本当に痛いんだよ。", "vi": "Không phải đâu! Hôm nay con thực sự đau."}]}, {"id": "1-02-6", "no": 6, "page": 20, "start": 60.68, "end": 77.27, "dur": 16.59, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ねー、このＣＭの人、中田友美恵だよね？　ほら、この前のドラマに出てた…。", "vi": "Này, diễn viên đóng quảng cáo này là Yumie Nakata phải không? Cái cô đóng trong phim truyền hình hôm trước ấy…"}, {"spk": "B", "jp": "え、そう？　わかんなかったよ。", "vi": "Ơ, thế à? Anh không hề nhận ra."}, {"spk": "A", "jp": "うん、　印象違うもんね。", "vi": "Ừ, trông khác hẳn nhỉ!"}, {"spk": "B", "jp": "そうだねー。あのドラマのときは老け役だったからね。", "vi": "Đúng rồi. Trong phim đó cô ấy đóng vai người đứng tuổi mà."}]}]}, {"track": "1-03", "disk": 1, "no": 3, "audio": "sd_1-03.mp3", "dur": 93.07, "pages": [22], "level": "中級", "section": 1, "segments": [{"id": "1-03-7", "no": 7, "page": 22, "start": 0.46, "end": 10.83, "dur": 10.37, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今日はどうして振袖の人が多いんだろ。", "vi": "Sao hôm nay nhiều người mặc Furisode thế nhỉ?"}, {"spk": "B", "jp": "何言ってんの。成人式じゃない。", "vi": "Anh nói gì vậy? Lễ trưởng thành mà."}, {"spk": "A", "jp": "えっ、そうだっけ。", "vi": "Ơ, vậy sao?"}, {"spk": "B", "jp": "やだー、しっかりしてよ。", "vi": "Ôi trời, đừng có như trên mây nữa!"}]}, {"id": "1-03-8", "no": 8, "page": 22, "start": 10.23, "end": 42.16, "dur": 31.93, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "先生とクラスメートから誕生日プレゼントもらったよ…。全部で五つ。", "vi": "Con nhận được quà sinh nhật của cô giáo và các bạn đấy…Tất cả có 5 gói quà."}, {"spk": "B", "jp": "そう…だけど、五つももらったにしては元気がないんじゃない？", "vi": "Thế cơ à? …Nhưng sao nhận được 5 gói quà mà trông con ỉu xìu vậy?"}, {"spk": "A", "jp": "それがね、五つが五つとも、目覚まし時計だったんだ。少しでも遅刻がなくなるようにってね。", "vi": "Đó là vì cả 5 gói quà đều là đồng hồ báo thức. Mọi người báo là để con không bị muộn giờ nữa."}, {"spk": "B", "jp": "みんな、あんたのことよくわかってるんだね。", "vi": "Mọi người hiểu con quá nhỉ!"}, {"spk": "A", "jp": "まー、そう言われれば、そうなんだけど…。", "vi": "Mẹ nói thế cũng đúng nhưng…"}, {"spk": "B", "jp": "よかったじゃない、これで遅刻がなくなるなら。頑張りなさいよ。", "vi": "Nếu nhờ điều này mà con không đi học muộn nữa thì tốt quá còn gì. Cố gắng lên!"}]}, {"id": "1-03-9", "no": 9, "page": 22, "start": 41.56, "end": 58.88, "dur": 17.32, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今何時？", "vi": "Mấy giờ rồi?"}, {"spk": "B", "jp": "11時。", "vi": "11 giờ."}, {"spk": "A", "jp": "えっ、もうそんな時間？　あ～あ、一日があっという間に過ぎちゃった…。", "vi": "Hả, đã đến thế rồi á? Ôi, 1 ngày trôi qua trong chớp mắt…"}, {"spk": "B", "jp": "何言ってんの？", "vi": "Anh nói vậy là sao?"}, {"spk": "A", "jp": "やることいっぱいあるのに、時間だけが過ぎてく…。", "vi": "Có bao nhiêu việc phải làm mà thời gian cứ thế trôi đi…."}, {"spk": "B", "jp": "グダグダ言ってる暇があったら、さっさとやったら～？", "vi": "Có thời gian than thở sao không lo mà làm đi?"}]}, {"id": "1-03-10", "no": 10, "page": 22, "start": 58.28, "end": 76.13, "dur": 17.85, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "来週、車の免許、更新に行かなくちゃ。", "vi": "Tuần sau em phải đi đổi bằng lái."}, {"spk": "B", "jp": "年末だから、混むかもね。", "vi": "Cuối năm có lẽ sẽ đông đấy!"}, {"spk": "A", "jp": "あ、そうかもね。じゃ、朝、早めに行こう。", "vi": "Ừ, có lẽ. Thế thì sáng đi sớm vậy."}, {"spk": "B", "jp": "うん。それがいいね。", "vi": "Ừ. Như thế tốt hơn."}, {"spk": "A", "jp": "写真撮るから、寝起きの顔になんないようにしなくっちゃ。", "vi": "Phải chụp ảnh nên phải cố không làm vẻ mặt ngái ngủ."}, {"spk": "B", "jp": "そんなに変わんないんじゃない？", "vi": "Có gì khác đâu cơ chứ?"}]}, {"id": "1-03-11", "no": 11, "page": 22, "start": 75.53, "end": 91.3, "dur": 15.77, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "太郎の数学のテストを見て。28点と32点だわ。", "vi": "Anh xem điểm kiểm tra toán của Tarou này. 28 và 32 điểm."}, {"spk": "B", "jp": "50点満点で？", "vi": "Điểm tối đa là 50?"}, {"spk": "A", "jp": "100点満点よ。あなた、本当に楽観的な人ね。", "vi": "Điểm tối đa là 100. Anh quá là lạc quan."}, {"spk": "B", "jp": "まー、いいじゃないか。かえるの子はかえるだよ。", "vi": "Thì có sao đâu. Cha nào con nấy mà."}]}]}, {"track": "1-04", "disk": 1, "no": 4, "audio": "sd_1-04.mp3", "dur": 40.78, "pages": [24], "level": "中級", "section": 1, "segments": [{"id": "1-04-12", "no": 12, "page": 24, "start": 0.53, "end": 20.23, "dur": 19.7, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あー、どうしよう！　たかしの熱が下がらない！", "vi": "Ôi, làm thế nào bây giờ! Takashi không hạ sốt!"}, {"spk": "B", "jp": "今日は日曜日だしなー。病院はどこも休みだろう？", "vi": "Hôm nay lại là chủ nhật nữa. Bệnh viện nào cũng nghỉ phải không?"}, {"spk": "A", "jp": "ちょっと、区の広報誌持ってきて。", "vi": "Này, mang tạp chí thông tin của quận lại đây cho em."}, {"spk": "B", "jp": "え、区の広報誌？", "vi": "Tạp chí thông tin của quận?"}, {"spk": "A", "jp": "電話の横にあるでしょ。休日診療の病院が載ってんのよ。", "vi": "Ở cạnh điện thoại ấy. Trong đó có đăng danh sách các bệnh viện làm việc vào ngay nghỉ."}, {"spk": "B", "jp": "あ、あった、あった。", "vi": "A, thấy rồi, thấy rồi."}]}, {"id": "1-04-13", "no": 13, "page": 24, "start": 19.63, "end": 38.92, "dur": 19.29, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "谷口さんちからの年賀状きてる？　あそこの毎年おもしろいんだよ。", "vi": "Thiệp chúc mừng năm mới nhà Taniguchi đã đến chưa? Thiệp của nhà đó năm nào cũng thú vị."}, {"spk": "B", "jp": "あ、谷口さんって兄妹みたいによく似た夫婦でしょ。", "vi": "A, nhà Taniguchi có phải là đôi vợ chồng giống nhau như anh em ấy không?"}, {"spk": "A", "jp": "あそこんち、犬もいて、犬まで似てるんだよ。", "vi": "Nhà đó có nuôi chó. Đến cả chó cũng giống."}, {"spk": "B", "jp": "みんな兄妹だったりして。", "vi": "Có khi họ từng là anh em."}, {"spk": "A", "jp": "それはない！", "vi": "Không có chuyện đó đâu!"}, {"spk": "B", "jp": "そっか、ないか。", "vi": "Vậy à, không có chuyện đó à?"}]}]}]}, {"section": 2, "level": "上級", "tracks": [{"track": "1-05", "disk": 1, "no": 5, "audio": "sd_1-05.mp3", "dur": 112.38, "pages": [26], "level": "上級", "section": 2, "segments": [{"id": "1-05-1", "no": 1, "page": 26, "start": 0.41, "end": 17.78, "dur": 17.37, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "コーヒー、いれてくれない？", "vi": "Pha cà phê dùm anh được không?"}, {"spk": "B", "jp": "いいよ、インスタント？　それとも豆からひく？", "vi": "Được thôi, anh dùng cà phê tan hay cà phê hạt?"}, {"spk": "A", "jp": "じゃ、せっかくだから豆からひいてもらおうかな。", "vi": "Mất công pha rồi thì pha cho anh cà phê hạt đi."}, {"spk": "B", "jp": "え、めんどうだなー。インスタントじゃだめ？", "vi": "Ồ, lằng nhằng lắm. Cà phê tan không được à?"}, {"spk": "A", "jp": "だったら、最初から聞くなよ。", "vi": "Thế thì từ đầu đừng có hỏi!"}]}, {"id": "1-05-2", "no": 2, "page": 26, "start": 17.18, "end": 27.11, "dur": 9.93, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "う～ん、また胃がシクシク痛み出した。", "vi": "Ùm, dạ dày anh lại đau ngâm ngẩm."}, {"spk": "B", "jp": "どうしたの？　胃炎？", "vi": "Sao thế nhỉ? Viêm dạ dày à?"}, {"spk": "A", "jp": "将来のことを考えはじめると痛くなるんだよ。", "vi": "Cứ bắt đầu nghĩ đến tương lai là lại đau."}, {"spk": "B", "jp": "このご時勢、もっと図太く生きなきゃ。", "vi": "Thời buổi này phải sống thoáng lên!"}]}, {"id": "1-05-3", "no": 3, "page": 26, "start": 26.51, "end": 50.14, "dur": 23.63, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ちょっと、私、怒ってるんだけど。", "vi": "Này, tôi đang giận đấy!"}, {"spk": "B", "jp": "え？　何でそんなにプンプン怒ってんの？　僕、なんか悪いことをした？", "vi": "Ơ, sao lại nổi giận ầm ầm vậy? Anh làm gì sai à?"}, {"spk": "A", "jp": "ふざけないで！　前の彼女とデートしてるの見ちゃったんだから。", "vi": "Đừng có giả bộ! Tôi thấy anh hẹn hò với bạn gái cũ đấy."}, {"spk": "B", "jp": "あ、あれは偶然会って立ち話してただけだよ。そばにいたなら、声かけてくれればよかったのにー。", "vi": "À, đó là bọn anh chỉ tình cờ gặp nhau nên đứng nói chuyện thôi. Em ở gần đấy sao không lên tiếng?"}]}, {"id": "1-05-4", "no": 4, "page": 26, "start": 49.54, "end": 68.22, "dur": 18.68, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ねー、何もそんなにツンツンしなくても…。", "vi": "Này, đâu cần phải bực bội như thế…."}, {"spk": "B", "jp": "いいえ。怒るなって言われても、今度ばかりは無理です。", "vi": "Không. Anh bảo tôi không giận nhưng lần này thì không được."}, {"spk": "A", "jp": "だから、あれは君の誤解だって、さっきから言ってるだろう。", "vi": "Nãy giờ anh đã bảo là em hiểu nhầm mà."}, {"spk": "B", "jp": "偶然会っても、立ち話なんてしてほしくないのよね、私としては…。", "vi": "Em không muốn anh đứng nói chuyện dù là gặp tình cờ đi nữa…."}]}, {"id": "1-05-5", "no": 5, "page": 26, "start": 67.62, "end": 89.23, "dur": 21.61, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "そんなにキンキンどなったら、周りの人が見るだろう。", "vi": "Em cứ gào ầm lên thế mọi người nhìn đấy."}, {"spk": "B", "jp": "見られたってかまいません。悪いのはあなたなんだし…。", "vi": "Nhìn cũng chẳng sao. Lỗi tại anh cơ mà…."}, {"spk": "A", "jp": "わかったわかった、謝ります。もう二度と君を傷つけるようなことはしません。", "vi": "Thôi được rồi, được rồi. Anh xin lỗi. Anh sẽ không bao giờ làm em tổn thương nữa."}, {"spk": "B", "jp": "本当？　心からそう思ってる？", "vi": "Thật không? Anh thật lòng nghĩ vậy chứ?"}, {"spk": "A", "jp": "もちろんだよ。僕の心の中には君しかいないって！", "vi": "Tất nhiên. Trong lòng anh chỉ có em thôi!"}]}, {"id": "1-05-6", "no": 6, "page": 26, "start": 88.63, "end": 110.61, "dur": 21.98, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ねー、もう12月も半ばだし、そろそろおせちのこと考えないとね。", "vi": "Này, đã giữa tháng 12 rồi, đến lúc nghĩ đến Osechi rồi đấy."}, {"spk": "B", "jp": "うーん、適当に決めてくれよ。家事は君に任せてあるんだから…。", "vi": "Ùm, em tự quyết định đi. Việc nhà giao cả cho em rồi mà…."}, {"spk": "A", "jp": "あ、そう？　じゃー、おせちなしっていう選択でもいいわけね。だいたい、おせち食べるのはあなただけなんだから。", "vi": "Ồ, vậy sao? Vậy thì em có thể chọn là không làm Osechi cũng được phải không? Vì cũng chỉ có anh ăn thôi."}, {"spk": "B", "jp": "それを言っちゃ、身もふたもないな。", "vi": "Em nói vậy thì anh chịu rồi."}]}]}, {"track": "1-06", "disk": 1, "no": 6, "audio": "sd_1-06.mp3", "dur": 119.43, "pages": [28], "level": "上級", "section": 2, "segments": [{"id": "1-06-7", "no": 7, "page": 28, "start": 0.46, "end": 21.87, "dur": 21.41, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ねー、見て、このウェディングドレス。全部手作りのレースだって。すてきね。", "vi": "Nhìn cái váy cưới này này. Nghe nói toàn bộ ren được làm thủ công đấy. Thật tuyệt nhỉ!"}, {"spk": "B", "jp": "うん、すごいね。一つ一つがすごく精巧だし…。気が遠くなるような作業だね。", "vi": "Ù, tuyệt thật. Từng sợi, từng sợi đều rất tinh xảo….Một công việc đòi hỏi sự kiên nhẫn nhỉ!"}, {"spk": "A", "jp": "私、これが着たいなー。", "vi": "Em muốn mặc cái này quá!"}, {"spk": "B", "jp": "え、ちょっと待ってよ。値段も相当…ほらね、やっぱり桁が違うよ。", "vi": "Ấy, khoan đã. Giá cũng khá là…Đây này, đúng là con số khác hẳn."}]}, {"id": "1-06-8", "no": 8, "page": 28, "start": 21.27, "end": 41.58, "dur": 20.31, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "冬のバーゲンセール、全品9割引？　信じられない！", "vi": "Tất cả các mặt hàng đều giảm 90% trong đợt giảm giá mùa đông? Thật không thể tin được!"}, {"spk": "B", "jp": "えっ、90%オフだって？　いくら出血大サービスと言っても、それじゃ、店も元取れないよね。", "vi": "Ơ, em bảo là giảm 90% á? Dù là khuyến mãi lớn nhưng bán với giá đó thì cửa hàng cũng làm sao thu hồi vốn được nhỉ?"}, {"spk": "A", "jp": "赤字覚悟なんじゃない。", "vi": "Chắc họ chấp nhận lỗ đấy!"}, {"spk": "B", "jp": "そりゃそうだ。まー、うちの家計にとっちゃ助かるけどねー。", "vi": "Có thể cho là thế. Dù sao vẫn có lợi cho tài chính gia đình mình."}]}, {"id": "1-06-9", "no": 9, "page": 28, "start": 40.98, "end": 67.36, "dur": 26.38, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ねー、お父さん、今度の選挙、誰に入れる？", "vi": "Bố nó này, lần bầu cử này, bố nó bầu ai?"}, {"spk": "B", "jp": "そうだな、しっかりと国民の声に耳を傾けてくれる人がいいなー。それから、国民のために尽くしてくれる人。", "vi": "Xem nào, phải là người nào biết lắng nghe ý kiến của người dân. Và làm hết sức mình vì nhân dân."}, {"spk": "A", "jp": "でも、選挙のときはみんなそう言うのよね。選挙が終わるとみんな国民なんてどうでもいいってなっちゃう。", "vi": "Nhưng khi vận động bầu cử ai cũng nói thế cả. Đến khi kết thúc đợt bầu cử thì họ chẳng quan tâm đến người dân nữa."}, {"spk": "B", "jp": "そうだね。目先の利益に目がくらんで、私腹を肥やすことばかり考えてる政治家は最低だよな。", "vi": "Đúng vậy. Những chính trị gia mờ mắt trước lợi ích trước mắt, chỉ nghĩ đến việc làm đầy túi của mình thật tồi tệ."}]}, {"id": "1-06-10", "no": 10, "page": 28, "start": 66.76, "end": 95.73, "dur": 28.97, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "何その頭、鳥の巣みたいにボサボサじゃないか～。", "vi": "Đầu tóc kiểu gì vậy? Bù xù như tổ quạ ấy."}, {"spk": "B", "jp": "そっちこそ、何よ、そのジーンズ。ボロボロじゃない。", "vi": "Còn cậu thì sao? Quần bò thì tả toi."}, {"spk": "A", "jp": "何言ってんだよ、これがファッションだよ。あれ、やだな～、その靴下。右と左で色が違ってんだろう。そそっかしいんだから、まったく～。", "vi": "Cậu nói gì vậy? Đây là thời trang đấy! Ơ, tất gì mà thế này?! Mỗi chiếc một màu. Cậu thật ẩu quá!"}, {"spk": "B", "jp": "もう～、これが最新のファッションなの！　センスが悪いくせに、いちいちうるさいったらありゃしない。", "vi": "Ôi trời, đây là thời trang mới nhất đấy! Gu thẩm mỹ kém mà còn bày đặt chê bai."}]}, {"id": "1-06-11", "no": 11, "page": 28, "start": 95.13, "end": 117.51, "dur": 22.38, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "家を買うならやっぱり、周りの環境を考えないとね。", "vi": "Mua nhà thì phải nghĩ tới môi trường xung quanh nhỉ!"}, {"spk": "B", "jp": "そう？　私は環境よりむしろ便利さのほうが大切だと思うけどな。", "vi": "Vậy sao? Em lại nghĩ sự tiện lợi quan trọng hơn môi trường."}, {"spk": "A", "jp": "ま、仕事をしているときはそうだろうけど、老後のことを考えたら、どう？", "vi": "Đúng là lúc còn đi làm thì vậy nhưng lúc về già thì sao?"}, {"spk": "B", "jp": "それもそうだね。いくら都心でも、空気が悪くちゃ長生きもできないもんね。", "vi": "Anh nói cũng đúng. Sống ở trung tâm thành phố mà không khí bẩn thì cũng chẳng sống lâu được nhỉ."}]}]}, {"track": "1-07", "disk": 1, "no": 7, "audio": "sd_1-07.mp3", "dur": 104.62, "pages": [30], "level": "上級", "section": 2, "segments": [{"id": "1-07-12", "no": 12, "page": 30, "start": 0.53, "end": 19.79, "dur": 19.26, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "何だか奥歯が痛いんだよね。", "vi": "Răng hàm em đau quá!"}, {"spk": "B", "jp": "親知らずが生えてくるんじゃない？", "vi": "Hay là mọc răng khôn?"}, {"spk": "A", "jp": "うん、そうかも。あ、また、ズキズキしてきた。", "vi": "Ừ, có lẽ. Á, lại đau nhức rồi."}, {"spk": "B", "jp": "生える角度が悪くて、となりの歯が押されちゃってるのかもね。ひどくならないうちに、早く歯医者さんに行ったほうがいいよ。", "vi": "Có lẽ là mọc lệch nên chèn vào răng bên cạnh. Em mau đến khám nha sĩ trước khi tệ hơn."}]}, {"id": "1-07-13", "no": 13, "page": 30, "start": 19.19, "end": 34.48, "dur": 15.29, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ピザ注文しない？", "vi": "Gọi pizza nhé?"}, {"spk": "B", "jp": "うん、いいね。何にする？", "vi": "Ừ, ý hay đấy. Gọi loại gì?"}, {"spk": "A", "jp": "じゃー、バーベキューチキンとシーフードミックスのハーフアンドハーフはどう？　クリスピーのＬね。", "vi": "Ừm, một nửa cái pizza gà nướng và một nửa cái pizza hải sản được không? Cỡ L, đế giòn."}, {"spk": "B", "jp": "めんどくさいな～。自分で注文してよ。", "vi": "Lằng nhằng quá. Em tự gọi đi!"}]}, {"id": "1-07-14", "no": 14, "page": 30, "start": 33.88, "end": 46.4, "dur": 12.52, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "確かディスカウントクーポンがあったはずなんだけど。", "vi": "Rõ ràng là có phiếu giảm giá."}, {"spk": "B", "jp": "え、いくら安くなるの？", "vi": "Ồ, giảm được bao nhiêu?"}, {"spk": "A", "jp": "800円。バカになんないよね、800円は。", "vi": "800 Yên. Không thể coi nhẹ 800 Yên được nhỉ!"}, {"spk": "B", "jp": "うん、ランチ1回分だよね。", "vi": "Ừ, đủ cho một bữa trưa đấy."}]}, {"id": "1-07-15", "no": 15, "page": 30, "start": 45.8, "end": 66.61, "dur": 20.81, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あ、やばい。伊藤さんに年賀状出しちゃったけど、あそこ喪中だった。", "vi": "Ôi, gay rồi! Em đã gửi thiệp mừng năm mới cho nhà Itou, nhưng năm nay nhà bên đó có tang."}, {"spk": "B", "jp": "あ、そうだね。しかも、お父様が亡くなったの暮れだったよね。", "vi": "Ừ, đúng rồi. Mà bố họ lại mất vào cuối năm."}, {"spk": "A", "jp": "うん。結構な枚数出してるから、気がつかないで出しちゃったんだね。", "vi": "Vâng. Chúng ta thường gửi khá nhiều thiệp nên em không để ý mà gửi đi mất."}, {"spk": "B", "jp": "しょうがないね。今度、ひと声かけとくよ。", "vi": "Biết làm sao được. Để anh nói một tiếng với họ nếu có gặp."}]}, {"id": "1-07-16", "no": 16, "page": 30, "start": 66.01, "end": 87.01, "dur": 21.0, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ゆうべ、駅前の自販機、壊されてお金盗まれたんだって。", "vi": "Thấy bảo đêm qua máy bán hàng tự động trước ga bị phá và bị lấy hết tiền."}, {"spk": "B", "jp": "え～、この辺も物騒だね。おとといストーカー騒ぎもあったし…。", "vi": "Chà, khu vực này cũng lắm chuyện thật đấy. Hôm kia cũng ầm ĩ vụ đeo bám…."}, {"spk": "A", "jp": "お姉ちゃんも気をつけなさいよ～。帰ってくるの遅いんだから。", "vi": "Con cũng phải cẩn thận đấy. Con hay về muộn mà."}, {"spk": "B", "jp": "うん、そうねー。防犯ブザーでも持って、自分の身は自分で守らなくちゃね。", "vi": "Vâng, mẹ nói phải. Chắc con phải mang theo máy cảnh báo tội phạm để tự bảo vệ mình thôi."}]}, {"id": "1-07-17", "no": 17, "page": 30, "start": 86.41, "end": 102.74, "dur": 16.33, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "このアナウンサー、顔小さいね。", "vi": "Phát thanh viên này có khuôn mặt nhỏ nhỉ."}, {"spk": "B", "jp": "あ、本当だ。ほら、前にいるのに後ろの人と同じぐらいに見えない？", "vi": "Ô, đúng thế thật. Xem này, đứng ở phía trước mà nhìn bằng người đứng ở sau ấy nhỉ?"}, {"spk": "A", "jp": "うん。遠近法を無視した構図だね。", "vi": "Ừ, đúng là một bố cục bỏ qua phép xa - gần nhỉ."}, {"spk": "B", "jp": "後ろの人だって、決して顔大きくないのにね。", "vi": "Người ở đằng sau chắc chắn mặt không to."}]}]}, {"track": "1-08", "disk": 1, "no": 8, "audio": "sd_1-08.mp3", "dur": 107.34, "pages": [32], "level": "上級", "section": 2, "segments": [{"id": "1-08-18", "no": 18, "page": 32, "start": 0.38, "end": 17.69, "dur": 17.31, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "も～、顔見る度に説教されたんじゃ、たまんないよ。", "vi": "Trời ơi, cứ mỗi lần nhìn thấy mặt là lại bị thuyết giáo thì làm sao chịu nổi."}, {"spk": "B", "jp": "お父さん、あなたのことが心配なのよ。", "vi": "Bố lo cho con đấy thôi!"}, {"spk": "A", "jp": "人のことはいいから、自分の老後の心配でもしてくれってんだよ。", "vi": "Chuyện của con để con lo. Sao bố không lo cho tuổi già của mình đi!"}, {"spk": "B", "jp": "親の言うことは素直に聞いといたほうがいいんじゃない？", "vi": "Con cái nên ngoan ngoãn nghe lời bố mẹ chứ?"}]}, {"id": "1-08-19", "no": 19, "page": 32, "start": 17.09, "end": 36.42, "dur": 19.33, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "見て、あの子、さっきから黙々と砂山作ってるんだけど…。", "vi": "Nhìn kìa, đứa trẻ đó từ nãy đến giờ cứ lẳng lặng xây lâu đài cát…"}, {"spk": "B", "jp": "うん、上手だね。あ、あー、残念、崩れちゃった。", "vi": "Ừ, đẹp thật. Ôi, tiếc quá, đổ mất rồi!"}, {"spk": "A", "jp": "もう、これで四回目よ、崩れたの。小さいのに根性あるわね。", "vi": "Đây là lần thứ 4 đấy. Còn nhỏ mà kiên trì nhỉ!"}, {"spk": "B", "jp": "よその子ながら、将来が楽しみだね。", "vi": "Không phải con mình nhưng tương lai chắc vui lắm nhỉ!"}]}, {"id": "1-08-20", "no": 20, "page": 32, "start": 35.82, "end": 55.56, "dur": 19.74, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "おやつ何にする？", "vi": "Ăn nhẹ món gì bây giờ?"}, {"spk": "B", "jp": "アツアツのあんまんがあるけど、どう？", "vi": "Có bánh bao ngọt nóng hổi đấy. Ăn không?"}, {"spk": "A", "jp": "いいね、それ。じゃ、しぶーいお茶用意するね。", "vi": "Nghe được đấy nhỉ. Vậy em sẽ pha trà đặc nhé."}, {"spk": "B", "jp": "あ、それから、ホクホクの焼き芋もあるよ。", "vi": "À, còn có cả khoai nướng nữa."}, {"spk": "A", "jp": "うーん、あんまんに焼き芋じゃ、かなりヘビーなおやつになりそうだね。", "vi": "Ừm, bánh bao ngọt và khoai nướng, xem ra là sẽ thành bữa ăn nặng rồi."}, {"spk": "B", "jp": "夕飯少なめにしてもらわなきゃね。", "vi": "Phải giảm bớt bữa tối thôi."}]}, {"id": "1-08-21", "no": 21, "page": 32, "start": 54.96, "end": 83.62, "dur": 28.66, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あなた、一緒にランチ行かない？", "vi": "Anh đi ăn trưa cùng em không?"}, {"spk": "B", "jp": "うーん、今日は昼抜きにしとくよ。", "vi": "Ừm, hôm nay anh không ăn."}, {"spk": "A", "jp": "どうしたの？　珍しいじゃない。具合悪いの？", "vi": "Sao thế? Thật chẳng giống anh gì cả. Anh thấy khó chịu trong người à?"}, {"spk": "B", "jp": "うん。昨日、パーティでマンゴー食べすぎちゃって…、おなかがちょっとね…。", "vi": "Ừ. Hôm qua anh ăn quá nhiều xoài ở bữa tiệc nên bụng dạ hơi có vấn đề…."}, {"spk": "A", "jp": "マンゴーの食べすぎ？　もう、子どもじゃあるまいし…。いい年したおじさんが恥ずかしいわね。", "vi": "Ăn quá nhiều xoài? Anh có còn là trẻ con nữa đâu…Ngần này tuổi rồi thật là xấu hổ!"}, {"spk": "B", "jp": "だけど、本当においしかったんだよ、あの完熟マンゴー。", "vi": "Nhưng thực sự là món xoài chín đó rất ngon."}]}, {"id": "1-08-22", "no": 22, "page": 32, "start": 83.02, "end": 105.33, "dur": 22.31, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ねー、これ食べてみて。", "vi": "Này, ăn thử cái này đi!"}, {"spk": "B", "jp": "どれどれ。うーん、うまいよ、これ。", "vi": "Đâu, đâu? Ừm, ngon thật!"}, {"spk": "A", "jp": "本当？　テレビでやってたの、作ってみたの。", "vi": "Thật không? Em xem trên ti vi hướng dẫn nên làm thử đấy."}, {"spk": "B", "jp": "最近、料理の腕上げたね。", "vi": "Dạo này tay nghề nấu ăn của em khá hơn hẳn."}, {"spk": "A", "jp": "そう？　それほどでもないけど…。でも、うそでもうれしいわ。", "vi": "Vậy sao? Làm gì đến mức đó… Nhưng dù anh nói dối thì em cũng vẫn vui."}, {"spk": "B", "jp": "うそじゃないよ。それとも、僕が君の味にすっかり慣らされちゃったのかな。", "vi": "Không nói dối đâu. Hay là anh đã quen với vị món ăn em nấu quá rồi?"}]}]}, {"track": "1-09", "disk": 1, "no": 9, "audio": "sd_1-09.mp3", "dur": 83.07, "pages": [34], "level": "上級", "section": 2, "segments": [{"id": "1-09-23", "no": 23, "page": 34, "start": 0.51, "end": 31.22, "dur": 30.71, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "太郎が学校休んだんだって？　どこか具合でも悪いのか？", "vi": "Em bảo Taro nghỉ học hôm nay? Con thấy khó chịu ở đâu à?"}, {"spk": "B", "jp": "ううん、そうじゃなくて。学校でクラスメートにからかわれたらしいの。", "vi": "Không, không phải thế. Hình như con bị bạn cùng lớp trêu."}, {"spk": "A", "jp": "からかわれたぐらいで学校に行けないんじゃ、しょうがないな～。", "vi": "Bị bạn cùng lớp trêu mà cũng nghĩ học thì thật chẳng thể hiểu nổi."}, {"spk": "B", "jp": "それが、大好きな女の子にからかわれちゃったらしいのよ。", "vi": "Hình như là bị một bạn gái mà con rất thích trêu."}, {"spk": "A", "jp": "いったい、何をからかわれたんだ？", "vi": "Thế bị trêu cái gì?"}, {"spk": "B", "jp": "あなたがカットしてあげたヘアスタイルよ。坊主頭はもう古いって…。太郎、怒ってるわよ～。", "vi": "Kiểu tóc anh cắt cho con ấy. Con bé bảo đầu húi cua giờ xưa rồi. Taro bực mình lắm đó."}]}, {"id": "1-09-24", "no": 24, "page": 34, "start": 30.62, "end": 57.68, "dur": 27.06, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "翼、いつまでゲームしてんの！　もうそのくらいで止めにして、さっさと寝なさい。", "vi": "Tsubasa, con định chơi game đến bao giờ hả? Chơi thế thôi. Mau đi ngủ đi!"}, {"spk": "B", "jp": "わかったよ。", "vi": "Vâng."}, {"spk": "A", "jp": "ほらほら、止めなさい。何時だと思ってるのよ。いい加減にしないとー。", "vi": "Nào, nào, dừng lại ngay. Con nghĩ giờ là mấy giờ rồi? Không dừng lại là mẹ…"}, {"spk": "B", "jp": "もう、いちいちうるさいんだよ、おふくろは！　もう子どもじゃないんだから。", "vi": "Mẹ lắm lời quá đấy! Con có còn là trẻ con nữa đâu!"}, {"spk": "A", "jp": "親の言うことに口答えして、そんな息子に育てた覚えはありません。", "vi": "Mẹ không nhớ là đã nuôi đứa con dám cãi lời bố mẹ đấy!"}, {"spk": "B", "jp": "はいはい、わかりました！", "vi": "Vâng, vâng, con biết rồi!"}]}, {"id": "1-09-25", "no": 25, "page": 34, "start": 57.08, "end": 81.28, "dur": 24.2, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "姉貴ー、おやじとおふくろ、またけんかしてるよ。", "vi": "Chị, bố mẹ lại cãi nhau đấy!"}, {"spk": "B", "jp": "また～？「夫婦げんかは犬も食わない」って言うのにね。", "vi": "Lại à? Người ta bảo \"vợ chồng cãi nhau đến con chó cũng bỏ ăn\" thế mà bố mẹ cứ…"}, {"spk": "A", "jp": "本当、本当。まー、「けんかするほど仲がいい」とも言うけどさー。", "vi": "Đúng vậy. Nhưng cũng có câu \"thân thiết đến mức cãi nhau\""}, {"spk": "B", "jp": "少しは子どもの身にもなってほしいよね。", "vi": "Chị mong bố mẹ đặt mình vào vị trí của con cái một chút."}, {"spk": "A", "jp": "まったく。週末ごとじゃ、たまったもんじゃないよ。", "vi": "Thật chẳng ra sao! Cuối tuần nào cũng thế này làm sao chịu nổi!"}, {"spk": "B", "jp": "まー、ほとぼりが冷めるまでほっとこう。", "vi": "Thôi cứ mặc kệ cho đến lúc cả hai nguội lại đi!"}]}]}]}]}, {"unit": 2, "titleJp": "親しい友人との会話", "titleVi": "Hội thoại với bạn thân", "sections": [{"section": 1, "level": "中級", "tracks": [{"track": "1-10", "disk": 1, "no": 10, "audio": "sd_1-10.mp3", "dur": 82.42, "pages": [40], "level": "中級", "section": 1, "segments": [{"id": "1-10-1", "no": 1, "page": 40, "start": 0.4, "end": 14.26, "dur": 13.86, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今日、仕事の面接に行くんだ。", "vi": "Hôm nay tớ đi phỏng vấn xin việc đấy."}, {"spk": "B", "jp": "え～！　まさかその格好で行くんじゃないでしょうね？", "vi": "Hả? Cậu không định mặc như thế đi đấy chứ?"}, {"spk": "A", "jp": "え～？　どうして？　なんか変？", "vi": "Ơ? Tại sao? Có gì không ổn à?"}, {"spk": "B", "jp": "ジーンズはまずいでしょう、やっぱり。", "vi": "Rõ ràng là mặc quần bò là không được rồi."}]}, {"id": "1-10-2", "no": 2, "page": 40, "start": 13.66, "end": 33.94, "dur": 20.28, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あ～あ、一目でいいから彼女に会いたいな～。", "vi": "Ôi, giá mà mình được gặp nàng dù chỉ trong giây lát."}, {"spk": "B", "jp": "何未練がましいこと言ってんだよ。ふられたんだよ、お前は。", "vi": "Còn tiếc nuối gì nữa. Cậu bị đá rồi còn gì."}, {"spk": "A", "jp": "いや～、なんかの事情があったんだよ、きっと。", "vi": "Không, chắc chắn là có lý do gì đó."}, {"spk": "B", "jp": "幸せなやつだな～、お前は。", "vi": "Cậu đúng là một kẻ hạnh phúc!"}]}, {"id": "1-10-3", "no": 3, "page": 40, "start": 33.34, "end": 42.61, "dur": 9.27, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あれ、ちょっと太った？", "vi": "Chà, cậu mập lên một chút đấy à?"}, {"spk": "B", "jp": "やだー、ひどい！", "vi": "Này, cậu thật quá đáng!"}, {"spk": "A", "jp": "ごめんごめん、気に触った？", "vi": "Xin lỗi, xin lỗi, tớ làm cậu phật lòng à?"}, {"spk": "B", "jp": "当たり前じゃない！　本当にデリカシーのない人ね。", "vi": "Đương nhiên rồi! Cậu chẳng tế nhị gì cả!"}]}, {"id": "1-10-4", "no": 4, "page": 40, "start": 42.01, "end": 54.44, "dur": 12.43, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "入学試験の面接、どうだった？", "vi": "Phỏng vấn thi đầu vào thế nào?"}, {"spk": "B", "jp": "志望動機をしつこく聞かれて、たじたじだったよ。", "vi": "Tớ luống cuống vì bị hỏi mãi về lý do muốn vào trường."}, {"spk": "A", "jp": "じゃー、望みが薄いかもね。", "vi": "Vậy thì có lẽ ít hy vọng rồi!"}, {"spk": "B", "jp": "え、そんな～。", "vi": "Ơ, đừng nói thế chứ!"}]}, {"id": "1-10-5", "no": 5, "page": 40, "start": 53.84, "end": 66.34, "dur": 12.5, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "教室の時計、おかしくない？", "vi": "Đồng hồ lớp mình bị làm sao thì phải?"}, {"spk": "B", "jp": "あ、本当だ。3、4分進んでる。", "vi": "Ừ, đúng thật. Nhanh 3,4 phút."}, {"spk": "A", "jp": "きっと誰かが授業を早く終わらせようって、仕組んだんじゃないの？", "vi": "Có khi ai đó làm thế để giờ học kết thúc sớm đấy mà!"}, {"spk": "B", "jp": "かもね…。", "vi": "Có thể…"}]}, {"id": "1-10-6", "no": 6, "page": 40, "start": 65.74, "end": 80.57, "dur": 14.83, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "誕生日おめでとう！　これプレゼント。", "vi": "Chúc mừng sinh nhật! Quà của cậu đây."}, {"spk": "B", "jp": "あ、ありがとう。よく覚えててくれたね。この中、何入ってんの？", "vi": "Oa, cám ơn cậu. Cám ơn cậu vẫn nhớ. Có gì bên trong thế?"}, {"spk": "A", "jp": "それは開けてからのお楽しみ。", "vi": "Cứ mở ra đi!"}, {"spk": "B", "jp": "何だろう。ワクワクするな。", "vi": "Gì vậy nhỉ? Hỏi hộp quá!"}]}]}, {"track": "1-11", "disk": 1, "no": 11, "audio": "sd_1-11.mp3", "dur": 89.52, "pages": [42], "level": "中級", "section": 1, "segments": [{"id": "1-11-7", "no": 7, "page": 42, "start": 0.46, "end": 23.15, "dur": 22.69, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "かおりって、毎日彼と電話してるの？", "vi": "Kaori, ngày nào cậu cũng gọi điện cho bạn trai à?"}, {"spk": "B", "jp": "うん、ま～ね。", "vi": "Ờ, thì…"}, {"spk": "A", "jp": "よくそんなに毎日毎日話すことあるね～。信じらんない。", "vi": "Ngày nào cũng có chuyện để nói nhỉ! Thật không thể tin được."}, {"spk": "B", "jp": "え～、だって彼の生活全部知ってたいもん…。", "vi": "Ơ, thì tại tớ muốn biết toàn bộ cuộc sống của anh ấy mà."}, {"spk": "A", "jp": "ごちそうさま。でもそんなの初めのうちだけだよ、絶対。", "vi": "Tớ nghe đủ rồi. Nhưng thế này cũng chỉ lúc mới yêu thôi. Chắc chắn luôn."}, {"spk": "B", "jp": "そんなことないよ～。何でそうやって水さすようなこと言うの～？", "vi": "Không có chuyện đó đâu. Sao cậu lại nói kiểu phá đám như thế chứ?"}]}, {"id": "1-11-8", "no": 8, "page": 42, "start": 22.55, "end": 49.24, "dur": 26.69, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "由佳、フラダンス習ってるんだって？", "vi": "Yuka, nghe nói cậu đang học múa Hula?"}, {"spk": "B", "jp": "うん、先月始めたばっかりなんだけどね。", "vi": "Ù, tớ mới học từ tháng trước."}, {"spk": "A", "jp": "私もちょっと興味あるんだ。ねー、どんな感じ？", "vi": "Tớ cũng có chút quan tâm tới môn đó. Nói xem, nó thế nào?"}, {"spk": "B", "jp": "えー、おもしろいよー。すごくストレス解消にもなるし。今はまだ基礎練習だけだけど、それでも運動量は半端じゃないし…。", "vi": "Ờ, thú vị lắm. Cũng giúp giảm căng thẳng rất tốt nữa. Bây giờ tớ mới đang tập động tác cơ bản thôi nhưng dù thế thì lượng vận động cũng không vừa đâu…"}, {"spk": "A", "jp": "へー。でも難しいんでしょ？", "vi": "Chà. Nhưng khó phải không?"}, {"spk": "B", "jp": "まー、簡単じゃないけど、私でもできるんだから。", "vi": "Thì, cũng không đơn giản đâu nhưng đến tớ còn làm được cơ mà."}]}, {"id": "1-11-9", "no": 9, "page": 42, "start": 48.64, "end": 67.4, "dur": 18.76, "title": "", "titleVi": "", "lines": [{"spk": "", "jp": "【広告チラシを見ながら】", "vi": "【Vừa xem tờ rơi quảng cáo】"}, {"spk": "A", "jp": "ねー、どうしてこのジムこんなに高いの？", "vi": "Này, sao phòng tập này lại đắt thế?"}, {"spk": "B", "jp": "え～、高級感出そうとしてんじゃない？", "vi": "Ờ, có lẽ vì trông nó có vẻ cao cấp?"}, {"spk": "A", "jp": "あー、シャワールームなんかも豪華そうだしね。", "vi": "Ù, phòng tắm trông cũng có vẻ sang trọng."}, {"spk": "B", "jp": "そうそう、ほかのところとは違うよね。", "vi": "Đúng đấy, khác với những phòng tập khác nhỉ!"}, {"spk": "A", "jp": "うん…でもこの値段じゃちょっと手が出ないなー。", "vi": "Ù… Nhưng giá này thì tớ không trả nổi."}, {"spk": "B", "jp": "そうだねー。", "vi": "Cậu nói phải."}]}, {"id": "1-11-10", "no": 10, "page": 42, "start": 66.8, "end": 87.52, "dur": 20.72, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "きゃー、あれ俳優の田中ジョージじゃない？", "vi": "Ôi, kia là nam diễn viên George Tanaka phải không?"}, {"spk": "B", "jp": "どこどこ？　え～、そうかな。似てるけど、なんか微妙に違わない？", "vi": "Đâu, đâu? Ờ, có lẽ thế. Trông giống nhưng hình như hơi khác thì phải?"}, {"spk": "A", "jp": "うそ～、絶対に田中ジョージよ。", "vi": "Không đâu. Chắc chắn là George Tanaka đấy."}, {"spk": "B", "jp": "でもさ～、あの田中ジョージが100円ショップなんかに来る？", "vi": "Nhưng, George Tanaka đó mà tới cửa hàng 100 Yên à?"}, {"spk": "A", "jp": "それもそうだよね…。", "vi": "Cũng phải…."}, {"spk": "B", "jp": "他人の空似だよ。", "vi": "Chỉ là người giống người thôi."}]}]}, {"track": "1-12", "disk": 1, "no": 12, "audio": "sd_1-12.mp3", "dur": 101.25, "pages": [44], "level": "中級", "section": 1, "segments": [{"id": "1-12-11", "no": 11, "page": 44, "start": 0.39, "end": 23.33, "dur": 22.94, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "何、どうしたの？　あんなに人が集まって…。", "vi": "Gì vậy, có chuyện gì vậy? Sao đông người thế?"}, {"spk": "B", "jp": "三丁目のビルで火事があったんだって。", "vi": "Nghe nói có hỏa hoạn trong tòa nhà ở phường 3."}, {"spk": "A", "jp": "えっ、火事？　だから野次馬がたくさんいるんだ。ほら、テレビカメラも来てる。", "vi": "Ơ, hỏa hoạn á? Thảo nào mà tập trung nhiều người thích hóng chuyện thế. Kìa, cả truyền hình cũng tới."}, {"spk": "B", "jp": "何でも放火らしいよ。", "vi": "Thấy bảo là có kẻ đốt."}, {"spk": "A", "jp": "へー、そうなの？　日中、堂々と放火なんて…。", "vi": "Ồ, vậy sao? Ban ngày ban mặt mà dám đốt thì thật…."}, {"spk": "B", "jp": "物騒な世の中になったもんだね。", "vi": "Thời buổi loạn hết cả rồi."}]}, {"id": "1-12-12", "no": 12, "page": 44, "start": 22.73, "end": 48.95, "dur": 26.22, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今日は本当、ついてないよ！　定期落としちゃったんだ。", "vi": "Hôm nay đúng là xui xẻo! Tớ làm rơi mất vé tháng rồi."}, {"spk": "B", "jp": "えっ、どこで落としたの？", "vi": "Hả, cậu làm rơi ở đâu?"}, {"spk": "A", "jp": "それがわかってればね～。", "vi": "Nếu mà biết thì…."}, {"spk": "B", "jp": "とりあえず、定期を買った駅に連絡してみたら？　落とした定期は、そこに届くことになってるんだって。", "vi": "Sao không liên lạc với ga mà cậu đã mua vé? Thấy bảo vé bị rơi sẽ được gửi đến đó."}, {"spk": "A", "jp": "でも、お金が少し入ってたんだけど、大丈夫かな。", "vi": "Nhưng vẫn còn ít tiền trong đó, liệu có còn không nhỉ?"}, {"spk": "B", "jp": "う～ん、お金が入ってたなら、出てこないかもね。", "vi": "Ừm, nếu còn tiền thì có khi không quay lại đâu."}]}, {"id": "1-12-13", "no": 13, "page": 44, "start": 48.35, "end": 79.06, "dur": 30.71, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "映画5本ハシゴしたら、内容がごちゃごちゃになっちゃったよ。", "vi": "Sau khi đi từ phòng chiếu này sang phòng chiếu khác để xem 5 phim thì nội dung lẫn lộn hết."}, {"spk": "B", "jp": "5本ハシゴって、つまり10時間くらい映画見続けたってこと？", "vi": "Đi từ phòng chiếu này sang phòng chiếu khác để xem 5 phim? Nghĩa là cậu xem liên tục 10 tiếng liền?"}, {"spk": "A", "jp": "うん。シネコンだから便利だし、映画の日は1本1000円だからね。", "vi": "Ừ, cụm tổ hợp rạp chiếu phim liên hoàn nên tiện lắm và vào ngày chiếu phim thì 1 phim có 1000 Yên thôi."}, {"spk": "B", "jp": "内容がごちゃごちゃになっちゃうなら、あんまり意味ないと思うけど。", "vi": "Nếu nội dung lẫn lộn thì tớ nghĩ chẳng có ý nghĩa gì."}, {"spk": "A", "jp": "まー、完全に頭に入ってるのは1、2本かな。", "vi": "Ừ, có lẽ tớ nhớ được hết 1 hoặc 2 phim."}, {"spk": "B", "jp": "ふーん、私は、やっぱり1本をじっくり見るほうが好きだな。", "vi": "Hừm, tớ vẫn thích xem kỹ một bộ phim hơn."}]}, {"id": "1-12-14", "no": 14, "page": 44, "start": 78.46, "end": 99.35, "dur": 20.89, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あ、信号が青になった。行こう！", "vi": "Kìa, đèn chuyển sang xanh dương rồi. Đi thôi!"}, {"spk": "B", "jp": "え、青？　青じゃないよ、緑でしょう？", "vi": "Ơ, xanh dương? Không phải xanh dương mà là xanh lá cây chứ?"}, {"spk": "A", "jp": "違うよ、日本では緑を時々青って言うんだよ。", "vi": "Không phải. Ở Nhật Bản, đôi khi gọi xanh lá cây là xanh dương."}, {"spk": "B", "jp": "ふーん、色の感覚が違うのかー。", "vi": "Hừm, là do cảm giác về màu sắc khác nhau à?!"}, {"spk": "A", "jp": "そう言えば、「顔が真っ青になった」とも言うね。", "vi": "Nói đến mới nhớ, người Nhật cũng nói là \"Mặt xanh lét\""}, {"spk": "B", "jp": "まさか、顔が緑になったってことじゃないよね。", "vi": "Không có chuyện mặt trở nên xanh lá cây đâu nhỉ?"}]}]}, {"track": "1-13", "disk": 1, "no": 13, "audio": "sd_1-13.mp3", "dur": 63.22, "pages": [46], "level": "中級", "section": 1, "segments": [{"id": "1-13-15", "no": 15, "page": 46, "start": 0.47, "end": 31.66, "dur": 31.19, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "最近、肩が凝って肩が凝って…。", "vi": "Gần đây vai mỏi, mỏi quá…."}, {"spk": "B", "jp": "へー、そうなの。もしかしてデスクワークばっかりなんじゃないの？", "vi": "Ồ, vậy sao?! Có lẽ tại cậu ngồi làm việc nhiều quá đấy!"}, {"spk": "A", "jp": "そうなんだ。一日8時間はパソコンに向かってるもん。", "vi": "Cậu nói phải. Một ngày tớ ngồi máy tính 8 tiếng liền."}, {"spk": "B", "jp": "1時間に一回ぐらい、ストレッチでもしてみたら？", "vi": "Hay cậu thử giãn cơ mỗi tiếng một lần xem?"}, {"spk": "A", "jp": "そうだよね～。だけど仕事を始めるとあっという間に3、4時間過ぎちゃうんだ。", "vi": "Ý hay đấy. Nhưng cứ bắt đầu làm việc là loáng một cái đã 3,4 tiếng trôi qua."}, {"spk": "B", "jp": "あのね、わかってると思うけど、働きすぎは良くないよ。", "vi": "Này, tớ nghĩ cậu biết là làm việc nhiều không tốt đâu đấy!"}, {"spk": "A", "jp": "そうだね、気をつけるよ。", "vi": "Tớ biết. Tớ sẽ chú ý."}]}, {"id": "1-13-16", "no": 16, "page": 46, "start": 31.06, "end": 61.35, "dur": 30.29, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ちょっとこのメール見て、「あけおめ、ことよろ」ってわかる？", "vi": "Này, đọc cái mail này đi. Cậu có hiểu 「あけおめ、ことよろ」nghĩa là gì không?"}, {"spk": "B", "jp": "あけおめ？　ことよろ？", "vi": "Akeome? Kotoyoro?"}, {"spk": "A", "jp": "あけましておめでとうが「あけおめ」、今年もどうぞよろしくが「ことよろ」なんだって。", "vi": "Chúc mừng năm mới viết tắt thành 「あけおめ」, còn năm nay cũng mong được giúp đỡ viết tắt thành 「ことよろ」"}, {"spk": "B", "jp": "へー、そうなんだ、知らなかった。外来語にそのパターンがあるのは知ってたけど。", "vi": "Chà, ra là thế. Tớ không hề biết đấy. Chỉ biết là trong từ vay mượn thì có kiểu viết tắt như thế thôi."}, {"spk": "A", "jp": "「コンビニ」とか「マザコン」とか「セクハラ」なんかだよね。", "vi": "Kiểu như 「コンビニ (convenience store)」, 「マザコン (mother complex)」hay 「セクハラ (sexual harassment)」ấy nhỉ?"}, {"spk": "B", "jp": "日本人って、せっかちなのかな？　何でも略すよね。", "vi": "Người Nhật vội vàng hay sao vậy? Cái gì cũng giản lược."}]}]}]}, {"section": 2, "level": "上級", "tracks": [{"track": "1-14", "disk": 1, "no": 14, "audio": "sd_1-14.mp3", "dur": 91.72, "pages": [48], "level": "上級", "section": 2, "segments": [{"id": "1-14-1", "no": 1, "page": 48, "start": 0.41, "end": 16.0, "dur": 15.59, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ねー、冬になると肘とか踵がカサカサしない？", "vi": "Này, mùa đông khuỷu tay và gót chân cậu không bị nứt nẻ à?"}, {"spk": "B", "jp": "大丈夫。保湿クリームを朝晩すりこんでるから。", "vi": "Không hề. Vì tớ bôi kem dưỡng ẩm mỗi sáng và tối mà."}, {"spk": "A", "jp": "へー、それどこで売ってるの？", "vi": "Ô, kem đó bán ở đâu vậy?"}, {"spk": "B", "jp": "え、ドラッグストアならどこでも売ってるよ。", "vi": "Ơ, hiệu thuốc nào cũng bán mà."}]}, {"id": "1-14-2", "no": 2, "page": 48, "start": 15.4, "end": 30.35, "dur": 14.95, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "彼女、昨日からプリプリして口もきいてくれないんだ。", "vi": "Từ hôm qua đến giờ, cậu ấy cáu kỉnh, chẳng chịu nói với tớ tiếng nào cả."}, {"spk": "B", "jp": "私にもそうだよ。何怒ってんだろう。", "vi": "Với tớ cũng thế. Không hiểu cô ấy giận gì nữa?"}, {"spk": "A", "jp": "まー、ほっとこう。さわらぬ神に祟りなしだ。", "vi": "Thôi cứ mặc kệ đi. Không động đến sẽ không có chuyện."}, {"spk": "B", "jp": "そうだね。それが一番かもね。", "vi": "Ừ, có lẽ thế là tốt nhất."}]}, {"id": "1-14-3", "no": 3, "page": 48, "start": 29.75, "end": 44.8, "dur": 15.05, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ねー。ちょっと、聞いて聞いて！　このカッターは切れなかったー！って、どう？", "vi": "Này, nghe này, nghe này! \"Con dao cắt này không cắt được!\". Cậu thấy sao?"}, {"spk": "B", "jp": "うーん。内容がないよ～。", "vi": "Ừm. Không có nội dung."}, {"spk": "A", "jp": "さむー、くだらなーい。", "vi": "Nhạt quá, chẳng ra sao cả."}, {"spk": "B", "jp": "どっちが？　お互いさまでしょ！", "vi": "Ai cơ? Như nhau cả thôi!"}]}, {"id": "1-14-4", "no": 4, "page": 48, "start": 44.2, "end": 60.15, "dur": 15.95, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ちょっと、悪いんだけど1000円貸してくれない？", "vi": "Này, cậu có thể cho tớ vay 1000 Yên được không?"}, {"spk": "B", "jp": "また？　この前貸した500円もまだ返してもらってないよ。", "vi": "Lại nữa sao? Cậu còn chưa trả 500 Yên tớ cho vay lần trước đấy."}, {"spk": "A", "jp": "え～っ？　そう？　てっきり返したと思ってた。ごめん！", "vi": "Ơ? Vậy sao? Tớ cứ tưởng đã trả rồi. Xin lỗi nhé!"}, {"spk": "B", "jp": "も～、しょうがないな～。", "vi": "Ôi trời, đến chịu cậu."}]}, {"id": "1-14-5", "no": 5, "page": 48, "start": 59.55, "end": 73.72, "dur": 14.17, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "彼女、最近休みがちだね。", "vi": "Dạo này cậu ấy hay nghỉ nhỉ."}, {"spk": "B", "jp": "何でも結婚するんで、学校どころじゃないらしいよ。", "vi": "Hình như cậu ấy sắp cưới nên không có thời gian đi học."}, {"spk": "A", "jp": "え、あの田中さんと結婚しちゃうの？", "vi": "Sao? Cậu ấy sẽ cưới anh chàng Tanaka đó sao?"}, {"spk": "B", "jp": "うん。とうとうお父さんのお許しが出たらしいよ。", "vi": "Ừ. Hình như cuối cùng thì bố cậu ấy cũng đã đồng ý."}]}, {"id": "1-14-6", "no": 6, "page": 48, "start": 73.12, "end": 89.94, "dur": 16.82, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あー、久しぶりにいい映画を見たわ。", "vi": "Chà, lâu lắm mới xem được bộ phim hay!"}, {"spk": "B", "jp": "本当だね！　最後のシーンは感動で心がふるえたよ。", "vi": "Đúng thế thật! Cảnh cuối làm tớ xúc động đến rụn người."}, {"spk": "A", "jp": "私は心のけがれが、すっかり洗い流されたって感じよ。", "vi": "Cảm giác như tâm hồn tớ được gột rửa sạch sẽ ấy."}, {"spk": "B", "jp": "ま、どうせそれも一日だけだけどね。", "vi": "Dù gì thì cũng chỉ được một ngày thôi."}]}]}, {"track": "1-15", "disk": 1, "no": 15, "audio": "sd_1-15.mp3", "dur": 105.35, "pages": [50], "level": "上級", "section": 2, "segments": [{"id": "1-15-7", "no": 7, "page": 50, "start": 0.46, "end": 16.89, "dur": 16.43, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "学校のとなりのうどん屋、つぶれちゃったみたいだよ。", "vi": "Hình như quán Udon gần trường đóng cửa rồi thì phải."}, {"spk": "B", "jp": "え～？　けっこうお客さん入ってたのにね。", "vi": "Há? Chỗ đó cũng khá đông khách cơ mà?"}, {"spk": "A", "jp": "あ～あ、つぶれる前にもう一度行っておけばよかった。", "vi": "Chán thật, giá mà tớ đến đó một lần trước khi đóng cửa."}, {"spk": "B", "jp": "本店が新宿にあるみたいよ。何なら行ってみる？", "vi": "Hình như cửa hàng chính ở Shinzuku đấy. Sao cậu không thử đến đó?"}]}, {"id": "1-15-8", "no": 8, "page": 50, "start": 16.29, "end": 34.26, "dur": 17.97, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "すべてうまく行っているのに、この不安感はなんだろう？", "vi": "Mọi chuyện đang diễn ra suôn sẻ mà sao tớ lại cảm thấy bất an vậy?"}, {"spk": "B", "jp": "疲れてるんじゃない？　今日は、ゆっくり休んだら？", "vi": "Chắc tại cậu mệt mỏi đấy thôi! Sao hôm nay cậu không nghỉ ngơi cho thoải mái đi?"}, {"spk": "A", "jp": "そうねー。久しぶりに銭湯でも行ってみるかな…。", "vi": "Cậu nói phải. Có lẽ tớ sẽ đi nhà tắm công cộng vì lâu rồi không đi."}, {"spk": "B", "jp": "そうだね。いい気分転換になるんじゃない？", "vi": "Hay đấy! Sẽ giúp cậu thay đổi tâm trạng tốt đấy!"}]}, {"id": "1-15-9", "no": 9, "page": 50, "start": 33.66, "end": 51.72, "dur": 18.06, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "いつも、顔の色つやがいいね。鈴木さんって健康的だよね。", "vi": "Da mặt cậu lúc nào cũng đẹp nhỉ. Cậu khỏe mạnh thật đấy."}, {"spk": "B", "jp": "うん、快食快眠してるからね。健康の秘訣だよ。", "vi": "Ừ. Vì tớ ăn ngon ngủ kỹ. Đó là bí quyết của sức khỏe."}, {"spk": "A", "jp": "私なんかなかなか睡眠時間が十分取れなくて。", "vi": "Tớ không thể có thời gian ngủ đủ."}, {"spk": "B", "jp": "いやー、時間て取るんじゃなくて作るもんだよ。", "vi": "Không, không phải là \"có\" thời gian mà phải \"tạo ra\" thời gian."}]}, {"id": "1-15-10", "no": 10, "page": 50, "start": 51.12, "end": 69.88, "dur": 18.76, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "日本人って、どうしてこう優柔不断なんだろう。", "vi": "Tại sao người Nhật lại thiếu quyết đoán vậy?"}, {"spk": "B", "jp": "そうだね。でも、みんながみんな一概に優柔不断とは言えないけどね。", "vi": "Cũng có thể. Nhưng không thể nói là tất cả mọi người đều thiếu quyết đoán."}, {"spk": "A", "jp": "まー、そうだけど。多いよ、私の周りには。", "vi": "Thì đúng vậy nhưng quanh tớ nhiều người thế lắm."}, {"spk": "B", "jp": "う～ん、周りに気を遣ってるってことじゃない？", "vi": "Ừm, chắc họ không muốn làm phiền đến những người xung quanh thôi."}]}, {"id": "1-15-11", "no": 11, "page": 50, "start": 69.28, "end": 86.57, "dur": 17.29, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "いつまでも悲しんでばかりじゃだめだよ。", "vi": "Cậu không thể buồn rầu mãi được."}, {"spk": "B", "jp": "頭ではわかってるんだけど、なかなかねー。", "vi": "Tớ biết thế nhưng vẫn không..."}, {"spk": "A", "jp": "公園でも散歩してみたら？　気分が晴れるよ。", "vi": "Hay cậu thử đi dạo trong công viên xem sao? Sẽ dễ chịu hơn đấy."}, {"spk": "B", "jp": "うーん、でも、よその犬を見るとまた思い出しちゃって。", "vi": "Ừ, nhưng nhìn thấy chó của người khác là tớ sẽ lại nhớ đến nó mất."}]}, {"id": "1-15-12", "no": 12, "page": 50, "start": 85.97, "end": 103.37, "dur": 17.4, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ねー、もう、立ち直れないくらいショックだったってことある？", "vi": "Này, cậu đã bao giờ bị sốc đến mức không thể gượng dậy được chưa?"}, {"spk": "B", "jp": "ありすぎて思い出せないよ！", "vi": "Có quá nhiều khiến tớ không thể nhớ nổi ấy chứ!"}, {"spk": "A", "jp": "人間って不思議だよねー。それでも何とか生きていけちゃうんだからね～。", "vi": "Con người thật là lạ nhỉ. Vì dù vậy mà vẫn gắng gượng sống được."}, {"spk": "B", "jp": "ある程度鈍感っていうのも才能の一つだよね。", "vi": "Ở một mức độ nào đó, thiếu nhạy cảm cũng là một tài năng đấy nhỉ!"}]}]}, {"track": "1-16", "disk": 1, "no": 16, "audio": "sd_1-16.mp3", "dur": 108.8, "pages": [52], "level": "上級", "section": 2, "segments": [{"id": "1-16-13", "no": 13, "page": 52, "start": 0.45, "end": 24.68, "dur": 24.23, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あ～あ、もうヘトヘトだ。", "vi": "Ôi, tớ mệt rã rời rồi."}, {"spk": "B", "jp": "だいぶ手こずってるようだね。それで許してもらえたのか？", "vi": "Cậu đã khá vất vả nhỉ! Thế đã được tha thứ chưa?"}, {"spk": "A", "jp": "うん、どうにかね。いや、今度の彼女は手ごわい。", "vi": "Ừ, cũng ổn ổn rồi. Cô bạn gái lần này rắn thật."}, {"spk": "B", "jp": "手ごわいほど男は振り回されて夢中になるもんだってこと、彼女はちゃんと知ってるんだよ。", "vi": "Cô ấy biết rõ là càng rắn thì càng điều khiến được đàn ông, khiến họ say mê mình."}, {"spk": "A", "jp": "それが過ぎると、愛想をつかされるってことも知っといてほしいけどね。", "vi": "Tớ cũng muốn cô ấy biết là nếu quá đi thì sẽ mất hết tình cảm."}]}, {"id": "1-16-14", "no": 14, "page": 52, "start": 24.08, "end": 43.59, "dur": 19.51, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "何、この写真、すごいピンぼけじゃない。", "vi": "Ảnh kiểu gì thế này? Chẳng nét gì cả."}, {"spk": "B", "jp": "やっぱり？　岡本さんに任せたのがまずかったね。", "vi": "Cậu cũng thấy thế à? Quả là sai lầm khi giao cho Okamoto."}, {"spk": "A", "jp": "あ、でも、見て、由美ちゃんだけはピントばっちりに写ってるよ。", "vi": "A, nhưng nhìn này, riêng Yumi thì rõ mồn một."}, {"spk": "B", "jp": "あ、そういうことかー。由美ちゃんだけしか目に入ってなかったのね、岡本さん。", "vi": "Chà, ra là thế. Trong mắt Okamoto chỉ có Yumi thôi nhỉ!"}]}, {"id": "1-16-15", "no": 15, "page": 52, "start": 42.99, "end": 72.77, "dur": 29.78, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "リナの元彼、新しい彼女できたんだって。しかもクラスメートのナオよ。別れてから一週間も経ってないのに、ひどすぎない？", "vi": "Rina, nghe nói bạn trai cũ của cậu có bạn gái mới rồi đấy. Lại là Nao lớp mình nữa chứ! Chia tay chưa được 1 tuần. Cậu ta thật quá đáng!"}, {"spk": "B", "jp": "ふん、いいじゃない、あいつが何しようと、もう関係ないし…。", "vi": "Hừm, có sao đâu. Hắn ta có làm gì cũng chẳng liên quan đến mình...."}, {"spk": "A", "jp": "ちょっとなんか言ってやったほうがいいんじゃない？", "vi": "Cậu nên nói gì đó với cậu ta đi chứ?"}, {"spk": "B", "jp": "もう私がとやかく言う筋合いじゃないから、二度とあいつの名前は口に出さないでくれる？", "vi": "Tớ không còn ở vị trí có thể nói này nói nọ nữa nên làm ơn đừng nhắc đến tên hắn ta nữa được không?"}]}, {"id": "1-16-16", "no": 16, "page": 52, "start": 72.17, "end": 87.92, "dur": 15.75, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "男の人って、女の涙に弱いんだって。", "vi": "Người ta bảo đàn ông dễ mềm lòng trước nước mắt của phụ nữ."}, {"spk": "B", "jp": "あ、聞いたことある。なんてったって、女の武器を使わない手はないんじゃない？", "vi": "Ừ, tớ đã từng nghe điều đó. Vậy là tớ không có cách gì để không sử dụng vũ khí của phụ nữ nhỉ?"}, {"spk": "A", "jp": "うん。だから、ここぞって時に使うといいかもね。", "vi": "Ừ. Vậy nên đem ra sử dụng lúc cần thiết có lẽ cũng được nhỉ!"}, {"spk": "B", "jp": "そうだね。そんな簡単に泣けたらいいけどね。", "vi": "Ừ. Nếu có thể dễ dàng khóc được."}]}, {"id": "1-16-17", "no": 17, "page": 52, "start": 87.32, "end": 106.91, "dur": 19.59, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "うー、さむーい。どうして寒いと胸を張って歩けないんだろうね。", "vi": "Eo, lạnh quá. Tại sao trời lạnh là không thể đi thẳng người được nhỉ?"}, {"spk": "B", "jp": "うん、肩凝るね。寒いのと暑いのとどっちが我慢できる？", "vi": "Ừ, vai đông cứng lại nhỉ. Cậu chịu lạnh hay nóng tốt hơn?"}, {"spk": "A", "jp": "うーん、今は暑いの。でも、基本的に暑がりで寒がりだからどっちも苦手。", "vi": "Ừm, bây giờ thì chịu nóng tốt hơn. Nhưng về cơ bản tớ không ưa cả nóng lẫn lạnh."}, {"spk": "B", "jp": "あ、私も。案外そういう人多いんじゃない。", "vi": "Tớ cũng vậy. Có vẻ nhiều người như thế nhỉ."}]}]}, {"track": "1-17", "disk": 1, "no": 17, "audio": "sd_1-17.mp3", "dur": 88.92, "pages": [54], "level": "上級", "section": 2, "segments": [{"id": "1-17-18", "no": 18, "page": 54, "start": 0.38, "end": 18.61, "dur": 18.23, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今日、教授に怒られて、散々だったよ。", "vi": "Hôm nay tớ bị giáo sư mắng cho một trận nên thân."}, {"spk": "B", "jp": "どうしたの？", "vi": "Sao thế?"}, {"spk": "A", "jp": "田中と津田の代返をしたんだ。いつもはうまくいくんだけど、今日は続いてたから失敗した！", "vi": "Tớ điểm danh cho Tanaka và Tsuda. Mọi lần vẫn chót lọt nhưng hôm nay thầy gọi liền nhau nên bị lộ!"}, {"spk": "B", "jp": "わかった！　こうでしょ！　「田中くん」「はーい」「津田くん」「はーい」", "vi": "Tớ hiểu rồi! Như thế này chứ gì?! \"Tanaka-kun\"\"Có ạ!\"\"Tsuda-kun\"\"Có ạ!\""}]}, {"id": "1-17-19", "no": 19, "page": 54, "start": 18.01, "end": 37.1, "dur": 19.09, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "うーん、見事にやられた。", "vi": "Hừ, bị chơi một vố ngoạn mục."}, {"spk": "B", "jp": "どうしたの？", "vi": "Nghĩa là sao?"}, {"spk": "A", "jp": "テストにやまかけたら、まったくはずされちゃったんだ。", "vi": "Tớ học tủ nhưng bị lệch tủ."}, {"spk": "B", "jp": "そりゃ、先生のほうが一枚も二枚も上手ってことだよ。", "vi": "Điều đó có nghĩa là thầy giáo cao tay hơn hẳn nhỉ."}, {"spk": "A", "jp": "追試確定だな…。前期に続いて3回目だー。", "vi": "Chắc chắn là phải thi lại rồi.... Lần thứ 3 tính cả kỳ trước."}, {"spk": "B", "jp": "ご愁傷さま。", "vi": "Xin chia buồn với cậu."}]}, {"id": "1-17-20", "no": 20, "page": 54, "start": 36.5, "end": 63.18, "dur": 26.68, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "出張どうだった？", "vi": "Chuyến công tác thế nào?"}, {"spk": "B", "jp": "うん、仕事のほうは問題なかったんだけどさー、ずっと腰痛で本当大変だったんだ。", "vi": "Ừm, công việc thì không vấn đề gì nhưng thật khổ sở vì bị đau lưng suốt."}, {"spk": "A", "jp": "腰痛？　えー、どうして？　持病なの？", "vi": "Đau lưng? Tại sao vậy? Bệnh mãn tính à?"}, {"spk": "B", "jp": "いや、道歩いてるときにくしゃみした拍子にグキッときて…。", "vi": "Không, đang đi trên đường, tự dưng nhói cái đúng lúc hắt hơi."}, {"spk": "A", "jp": "ははは…、やだねー、漫画みたい。", "vi": "Ha ha ha..., cậu giỡn à. Cứ như là trong truyện tranh ấy."}, {"spk": "B", "jp": "笑い事じゃなかったんだよー。本当に涙が出るほど痛かったんだから。", "vi": "Không phải chuyện cười đâu. Thật sự là đau đến chảy nước mắt ấy."}]}, {"id": "1-17-21", "no": 21, "page": 54, "start": 62.58, "end": 87.17, "dur": 24.59, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "一人はソロで、二人はデュエット、三人はトリオで、四人はカルテットか…。", "vi": "Một người gọi là hát sô lô, hai người gọi là hát duet, ba người gọi là hát trio, bốn người gọi là quarto à...."}, {"spk": "B", "jp": "それは音楽用語だね。イタリア語だろう？", "vi": "Đó là thuật ngữ trong âm nhạc nhỉ. Tiếng Ý phải không?"}, {"spk": "A", "jp": "一人はシングルとも言うし、二人はペアとも言うよ。", "vi": "Một người còn gọi là đơn ca, hai người còn gọi là song ca."}, {"spk": "B", "jp": "あー、ダブルスとも言うね、テニスでは。プロレスはタッグだし…。", "vi": "Ừ, còn gọi là cặp, trong quần vợt ấy. Trong đấu vật chuyên nghiệp thì là cặp đôi."}, {"spk": "A", "jp": "あー、たわいもない話だけど、おもしろいね。", "vi": "Ồ... Chuyện không đâu mà vui nhỉ."}]}]}, {"track": "1-18", "disk": 1, "no": 18, "audio": "sd_1-18.mp3", "dur": 51.28, "pages": [56], "level": "上級", "section": 2, "segments": [{"id": "1-18-22", "no": 22, "page": 56, "start": 0.42, "end": 22.97, "dur": 22.55, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "受験まで残り50日切ったから、そろそろ追い込みかけていかないとね。", "vi": "Chỉ còn 50 ngày nữa là thi nên đã đến lúc chúng ta phải dốc sức rồi nhỉ."}, {"spk": "B", "jp": "そうだね。今が頑張りどころだね。", "vi": "Ừ. Bây giờ là thời điểm cần cố gắng."}, {"spk": "A", "jp": "うん。本当、焦るよね。", "vi": "Ừ. Sốt ruột thật đấy."}, {"spk": "B", "jp": "え〜、なんで〜？　毎日コツコツやってきてるじゃん。", "vi": "Ơ? Tại sao? Chúng ta vẫn đều đặn học hàng ngày mà."}, {"spk": "A", "jp": "そうだけどさ〜、何となく。", "vi": "Đành là thế nhưng không hiểu sao lại vẫn lo."}, {"spk": "B", "jp": "ま〜ね〜。やるだけやるしかないんじゃない？", "vi": "Tớ hiểu. Cứ làm việc phải làm thôi nhỉ?"}]}, {"id": "1-18-23", "no": 23, "page": 56, "start": 22.37, "end": 49.4, "dur": 27.03, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ねー、最近のドラマでなんかおもしろいのある？", "vi": "Này, dạo này có phim truyền hình nào hay không?"}, {"spk": "B", "jp": "「とんだ所に嫁に来た！」とかいうのがいいよ。見たことある？", "vi": "\"Tôi đã tới làm dâu một gia đình kỳ lạ!\" được đấy. Cậu đã xem chưa?"}, {"spk": "A", "jp": "ううん。それってどんなドラマ？", "vi": "Chưa. Phim nói về gì vậy?"}, {"spk": "B", "jp": "「嫁と姑の確執」ってとこかな。", "vi": "Kiểu như \"Mối hiềm khích giữa mẹ chồng và nàng dâu\"."}, {"spk": "A", "jp": "でも、よくあるパターンじゃない。", "vi": "Nhưng đó là một mô típ thường thấy mà."}, {"spk": "B", "jp": "そうなんだけど、姑をやってる松下礼子がはまり役でさ。意地悪な女をやらせたら、彼女の右に出る者はいないね。", "vi": "Đúng vậy nhưng Reiko Matsushita đóng vai mẹ chồng đạt lắm. Không ai đóng vai một bà già khó chịu giỏi như cô ấy cả."}]}]}]}]}, {"unit": 3, "titleJp": "知人や近所の人などとの会話", "titleVi": "Hội thoại với người quen, hàng xóm", "sections": [{"section": 1, "level": "中級", "tracks": [{"track": "1-19", "disk": 1, "no": 19, "audio": "sd_1-19.mp3", "dur": 92.97, "pages": [62], "level": "中級", "section": 1, "segments": [{"id": "1-19-1", "no": 1, "page": 62, "start": 0.46, "end": 18.94, "dur": 18.48, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "来週の日曜日、新年会をしようと思うんですけど。", "vi": "Chủ nhật tuần sau chúng tôi định tổ chức tiệc mừng năm mới."}, {"spk": "B", "jp": "あ、ぜひ参加させてください。楽しみです。", "vi": "A, vậy cho tôi tham gia nhé! Tôi háo hức lắm."}, {"spk": "A", "jp": "それで、一人一皿、得意な料理を持ってきてほしいんですけど。", "vi": "Chúng tôi muốn mỗi người sẽ mang tới một đĩa món ăn mình nấu ngon nhất."}, {"spk": "B", "jp": "わかりました。じゃ、ぎょうざ持っていきます。", "vi": "Tôi hiểu rồi. Vậy tôi sẽ mang sủi cảo tới."}]}, {"id": "1-19-2", "no": 2, "page": 62, "start": 18.34, "end": 35.31, "dur": 16.97, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "このざる豆腐おいしいですね。", "vi": "Món zarudofu này ngon thật đấy."}, {"spk": "B", "jp": "本当ですね。このプルプルの食感がたまりませんね。", "vi": "Đúng vậy. Cảm giác mềm mịn thật tuyệt vời nhỉ!"}, {"spk": "A", "jp": "さすが、豆腐専門レストランですね。豆腐ハンバーグも注文してみましょうか
