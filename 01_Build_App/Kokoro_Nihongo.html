", "no": 2, "page": 86, "start": 26.3, "end": 40.6, "dur": 14.3, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あのー、来週引っ越すので、郵便物の転送をお願いしたいんですけど。", "vi": "Xin lỗi… Tuần sau tôi chuyển nhà nên muốn nhờ chuyển tiếp thư và bưu phẩm của bưu điện."}, {"spk": "B", "jp": "はい。では、こちらの用紙にご記入ください。", "vi": "Vâng. Vậy chị hãy điền vào phiếu này."}, {"spk": "A", "jp": "あの、どのくらいの間転送してくれるんですか？", "vi": "Thế, các anh sẽ chuyển tiếp trong thời gian bao lâu?"}, {"spk": "B", "jp": "指定日から1年間になります。", "vi": "1 năm kể từ ngày yêu cầu ạ."}]}, {"id": "1-30-3", "no": 3, "page": 86, "start": 40.0, "end": 52.06, "dur": 12.06, "title": "", "titleVi": "", "lines": [{"spk": "", "jp": "【メガネ売り場で】", "vi": "【Tại quầy bán kính】"}, {"spk": "A", "jp": "お客様、とてもよくお似合いですよ。", "vi": "Rất hợp với chị ạ."}, {"spk": "B", "jp": "そう？　顔が大きく見えないかしら？", "vi": "Vậy sao? Trông mặt có to không?"}, {"spk": "A", "jp": "フレームがシャープですから、かえって小さく見えますよ。", "vi": "Gọng kính mảnh nên trông mặt nhỏ hơn đấy ạ."}, {"spk": "B", "jp": "じゃー、いただこうかしら。", "vi": "Vậy tôi lấy cái này."}]}, {"id": "1-30-4", "no": 4, "page": 86, "start": 51.46, "end": 74.7, "dur": 23.24, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "そろそろラストオーダーのお時間ですので、ご注文があればおうかがいいたしますが。", "vi": "Sắp đến giờ nhận gọi món cuối rồi nên nếu quý khách có gọi gì, tôi xin nhận ạ."}, {"spk": "B", "jp": "じゃー、ちょっとデザートのメニュー見せてもらえますか？", "vi": "Cho tôi xem thực đơn tráng miệng đi."}, {"spk": "A", "jp": "はい、こちらでございます。本日はイチゴのムースがおすすめですが。", "vi": "Vâng, đây ạ. Hôm nay nhà hàng chúng tôi khuyên quý khách dùng bánh mouse dâu tây ạ."}, {"spk": "B", "jp": "じゃ、それお願いします。あ、それと、コーヒーもね。", "vi": "Vậy cho tôi món đó. À, cả cà phê nữa."}, {"spk": "A", "jp": "コーヒーは、カプチーノかエスプレッソをご用意できますが。", "vi": "Chị dùng cappuccino hay espresso ạ?"}, {"spk": "B", "jp": "じゃ、エスプレッソにしてください。", "vi": "Cho tôi espresso."}]}]}, {"track": "1-31", "disk": 1, "no": 31, "audio": "sd_1-31.mp3", "dur": 90.23, "pages": [88], "level": "上級", "section": 2, "segments": [{"id": "1-31-5", "no": 5, "page": 88, "start": 0.4, "end": 37.07, "dur": 36.67, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あのー、ポイントカードをなくしちゃったんですが、再発行をお願いできますか？", "vi": "Xin lỗi, tôi làm mất thẻ tích điểm rồi. Liệu có cấp lại được không?"}, {"spk": "B", "jp": "あ、はい。そうしますと、新規のお申し込みになりますので、こちらの用紙に記入していただけますか？", "vi": "Được ạ. Như vậy sẽ là yêu cầu cấp thẻ mới nên mời chị điền vào phiếu này."}, {"spk": "A", "jp": "はい。あのー、ちょっと聞きたいんですけど、前のカードに溜まってたポイントはどうなるんですか？", "vi": "Vâng. Ừm, tôi hỏi một chút. Điểm tích lũy được ở thẻ trước thì thế nào?"}, {"spk": "B", "jp": "申し訳ございませんが、ポイント数はそのカードでしか認証できないんです。", "vi": "Tôi rất xin lỗi nhưng số điểm tích lũy chỉ được chứng minh bằng thẻ đó thôi."}, {"spk": "A", "jp": "そうなんだ…。けっこう溜まってたのに、惜しかったな～。", "vi": "Vậy à….Tôi tích được khá nhiều điểm. Tiếc thật đấy!"}, {"spk": "B", "jp": "はい、お待たせしました。こちらが新しいカードです。裏側に署名なさってからお使いください。", "vi": "Xin lỗi đã để chị đợi. Đây là thẻ mới. Chị ký vào mặt sau thẻ rồi dùng ạ."}]}, {"id": "1-31-6", "no": 6, "page": 88, "start": 36.47, "end": 64.59, "dur": 28.12, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あのー、すみません。まだ来ないんですけど。", "vi": "Xin lỗi, món của tôi vẫn chưa ra."}, {"spk": "B", "jp": "あ、申し訳ございません。", "vi": "Ôi, tôi xin lỗi."}, {"spk": "A", "jp": "もう30分も待ってるんですけど…。それに、あちらより私の方が先に注文してると思うんだけど…。", "vi": "Tôi đợi đã 30 phút rồi…. Với lại, tôi nghĩ tôi gọi món trước bàn bên kia…."}, {"spk": "B", "jp": "あ、本当に申し訳ございません。ただいま確認してまいりますので。", "vi": "Vâng, tôi thực sự xin lỗi. Tôi sẽ kiểm tra ngay."}, {"spk": "A", "jp": "あんまり時間ないんで…。まだ時間がかかるようだったらキャンセルにしてください。", "vi": "Tôi không có nhiều thời gian. Nếu còn mất thời gian nữa thì hủy cho tôi."}, {"spk": "B", "jp": "あ、ただいますぐに確認してまいりますので少々お待ちいただけますか。", "vi": "Tôi sẽ xác nhận ngay ạ. Xin chị đợi cho một lát."}]}, {"id": "1-31-7", "no": 7, "page": 88, "start": 63.99, "end": 88.41, "dur": 24.42, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あのー、すみません。中村由美の最近出た小説、どこにありますか？", "vi": "Xin lỗi, tiểu thuyết mới gần đây của Yumi Nakamura để ở đâu vậy?"}, {"spk": "B", "jp": "えーと、題名はおわかりですか？", "vi": "Chị có biết tên không ạ?"}, {"spk": "A", "jp": "えーと、花のようになんとかかんとかって感じの…。", "vi": "Ờ, hình như là như hoa như gì gì đó thì phải…"}, {"spk": "B", "jp": "少々お待ちください。ただいまお調べしますので。", "vi": "Chị đợi một lát. Tôi sẽ tìm ngay."}, {"spk": "A", "jp": "あー、『花のように風のように』だったかなー、確か。", "vi": "À, là \"Như hoa như gió\". Hình như thế."}, {"spk": "B", "jp": "はい。あー、ございます。こちらです。", "vi": "Vâng. A, có rồi. Đây ạ."}]}]}, {"track": "1-32", "disk": 1, "no": 32, "audio": "sd_1-32.mp3", "dur": 114.08, "pages": [90], "level": "上級", "section": 2, "segments": [{"id": "1-32-8", "no": 8, "page": 90, "start": 0.48, "end": 30.57, "dur": 30.09, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あ、すいません。この冷蔵庫、こっちのに比べてだいぶ高いんだけど、何が違うんですか？", "vi": "Tôi xin lỗi, tủ lạnh này khá đắt so với cái kia, không hiểu là khác nhau cái gì vậy?"}, {"spk": "B", "jp": "はい、えーとですね。", "vi": "Vâng, là..."}, {"spk": "A", "jp": "容量も同じだし、使い勝手も似たような感じだし。", "vi": "Dung lượng cũng như nhau, tính năng cũng có vẻ giống."}, {"spk": "B", "jp": "あー、こちらは省エネの点でだいぶ進んでるんです。消費電力とかCO2の排出量とかですね。", "vi": "A, cái này tiết kiệm năng lượng hơn. Về điện năng tiêu hao cũng như lượng khí CO2 thải ra."}, {"spk": "A", "jp": "なるほど。消費電力ねー。ちょっと細かい数字、説明してもらえます？", "vi": "Ra là vậy. Điện năng tiêu hao nhỉ. Có thể giải thích cho tôi con số cụ thể không?"}, {"spk": "B", "jp": "はい、では、こちらのパンフレットをごらんください。", "vi": "Vâng. Mời chị xem cuốn hướng dẫn này."}]}, {"id": "1-32-9", "no": 9, "page": 90, "start": 29.97, "end": 72.28, "dur": 42.31, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今日はどうなさいますか？", "vi": "Hôm nay chị cắt kiểu gì ạ?"}, {"spk": "B", "jp": "そうね、だんだん暑くなってきたから、思い切ってバッサリ切っちゃおうかな。", "vi": "Tôi cũng chưa biết nữa. Trời ngày càng nóng hay là cắt ngắn hẳn đi nhỉ?"}, {"spk": "A", "jp": "じゃ、全体的に少しすいて髪を軽くしましょうか。ゆるいウェーブをつければ、夏らしく涼しげになりますよ。お客様の髪ですと、パーマはかかりやすいですし。", "vi": "Vậy tôi tỉa cho mỏng đi nhé? Nếu làm gọn sóng nhẹ sẽ tạo cảm giác mát mẻ của ngày hè. Tóc của chị dễ uốn xoăn."}, {"spk": "B", "jp": "そうねー、それと髪を少し明るめの色にしてもらおうかな。", "vi": "Cũng được. Nhuộm cho tôi màu gì sáng sáng một chút được không?"}, {"spk": "A", "jp": "そうですね、じゃ、こちらの赤っぽい茶色なんかいかがですか？　それから、こちらのオレンジがかった茶色も今流行りですよ。お客様にもよくお似合いだと思いますが…。", "vi": "Vâng, chị thấy màu nâu đỏ này thế nào? Cả màu nâu ánh cam này cũng đang mốt đấy ạ. Tôi nghĩ rất hợp với chị."}, {"spk": "B", "jp": "そーね。たまにはイメージチェンジもいいかもね。じゃ、あとはお任せで。", "vi": "Cũng được nhỉ! Có lẽ thỉnh thoảng thay đổi một chút cũng hay. Tùy cả vào anh đấy."}]}, {"id": "1-32-10", "no": 10, "page": 90, "start": 71.68, "end": 111.75, "dur": 40.07, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "すみません、図書館のカードを作りたいんですが…。この区の住民じゃないんですけど、大丈夫ですか？", "vi": "Xin lỗi, tôi muốn làm thẻ thư viện...Nhưng tôi không phải người dân của quận này, liệu có được không ạ?"}, {"spk": "B", "jp": "お勤め先がこの区でしたら、問題ありませんよ。本日何か会社の住所が書いてあるものをお持ちでいらっしゃいますか？", "vi": "Nếu anh làm việc ở quận này thì không vấn đề gì. Hôm nay anh có mang giấy tờ gì để ghi địa chỉ của công ty không?"}, {"spk": "A", "jp": "あ、名刺ならあります。", "vi": "A, tôi có danh thiếp đây."}, {"spk": "B", "jp": "申し訳ありません。名刺ですとちょっと…。社員証とか健康保険証とか、公的に証明できるものをお持ちですか。", "vi": "Tôi xin lỗi. Danh thiếp thì không được.... Anh có mang theo thẻ nhân viên, thẻ bảo hiểm y tế hoặc giấy tờ gì có xác nhận của chính quyền không?"}, {"spk": "A", "jp": "え～、公的なものですか。僕、フリーランス契約だからそういったもの、ないんですよ。", "vi": "Ơ, giấy tờ có xác nhận của chính quyền à? Tôi ký hợp đồng làm tự do nên không có giấy tờ như thế."}, {"spk": "B", "jp": "でしたらお手数ですが、在勤証明書をご所属の機関で書いてもらって、持ってきていただけないでしょうか。", "vi": "Vậy, làm phiền anh nhờ nơi làm việc viết giấy xác nhận rồi mang đến cho chúng tôi được không?"}]}]}, {"track": "1-33", "disk": 1, "no": 33, "audio": "sd_1-33.mp3", "dur": 99.94, "pages": [92], "level": "上級", "section": 2, "segments": [{"id": "1-33-11", "no": 11, "page": 92, "start": 0.39, "end": 40.78, "dur": 40.39, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "お電話ありがとうございます。三友銀行、山田が承ります。", "vi": "Cám ơn quý khách đã gọi điện. Yamada, ngân hàng Sanyu nghe máy ạ."}, {"spk": "B", "jp": "すみません、ちょっとお聞きしたいんですが。そちらから、定期預金の満期通知が届いたんですが。", "vi": "Xin lỗi, tôi muốn hỏi một chút là tôi nhận được thông báo báo đến hạn số tiết kiệm có kỳ hạn của ngân hàng."}, {"spk": "A", "jp": "あ、いつもご利用ありがとうございます。満期のお知らせでございますね。失礼ですが、お客様は継続ご希望でいらっしゃいますか。それとも解約ご希望でしょうか。", "vi": "Cám ơn quý khách đã luôn sử dụng dịch vụ của ngân hàng chúng tôi. Cho tôi hỏi, quý khách có muốn tiếp tục gửi hay muốn khóa sổ."}, {"spk": "B", "jp": "解約でお願いします。", "vi": "Tôi muốn khóa sổ."}, {"spk": "A", "jp": "それでは、定期預金の通帳と届け出印、身分証明書をお持ちの上、お近くの支店に期日までにお越しいただき、お手続きをお願いいたします。", "vi": "Vậy, từ giờ tới ngày hết hạn số, quý khách hãy mang số tiết kiệm, con dấu và chứng minh nhân dân tới chi nhánh gần nhất để làm thủ tục ạ."}, {"spk": "B", "jp": "はい、わかりました。", "vi": "Vâng, tôi hiểu rồi."}]}, {"id": "1-33-12", "no": 12, "page": 92, "start": 40.18, "end": 70.27, "dur": 30.09, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "本日は、診察をご希望ですか？", "vi": "Hôm nay ông muốn khám ạ?"}, {"spk": "B", "jp": "あのー、薬だけお願いしたいんですが…。", "vi": "Tôi chỉ muốn lấy thuốc thôi."}, {"spk": "A", "jp": "あ、はい。では、診察券を拝見できますか？", "vi": "À, vâng. Ông cho tôi xem phiếu khám được không ạ?"}, {"spk": "B", "jp": "はい。", "vi": "Vâng."}, {"spk": "A", "jp": "え～と、前回いらっしゃったのが9月ですから、6カ月過ぎてしまってますね。", "vi": "Ồ, lần trước ông tới là tháng 9, đã quá 6 tháng rồi."}, {"spk": "B", "jp": "あ、そうですか。そんなに経ってますか。", "vi": "Ôi, vậy sao? Đã lâu thế rồi cơ à?!"}, {"spk": "A", "jp": "ええ、6カ月過ぎますと、一度診察を受けていただかないとお薬はお出しできないんですよ。", "vi": "Vâng, nếu quá 6 tháng mà ông không khám lại thì chúng tôi không cấp thuốc được ạ."}, {"spk": "B", "jp": "あ、そうなんですか。じゃ、診察、お願いします。", "vi": "Ồ, tôi không biết điều đó. Vậy cho tôi khám."}]}, {"id": "1-33-13", "no": 13, "page": 92, "start": 69.67, "end": 99.94, "dur": 30.27, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あのー。", "vi": "Xin lỗi."}, {"spk": "B", "jp": "はい、いらっしゃいませ。", "vi": "Vâng, xin chào quý khách."}, {"spk": "A", "jp": "この5人前のお寿司の盛り合わせ、予約したいんですけど。", "vi": "Tôi muốn đặt xuất Sushi tổng hợp dành cho 5 người này."}, {"spk": "B", "jp": "はい、こちらの盛り合わせですね。ありがとうございます。いつご用意いたしましょうか。", "vi": "Vâng, suất tổng hợp này ạ! Xin cảm ơn quý khách. Khi nào chúng tôi cần chuẩn bị?"}, {"spk": "A", "jp": "明日お昼頃、取りに来ます。", "vi": "Khoảng trưa mai tôi sẽ tới lấy."}, {"spk": "B", "jp": "お昼頃ですね。じゃ、こちらにお名前と電話番号をお願いします。", "vi": "Trưa mai ạ. Xin quý khách điền tên và số điện thoại vào đây."}, {"spk": "A", "jp": "はい。あ、それから、この太巻きも一本入れてもらえますか？", "vi": "Vâng. À, có thể cho tôi thêm một Sushi cuộn lớn không?"}, {"spk": "B", "jp": "こちらの太巻きを一本ですね。お会計は先になりますが、よろしいですか？", "vi": "Một Sushi cuộn lớn này ạ. Chúng tôi nhận thanh toán trước, thế có được không ạ?"}]}]}]}]}, {"unit": 5, "titleJp": "同僚との会話", "titleVi": "Hội thoại với đồng nghiệp", "sections": [{"section": 1, "level": "中級", "tracks": [{"track": "2-02", "disk": 2, "no": 2, "audio": "sd_2-02.mp3", "dur": 96.18, "pages": [96], "level": "中級", "section": 1, "segments": [{"id": "2-02-1", "no": 1, "page": 96, "start": 0.43, "end": 11.43, "dur": 11.0, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今日は何日だっけ？", "vi": "Hôm nay là ngày bao nhiêu nhỉ?"}, {"spk": "B", "jp": "22日だけど。", "vi": "Hôm nay là 22."}, {"spk": "A", "jp": "あー、あとちょっとで給料だ。フトコロが寒くってねー。", "vi": "À, mấy bữa nữa có lương rồi. Tớ rỗng hầu bao quá."}, {"spk": "B", "jp": "あー、あと3日だね。", "vi": "Ơ, còn 3 ngày nữa thôi."}]}, {"id": "2-02-2", "no": 2, "page": 96, "start": 10.83, "end": 29.66, "dur": 18.83, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今度の三連休、何するの？", "vi": "Ba ngày nghỉ sắp tới cậu định làm gì?"}, {"spk": "B", "jp": "うーん、どこにも行かないで、家でゴロゴロするつもり。", "vi": "Ừm, chẳng đi đâu hết, chỉ định loanh quanh ở nhà thôi."}, {"spk": "A", "jp": "え～、おもしろくないじゃない、せっかくの休みなのに。", "vi": "Sao? Được nghỉ mà thế thì vui gì."}, {"spk": "B", "jp": "だって、しょうがないよ、金欠なんだから。", "vi": "Thì cậu xem, biết làm thế nào, tớ làm gì có tiền."}]}, {"id": "2-02-3", "no": 3, "page": 96, "start": 29.06, "end": 46.55, "dur": 17.49, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "聞いた？　田中くん、この間の昇進試験、まただめだったんだって。", "vi": "Cậu biết chưa? Nghe nói Tanaka lại trượt kỳ thi thăng cấp rồi đấy."}, {"spk": "B", "jp": "うん、あんなに頑張ってたのにね。ガックリきてるだろうなー。", "vi": "Ừ, dù cậu ấy cố gắng đến thế. Chắc phải chán lắm nhỉ."}, {"spk": "A", "jp": "明日会ったら、なんて言って慰めよう。", "vi": "Ngày mai gặp cậu ấy, nên nói gì để an ủi đây."}, {"spk": "B", "jp": "気の毒で、声のかけようもないよ。", "vi": "Đáng thương thế, biết nói gì đây."}]}, {"id": "2-02-4", "no": 4, "page": 96, "start": 45.95, "end": 61.62, "dur": 15.67, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "山田さんの送別会の費用、一人3000円でお願いします。", "vi": "Xin mỗi người đóng 3000 Yên phí tổ chức tiệc chia tay anh Yamada."}, {"spk": "B", "jp": "すみません。今日は持ち合わせがなくて…。", "vi": "Xin lỗi, hôm nay tôi không mang đủ tiền..."}, {"spk": "A", "jp": "じゃー、私が立て替えておきましょうか。", "vi": "Vậy, tôi ứng trước cho chị nhé?"}, {"spk": "B", "jp": "え、いいんですか？　すみません、明日、必ずお返しします。", "vi": "Có được không? Xin lỗi nhé, chắc chắn ngày mai tôi sẽ trả lại anh."}]}, {"id": "2-02-5", "no": 5, "page": 96, "start": 61.02, "end": 73.68, "dur": 12.66, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "課長の結婚式行ったら、妹さんと瓜二つなの。", "vi": "Hôm dự lễ cưới trưởng nhóm, thấy cô em gái giống anh như lột."}, {"spk": "B", "jp": "え、本当？　妹さん、ちょっとかわいそうかも…。", "vi": "Sao, thật á? Vậy thì tội cho cô ấy quá..."}, {"spk": "A", "jp": "いや、似てるんだけど、とっても感じよかったよ。", "vi": "Không, tuy giống nhau nhưng cô ấy dễ chịu lắm."}, {"spk": "B", "jp": "きっと、性格のいい妹さんなんだろうね。", "vi": "Chắc là một cô em gái tốt tính lắm nhỉ."}]}, {"id": "2-02-6", "no": 6, "page": 96, "start": 73.08, "end": 94.38, "dur": 21.3, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "すみません。明日、午前中に私宛に代引きで荷物が届くことになってるんですけど、遅番なんで受け取ってもらえますか？", "vi": "Xin lỗi, trong sáng mai có hàng thanh toán cước tại chỗ gửi đến cho tôi, nhưng tôi lại làm ca muộn. Chị nhận giúp tôi được không?"}, {"spk": "B", "jp": "了解。お金だけ準備しといてね。", "vi": "Được thôi. Hãy chuẩn bị sẵn tiền nhé."}, {"spk": "A", "jp": "はい。じゃー、この引き出しにお金入れときます。ぴったりお釣りなしです。", "vi": "Ừ. Vậy, tôi để tiền trong ngăn kéo này. Vừa đủ, không thừa."}, {"spk": "B", "jp": "わかった。", "vi": "Được rồi."}]}]}, {"track": "2-03", "disk": 2, "no": 3, "audio": "sd_2-03.mp3", "dur": 85.89, "pages": [98], "level": "中級", "section": 1, "segments": [{"id": "2-03-7", "no": 7, "page": 98, "start": 0.46, "end": 14.87, "dur": 14.41, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あ～、何これ～！　データ全部消えちゃったよ～。", "vi": "Oái, gì thế này! Mất hết dữ liệu rồi..."}, {"spk": "B", "jp": "え～？　どうして？", "vi": "Hả? Tại sao?"}, {"spk": "A", "jp": "わかんないけど、急に画面が真っ暗になって…。", "vi": "Chẳng biết sao, nhưng tự nhiên màn hình tối thui..."}, {"spk": "B", "jp": "バックアップとってなかったの？", "vi": "Cậu không back-up sao?"}]}, {"id": "2-03-8", "no": 8, "page": 98, "start": 14.27, "end": 31.21, "dur": 16.94, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "先輩、ここには駐車できませんよ。", "vi": "Anh ơi, chỗ này không đậu xe được đâu."}, {"spk": "B", "jp": "そうか…。最近、路上駐車の取り締まり厳しくなったからね。", "vi": "Vậy à... Gần đây người ta bắt lỗi đậu xe trên đường chặt hơn nhỉ."}, {"spk": "A", "jp": "しょうがないですね、パーキング探しましょうか。", "vi": "Biết làm sao được. Mình tìm chỗ đậu xe thôi."}, {"spk": "B", "jp": "いや、ほんの10分で済むから、ちょっと乗っててくれない？", "vi": "Không, chỉ đúng 10' là xong nên cậu đợi trong xe giúp tôi được không?"}]}, {"id": "2-03-9", "no": 9, "page": 98, "start": 30.61, "end": 61.09, "dur": 30.48, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "坂本さん、初めて彼女のうちに行ったとき、向こうのご両親になんて言いました？", "vi": "Sakamoto này, lần đầu đến nhà bạn gái, anh đã nói gì với bố mẹ cô ấy?"}, {"spk": "B", "jp": "え？　なんて言ったかな。どうして？", "vi": "Sao? Tôi đã nói gì nhỉ? Mà sao vậy?"}, {"spk": "A", "jp": "実は、来週、彼女のうちに行くんで。", "vi": "Thực ra là tuần sau em sẽ đến nhà bạn gái."}, {"spk": "B", "jp": "え、まだ結婚するんじゃないんでしょ？", "vi": "Hả? Chắc chưa cưới đấy chứ?"}, {"spk": "A", "jp": "ええ、そうなんですけどね。でも、何か言うべきかなって。", "vi": "Vâng, chưa đâu. Nhưng em không biết nên nói gì."}, {"spk": "B", "jp": "うーん。遊びでつき合ってるわけじゃないってことは、岡田さんを見れば、向こうのご両親もわかってくれるんじゃない？　挨拶だけでいいんじゃない？", "vi": "Ừm, Okada à, nhìn cậu thì bố mẹ cô ấy chắc cũng hiểu cậu không cặp với cô ấy để chơi bời đúng không? Nên có lẽ chỉ cần chào hỏi thôi."}]}, {"id": "2-03-10", "no": 10, "page": 98, "start": 60.49, "end": 84.13, "dur": 23.64, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "バレンタインデーにチョコレートもらった？", "vi": "Cậu có nhận được sô cô la vào ngày Valentine không?"}, {"spk": "B", "jp": "へへへ、もらったよ。本命から！　田中は？", "vi": "He he he... Có chứ! Từ chính nàng luôn! Còn cậu thì sao, Tanaka?"}, {"spk": "A", "jp": "もらったにはもらったけど、義理チョコ。", "vi": "Nhận thì có nhận, nhưng chỉ là sô cô la lễ nghi thôi."}, {"spk": "B", "jp": "いやー、義理でも全然もらえないよりいいんじゃない？", "vi": "Thôi, dù chỉ là lễ nghi vẫn còn hơn không nhận được tý gì phải không?"}, {"spk": "A", "jp": "でも、お返しに1万円はかかるかも…。ちょっとありがた迷惑だよな。", "vi": "Nhưng quà cảm ơn không khéo tốn hơn 10.000 Yên mất... Quả là một sự hàm ơn phiền toái."}, {"spk": "B", "jp": "そうか～？　まー、感謝の印ってことで、もらっとけよ。", "vi": "Vậy hả? Mà thôi, cứ nhận đi, coi đó thay cho lời cảm ơn từ họ."}]}]}, {"track": "2-04", "disk": 2, "no": 4, "audio": "sd_2-04.mp3", "dur": 78.65, "pages": [100], "level": "中級", "section": 1, "segments": [{"id": "2-04-11", "no": 11, "page": 100, "start": 0.39, "end": 27.37, "dur": 26.98, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あー、調子わる～。", "vi": "Ôi, khó chịu quá!"}, {"spk": "B", "jp": "どうしたの？", "vi": "Cậu sao vậy?"}, {"spk": "A", "jp": "ちょっと、夕べ飲みすぎて…。胸はムカムカするし、胃はもたれるし、頭はガンガンするし…。それに女房には「毎日午前様だ」って叱られるし…。踏んだり蹴ったりだよ。", "vi": "Tối qua tớ uống hơi nhiều... Giờ vừa buồn nôn, vừa đầy bụng, vừa váng đầu... Đã thế còn bị vợ mắng là \"Quý ông luôn về lúc sáng sớm\" nữa... Đúng là họa vô đơn chí!"}, {"spk": "B", "jp": "そんなになるまで飲むから、罰が当たったのよ。", "vi": "Tại cậu uống đến mức ra như thế nên bị trời phạt đó thôi."}, {"spk": "A", "jp": "あー、腹も痛くなってきた。ちょっとトイレ。", "vi": "Ôi, Bụng cũng đau nữa rồi. Phải đi vệ sinh một cái."}, {"spk": "B", "jp": "まったく、もう～。", "vi": "Thật đúng là!"}]}, {"id": "2-04-12", "no": 12, "page": 100, "start": 26.77, "end": 49.49, "dur": 22.72, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "田中さん、歓送迎会の日程を決めたいんですけど、希望日ってありますか？", "vi": "Anh Tanaka này, tôi đang muốn chọn ngày làm tiệc đón-tiễn, anh có yêu cầu ngày nào không?"}, {"spk": "B", "jp": "えーと、いつ頃の予定？", "vi": "Xem nào. Dự kiến tầm nào nhỉ?"}, {"spk": "A", "jp": "再来週のどこかでやりたいんですけどねー。", "vi": "Tôi định làm vào ngày nào đó trong tuần sau nữa."}, {"spk": "B", "jp": "再来週ね～。今んとこ、全部空いてるけど…。", "vi": "Tuần sau nữa à? Lúc này tôi vẫn trống lịch cả tuần..."}, {"spk": "A", "jp": "じゃー、いつでもオーケーってことでいいですか？", "vi": "Vậy là ngày nào cũng được phải không?"}, {"spk": "B", "jp": "うーん、やっぱ、金曜日がベストだな。", "vi": "Ừm, nghĩ lại thì có lẽ thứ Sáu là tiện nhất."}]}, {"id": "2-04-13", "no": 13, "page": 100, "start": 48.89, "end": 76.66, "dur": 27.77, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "もしもし、遠藤ですが。", "vi": "Alo, tôi Endo đây."}, {"spk": "B", "jp": "あ、遠藤さん、山本です。おはようございます。", "vi": "A, anh Endo. Tôi là Yamamoto. Chào anh!"}, {"spk": "A", "jp": "おはようございます。えーと、今東京駅にいるんですけど、電車が事故か何かで止まっちゃってるんですよ。いつ動くかもわかんなくて。", "vi": "Chào chị. Ồ, tôi đang ở ga Tokyo nhưng tàu điện đang dừng, không biết vì tai nạn hay vì cái gì. Cũng không biết lúc nào mới chạy nữa."}, {"spk": "B", "jp": "あ、そうなんですか。", "vi": "Ôi, thế à?"}, {"spk": "A", "jp": "ええ。で、今日朝一で打ち合わせが入ってるんですけど、少し遅れるって主任に伝えてもらえますか。", "vi": "Ừ, mà sáng nay tôi có lịch họp đầu buổi sáng nên nhờ chị nói với trưởng nhóm tôi sẽ đến muộn một chút được không?"}, {"spk": "B", "jp": "はい、わかりました。伝えておきます。", "vi": "Vâng, rõ rồi. Tôi sẽ nói."}]}]}, {"track": "2-05", "disk": 2, "no": 5, "audio": "sd_2-05.mp3", "dur": 85.79, "pages": [102], "level": "中級", "section": 1, "segments": [{"id": "2-05-14", "no": 14, "page": 102, "start": 0.43, "end": 29.38, "dur": 28.95, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "加藤さん、これ人間ドックの案内書です。よくお読みになって、申込書を出してくださいね。", "vi": "Anh Kato này, đây là bản hướng dẫn về chương trình kiểm tra sức khỏe tổng quát. Hãy xem kỹ và nộp đơn đăng ký nhé."}, {"spk": "B", "jp": "え、人間ドック？　いやー、ちょっと忙しくてそんなの行ってる暇ないんで…。", "vi": "Sao? Kiểm tra sức khỏe tổng quát ư? Không, tôi bận lắm, không có thời gian đi kiểm tra đâu..."}, {"spk": "A", "jp": "でも、加藤さんの年齢だと、人間ドックは行かなきゃいけないことになってるんですよ。", "vi": "Nhưng quy định là ở độ tuổi của anh thì buộc phải đi đấy."}, {"spk": "B", "jp": "え、そうなんですか？　やだなー。なんか、かえって病気になっちゃうような気がして。", "vi": "Ô, thật vậy sao? Chán nhỉ! Không hiểu sao, tôi cảm thấy có khi lại sinh bệnh thêm ấy chứ."}, {"spk": "A", "jp": "まー、そう言わずに。", "vi": "Thôi nào, đừng có nói vậy chứ."}, {"spk": "B", "jp": "まー、しょうがないですね。", "vi": "Thôi được, còn cách nào khác nhỉ!"}]}, {"id": "2-05-15", "no": 15, "page": 102, "start": 28.78, "end": 57.49, "dur": 28.71, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今度の電車は15分で、次の電車は25分ですね。", "vi": "Chuyến tàu sắp tới xuất phát lúc 15 phút, chuyến sau đó xuất phát lúc 25 phút nhỉ."}, {"spk": "B", "jp": "うん、つまり、今度と次では今度のほうが早いってことだね。", "vi": "Ừ, tức là giữa chuyến sắp tới với chuyến sau đó thì chuyến sắp tới nhanh hơn nhỉ."}, {"spk": "A", "jp": "なんか紛らわしいですよね。これって、鉄道会社に共通した言い方なんでしょうか。", "vi": "Thật là lằng nhằng nhỉ. Không biết đây có phải là kiểu nói chung giữa các công ty đường sắt không?"}, {"spk": "B", "jp": "う～ん、どうかなー。今度からちょっと気をつけて見てみよう。", "vi": "Ừm, Không biết nữa. Từ giờ, mình sẽ để ý xem sao."}, {"spk": "A", "jp": "あ、電車来ましたよ。急ぎましょう。", "vi": "Ô, tàu đến rồi kìa. Nhanh lên nào!"}, {"spk": "B", "jp": "うん、今度のに乗れないと、約束の時間ギリギリになっちゃうからね。", "vi": "Ừ, vì nếu không kịp chuyến này thì sẽ bị sát giờ hẹn mất."}]}, {"id": "2-05-16", "no": 16, "page": 102, "start": 56.89, "end": 83.91, "dur": 27.02, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "「一度マイクを握ったら離さない」とは、山田さんのことだね。", "vi": "Cậu Yamada đúng là \"Khi đã nắm mic thì nhất quyết không rời\" nhỉ!"}, {"spk": "B", "jp": "さっきから、3曲ぶっ続けですよ。上手ならいいんですけどねー。", "vi": "Hát liền tù tì 3 bài từ nãy đến giờ rồi đấy. Mà nếu hát hay thì đã đành."}, {"spk": "A", "jp": "誰だよ、山田さんにマイク渡したのは…。", "vi": "Ai nhỉ? Ai lại đi đưa mic cho Yamada thế...?"}, {"spk": "B", "jp": "渡したんじゃなくて、奪い取られたんですよ。", "vi": "Có ai đưa đâu. Bị cậu ấy cướp mic đấy."}, {"spk": "A", "jp": "しっかりマイク持っとかないからだよ。あ～あ、これじゃ俺の順番なんて来やしないよ。", "vi": "Tại không giữ mic cho chắc đấy. Ôi., thế này thì còn lâu mới đến lượt tớ mất."}, {"spk": "B", "jp": "こっそり抜け出して、ほかのカラオケに行っちゃいましょうかー。", "vi": "Hay là lén ra, tới quán karaoke khác đi!"}]}]}]}, {"section": 2, "level": "上級", "tracks": [{"track": "2-06", "disk": 2, "no": 6, "audio": "sd_2-06.mp3", "dur": 106.5, "pages": [104], "level": "上級", "section": 2, "segments": [{"id": "2-06-1", "no": 1, "page": 104, "start": 0.41, "end": 13.27, "dur": 12.86, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あー、目がショボショボする。", "vi": "Ôi, mắt nhòa quá."}, {"spk": "B", "jp": "どうしたの？　老眼？", "vi": "Sao vậy? Viễn thị ư?"}, {"spk": "A", "jp": "そうかな～。38歳って、もう老眼年齢？", "vi": "Chẳng biết nữa... Tuổi 38 đã bị viễn thị chưa nhỉ?"}, {"spk": "B", "jp": "冗談だよ。課の中で美智子さんが一番若いんだから。", "vi": "Đùa vậy thôi. Cậu trẻ nhất phòng mình mà, Michiko."}]}, {"id": "2-06-2", "no": 2, "page": 104, "start": 12.67, "end": 33.67, "dur": 21.0, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "女房のやつ、朝っぱらからガミガミうるさいったらありゃしないよ。", "vi": "Mụ vợ nhà này, mới sáng ra mà đã làu nhàu làu nhàu."}, {"spk": "B", "jp": "毎晩午前様じゃね～、しかたないんじゃないの？", "vi": "Tối nào cũng về nhà sau nửa đêm thì còn kêu ca nỗi gì chứ?"}, {"spk": "A", "jp": "誰が好き好んで午前様やってると思ってんだよ。", "vi": "Ai bảo tớ muốn về muộn thế nào!"}, {"spk": "B", "jp": "なんだかんだ言っても、おまえのこと心配してるんだよ。", "vi": "Nói gì thì nói, chẳng qua cô ấy cũng chỉ lo cho cậu mà thôi."}]}, {"id": "2-06-3", "no": 3, "page": 104, "start": 33.07, "end": 47.65, "dur": 14.58, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "まだ落ち込んでんの？", "vi": "Cậu vẫn còn buồn sao?"}, {"spk": "B", "jp": "うん。あの一件以来、山田さんとの仲がギクシャクしちゃって…。", "vi": "Ừ, từ sau chuyện đó, quan hệ với anh Yamada không còn tốt nữa..."}, {"spk": "A", "jp": "職場は明るく楽しくだよ。中村さんから飲みに誘えば？", "vi": "Chỗ làm việc là phải vui vẻ mới được. Thứ rủ anh ấy đi uống xem, Nakamura!"}, {"spk": "B", "jp": "うん。でも顔を見るとなんか気まずくって。", "vi": "Ừ, nhưng cứ nhìn mặt cậu ấy là tớ lại thấy ngại."}]}, {"id": "2-06-4", "no": 4, "page": 104, "start": 47.05, "end": 65.25, "dur": 18.2, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "吉田さん、とうとう会社クビになったんだって。", "vi": "Nghe nói anh Yoshida cuối cùng cũng bị sa thải rồi đấy."}, {"spk": "B", "jp": "うーん、あの仕事ぶりじゃ、当然だよね。", "vi": "Ừ, làm việc kiểu ấy thì cũng là chuyện đương nhiên thôi."}, {"spk": "A", "jp": "うん、身から出た錆だね。", "vi": "Ừ, gieo gió gặt bão mà."}, {"spk": "B", "jp": "もっと動ける人があのポストには必要だからね。", "vi": "Vị trí ấy cần một người có năng lực hơn nhỉ."}]}, {"id": "2-06-5", "no": 5, "page": 104, "start": 64.65, "end": 88.91, "dur": 24.26, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今日の中田さんの遅刻の理由、聞いた？　きっとまた寝過ごしたのに、渋滞だって。", "vi": "Cậu đã nghe lý do Nakata đến muộn hôm nay chưa? Chắc chắn lại ngủ quên, thế mà lại nói là tắc đường."}, {"spk": "B", "jp": "うん。バレバレだったね。ネクタイしてなかったし、寝癖もついてたしね。", "vi": "Ừ, nói dối lòi đuôi ra nhỉ. Quên thắt cà vạt này, đầu tóc rối bù nữa nhỉ."}, {"spk": "A", "jp": "そもそも、彼、渋滞が関係する交通機関なんか使ってたっけ？", "vi": "Mà cậu ta có dùng phương tiện giao thông nào liên quan đến tắc đường không nhỉ?"}, {"spk": "B", "jp": "うちから駅までの自転車が渋滞してたって、言いたいんじゃないの？", "vi": "Chắc ý cậu ta là đi xe đạp từ nhà ra ga bị tắc đường chăng?"}]}, {"id": "2-06-6", "no": 6, "page": 104, "start": 88.31, "end": 104.53, "dur": 16.22, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あー、どうしよう。締め切りに間に合わない！", "vi": "Ôi, làm sao đây. Không kịp thời hạn rồi!"}, {"spk": "B", "jp": "どうしたの？　ちょっと手伝おうか？", "vi": "Sao thế? Tớ giúp một tay nhé!"}, {"spk": "A", "jp": "え、いいの？　悪いね。恩に着るよ。", "vi": "Ồ, thật ư? Ngại quá. Tớ mang ơn cậu."}, {"spk": "B", "jp": "そんな水臭いこと言って。困ったときはお互いさまだよ。", "vi": "Cậu nói năng khách sáo quá. Lúc khó khăn thì phải giúp nhau chứ."}]}]}, {"track": "2-07", "disk": 2, "no": 7, "audio": "sd_2-07.mp3", "dur": 94.3, "pages": [106], "level": "上級", "section": 2, "segments": [{"id": "2-07-7", "no": 7, "page": 106, "start": 0.46, "end": 21.2, "dur": 20.74, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "昨日、人事課の鈴木さんと激しくやりあってたでしょ。見ちゃったよ～。大変そうだね～。", "vi": "Hôm qua cậu cãi nhau to với Suzuki ở phòng nhân sự phải không? Tớ thấy rồi. Có vẻ cũng mệt đấy nhỉ!"}, {"spk": "B", "jp": "え、見てたの？", "vi": "Sao? Cậu trông thấy à?"}, {"spk": "A", "jp": "あの人、一筋縄じゃいかないからね。", "vi": "Tay đó quả cũng không dễ chịu tý nào."}, {"spk": "B", "jp": "でも、今思えば言いすぎたかな。そうか、見られたか。穴があったら入りたいよ。", "vi": "Nhưng giờ nghĩ lại, có lẽ tớ cũng hơi quá lời. Vậy ra, cậu trông thấy rồi à? Có cái lỗ nào thì tớ muốn chui luôn vào."}]}, {"id": "2-07-8", "no": 8, "page": 106, "start": 20.6, "end": 35.23, "dur": 14.63, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "竹内君って、博士号持ってるんだってね。", "vi": "Nghe nói Takeuchi có bằng tiến sỹ cơ đấy."}, {"spk": "B", "jp": "うん、人は見かけによらないよね。", "vi": "Ừ, đúng là không được xét người qua bề ngoài nhỉ!"}, {"spk": "A", "jp": "バカなことばっかり言ってるけどさ。", "vi": "Nhưng cậu ấy toàn nói những điều ngốc nghếch."}, {"spk": "B", "jp": "そうなんだよね。でもやるときはやるよね。", "vi": "Đúng thế thật. Nhưng lúc làm là cậu ấy làm ra trò đấy."}]}, {"id": "2-07-9", "no": 9, "page": 106, "start": 34.63, "end": 48.64, "dur": 14.01, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "どうだった？　部長面談。", "vi": "Sao? Cuộc gặp với trưởng phòng thế nào?"}, {"spk": "B", "jp": "も～、ガンガンどなられちゃって、意気消沈。", "vi": "Ôi trời, Tớ bị quạt một trận tơi bời, buồn chết đây."}, {"spk": "A", "jp": "じゃー、今夜はおまえのやけ酒にでもつき合うか。", "vi": "Vậy, tối nay tớ đi uống rượu giải sầu với cậu nhé."}, {"spk": "B", "jp": "おー、パーっと憂さ晴らしでもするか。", "vi": "Ừ, mình sẽ quên sạch chuyện buồn đi nhé."}]}, {"id": "2-07-10", "no": 10, "page": 106, "start": 48.04, "end": 65.97, "dur": 17.93, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "も～、今度の課長ったらネチネチしつこいったらありゃしない。", "vi": "Ôi, cái lão trưởng nhóm mới này, làng nhằng phát khiếp."}, {"spk": "B", "jp": "また叱られたの？", "vi": "Lại bị mắng à?"}, {"spk": "A", "jp": "謝ってるのに、1時間も嫌味タラタラ言われちゃった。", "vi": "Tớ đã nhận lỗi rồi mà còn lải nhải suốt cả tiếng đồng hồ."}, {"spk": "B", "jp": "ま、右から左へ受け流しとけばいいんじゃない？", "vi": "Ôi dào, cứ bỏ ngoài tai là được chứ gì!"}]}, {"id": "2-07-11", "no": 11, "page": 106, "start": 65.37, "end": 79.07, "dur": 13.7, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "おい、明日の飲み会どうする？", "vi": "Này, bữa nhậu ngày mai tính sao?"}, {"spk": "B", "jp": "行かないわけにはいかないでしょう？　部長のお誘いだもの。", "vi": "Không đi không được nhỉ! Trưởng phòng mời kia mà."}, {"spk": "A", "jp": "そうだね…。新入社員はつらいよね。", "vi": "Đúng thế nhỉ... Nhân viên mới khổ ghê cơ."}, {"spk": "B", "jp": "何とか一次会だけで帰るようにしようね。", "vi": "Xem thế nào hết tăng 1 mình về trước nhé."}]}, {"id": "2-07-12", "no": 12, "page": 106, "start": 78.47, "end": 92.32, "dur": 13.85, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "またいちからやり直し…。", "vi": "Lại làm lại từ đầu..."}, {"spk": "B", "jp": "あんだけエネルギー注いだのにね。", "vi": "Tốn bao nhiêu sức lực mà vậy nhỉ."}, {"spk": "A", "jp": "全然積み上がっていかない。本当に、割に合わないね。", "vi": "Không tiến bộ thêm chút nào cả. Đúng là chẳng bõ công nhỉ."}, {"spk": "B", "jp": "合わないね～。", "vi": "Chẳng bõ công nhỉ."}]}]}, {"track": "2-08", "disk": 2, "no": 8, "audio": "sd_2-08.mp3", "dur": 96.68, "pages": [108], "level": "上級", "section": 2, "segments": [{"id": "2-08-13", "no": 13, "page": 108, "start": 0.45, "end": 23.23, "dur": 22.78, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "部長の娘さん、結婚することになったらしいですよ。", "vi": "Nghe nói con gái trưởng phòng sẽ cưới đấy."}, {"spk": "B", "jp": "へー。娘を結婚させる父親の気持ちって、どんなものなんでしょうね？", "vi": "Chà, Không biết tâm trạng ông bố sắp cho con gái đi lấy chồng thì thế nào nhỉ?"}, {"spk": "A", "jp": "ホッとした気持ちと寂しい気持ちが入り交じって、感極まるって感じなんじゃないですかね。", "vi": "Chắc là tràn ngập cảm xúc, vừa nhẹ lòng vừa xen lẫn nỗi buồn nhỉ."}, {"spk": "B", "jp": "そうかー。花嫁の父親って、複雑な心境なんですねー。", "vi": "Vậy hả? Làm bố cô dâu tâm trạng rối bời phết nhỉ?"}]}, {"id": "2-08-14", "no": 14, "page": 108, "start": 22.63, "end": 52.39, "dur": 29.76, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "この度マーケティング部に配属されましたパク・ヨンジュンです。これからお世話になります。どうぞ、よろしくお願いいたします。", "vi": "Tôi là Pak Yon Jun, mới được chuyển về phòng marketing. Tôi sẽ được làm việc với các anh chị trong thời gian tới. Rất mong được các anh chị giúp đỡ."}, {"spk": "B", "jp": "パク・ヨンジュンさんね。渡辺です。どうぞよろしく。ところで、お名前はなんとお呼びすればいいですか。", "vi": "Anh Pak Yon Jun à. Tôi là Watanabe. Rất mong anh giúp đỡ. Nhân tiện, tôi nên gọi tên anh thế nào?"}, {"spk": "A", "jp": "あ、前の部署では同姓の人がいたのでヨンジュンと呼ばれていましたが、ここではパクと呼んでください。", "vi": "À, ở phòng cũ có người trùng họ nên mọi người gọi tôi là Yon Jun, còn ở đây thì cứ gọi tôi là Pak."}, {"spk": "B", "jp": "わかりました。パクさんですね。", "vi": "Được rồi. Vậy là anh Pak nhé."}]}, {"id": "2-08-15", "no": 15, "page": 108, "start": 51.79, "end": 75.98, "dur": 24.19, "title": "", "titleVi": "", "lines": [{"spk": "", "jp": "【営業部と企画部との会議で】", "vi": "【Cuộc họp giữa phòng kinh doanh và phòng kế hoạch】"}, {"spk": "A", "jp": "先ほども申し上げましたように、営業部としては賛成いたしかねます。", "vi": "Như tôi đã trình bày lúc này, phòng kinh doanh khó mà tán thành được."}, {"spk": "B", "jp": "でも、反対の理由が今一つはっきりこちらに伝わって来ないんですよ。", "vi": "Nhưng, phía chúng tôi thấy lý do phản đối thiếu rõ ràng."}, {"spk": "A", "jp": "利益の見込みがない商品の企画に賛成するわけにはいかないということです。", "vi": "Không có lý gì chúng tôi lại tán thành một kế hoạch sản phẩm không thấy trước lợi nhuận."}, {"spk": "B", "jp": "いや、短期的には厳しいかもしれませんが、長期的には必ず利益が見込めると思うんですよ。", "vi": "Không, ngắn hạn thì có thể khó, nhưng dài hạn thì tôi nghĩ chắc chắn có thể có lợi nhuận."}]}, {"id": "2-08-16", "no": 16, "page": 108, "start": 75.38, "end": 94.62, "dur": 19.24, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "最終報告書ですが、ひとまずフォーマットを作ってみました。ちょっと目を通して、それで良ければ書き始めといてもらえますか？", "vi": "Về bản báo cáo cuối cùng, tôi đã soạn tạm phom ra rồi. Cậu xem qua, nếu được rồi thì bắt đầu viết luôn được không?"}, {"spk": "B", "jp": "はい。締め切りはいつですか？", "vi": "Vâng, hạn chót là bao giờ ạ?"}, {"spk": "A", "jp": "先方はまだ何も言ってこないけど、前倒しにできることしといてください。", "vi": "Khách hàng thì chưa nói gì, nhưng hãy cứ làm để đi trước tiến độ."}, {"spk": "B", "jp": "はい。わかりました。", "vi": "Vâng, em hiểu rồi ạ."}]}]}, {"track": "2-09", "disk": 2, "no": 9, "audio": "sd_2-09.mp3", "dur": 85.29, "pages": [110], "level": "上級", "section": 2, "segments": [{"id": "2-09-17", "no": 17, "page": 110, "start": 0.43, "end": 13.47, "dur": 13.04, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あー、気分爽快！", "vi": "Aa… Tinh thần sảng khoái quá!"}, {"spk": "B", "jp": "なんかあったの？", "vi": "Có chuyện gì chăng?"}, {"spk": "A", "jp": "いや、ただ部長が出張で席にいないだけなんだけどね。", "vi": "Không, chỉ là trưởng phòng đi công tác vắng thôi mà."}, {"spk": "B", "jp": "そういえば、部全体がのびのびしてるみたいだねー。", "vi": "Nói vậy mới thấy, cả phòng cậu có vẻ thư giãn nhỉ."}]}, {"id": "2-09-18", "no": 18, "page": 110, "start": 12.87, "end": 28.81, "dur": 15.94, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "山田部長、今夜はいやに機嫌がいいですよね。", "vi": "Trưởng phòng Yamada tối nay có vẻ vui gớm nhỉ."}, {"spk": "B", "jp": "うん。何でも昇進が内定したらしいよ。", "vi": "Ừ, nghe nói được thăng chức mà lại."}, {"spk": "A", "jp": "へー、そうなんですか。あの笑顔、いつもの部長とは思えませんね。", "vi": "Chà, Vậy hả? Nhìn khuôn mặt tươi cười kia, không thể tin đó là trưởng phòng mọi khi nhỉ."}, {"spk": "B", "jp": "よっぽど嬉しかったんだろうね。", "vi": "Chắc là phải vui lắm đấy."}]}, {"id": "2-09-19", "no": 19, "page": 110, "start": 28.21, "end": 51.28, "dur": 23.07, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今日も木村さん、昼休みに難しそうな哲学の本読んでたよ。", "vi": "Cậu Kimura trưa nay lại đọc một cuốn sách triết học trông có vẻ khó lắm đấy."}, {"spk": "B", "jp": "そうそう、いつも読んでるよね。", "vi": "Phải rồi, cậu ấy lúc nào cũng đọc nhỉ."}, {"spk": "A", "jp": "なんか、勉強熱心そうだよねー。", "vi": "Trông có vẻ chăm học thật đấy nhỉ."}, {"spk": "B", "jp": "え～、そうは思えないけどなー。現実逃避なんじゃないの？", "vi": "Sao? Tớ thì không nghĩ vậy đâu. Chắc chỉ là chạy trốn thực tại thôi."}, {"spk": "A", "jp": "また、すぐそうやって物事を斜めに見るんだからー。もっと素直になれば？", "vi": "Cậu lại ngay lập tức nhìn mọi việc méo mó đi thế. Sao không nghĩ trong sáng hơn đi."}, {"spk": "B", "jp": "しょうがないよ、性分なんだから。", "vi": "Biết làm sao được. Bản tính tớ thế rồi."}]}, {"id": "2-09-20", "no": 20, "page": 110, "start": 50.68, "end": 83.48, "dur": 32.8, "title": "", "titleVi": "", "lines": [{"spk": "", "jp": "【新人教育に手を焼く同僚同士の雑談】", "vi": "【Câu chuyện giữa những đồng nghiệp đang lúng túng trong việc đào tạo nhân viên mới】"}, {"spk": "A", "jp": "いくら口を酸っぱくして言っても、聞くほうにその気がなくちゃね…。", "vi": "Nói đến khô cả họng mà người nghe có thèm nghe đâu."}, {"spk": "B", "jp": "本当、本当！　言うだけ疲れるってもんだよ。", "vi": "Đúng thế! Đúng thế! Chỉ nói không đã mệt rồi nhỉ."}, {"spk": "A", "jp": "かと言って、何も言わないでいいってわけにもいかないだろうし…。", "vi": "Nói là vậy, chứ không nói cũng không được…"}, {"spk": "B", "jp": "「人の振り見てわが振り直せ」で、自分で気づくのが一番なんだけどねー。", "vi": "Đúng là \"Nhìn người lại ngẫm đến ta\". Tự mình nhận ra là tốt nhất nhỉ."}, {"spk": "A", "jp": "無理、無理！　だいたい先輩後輩の観念からしてないんだから。", "vi": "Khó lắm, khó lắm! Ngay đến quan niệm đàn anh đàn em còn chẳng có nữa là."}, {"spk": "B", "jp": "僕たちが新人の頃は、先輩の言葉は絶対だったけどな～。", "vi": "Hồi bọn mình mới vào công ty, những lời của bậc đàn anh luôn là tuyệt đối nhỉ."}]}]}, {"track": "2-10", "disk": 2, "no": 10, "audio": "sd_2-10.mp3", "dur": 91.98, "pages": [112], "level": "上級", "section": 2, "segments": [{"id": "2-10-21", "no": 21, "page": 112, "start": 0.43, "end": 22.1, "dur": 21.67, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "例のプロジェクト、まだ決まらないの？", "vi": "Dự án đó vẫn chưa quyết à?"}, {"spk": "B", "jp": "そうなんだよ。当初の計画が保留になっちゃってんだよねー。", "vi": "Đúng vậy đấy! Kế hoạch ban đầu bị bảo lưu mất rồi."}, {"spk": "A", "jp": "なんか話がややこしくなってない？", "vi": "Có vẻ làng nhằng nhỉ?"}, {"spk": "B", "jp": "そうなんだ。あちらを立てればこちらが立たずでさー。", "vi": "Chính thế đấy. Được chỗ này lại hỏng chỗ kia."}, {"spk": "A", "jp": "いっそ、振り出しに戻しちゃえば？", "vi": "Sao không bắt đầu lại từ đầu?"}, {"spk": "B", "jp": "そうしたいのはやまやまなんだけどね～。", "vi": "Tôi cũng muốn làm vậy lắm chứ."}]}, {"id": "2-10-22", "no": 22, "page": 112, "start": 21.5, "end": 56.82, "dur": 35.32, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "どうしたの？　さっきから時計ばっかり気にして、ちっとも落ち着きがないけど。", "vi": "Có chuyện gì vậy? Này giờ cậu cứ để ý đồng hồ suốt, chẳng yên chút nào cả."}, {"spk": "B", "jp": "うん。実は、さっき病院にいる妻から連絡があって、陣痛が始まったんだって。", "vi": "Ừ. Thực ra, vợ tớ ở viện mới gọi báo là cô ấy bắt đầu trở dạ."}, {"spk": "A", "jp": "え、本当？　だったら仕事なんてしてないで、奥さんの所に早く行ってあげなさいよ。", "vi": "Ô, thật á? Vậy thì đừng làm việc nữa, mau tới chỗ cô ấy đi."}, {"spk": "B", "jp": "うん、そうしたいのはやまやまなんだけど、どうしても抜けられない会議があって…。", "vi": "Ừ, tớ muốn thế lắm chứ nhưng có cuộc họp không thể vắng mặt…."}, {"spk": "A", "jp": "そんなのどうだっていいじゃない。一生に何度もあることじゃないのよ。", "vi": "Chuyện đó sao mà chẳng được. Cả đời đâu có mấy lần sinh nở đâu."}, {"spk": "B", "jp": "うーん。そうだね。じゃ、課長に相談してくるよ。", "vi": "Ừ, cậu nói đúng. Tớ sẽ đi nói với trưởng nhóm."}]}, {"id": "2-10-23", "no": 23, "page": 112, "start": 56.22, "end": 90.09, "dur": 33.87, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "山田さんって、飲み会に誘っても絶対に来たことないし、人づき合いよくないよね。", "vi": "Anh Yamada ấy, có mời đi uống cũng nhất định không đi bao giờ. Quan hệ với mọi người chẳng tốt gì cả nhỉ."}, {"spk": "B", "jp": "うん。部長のゴルフの誘いも平気で断っちゃうんだって。", "vi": "Ừ, nghe nói trưởng phòng rủ đi đánh gôn anh ta cũng thản nhiên từ chối."}, {"spk": "A", "jp": "へー、どんなに仕事ができてもそれじゃーね…。", "vi": "Thế cơ à, làm việc tốt đến mấy mà thế thì…"}, {"spk": "B", "jp": "そうだよね。やっぱり人間関係って大切だよね。", "vi": "Đúng vậy nhỉ. Quan hệ với mọi người quan trọng mà."}, {"spk": "A", "jp": "うん。特に組織の仕事って、そういうの影響するじゃない？　山田さんも上司の受けが悪いと、出世もままならないんじゃないかなー。", "vi": "Ừ. Nhất là công việc tập thể, những chuyện như thế cũng ảnh hưởng chứ? Anh Yamada làm mất lòng sếp thế thì làm sao mà thăng tiến được kia chứ!"}, {"spk": "B", "jp": "そうか。じゃ、俺も気をつけなきゃな。", "vi": "Thế à? Vậy, tớ cũng phải cẩn thận mới được."}]}]}, {"track": "2-11", "disk": 2, "no": 11, "audio": "sd_2-11.mp3", "dur": 116.3, "pages": [114], "level": "上級", "section": 2, "segments": [{"id": "2-11-24", "no": 24, "page": 114, "start": 0.38, "end": 52.12, "dur": 51.74, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "どんなに頑張ってもしょせん一介のサラリーマンなんだから、億万長者になれるわけないよな。", "vi": "Có cố gắng đến mấy thì rốt cuộc cũng chỉ là một người làm công ăn lương bình thường, chẳng cách nào trở thành triệu phú được nhỉ."}, {"spk": "B", "jp": "どうして今さらそんなこと？", "vi": "Sao giờ cậu lại nói chuyện đó?"}, {"spk": "A", "jp": "だってさ、毎日満員電車に揺られて会社に行って、クタクタになるまで働いて、夜は家に帰って寝るだけ。しかも、給料も一向に上がらない、出世も無理ときたら、この先望みなんて持てるわけないよ。", "vi": "Thì cậu xem, ngày nào cũng chỉ lắc lư trên tàu điện chật kín người, đến công ty, làm việc đến phờ phạc rồi về ngủ. Lương thì chẳng tăng, thành đạt cũng không mong thì làm gì có thể hy vọng ở tương lai chứ."}, {"spk": "B", "jp": "そんなこと言わないでくれよ。なんだか俺まで悲しくなってくるよ。", "vi": "Đừng nói thế chứ. Làm tớ cũng buồn lây đây này."}, {"spk": "A", "jp": "あ～あ、何のために働き蜂みたいに毎日働いてんのかなー。いっそ脱サラでもしようかなー。", "vi": "Ôi, ngày nào cũng làm việc như con ong chăm chỉ để làm gì chứ! Hay là bỏ quách cái cảnh làm công này đi nhỉ."}, {"spk": "B", "jp": "そんな弱気なこと言って、自分はだめだってはなから諦めちゃだめだよ。平凡なサラリーマンでも、真面目にコツコツ働いて認められた人はごまんといるじゃないか。", "vi": "Đừng có thối chí, tự mình bỏ cuộc như thế chứ! Thiếu gì những người chỉ làm công ăn lương bình thường mà nghiêm túc, chăm chỉ, cuối cùng cũng được công nhận đấy thôi."}]}, {"id": "2-11-25", "no": 25, "page": 114, "start": 51.52, "end": 86.47, "dur": 34.95, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "次回の報告会だけど、10月頃に持ってこようと思うんだけど…。どう思う？", "vi": "Về buổi báo cáo lần tới, tôi định chuyển sang tháng 10… Cậu nghĩ sao?"}, {"spk": "B", "jp": "10月ね…。", "vi": "Tháng 10 à…"}, {"spk": "A", "jp": "新入社員のモチベーションをあげる仕掛けになると思うんだよね。ちょうど今回と2カ月離れてるし。", "vi": "Tôi nghĩ nó sẽ là cái cớ để nâng cao động lực của nhân viên mới. Vừa vặn cách buổi báo cáo lần này tròn 2 tháng."}, {"spk": "B", "jp": "そうだね。9月は中間決算が控えているから、10月ごろが確かにいいかもね。", "vi": "Cậu nói phải. Tháng 9 có quyết toán giữa kỳ nên khoảng tháng 10 chắc được đấy."}, {"spk": "A", "jp": "じゃ、そういうことで。具体的な日時は、またいくつか候補日を挙げるから、そこから考えよう。", "vi": "Vậy cứ thế nhé. Ngày giờ cụ thể, tôi sẽ đưa ra một số phương án rồi ta sẽ chọn từ đó."}, {"spk": "B", "jp": "そうだな。とりあえず、10月予定とだけ知らせておこう。メールしとくよ。", "vi": "Được rồi. Tạm thời, cứ thông báo là dự kiến vào tháng 10 nhé. Tôi sẽ gửi mail."}]}, {"id": "2-11-26", "no": 26, "page": 114, "start": 85.87, "end": 114.4, "dur": 28.53, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "次回の打ち合わせは、来週の火曜か水曜あたりでどうですか？", "vi": "Cuộc họp tiếp theo vào khoảng thứ 3, thứ 4 tuần sau được không?"}, {"spk": "B", "jp": "どちらかと言うと、14日のほうが都合がいいですね。", "vi": "Nếu phải chọn thì ngày 14 tiện cho tôi hơn."}, {"spk": "A", "jp": "14日の火曜日ですね、わかりました。", "vi": "Thứ ba, ngày 14 đúng không ạ. Tôi hiểu rồi."}, {"spk": "B", "jp": "じゃ、14日の2時3時ということで。", "vi": "Vậy 2 hoặc 3 giờ ngày 14 nhé."}, {"spk": "A", "jp": "はい。じゃ、部屋、押さえときます。", "vi": "Vâng, tôi sẽ đặt phòng trước."}, {"spk": "B", "jp": "お願いします。それから今年度の経費、概数でいいので出しといてください。", "vi": "Nhờ anh việc đó. À, anh cho tôi kinh phí năm nay, đại khái thôi cũng được."}, {"spk": "A", "jp": "はい、わかりました。今日中にやっときます。", "vi": "Vâng, tôi hiểu rồi. Tôi sẽ làm trong hôm nay."}]}]}]}]}, {"unit": 6, "titleJp": "上司や部下との会話", "titleVi": "Hội thoại với cấp trên, cấp dưới", "sections": [{"section": 1, "level": "中級", "tracks": [{"track": "2-12", "disk": 2, "no": 12, "audio": "sd_2-12.mp3", "dur": 95.76, "pages": [120], "level": "中級", "section": 1, "segments": [{"id": "2-12-1", "no": 1, "page": 120, "start": 0.43, "end": 10.54, "dur": 10.11, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "3時までに会議の資料を提出してください。", "vi": "Hãy trình tài liệu hội nghị trước 3 giờ."}, {"spk": "B", "jp": "はい、了解しました。", "vi": "Vâng, em rõ rồi."}, {"spk": "A", "jp": "簡潔にまとめてくださいね。", "vi": "Tóm tắt ngắn gọn vào nhé."}, {"spk": "B", "jp": "はい、わかりました。", "vi": "Vâng, em hiểu ạ."}]}, {"id": "2-12-2", "no": 2, "page": 120, "start": 9.94, "end": 28.01, "dur": 18.07, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あれ、今日、中本さんも福田さんもお休み？", "vi": "Ô, hôm nay cả Nakamoto và Fukuda đều nghỉ à?"}, {"spk": "B", "jp": "中本さんは発熱、福田さんは遅番です。", "vi": "Nakamoto bị sốt, còn Fukuda làm ca sau ạ."}, {"spk": "A", "jp": "発熱？　そうなんだ。", "vi": "Sốt ư? Vậy cơ à?"}, {"spk": "B", "jp": "昨日、咳してたから悪化したのかもしれませんね。", "vi": "Vì hôm qua họ nên‹?› chắc hôm nay bị nặng hơn ạ."}]}, {"id": "2-12-3", "no": 3, "page": 120, "start": 27.41, "end": 47.57, "dur": 20.16, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "人身事故で電車が止まってるみたいですよ。", "vi": "Hình như tàu điện bị dừng vì tai nạn với người đấy ạ."}, {"spk": "B", "jp": "え～、あと30分で着かなくちゃいけないのに、それじゃ2時に着かないよ。", "vi": "Hả? 30 phút nữa phải tới đó rồi mà thế này thì làm sao kịp lúc 2 giờ."}, {"spk": "A", "jp": "地下鉄で振替輸送をしているようですよ。ちょっと時間がかかるけど、それで行きましょうか。", "vi": "Hình như họ đang chuyển tiếp bằng tàu điện ngầm đấy ạ. Tuy hơi mất thời gian, nhưng hay là mình dùng cách đó?"}, {"spk": "B", "jp": "うーん、それしかないね。", "vi": "Ừm, cũng chỉ còn cách đó thôi nhỉ."}]}, {"id": "2-12-4", "no": 4, "page": 120, "start": 46.97, "end": 67.81, "dur": 20.84, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今日から8月だね。奥さんの出産も近いんじゃない？", "vi": "Từ hôm nay là sang tháng 8 rồi nhỉ. Vợ cậu cũng sắp sinh rồi đúng không?"}, {"spk": "B", "jp": "ええ。今月の14日、出産予定日なんです。", "vi": "Vâng. 14 tháng này là ngày dự sinh ạ."}, {"spk": "A", "jp": "あ、そう。奥さん暑いのに大変だね。木村さん立ち会うの？", "vi": "À thế à? Chắc vợ cậu cũng mệt vì trời nóng nhỉ! Cậu có ở cạnh vợ lúc sinh không?"}, {"spk": "B", "jp": "ええ、できれば。予定日の前後はお休みをいただいてるんです。", "vi": "Có, nếu được ạ. Em đã xin nghỉ phép mấy ngày trước và sau ngày dự sinh ạ."}]}, {"id": "2-12-5", "no": 5, "page": 120, "start": 67.21, "end": 93.95, "dur": 26.74, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あ～、出張旅費の申請書、書くの忘れてた。", "vi": "Ôi, tôi quên viết phiếu xin chi phí công tác rồi."}, {"spk": "B", "jp": "じゃ、私が書いときましょうか？", "vi": "Thế, để em viết nhé?"}, {"spk": "A", "jp": "悪いね。頼むよ。ついでに経理課にまわしといてくれないか。", "vi": "Phiền cô quá. Nhờ cô nhé! Nhân tiện, cô chuyển luôn sang phòng kế toán giúp tôi được không?"}, {"spk": "B", "jp": "え～、相変わらず人使いが荒いですね。", "vi": "Sao cơ ạ? Sếp vẫn hay tiện thể nhờ vả thế nhỉ."}, {"spk": "A", "jp": "そんなこと言わないで、頼んだよ。", "vi": "Đừng nói thế chứ! Tôi nhờ cô đấy!"}, {"spk": "B", "jp": "わかりました。その代わり、明日の課の飲み会、絶対参加してくださいね。", "vi": "Vâng. Bù lại, sếp nhất định phải tham gia bữa liên hoan của phòng ngày mai nhé."}]}]}, {"track": "2-13", "disk": 2, "no": 13, "audio": "sd_2-13.mp3", "dur": 100.34, "pages": [122], "level": "中級", "section": 1, "segments": [{"id": "2-13-6", "no": 6, "page": 122, "start": 0.43, "end": 28.09, "dur": 27.66, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "何書いてるんだ？", "vi": "Cậu viết cái gì đấy?"}, {"spk": "B", "jp": "スピーチの原稿なんです。結婚式の二次会でスピーチ頼まれちゃって。", "vi": "Bản thảo bài diễn văn ạ. Em bị yêu cầu phát biểu trong tiệc mừng sau lễ cưới."}, {"spk": "A", "jp": "あ、吉岡君の？　今週末だったね、確か。", "vi": "À, lễ cưới của cậu Yoshioka hả? Cuối tuần này nhỉ?"}, {"spk": "B", "jp": "はい。余興で歌、歌うぐらいにしたかったんですけどねー。", "vi": "Vâng, lúc đầu, em chỉ định hát một bài góp vui thôi kia."}, {"spk": "A", "jp": "そういえば、最近はあんまり結婚式で歌聞かないね。", "vi": "Lại nói chuyện đó, gần đây không mấy ai hát ở đám cưới nhỉ!"}, {"spk": "B", "jp": "そうですよね。昔はカラオケ大会みたいなところがありましたけどね。", "vi": "Đúng thế thật! Ngày trước còn có đám cưới mà cứ như thi hát karaoke ấy sếp nhỉ."}]}, {"id": "2-13-7", "no": 7, "page": 122, "start": 27.49, "end": 50.83, "dur": 23.34, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "高木君、沖縄どうだった？", "vi": "Takagi này, Okinawa thế nào?"}, {"spk": "B", "jp": "はい、予定通り行きました。先方の部長ともお会いできて、いろいろお話をうかがってきました。", "vi": "Dạ, chuyến đi đúng như dự kiến ạ. Em đã gặp trưởng phòng bên họ và hỏi được rất nhiều chuyện."}, {"spk": "A", "jp": "あ、そう。明日までに報告書出しといて。ラフなのでいいから。", "vi": "Ồ, vậy hả? Trình báo cáo chậm nhất trong ngày mai nhé. Sơ sơ thôi cũng được."}, {"spk": "B", "jp": "はい、大丈夫です。", "vi": "Vâng, được ạ."}, {"spk": "A", "jp": "それと、来週の打ち合わせで検討しなきゃいけないことをいくつかピックアップしといて。箇条書きで。", "vi": "Thêm nữa, cậu lọc ra một số điểm cần phải thảo luận trong cuộc họp tuần tới nhé. Gạch đầu dòng thôi."}, {"spk": "B", "jp": "はい、わかりました。", "vi": "Vâng, em hiểu rồi."}]}, {"id": "2-13-8", "no": 8, "page": 122, "start": 50.23, "end": 76.99, "dur": 26.76, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "田中君、「ほうれんそう」ってわかってる？", "vi": "Tanaka này, cậu biết \"Horenso\" chứ?"}, {"spk": "B", "jp": "ええ、あの野菜のほうれん草のことですよね。", "vi": "Có ạ, rau horenso (cải bó xôi/ rau chân vịt) phải không ạ?"}, {"spk": "A", "jp": "違う違う、会社で使う「ほうれんそう」だよ。", "vi": "Không, không. \"Ho-Ren-So\" dùng trong công ty cơ."}, {"spk": "B", "jp": "あ、「ほう」は「報告」、「れん」は「連絡」、「そう」は「相談」のことですね。", "vi": "À, \"Ho\" là \"Hokoku\" (báo cáo), \"Ren\" là \"Renraku\" (liên lạc), \"So\" là \"Sodan\" (bàn bạc) phải không ạ?"}, {"spk": "A", "jp": "わかってるんだったら、いつもそのようにしてほしいもんだね。", "vi": "Nếu cậu biết vậy thì tôi muốn cậu luôn luôn làm theo điều đó."}, {"spk": "B", "jp": "あっ、すみません。気をつけます。", "vi": "Ồ, em xin lỗi. Em sẽ chú ý ạ."}]}, {"id": "2-13-9", "no": 9, "page": 122, "start": 76.39, "end": 98.56, "dur": 22.17, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "この作業ペースじゃ、2日の納品は無理じゃないですか？", "vi": "Với nhịp độ công việc thế này thì giao hàng ngày mồng 2 làm sao được ạ?"}, {"spk": "B", "jp": "う～ん。でも、先方には大丈夫だって言っちゃったんだろ？", "vi": "Ừm, nhưng chúng ta đã nói với khách hàng là được rồi phải không?"}, {"spk": "A", "jp": "ええ、まー。", "vi": "À, vâng."}, {"spk": "B", "jp": "できるって言ったからにはやらないとな。この先の信用に関わるし。", "vi": "Một khi đã nói được thì phải làm bằng được thôi. Còn uy tín sau này nữa."}, {"spk": "A", "jp": "ええ、それはわかるんですが…。", "vi": "Vâng, em biết vậy nhưng…"}, {"spk": "B", "jp": "ちょっと、作業日程見直してみようよ。", "vi": "Lấy lịch làm việc ra xem lại thôi nào!"}]}]}, {"track": "2-14", "disk": 2, "no": 14, "audio": "sd_2-14.mp3", "dur": 49.11, "pages": [124], "level": "中級", "section": 1, "segments": [{"id": "2-14-10", "no": 10, "page": 124, "start": 0.45, "end": 18.89, "dur": 18.44, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "販促用のパンフの印刷、何社からか相見積もり取りましょうか。", "vi": "Về việc in tờ rơi quảng bá sản phẩm, em lấy báo giá cạnh tranh của vài công ty nhé?"}, {"spk": "B", "jp": "そうだね、頼むよ。", "vi": "Ừ, cô làm đi."}, {"spk": "A", "jp": "業者にも伝えて、意識し合ってもらったほうがいいですよね。", "vi": "Cũng nên nói cho các bên biết để họ có ý thức cạnh tranh với nhau anh nhỉ?"}, {"spk": "B", "jp": "うん。せっかく作るんだから、納得できるものにしないとね。", "vi": "Ừ, mất công làm thì phải làm sao cho có thể chấp nhận được nhé."}, {"spk": "A", "jp": "はい、それはもちろんです。", "vi": "Vâng, tất nhiên rồi ạ!"}]}, {"id": "2-14-11", "no": 11, "page": 124, "start": 18.29, "end": 47.24, "dur": 28.95, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "課長、先ほど日本商事の佐々木部長からお電話がありました。また一時間後にかけなおすとのことでした。", "vi": "Thưa trưởng nhóm, vừa có điện thoại của trưởng phòng Sasaki bên công ty thương mại Nihon Shoji. Ông ấy nói một tiếng sau sẽ gọi lại ạ."}, {"spk": "B", "jp": "佐々木部長？　ついさっき電話もらったばっかりだけどなー。なんか用件言ってなかった？", "vi": "Trưởng phòng Sasaki ư? Ông ấy vừa điện cho tôi lúc nãy mà. Ông ấy có nói việc gì không?"}, {"spk": "A", "jp": "いいえ、何も。", "vi": "Không, không nói gì ạ."}, {"spk": "B", "jp": "じゃ、電話してみようかな。", "vi": "Vậy để tôi gọi xem sao."}, {"spk": "A", "jp": "あ、こちらから折り返しましょうかと言ったんですが、これから会議に入るのでとおっしゃってました。", "vi": "À, em đã nói để bên mình gọi lại nhưng ông ấy nói phải vào họp ngay lúc đó ạ."}, {"spk": "B", "jp": "あ、そう。じゃー、しかたないね。", "vi": "À thế hả? Vậy thì chịu rồi."}]}]}]}, {"section": 2, "level": "上級", "tracks": [{"track": "2-15", "disk": 2, "no": 15, "audio": "sd_2-15.mp3", "dur": 91.59, "pages": [126], "level": "上級", "section": 2, "segments": [{"id": "2-15-1", "no": 1, "page": 126, "start": 0.41, "end": 19.77, "dur": 19.36, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "友達の結婚祝、何がいいと思う？", "vi": "Quà cưới cho bạn, cô nghĩ nên mua gì?"}, {"spk": "B", "jp": "コーヒーカップなんて、どうですか？", "vi": "Cốc uống cà phê thì sao ạ?"}, {"spk": "A", "jp": "うーん、ちょっと平凡じゃないか？", "vi": "Ừm, có nhàm quá không?"}, {"spk": "B", "jp": "じゃー、コーヒー豆とセットにしてあげたらどうでしょう。", "vi": "Vậy thì tặng cùng với cà phê hạt thì sao ạ?"}, {"spk": "A", "jp": "いやー、豆にも好みがあるしなー。難しいもんだね、お祝いも。", "vi": "Không, cà phê hạt cũng mỗi người một sở thích nữa chứ. Tặng quà khó thật đấy."}]}, {"id": "2-15-2", "no": 2, "page": 126, "start": 19.17, "end": 41.34, "dur": 22.17, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "最近、うちのパソコン調子が悪くって…。ウイルスにでも感染したのかな…。", "vi": "Gần đây, máy tính của tôi không ổn lắm… Không biết có bị nhiễm virus không nữa…"}, {"spk": "B", "jp": "どんな状況なんですか？", "vi": "Nó bị làm sao ạ?"}, {"spk": "A", "jp": "うん、立ち上げると同時に意味不明なメッセージが次から次へと出てくるんだよ。", "vi": "Ừm, cứ khởi động lên là nó hiện ra hàng loạt cảnh báo mà tôi chẳng hiểu gì cả."}, {"spk": "B", "jp": "変なメールを開けたりしませんでしたか？　とにかくプロバイダーに問い合わせてみたほうがいいですよ。", "vi": "Anh có mở mail nào khả nghi không ạ? Trước mắt, anh nên liên hệ với nhà cung cấp dịch vụ."}]}, {"id": "2-15-3", "no": 3, "page": 126, "start": 40.74, "end": 59.34, "dur": 18.6, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "さー、大変だぞ。今度のプロジェクトは失敗するわけにはいかないからな。", "vi": "Nào, sẽ vất vả đấy! Vì dự án lần này không được phép thất bại đâu."}, {"spk": "B", "jp": "はい。私たちも成功に向けて全力を尽くして頑張ります。", "vi": "Vâng, bọn em sẽ nỗ lực hết sức để thành công."}, {"spk": "A", "jp": "頼むよ。チームは一心同体って言うからね。", "vi": "Nhờ các cô cậu đấy! Vì cả đội phải \"Đồng lòng nhất trí\" mà."}, {"spk": "B", "jp": "はい。微力ながら、精一杯やらせていただきます。", "vi": "Vâng, tuy sức mọn nhưng bọn em sẽ làm hết sức mình ạ."}]}, {"id": "2-15-4", "no": 4, "page": 126, "start": 58.74, "end": 74.98, "dur": 16.24, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "奥様は、とても優しい方だそうですね。", "vi": "Nghe nói vợ anh rất hiền phải không ạ?"}, {"spk": "B", "jp": "外づらがいいんだよ。うちじゃ鬼よりこわいよ。", "vi": "Bà ấy giả bộ khéo thôi. Ở nhà thì còn dữ hơn quỷ đấy!"}, {"spk": "A", "jp": "へ～、いいんですか？　そんなことおっしゃって。", "vi": "Ôi, Anh nói thế mà được ư?"}, {"spk": "B", "jp": "ここだけの話にしといてくれよ。とにかく地獄耳なんだから。", "vi": "Đừng có nói cho ai khác đấy! Vì bà ấy thính lắm."}]}, {"id": "2-15-5", "no": 5, "page": 126, "start": 74.38, "end": 89.67, "dur": 15.29, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "部長、家庭円満の秘訣は何ですか？", "vi": "Trưởng phòng ơi, bí quyết để gia đình viên mãn là gì thế ạ?"}, {"spk": "B", "jp": "そりゃー、一に我慢、二に我慢、三四がなくて五に我慢だよ。", "vi": "Chuyện đó thì, \"một là chịu đựng, hai là chịu đựng, bỏ qua ba bốn, năm lại chịu đựng\" đó!"}, {"spk": "A", "jp": "へー、理解のある奥様に見えますけどねー。", "vi": "Ôi, trông bà nhà có vẻ biết cảm thông thế kia mà!"}, {"spk": "B", "jp": "内と外では大違いってね。", "vi": "Thì bên trong khác xa với bên ngoài mà lị!"}]}]}, {"track": "2-16", "disk": 2, "no": 16, "audio": "sd_2-16.mp3", "dur": 88.22, "pages": [128], "level": "上級", "section": 2, "segments": [{"id": "2-16-6", "no": 6, "page": 128, "start": 0.43, "end": 18.85, "dur": 18.42, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "さー、君たち！　今夜は僕のおごりだ。おおいに飲んでくれ。", "vi": "Nào, các cậu! Tối nay tôi đãi. Uống đã đi!"}, {"spk": "B", "jp": "部長！　ご昇進、おめでとうございます。", "vi": "Trưởng phòng! Chúc mừng anh lên chức ạ."}, {"spk": "A", "jp": "ありがとう。君たちにも、また一緒に頑張ってもらうからね。", "vi": "Cám ơn nhé. Tôi vẫn sẽ cần các cô cậu cố gắng cùng tôi đấy!"}, {"spk": "B", "jp": "もちろんです。では、部長のますますのご活躍を願って、乾杯！", "vi": "Tất nhiên rồi ạ. Nào, xin nâng cốc chúc cho trưởng phòng thành đạt hơn nữa."}]}, {"id": "2-16-7", "no": 7, "page": 128, "start": 18.25, "end": 36.1, "dur": 17.85, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "いやー、とっさの判断で早めに切り上げてよかったよ。", "vi": "Chà, thật may là chúng ta đã sớm dứt điểm với một nhận định dứt khoát."}, {"spk": "B", "jp": "迅速かつ適切な判断力がなければ、いいビジネスはできませんからね。", "vi": "Đúng là nếu không có năng lực nhận định nhanh chóng và chính xác thì không thể kinh doanh tốt được anh nhỉ!"}, {"spk": "A", "jp": "お！　君もたまにはいいことを言うじゃないか。", "vi": "Ồ, thì thoảng cậu cũng nói được một câu hay đấy chứ!"}, {"spk": "B", "jp": "いえいえ、日頃の課長のご指導の賜物ですよ。", "vi": "Đâu có ạ. Cũng nhờ trưởng nhóm chỉ bảo hàng ngày đó thôi ạ!"}]}, {"id": "2-16-8", "no": 8, "page": 128, "start": 35.5, "end": 51.82, "dur": 16.32, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あのー、折り入ってご相談したいことがあるんですが。", "vi": "Xin lỗi, em có việc muốn trao đổi kỹ với anh ạ."}, {"spk": "B", "jp": "あー、木村さん。今ちょっと手が離せないんだけど、ちょっと待ってくれる？", "vi": "Ồ, Kimura à, ngay bây giờ tôi không rời tay ra được. Cô đợi tôi một chút được không?"}, {"spk": "A", "jp": "はい。じゃ、あちらで待たせていただきます。", "vi": "Vâng ạ. Vậy thì em xin đợi ở đằng kia."}, {"spk": "B", "jp": "あ、悪いね。電話一本入れたらすぐ行くから。", "vi": "Xin lỗi cô nhé. Tôi gọi một cuộc điện thoại xong sẽ ra chỗ cô ngay."}]}, {"id": "2-16-9", "no": 9, "page": 128, "start": 51.22, "end": 63.95, "dur": 12.73, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "先方から見積もりが来ました。", "vi": "Bên họ đã gửi báo giá đến rồi ạ."}, {"spk": "B", "jp": "あ、どうだった？", "vi": "Ồ, thế nào?"}, {"spk": "A", "jp": "高すぎて話になりません。こっちの予算も言っといたんですけどね。", "vi": "Đắt quá, không nên chuyện được ạ. Mà em đã nói với họ cả về ngân sách bên mình rồi đấy."}, {"spk": "B", "jp": "もう一度、来てもらって相談してみるか。", "vi": "Có lẽ nên mời họ đến bàn thêm lần nữa?"}]}, {"id": "2-16-10", "no": 10, "page": 128, "start": 63.35, "end": 73.06, "dur": 9.71, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "この書類をシュレッダーにかけてください。", "vi": "Cậu hãy bỏ chỗ tài liệu này vào máy xén."}, {"spk": "B", "jp": "はい、全部ですね。", "vi": "Vâng, xén tất cả phải không ạ?"}, {"spk": "A", "jp": "いや、個人名の出てるとこだけでいいよ。", "vi": "Không, chỉ chỗ nào có tên riêng thôi."}, {"spk": "B", "jp": "はい。わかりました。", "vi": "Vâng, em hiểu rồi ạ."}]}, {"id": "2-16-11", "no": 11, "page": 128, "start": 72.46, "end": 86.38, "dur": 13.92, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "佐藤、税関から呼び出しが来てるぞ。", "vi": "Sato, bên thuế vụ họ gọi đấy!"}, {"spk": "B", "jp": "え？　呼び出しの理由は何ですか？", "vi": "Sao ạ? Họ gọi vì lý do gì ạ?"}, {"spk": "A", "jp": "何でも、通関書類が不足していたようだ。", "vi": "Hình như hồ sơ thông quan bị thiếu đó."}, {"spk": "B", "jp": "おかしいなー。何回もチェックしたはずなんですけど…。", "vi": "Lạ thật! Em đã kiểm tra đi kiểm tra lại rồi kia mà..."}]}]}, {"track": "2-17", "disk": 2, "no": 17, "audio": "sd_2-17.mp3", "dur": 90.83, "pages": [130], "level": "上級", "section": 2, "segments": [{"id": "2-17-12", "no": 12, "page": 130, "start": 0.53, "end": 16.69, "dur": 16.16, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "いやー、明日から出張になっちゃったよ。", "vi": "Ôi, tôi phải đi công tác ngay ngày mai rồi!"}, {"spk": "B", "jp": "え、それは急ですね。何かあったんですか？", "vi": "Sao ạ? Gấp quá nhỉ! Không biết có chuyện gì thế ạ?"}, {"spk": "A", "jp": "うん、工場の電気系統にトラブルが発生したみたいなんだ。", "vi": "Ừm, hình như hệ thống điện của nhà máy bị sự cố."}, {"spk": "B", "jp": "え～、それでわざわざ部長がいらっしゃらなきゃいけないんですか。", "vi": "Ồ, thế mà trưởng phòng phải đích thân đi cơ ạ?"}]}, {"id": "2-17-13", "no": 13, "page": 130, "start": 16.09, "end": 34.54, "dur": 18.45, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あれ？　ミーティングは午後3時からじゃなかったっけ。", "vi": "Ơ, không phải cuộc họp bắt đầu từ 3 giờ chiều sao?"}, {"spk": "B", "jp": "1時に変更になったこと、お伝えしてあったと思いますが…。", "vi": "Em đã báo với chị là chuyển sang 1 giờ rồi mà..."}, {"spk": "A", "jp": "うっかりしてた。てっきり3時だと思ってた。", "vi": "Tôi quên khuấy mất. Cứ đinh ninh là 3 giờ."}, {"spk": "B", "jp": "そうでしたか。資料を用意しておきましたので、ご覧になっておいてください。", "vi": "Thế ạ? Em đã chuẩn bị sẵn tài liệu. Chị xem trước đi ạ."}]}, {"id": "2-17-14", "no": 14, "page": 130, "start": 33.94, "end": 47.84, "dur": 13.9, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あの、部長、明日の出張のことなんですけど…。", "vi": "Thưa trưởng phòng, về chuyến công tác ngày mai..."}, {"spk": "B", "jp": "あ、ちょっと一服してからでいい？", "vi": "Ồ, để tôi làm một hơi xong có được không?"}, {"spk": "A", "jp": "あ、じゃ、僕もご一緒させてください。", "vi": "Ồ, thế thì cho em cùng hút với."}, {"spk": "B", "jp": "あれ？　タバコ吸うんだっけ。吸ってるとこ見たことなかったなー。", "vi": "Hả? Cậu cũng hút à? Tôi chưa thấy cậu hút bao giờ nhỉ!"}]}, {"id": "2-17-15", "no": 15, "page": 130, "start": 47.24, "end": 68.14, "dur": 20.9, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "山田さん、先週頼んでおいた企画案、持ってきて。", "vi": "Yamada này, mang cho tôi bản kế hoạch dự thảo tuần trước tôi nói cậu làm đi."}, {"spk": "B", "jp": "それが、なかなか案がまとまらなくて、まだできてないんです。", "vi": "Việc đó thì em chưa lên được dự thảo nên vẫn chưa xong ạ."}, {"spk": "A", "jp": "え、今できてないと困るな。現況報告しといてくれないと。締め切りまでに間に合う？", "vi": "Ô, bây giờ vẫn chưa xong thì gay nhỉ. Cậu phải báo cáo hiện trạng cho tôi chứ. Liệu có kịp hạn chót không?"}, {"spk": "B", "jp": "はい、締め切りまでには。今、資料をお持ちします。", "vi": "Có, hạn chót thì kịp ạ. Bây giờ em sẽ mang tài liệu đến ngay ạ."}]}, {"id": "2-17-16", "no": 16, "page": 130, "start": 67.54, "end": 89.07, "dur": 21.53, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "部長、長い間たいへんお世話になり、ありがとうございました。", "vi": "Trưởng phòng, cảm ơn anh đã giúp đỡ em suốt một thời gian dài ạ."}, {"spk": "B", "jp": "いやいや、こちらこそ。君にはいろいろ頑張ってもらって感謝してますよ。", "vi": "Không, không. Chính tôi mới phải cảm ơn chứ. Cảm ơn cô đã cố gắng rất nhiều."}, {"spk": "A", "jp": "ソウル支社に行っても頑張ります。もし部長がソウルにお越しの際はどうぞご連絡ください。", "vi": "Đến chi nhánh ở Seoul em sẽ vẫn cố gắng. Nếu trưởng phòng đến Seoul thì hãy liên lạc với em nhé."}, {"spk": "B", "jp": "うん。そっちに行くことがあったらぜひ。じゃ、体に気をつけて。", "vi": "Ừ, nhất định rồi, nếu có dịp đến đó. Thôi, giữ sức khỏe nhé."}]}]}, {"track": "2-18", "disk": 2, "no": 18, "audio": "sd_2-18.mp3", "dur": 85.5, "pages": [132], "level": "上級", "section": 2, "segments": [{"id": "2-18-17", "no": 17, "page": 132, "start": 0.43, "end": 27.83, "dur": 27.4, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "来年、建設を予定しているホテル付き複合テーマパークですが、国内外から年間200万人の利用が見込まれています。", "vi": "Công viên đa chủ đề có kèm khách sạn dự kiến xây dựng vào năm sau được dự báo mỗi năm sẽ đón 2 triệu lượt khách trong và ngoài nước."}, {"spk": "B", "jp": "そうか？　その概算、ちょっと楽観的すぎるんじゃないか。", "vi": "Thật sao? Dự báo đó có lạc quan quá không?"}, {"spk": "A", "jp": "いえ、2015年完成の新空港の建設により、大幅な集客数の増加が可能かと思われます。", "vi": "Không ạ. Nhờ việc xây dựng sân bay mới sẽ hoàn thành vào năm 2015 nên lượng khách có khả năng tăng mạnh."}, {"spk": "B", "jp": "じゃ、開発計画の詳細を分析して、文書を提出してくれないか。", "vi": "Vậy cô phân tích chi tiết kế hoạch phát triển rồi viết báo cáo nộp cho tôi nhé."}]}, {"id": "2-18-18", "no": 18, "page": 132, "start": 27.23, "end": 49.78, "dur": 22.55, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "課長、今回も予算がオーバーしそうですが…。", "vi": "Trưởng nhóm, lần này cũng có vẻ sẽ vượt ngân sách ạ..."}, {"spk": "B", "jp": "じゃー、その旨、稟議書書いてまわしといてくれないか。", "vi": "Vậy, cậu viết nội dung đó vào Bản trưng cầu ý kiến được không?"}, {"spk": "A", "jp": "はい。文面は前回同様でよろしいですか？", "vi": "Vâng ạ. Trình bày giống như lần trước có được không ạ?"}, {"spk": "B", "jp": "うん、金額のところだけ書き直せばいいだろう。", "vi": "Ừ, chỉ cần viết lại chỗ số tiền là được phải không?"}, {"spk": "A", "jp": "金額はどのくらいにしておきますか？", "vi": "Số tiền em để khoảng bao nhiêu ạ?"}, {"spk": "B", "jp": "前回の2割増しってとこだろう。ちょっと金額出してみて。", "vi": "Chẳng phải cậu nói tăng 20% so với lần trước sao? Cứ tính số tiền ra xem nào."}]}, {"id": "2-18-19", "no": 19, "page": 132, "start": 49.18, "end": 83.24, "dur": 34.06, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "え、原料がまだ届いてないって？　鈴木、相手先に電話入れて、とりあえず商品の納入が遅れるかもしれないって謝っといてくれ。", "vi": "Sao? Nguyên liệu vẫn chưa tới ư? Suzuki, gọi ngay cho khách hàng, xin lỗi họ là có thể sẽ phải giao hàng chậm."}, {"spk": "B", "jp": "はい、わかりました。", "vi": "Vâng, em hiểu rồi."}, {"spk": "", "jp": "［電話後］", "vi": "(Sau khi gọi điện)"}, {"spk": "B", "jp": "課長、これ以上の遅れは困るということですが…。", "vi": "Trưởng nhóm ơi, họ nói không thể đợi thêm được ạ..."}, {"spk": "A", "jp": "そうか。弱ったな。じゃー、鈴木、今すぐ確認しにタイに飛んでくれ。", "vi": "Thế à? Gay nhỉ. Vậy thì, Suzuki, cậu bay ngay sang Thái kiểm tra tình hình đi."}, {"spk": "B", "jp": "課長、出張となりますと、いろいろ準備が必要でして…。", "vi": "Trưởng phòng ơi, nếu đi công tác thì phải chuẩn bị nhiều lắm ạ..."}, {"spk": "A", "jp": "そんな悠長なこと言ってられないぞ。一刻を争うんだ。", "vi": "Đừng nói như có nhiều thời gian lắm vậy chứ! Phải tranh thủ từng giây đó."}, {"spk": "B", "jp": "はー、そうはおっしゃいましても…。", "vi": "Trời... Anh nói vậy thôi chứ..."}]}]}]}]}, {"unit": 7, "titleJp": "社外の人や面接官などとの会話", "titleVi": "Hội thoại với người ngoài công ty, người phỏng vấn", "sections": [{"section": 1, "level": "中級", "tracks": [{"track": "2-19", "disk": 2, "no": 19, "audio": "sd_2-19.mp3", "dur": 79.39, "pages": [136], "level": "中級", "section": 1, "segments": [{"id": "2-19-1", "no": 1, "page": 136, "start": 0.42, "end": 19.32, "dur": 18.9, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あのー、営業部の山田さんにお目にかかりたいんですが。", "vi": "Xin lỗi, tôi muốn xin gặp ông/bà Yamada ở phòng kinh doanh ạ..."}, {"spk": "B", "jp": "失礼ですが、お名前をいただけますでしょうか。", "vi": "Xin lỗi ông, tôi có thể xin tên ông được không ạ?"}
