<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e40af">
<title>ココロ日本語 - Kokoro Nihongo</title>
<style>
:root{
  --bg:#f0f4f8; --card:#ffffff; --ink:#1a2332; --sub:#64748b;
  --line:#dde4ed; --brand:#2563eb; --brand2:#3b82f6; --accent:#16a34a;
  --warn:#f59e0b; --bad:#dc2626; --good:#16a34a; --soft:#eff6ff;
  --shadow:0 2px 12px rgba(15,30,60,.07);
  --grad:linear-gradient(135deg,#1e40af,#3b82f6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{
  background:var(--grad);color:#fff;
  padding:16px 18px;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(15,30,60,.18)
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow>div{min-width:0;flex:1;overflow:hidden}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:11.5px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn{background:#d6e1fa;border:none;color:#1e40af;border-radius:10px;
  padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
main{flex:1;padding:16px;overflow-y:auto}
.hidden{display:none!important}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat .n{font-size:22px;font-weight:800;color:var(--brand)}
.stat .l{font-size:11px;color:var(--sub);margin-top:2px}
.progwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.progwrap .t{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:8px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#22c55e);border-radius:99px;transition:width .5s}

.sectitle{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin:6px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{background:var(--card);border:1.5px solid var(--line);color:var(--sub);border-radius:99px;
  padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pager-btn{background:var(--soft);border:1.5px solid var(--line);color:var(--brand);border-radius:50%;
  width:34px;height:34px;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;padding:0}
.pager-btn:disabled{opacity:.3;cursor:default}
.deck-grid-wrap{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.deck-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;min-width:0}
.deck-card{background:var(--brand);border:none;color:#fff;border-radius:14px;padding:10px 8px;
  cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;min-width:0;height:66px}
.deck-card:active{transform:scale(.97)}
.deck-card .deck-icons{font-size:13px;line-height:1;min-height:14px;max-height:14px;overflow:hidden;flex-shrink:0}
.deck-card .deck-label{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;flex-shrink:0}
.deck-card.on{box-shadow:0 0 0 3px #1e40af inset}
.deck-card.done{background:#16a34a}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 14px;
  cursor:pointer;box-shadow:var(--shadow);transition:.15s;text-align:left;position:relative;overflow:hidden}
.mode:active{transform:scale(.97)}
.mode .ico{font-size:26px;margin-bottom:8px;display:block}
.mode .mt{font-size:15px;font-weight:700}
.mode .md{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.4}
.mode.due::after{content:attr(data-due);position:absolute;top:10px;right:10px;background:var(--warn);
  color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px}
.mode.new-tag::before{content:'MỚI';position:absolute;top:10px;right:10px;background:var(--accent);
  color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:2px 8px}

/* generic button */
.btn{border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;transition:.12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:#fff;width:100%}
.btn-ghost{background:var(--soft);color:var(--brand)}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* card / flashcard */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:26px 20px;text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.jp{font-size:40px;font-weight:800;letter-spacing:1px;line-height:1.25}
.reading{font-size:17px;color:var(--brand2);margin-top:8px;font-weight:600}
.mean{font-size:19px;margin-top:14px;font-weight:600}
.en{font-size:14px;color:var(--sub);margin-top:4px;font-style:italic}
.ex{font-size:15px;color:var(--ink);margin-top:16px;background:var(--soft);border-radius:12px;
  padding:12px 14px;line-height:1.7;text-align:left;width:100%}
.tag{font-size:11px;color:var(--sub);background:var(--soft);border-radius:99px;padding:3px 10px;margin-bottom:12px;font-weight:600}
.speaker{background:var(--soft);border:none;border-radius:99px;width:52px;height:52px;font-size:24px;
  cursor:pointer;margin-top:16px;color:var(--brand);transition:.12s}
.speaker:active{transform:scale(.9);background:var(--brand);color:#fff}
.counter{text-align:center;font-size:13px;color:var(--sub);margin-bottom:12px}

.srs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.srs .btn{padding:12px 4px;font-size:13px;color:#fff}
.srs .again{background:var(--bad)} .srs .hard{background:var(--warn)}
.srs .good{background:var(--brand)} .srs .easy{background:var(--good)}
.srs .sub{font-size:10px;opacity:.85;display:block;font-weight:500;margin-top:2px}

.mastered-link{background:var(--soft);border-radius:10px;padding:8px 12px;text-align:center;font-size:13px;
  color:var(--brand);cursor:pointer;margin-bottom:10px;font-weight:600}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.card-actions .btn{font-size:12.5px;padding:10px 6px}

/* quiz / listening options */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px;font-size:16px;
  text-align:left;cursor:pointer;transition:.12s;font-weight:600}
.opt:active{transform:scale(.99)}
.opt.correct{background:#dcfce7;border-color:var(--good);color:#166534}
.opt.wrong{background:#fee2e2;border-color:var(--bad);color:#991b1b}
.opt.dim{opacity:.5}
.qword{font-size:34px;font-weight:800;text-align:center;margin:6px 0}
.qhint{text-align:center;color:var(--sub);font-size:14px}

/* speaking / mic */
.mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--brand);color:#fff;font-size:40px;
  cursor:pointer;margin:20px auto;display:block;box-shadow:0 6px 20px rgba(37,99,235,.3);transition:.15s}
.mic.rec{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}70%{box-shadow:0 0 0 22px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.heard{background:var(--soft);border-radius:12px;padding:12px;margin-top:14px;font-size:16px;min-height:48px;text-align:center}
.scorebig{font-size:44px;font-weight:800;text-align:center;margin:8px 0}

/* reading / kaiwa */
.sent-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:20px;margin-bottom:14px}
.sent-jp{font-size:22px;font-weight:700;line-height:1.6;letter-spacing:.5px}
.sent-vi{font-size:15px;color:var(--sub);margin-top:8px;line-height:1.5}
.sent-word{font-size:13px;color:var(--brand);margin-top:6px;font-weight:600}
.sent-controls{display:flex;gap:10px;margin-top:12px;align-items:center}
.sent-controls .speaker{margin:0;width:44px;height:44px;font-size:20px}
.speed-btn{background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;
  font-size:13px;font-weight:600;color:var(--brand);cursor:pointer}
.speed-btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}

.kaiwa-bubble{border-radius:16px;padding:14px 16px;margin-bottom:10px;max-width:85%;position:relative;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kaiwa-bubble.left{background:#eff6ff;border:1px solid #bfdbfe;align-self:flex-start;border-bottom-left-radius:4px}
.kaiwa-bubble.right{background:#f0fdf4;border:1px solid #bbf7d0;align-self:flex-end;border-bottom-right-radius:4px}
.kaiwa-role{font-size:11px;font-weight:700;margin-bottom:4px}
.kaiwa-bubble.left .kaiwa-role{color:var(--brand)}
.kaiwa-bubble.right .kaiwa-role{color:var(--accent)}
.kaiwa-text{font-size:18px;font-weight:600;line-height:1.6}
.kaiwa-vi{font-size:13px;color:var(--sub);margin-top:4px}
.kaiwa-container{display:flex;flex-direction:column;gap:4px}
.kaiwa-highlight{background:rgba(37,99,235,.12);border-radius:4px;padding:0 2px}

.mic-sm{width:40px;height:40px;border-radius:50%;border:none;background:var(--brand);color:#fff;
  font-size:18px;cursor:pointer;flex-shrink:0}
.mic-sm.rec{background:var(--bad);animation:pulse 1.2s infinite}

/* toast / feedback */
.fb{text-align:center;font-size:16px;font-weight:700;margin-top:14px;min-height:24px}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.note{font-size:12.5px;color:var(--sub);background:#f0f7ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px 12px;margin-top:14px;line-height:1.6}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:52px} .done h2{margin:10px 0 6px}

/* mic permission banner */
.mic-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:12px;padding:12px 14px;margin-bottom:14px;
  font-size:13px;color:#856404;line-height:1.5}
.mic-banner button{background:#ffc107;border:none;border-radius:8px;padding:8px 14px;font-size:13px;
  font-weight:700;color:#856404;cursor:pointer;margin-top:8px}

footer{text-align:center;font-size:11px;color:var(--sub);padding:14px}

/* settings */
.settings-btn{background:#d6e1fa;border:none;color:#1e40af;border-radius:10px;
  padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;
  white-space:nowrap;flex-shrink:0}
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.settings-panel{background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:560px;
  max-height:85vh;overflow-y:auto;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.settings-panel h3{margin:0 0 16px;font-size:17px}
.settings-panel label{font-size:13px;font-weight:600;color:var(--sub);display:block;margin-bottom:4px}
.settings-panel select{width:100%;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:10px;font-size:14px;margin-bottom:14px;background:var(--bg)}
.settings-panel .hint{font-size:11px;color:var(--sub);margin:-10px 0 14px;line-height:1.4}
.tts-status{font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:14px}
.tts-ok{background:#dcfce7;color:#166534}
.tts-no{background:var(--soft);color:var(--sub)}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.slider-row input[type=range]{flex:1;height:6px}
.slider-row .slider-val{min-width:36px;text-align:center;font-weight:700;font-size:14px;color:var(--brand)}
.gender-btns{display:flex;gap:8px;margin-bottom:14px}
.gender-btn{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;
  font-weight:600;cursor:pointer;text-align:center;background:var(--bg);color:var(--sub)}
.gender-btn.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

/* topic selection */
.topics{display:flex;flex-direction:column;gap:12px}
.topic-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px 16px;
  cursor:pointer;box-shadow:var(--shadow);transition:.15s;display:flex;align-items:center;gap:14px;position:relative}
.topic-card:active{transform:scale(.98)}
.topic-card .tc-icon{font-size:32px;min-width:42px;text-align:center}
.topic-card .tc-body{flex:1}
.topic-card .tc-title{font-size:16px;font-weight:700}
.topic-card .tc-sub{font-size:12.5px;color:var(--sub);margin-top:2px}
.topic-card .tc-badge{position:absolute;top:10px;right:12px;font-size:10px;font-weight:700;border-radius:99px;padding:3px 10px}
.topic-card.active .tc-badge{background:#dcfce7;color:#166534}
.topic-card.soon{opacity:.65;cursor:default}
.topic-card.soon:active{transform:none}
.topic-card.soon .tc-badge{background:var(--soft);color:var(--sub)}

/* IT業務編 — audio player + transcript */
.player-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:22px 20px;text-align:center;margin-bottom:14px}
.play-btn{background:var(--brand);border:none;border-radius:50%;width:72px;height:72px;font-size:28px;color:#fff;
  cursor:pointer;box-shadow:0 6px 20px rgba(37,99,235,.3);transition:.12s;margin-top:14px}
.play-btn:active{transform:scale(.93)}
.progress-row{display:flex;align-items:center;gap:8px;margin-top:16px}
.progress-row input[type=range]{flex:1;height:6px}
.progress-row .ptime{font-size:11.5px;color:var(--sub);min-width:34px}
.player-controls{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.transcript-panel{background:var(--soft);border-radius:12px;padding:14px;margin-top:10px;text-align:left;
  max-height:320px;overflow-y:auto}
.transcript-line{font-size:14.5px;line-height:1.8;margin-bottom:6px}
.transcript-line b{color:var(--brand)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <button class="backbtn hidden" id="backBtn">← 戻る</button>
      <div>
        <h1 id="hTitle">ココロ日本語</h1>
        <div class="sub" id="hSub">Kokoro Nihongo · <span id="hCount">596</span> từ</div>
      </div>
      <button class="settings-btn" id="settingsBtn" title="Cài đặt">⚙️ 設定</button>
    </div>
  </header>
  <main id="main"></main>
  <footer>Kokoro Nihongo v2.0 · 2026-07-18 · Dữ liệu từ 日本語の辞書.xlsx</footer>
</div>

<script>

にしても", "r": "いずれにしても", "vi": "Dù thế nào đi nữa", "en": "In any case / Either way", "ex": "いずれにしても、非常に見難しい画面ではなく、しかしながら　最小の工数に対応していただけばいいと思います。", "c": "その他"}, {"id": 87, "w": "しかしながら", "r": "しかしながら", "vi": "Tuy nhiên, nhưng mà", "en": "However / Nevertheless", "ex": "システムは完成しました。しかしながら、いくつかの不具合が残っています。", "c": "その他"}, {"id": 88, "w": "負数", "r": "ふすう", "vi": "Số âm", "en": "Negative number", "ex": "在庫に負数になるのは異常ですよ。", "c": "漢字"}, {"id": 89, "w": "放置", "r": "ほうち", "vi": "Bỏ mặc, để nguyên", "en": "Neglect / Leave as is", "ex": "その問い合わせは放置せず、すぐに対応してください。", "c": "漢字"}, {"id": 90, "w": "見落とす", "r": "みおとす", "vi": "Bỏ sót, không để ý", "en": "Overlook / Miss", "ex": "ヘッダー部分見落としておりました。申し訳ありませんが、ヘッダーのロケーションを使用するようにしてください。", "c": "漢字"}, {"id": 91, "w": "帳票", "r": "ちょうひょう", "vi": "Chứng từ, mẫu biểu in", "en": "Form / Report (printed)", "ex": "帳票の出力内容を確認してください。", "c": "漢字"}, {"id": 92, "w": "共有", "r": "きょうゆう", "vi": "Chia sẻ", "en": "Share", "ex": "ファイルを共有してください。", "c": "漢字"}, {"id": 93, "w": "共通", "r": "きょうつう", "vi": "Chung, dùng chung", "en": "Common / Shared", "ex": "共通の機能は一か所に集約してください。", "c": "漢字"}, {"id": 94, "w": "共同", "r": "きょうどう", "vi": "Hợp tác, cùng nhau", "en": "Joint / Collaborative", "ex": "共同で開発を進めましょう。", "c": "漢字"}, {"id": 95, "w": "一覧", "r": "いちらん", "vi": "Danh sách, bảng liệt kê", "en": "List / Overview", "ex": "顧客一覧画面を表示してください。", "c": "漢字"}, {"id": 96, "w": "監査", "r": "かんさ", "vi": "Kiểm toán, kiểm tra", "en": "Audit", "ex": "システムログを使って監査を行います。", "c": "漢字"}, {"id": 97, "w": "列", "r": "れつ", "vi": "Cột (column)", "en": "Column", "ex": "1～6行目は取込不要の行である。", "c": "漢字"}, {"id": 98, "w": "セット", "r": "セット", "vi": "Bộ, tập hợp, thiết lập", "en": "Set", "ex": "必要なデータをセットしてから処理を実行してください。", "c": "外来語"}, {"id": 99, "w": "挿入", "r": "そうにゅう", "vi": "Chèn vào", "en": "Insert", "ex": "新しい行を挿入してください。", "c": "漢字"}, {"id": 100, "w": "レコード", "r": "レコード", "vi": "Bản ghi (record trong database)", "en": "Record", "ex": "このレコードは既に削除されています。", "c": "外来語"}, {"id": 101, "w": "フロート表示", "r": "フロートひょうじ", "vi": "Hiển thị nổi (float display)", "en": "Float display", "ex": "ボタンのフロート表示が崩れています。", "c": "漢字"}, {"id": 102, "w": "タイト", "r": "タイト", "vi": "Chặt chẽ, gấp rút (về thời gian)", "en": "Tight", "ex": "納期はタイトと言うこともあります。", "c": "外来語"}, {"id": 103, "w": "そもそも", "r": "そもそも", "vi": "Vốn dĩ, ngay từ đầu", "en": "In the first place / To begin with", "ex": "そもそも実現不可能なデザインを提案するのが問題です。", "c": "その他"}, {"id": 104, "w": "明細", "r": "めいさい", "vi": "Chi tiết (invoice/report detail)", "en": "Details / Breakdown", "ex": "明細をご確認ください。", "c": "漢字"}, {"id": 105, "w": "直後", "r": "ちょくご", "vi": "Ngay sau đó", "en": "Immediately after", "ex": "処理完了の直後にメッセージを表示します。", "c": "漢字"}, {"id": 106, "w": "定例会", "r": "ていれいかい", "vi": "Cuộc họp định kỳ", "en": "Regular meeting", "ex": "本日の定例会を無しにしますね", "c": "漢字"}, {"id": 107, "w": "議事録", "r": "ぎじろく", "vi": "Biên bản cuộc họp", "en": "Meeting minutes", "ex": "議事録を作成して共有してください。", "c": "漢字"}, {"id": 108, "w": "要求", "r": "ようきゅう", "vi": "Yêu cầu", "en": "Request / Requirement", "ex": "昨日リクエストしましたが、アクセス権をください.", "c": "漢字"}, {"id": 109, "w": "把握", "r": "はあく", "vi": "Nắm bắt, hiểu rõ", "en": "Grasp / Understand", "ex": "検品のみに使用する場合は金額の把握が必要ないので、金額なしを送る場合もある。", "c": "漢字"}, {"id": 110, "w": "言及", "r": "げんきゅう", "vi": "Đề cập đến", "en": "Mention / Refer to", "ex": "昨日の内部打合せで出庫予定入力の必須入力がどの項目であるかという事は言及していないです。", "c": "漢字"}, {"id": 111, "w": "ステータス", "r": "ステータス", "vi": "Trạng thái", "en": "Status", "ex": "項目のステータスは「未」=未出庫", "c": "外来語"}, {"id": 112, "w": "アクティブステータス", "r": "アクティブステータス", "vi": "Trạng thái hoạt động", "en": "Active status", "ex": "アクティブステータスのユーザーのみ表示してください。", "c": "外来語"}, {"id": 113, "w": "非アクティブ化", "r": "ひアクティブか", "vi": "Vô hiệu hóa, tắt kích hoạt", "en": "Deactivate / Disable", "ex": "このアカウントは非アクティブ化されています。", "c": "漢字"}, {"id": 114, "w": "構築", "r": "こうちく", "vi": "Xây dựng, thiết lập", "en": "Build / Construct", "ex": "データベース構築を担当します。", "c": "漢字"}, {"id": 115, "w": "稟議", "r": "りんぎ", "vi": "Phê duyệt nội bộ (quy trình phê duyệt Nhật)", "en": "Internal approval process", "ex": "稟議書を作成して、上長に提出してください。", "c": "漢字"}, {"id": 116, "w": "稼働", "r": "かどう", "vi": "Vận hành, hoạt động (hệ thống/thiết bị)", "en": "In operation / Running", "ex": "稼働開始はいつになりますか？", "c": "漢字"}, {"id": 117, "w": "後回し", "r": "あとまわし", "vi": "Để sau, hoãn lại", "en": "Postpone / Put off", "ex": "帳票を後回しするなどのお願いしている第2フェーズのスケジュールですが、", "c": "漢字"}, {"id": 118, "w": "フィードバック", "r": "フィードバック", "vi": "Phản hồi", "en": "Feedback", "ex": "フィードバックをいただけますか。", "c": "外来語"}, {"id": 119, "w": "事前に", "r": "じぜんに", "vi": "Trước đó, trước khi xảy ra", "en": "In advance / Beforehand", "ex": "事前にご確認いただけますでしょうか。", "c": "漢字"}, {"id": 120, "w": "予め", "r": "あらかじめ", "vi": "Trước, chuẩn bị sẵn", "en": "In advance / Beforehand", "ex": "最初からY700032(親) があらかじめ作成してないのです。", "c": "漢字"}, {"id": 121, "w": "ゆえに", "r": "ゆえに", "vi": "Vì vậy, do đó", "en": "Therefore / Hence", "ex": "データが不足していた。ゆえに、処理が失敗しました。", "c": "その他"}, {"id": 122, "w": "フェーズ", "r": "フェーズ", "vi": "Giai đoạn, phase", "en": "Phase", "ex": "フェーズ3の作業を開始します。", "c": "外来語"}, {"id": 123, "w": "権限", "r": "けんげん", "vi": "Quyền hạn, phân quyền", "en": "Authority / Permission", "ex": "このユーザーには権限がありません。", "c": "漢字"}, {"id": 124, "w": "付与", "r": "ふよ", "vi": "Cấp phát, trao quyền", "en": "Grant / Assign", "ex": "権限を付与する。", "c": "漢字"}, {"id": 125, "w": "引き続き", "r": "ひきつづき", "vi": "Tiếp tục", "en": "Continue / Thereafter", "ex": "引き続き宜しくお願い申し上げます。", "c": "漢字"}, {"id": 126, "w": "（が）見当たらない", "r": "みあたらない", "vi": "Không tìm thấy, không thấy đâu", "en": "Cannot be found", "ex": "第二フェーズのスケジュールを確認していたのですが、請求書に軽減税率のマークや注意文言を追加する件が  見当たりませんでした。", "c": "漢字"}, {"id": 127, "w": "懸念点", "r": "けねんてん", "vi": "Điểm đáng lo ngại, mối lo", "en": "Point of concern", "ex": "何か懸念点がありましたか？", "c": "漢字"}, {"id": 128, "w": "気付く", "r": "きづく", "vi": "Nhận ra, chú ý", "en": "Notice / Realize", "ex": "気付けないこともありますので、気になることがある場合言っていただけるとありがたいです。", "c": "漢字"}, {"id": 129, "w": "既に", "r": "すでに", "vi": "Đã, rồi (already)", "en": "Already", "ex": "帳票はすでに修正が完了している分は後回しにしようと思っていたので、対応状況の確認をしようと思ってました。", "c": "漢字"}, {"id": 130, "w": "ホバー", "r": "ホバー", "vi": "Di chuột qua (hover)", "en": "Hover", "ex": "ボタンにホバーすると色が変わります。", "c": "外来語"}, {"id": 131, "w": "引継（する）", "r": "ひきつぎ", "vi": "Bàn giao công việc", "en": "Handover", "ex": "前の担当者が本件についてちゃんと引継してもらいましたか。", "c": "漢字"}, {"id": 132, "w": "継承", "r": "けいしょう", "vi": "Kế thừa (OOP)", "en": "Inherit / Succession", "ex": "親クラスと言うのは　継承する基のクラスということです。", "c": "漢字"}, {"id": 133, "w": "本番運用開始", "r": "ほんばんうんようかいし", "vi": "Bắt đầu vận hành thực tế (go-live)", "en": "Go-live / Production launch", "ex": "本番運用開始の時期が変更になったので", "c": "漢字"}, {"id": 134, "w": "当面", "r": "とうめん", "vi": "Hiện tại, trong thời gian tới", "en": "For the time being", "ex": "当面はこの方法で対応します。", "c": "漢字"}, {"id": 135, "w": "いつのまにか", "r": "いつのまにか", "vi": "Tự lúc nào, không biết từ khi nào", "en": "Before one knows it", "ex": "何度か登録しているがいつのまにか消えてる", "c": "その他"}, {"id": 136, "w": "バックスラッシュ", "r": "バックスラッシュ", "vi": "Dấu gạch chéo ngược ( \\ )", "en": "Backslash", "ex": "テスト環境で、出荷先、仕入先の住所の移行とバックスラッシュの対応が完了していることを確認しました", "c": "外来語"}, {"id": 137, "w": "レスポンシブ", "r": "レスポンシブ", "vi": "Thiết kế responsive (đáp ứng)", "en": "Responsive", "ex": "レスポンシブデザインに対応してください。", "c": "外来語"}, {"id": 138, "w": "ローカル", "r": "ローカル", "vi": "Cục bộ, máy cục bộ (local)", "en": "Local", "ex": "ローカルのデータベースの名前が Yajima になっています。", "c": "外来語"}, {"id": 139, "w": "プルダウン", "r": "プルダウン", "vi": "Danh sách thả xuống (dropdown)", "en": "Pulldown / Dropdown", "ex": "在庫画面では倉庫もプルダウンリストで表示するようにしてください。", "c": "外来語"}, {"id": 140, "w": "鍵", "r": "かぎ", "vi": "Khóa, key", "en": "Key / Lock", "ex": "このデータのプライマリキーを確認してください。", "c": "漢字"}, {"id": 141, "w": "用意", "r": "ようい", "vi": "Chuẩn bị", "en": "Prepare / Ready", "ex": "テスト環境を用意してください。", "c": "漢字"}, {"id": 142, "w": "そのうえで", "r": "そのうえで", "vi": "Ngoài ra, hơn nữa, sau đó", "en": "Furthermore / On top of that", "ex": "仕様を確認した。そのうえで、実装を進めます。", "c": "その他"}, {"id": 143, "w": "差異", "r": "さい", "vi": "Sự khác biệt, chênh lệch", "en": "Difference / Discrepancy", "ex": "先週の木曜日の週報告会の後に、エムティ様から差異リストと担当者の事業所の件について", "c": "漢字"}, {"id": 144, "w": "違いがない", "r": "ちがいがない", "vi": "Không có sự khác biệt", "en": "No difference", "ex": "現行システムと比べて違いが無いかご確認ください。", "c": "漢字"}, {"id": 145, "w": "沿う", "r": "そう", "vi": "Tuân theo, theo", "en": "Follow / Along", "ex": "業務履歴の条件指定画面とソート順ポップアップはデザインで一度見せていただいておりますが、その内容に沿っているという確認で良いでしょうか？", "c": "漢字"}, {"id": 146, "w": "補完", "r": "ほかん", "vi": "Bổ sung, tự động điền", "en": "Complement / Autocomplete", "ex": "仕入先の補完作業", "c": "漢字"}, {"id": 147, "w": "補足", "r": "ほそく", "vi": "Bổ sung thông tin, chú thích", "en": "Supplement / Note", "ex": "一部分かり難い部分について資料に補足してエムティ様に説明します。補足を記入した資料を共有致します。", "c": "漢字"}, {"id": 148, "w": "ソースコード", "r": "ソースコード", "vi": "Mã nguồn", "en": "Source code", "ex": "ソースコードをGitにコミットしてください。", "c": "外来語"}, {"id": 149, "w": "バリデーション", "r": "バリデーション", "vi": "Kiểm tra tính hợp lệ (validation)", "en": "Validation", "ex": "入力バリデーションを実装してください。", "c": "外来語"}, {"id": 150, "w": "比較", "r": "ひかく", "vi": "So sánh", "en": "Compare", "ex": "現行システムと新システムを比較してください。", "c": "漢字"}, {"id": 151, "w": "頻繫（な）", "r": "ひんぱん", "vi": "Thường xuyên, liên tục", "en": "Frequent", "ex": "アプリが頻繁に落ちる。", "c": "漢字"}, {"id": 152, "w": "夢中", "r": "むちゅう", "vi": "Đam mê, say mê, mải miết", "en": "Absorbed / Enthusiastic", "ex": "昨夜夢中になるとつい声が大きくなってしまってすみませんでした。", "c": "漢字"}, {"id": 153, "w": "矛盾", "r": "むじゅん", "vi": "Mâu thuẫn", "en": "Contradiction", "ex": "開発チームの説明に矛盾があると思います。", "c": "漢字"}, {"id": 154, "w": "追記", "r": "ついき", "vi": "Ghi thêm, bổ sung vào tài liệu", "en": "Additional note / Append", "ex": "仕様書に追記しておきます。", "c": "漢字"}, {"id": 155, "w": "締め切り", "r": "しめきり", "vi": "Hạn chót, deadline", "en": "Deadline", "ex": "締め切りはいつですか。", "c": "漢字"}, {"id": 156, "w": "伸びる", "r": "のびる", "vi": "Kéo dài thêm", "en": "Extend / Be prolonged", "ex": "サーバーのメンテナンス時間が予定より伸びました。", "c": "漢字"}, {"id": 157, "w": "目視", "r": "もくし", "vi": "Kiểm tra bằng mắt", "en": "Visual inspection", "ex": "全項目の確認を日本側で行う場合、画面とデータを見比べる目視しか方法が無いです。", "c": "漢字"}, {"id": 158, "w": "エビデンス", "r": "エビデンス", "vi": "Bằng chứng, evidence", "en": "Evidence", "ex": "エムティ様からエビデンスとしてもらった業務履歴で", "c": "外来語"}, {"id": 159, "w": "空欄", "r": "くうらん", "vi": "Ô trống, để trống", "en": "Blank / Empty field", "ex": "空欄で移行する", "c": "漢字"}, {"id": 160, "w": "アンダーバー", "r": "アンダーバー", "vi": "Dấu gạch dưới ( _ )", "en": "Underscore", "ex": "アンダーバーが入ってる", "c": "外来語"}, {"id": 161, "w": "人✙に✙連絡を取る", "r": "れんらくをとる", "vi": "Liên lạc với ai đó", "en": "Contact / Get in touch", "ex": "また、明日8:00～(JP)から本番環境で稼働予定ですが、トラブルがあった場合開発チームに連絡取れますか？", "c": "漢字"}, {"id": 162, "w": "基礎", "r": "きそ", "vi": "Cơ bản, nền tảng", "en": "Foundation / Basics", "ex": "プログラミングの基礎から学びます。", "c": "漢字"}, {"id": 163, "w": "半導体", "r": "はんどうたい", "vi": "Chất bán dẫn", "en": "Semiconductor", "ex": "半導体不足が生産に影響しています。", "c": "漢字"}, {"id": 164, "w": "適用", "r": "てきよう", "vi": "Áp dụng", "en": "Apply", "ex": "本日の適用内容を確認してください。", "c": "漢字"}, {"id": 165, "w": "おごる", "r": "おごる", "vi": "Đãi (ăn uống), chiêu đãi", "en": "Treat someone to a meal", "ex": "今日、昼ご飯をおごります。", "c": "その他"}, {"id": 166, "w": "桁数", "r": "けたすう", "vi": "Số chữ số, số ký tự", "en": "Number of digits", "ex": "従業員マスターの主キーのデータ桁数を一つ増やすんだそうです。", "c": "漢字"}, {"id": 167, "w": "主キー", "r": "しゅキー", "vi": "Khóa chính (Primary Key)", "en": "Primary key", "ex": "主キーの設定を確認してください。", "c": "漢字"}, {"id": 168, "w": "違和感", "r": "いわかん", "vi": "Cảm giác kỳ lạ, không tự nhiên", "en": "Feeling of incongruity", "ex": "デザインに違和感があります。", "c": "漢字"}, {"id": 169, "w": "強制", "r": "きょうせい", "vi": "Bắt buộc, cưỡng bức", "en": "Force / Compulsory", "ex": "OKボタンをクリックすると　強制ポップアップか確認ポップアップで良いでしょうか。", "c": "漢字"}, {"id": 170, "w": "検知", "r": "けんち", "vi": "Phát hiện, phát hiện lỗi", "en": "Detect", "ex": "エラーを検知した場合はアラートを表示してください。", "c": "漢字"}, {"id": 171, "w": "五月雨", "r": "さみだれ", "vi": "Phát hành từng phần, rải rác", "en": "Staggered release", "ex": "開発される際、五月雨で実装・デプロイしても問題がないと思います。", "c": "漢字"}, {"id": 172, "w": "フリーワード", "r": "フリーワ 他の人に助けてもらった経験がありますか。その時のことを教えてください。", "c": "漢字"}, {"id": 454, "w": "聴解/聞き取り", "r": "ちょうかい/ききとり", "vi": "Nghe hiểu", "en": "Listening comprehension", "ex": "日本語の聞き取り力を上げたいですので、毎日のリスニングを練習しています。", "c": "漢字"}, {"id": 455, "w": "確実", "r": "かくじつ", "vi": "Chắc chắn, đảm bảo", "en": "Certain / Reliable", "ex": "お客様の工場での作業は、お客様のサーバーにSQLを追加することから始まるため、その手順を確実なものにしておく必要があると考えております。", "c": "漢字"}, {"id": 456, "w": "所有", "r": "しょゆう", "vi": "Sở hữu", "en": "Own / Possess", "ex": "お客様は支店を沢山所有しているので、調整が必要なため　リリース日は現在、未定の状態です。", "c": "漢字"}, {"id": 457, "w": "漏れる", "r": "もれる", "vi": "Rò rỉ, bị bỏ sót", "en": "Leak / Be omitted", "ex": "データが漏れないように確認してください。", "c": "漢字"}, {"id": 458, "w": "需要", "r": "じゅよう", "vi": "Nhu cầu", "en": "Demand", "ex": "IT分野の市場の需要が高まっていると言われていますね。", "c": "漢字"}, {"id": 459, "w": "手配", "r": "てはい", "vi": "Sắp xếp, chuẩn bị", "en": "Arrange / Prepare", "ex": "日本の出張のために　ホテルと飛行機のチケットを手配してください。", "c": "漢字"}, {"id": 460, "w": "オークション", "r": "オークション", "vi": "Đấu giá", "en": "Auction", "ex": "オークションサイトで購入しました。", "c": "外来語"}, {"id": 461, "w": "網羅", "r": "もうら", "vi": "Bao phủ toàn bộ, cover đầy đủ", "en": "Cover all / Comprehensive", "ex": "開発の際に　例外処理が発生することがありますので、すべてのケースをカバーできない可能性が高いです。", "c": "漢字"}, {"id": 462, "w": "用いる", "r": "もちいる", "vi": "Sử dụng, dùng", "en": "Use / Employ", "ex": "Figmaを用いたUIデザインが出来る方、大歓迎です。", "c": "漢字"}, {"id": 463, "w": "機種", "r": "きしゅ", "vi": "Kiểu máy, model thiết bị", "en": "Model / Type of device", "ex": "入庫する設備の機種を選定しております。", "c": "漢字"}, {"id": 464, "w": "棚卸", "r": "たなおろし", "vi": "Kiểm kho", "en": "Inventory check", "ex": "QRコードを読み込んで、棚卸情報を登録してください。", "c": "漢字"}, {"id": 465, "w": "消費", "r": "しょうひ", "vi": "Tiêu thụ", "en": "Consume", "ex": "メモリの消費量を確認してください。", "c": "漢字"}, {"id": 466, "w": "見込む", "r": "みこむ", "vi": "Dự kiến, ước tính", "en": "Anticipate / Estimate", "ex": "単価の取得が誤りがあるので、修正にかかる工数は0.5人日を見込んでおります。", "c": "漢字"}, {"id": 467, "w": "成果物", "r": "せいかぶつ", "vi": "Sản phẩm đầu ra, deliverable", "en": "Deliverable / Output", "ex": "成果物の : "漢字"}, {"id": 482, "w": "月次", "r": "つきじ", "vi": "Hàng tháng", "en": "Monthly", "ex": "月次レポートを作成してください。", "c": "漢字"}, {"id": 483, "w": "次月", "r": "じげつ", "vi": "Tháng sau", "en": "Next month", "ex": "次月のスケジュールをご確認ください。不明点があれば、お問い合わせください。", "c": "漢字"}, {"id": 484, "w": "絞込", "r": "しぼりこみ", "vi": "Lọc, thu hẹp (tìm kiếm)", "en": "Filter / Narrow", "ex": "材料マスタから材料購入先を絞り込み、且つ　材料マスタの購入可能である事", "c": "漢字"}, {"id": 485, "w": "取り掛かる", "r": "とりかかる", "vi": "Bắt tay vào, bắt đầu làm", "en": "Start on / Begin", "ex": "このデザインにおける（trong) 主な意図は　見ただけで　取り掛からなければならない材料を判断できることです。", "c": "漢字"}, {"id": 486, "w": "マス", "r": "マス", "vi": "Ô (cell/square)", "en": "Cell / Square", "ex": "このマスに上のマス　＋　下のマスの結果を表示する", "c": "外来語"}, {"id": 487, "w": "余る", "r": "あまる", "vi": "Thừa ra", "en": "Surplus / Be left over", "ex": "情報量がそんなに多くなくて　領域が余りそうので　許す限り　大きくしてほしいです。", "c": "漢字"}, {"id": 488, "w": "欲張る", "r": "よくばる", "vi": "Tham lam, đòi nhiều", "en": "Be greedy", "ex": "あれもこれも欲しがるなて、ちょっと欲張りすぎだよ。", "c": "漢字"}, {"id": 489, "w": "刻印", "r": "こくいん", "vi": "Dấu in, ký hiệu in", "en": "Stamp / Marking", "ex": "透明の袋にある刻印は　OCRで読み取れない と判断しています。", "c": "漢字"}, {"id": 490, "w": "透明", "r": "とうめい", "vi": "Trong suốt", "en": "Transparent", "ex": "透明のラベルを使用してください。", "c": "漢字"}, {"id": 491, "w": "関数", "r": "かんすう", "vi": "Hàm (function)", "en": "Function", "ex": "JavaScriptからBlazorの画面遷移に使う変数を呼び出して、試してみてください。", "c": "漢字"}, {"id": 492, "w": "コール", "r": "コール", "vi": "Gọi hàm (call), cuộc gọi", "en": "Call", "ex": "この関数をコールしてください。", "c": "外来語"}, {"id": 493, "w": "妥当", "r": "だとう", "vi": "Hợp lý, xác đáng", "en": "Reasonable / Appropriate", "ex": "ご共有いただいた見積もりについて　こちらで対応した各画面の工数を比較した結果、金額が妥当であると考えております。", "c": "漢字"}, {"id": 494, "w": "見解", "r": "けんかい", "vi": "Quan điểm, ý kiến", "en": "Opinion / View", "ex": "わたくし個人の見解としては　金額が高いとは思いません。", "c": "漢字"}, {"id": 495, "w": "見送り", "r": "みおくり", "vi": "Tiễn đưa / Hoãn lại", "en": "See off / Postpone", "ex": "①　友達を空港まで見送りに行くんだ。", "c": "漢字"}, {"id": 496, "w": "デベロッパー", "r": "デベロッパー", "vi": "Nhà phát triển, developer", "en": "Developer", "ex": "初回起動時に「このアプリは最新のバージョンに対応していません。アップデートを更新するか、デベロッパーにお問い合わせください。」と言うメッセージが出力されません。", "c": "外来語"}, {"id": 497, "w": "削減", "r": "さくげん", "vi": "Cắt giảm, giảm", "en": "Reduce / Cut", "ex": "工数を削減するために、Delphiによる画面設計を先に行ってください。", "c": "漢字"}, {"id": 498, "w": "特化", "r": "とっか", "vi": "Chuyên biệt hóa, tập trung vào", "en": "Specialize", "ex": "このシステムはタスク管理とバグ対応に特化して利用しています。", "c": "漢字"}, {"id": 499, "w": "放念", "r": "ほうねん", "vi": "Cho qua, không cần bận tâm", "en": "Disregard / No need to worry", "ex": "本件につきまして　ご放念ください。", "c": "漢字"}, {"id": 500, "w": "防止", "r": "ぼうし", "vi": "Ngăn chặn, phòng ngừa", "en": "Prevention", "ex": "二重登録の防止のため、LOTNOの重複チェックを行います。", "c": "漢字"}, {"id": 501, "w": "継続", "r": "けいぞく", "vi": "Tiếp tục", "en": "Continue", "ex": "プロジェクトを成功に導くために、顧客とスムーズにコミニケションし継続な改善も必要だと思っています。", "c": "漢字"}, {"id": 502, "w": "サイクル", "r": "サイクル", "vi": "Chu kỳ", "en": "Cycle", "ex": "アジャイル開発モデルはプロジェクトを短いサイクルに分けて進めます。", "c": "外来語"}, {"id": 503, "w": "関与", "r": "かんよ", "vi": "Tham gia, liên quan", "en": "Involvement", "ex": "ウォーターフォール開発モデルについて顧客の関与は最初と最後だけで、開発中に基本的に関与しない。", "c": "漢字"}, {"id": 504, "w": "ベンダー", "r": "ベンダー", "vi": "Nhà cung cấp (vendor)", "en": "Vendor", "ex": "ベンダーから見積もりをもらいました。", "c": "外来語"}, {"id": 505, "w": "拠点", "r": "きょてん", "vi": "Cơ sở, điểm hoạt động", "en": "Base / Location", "ex": "新しい拠点を設けます。", "c": "漢字"}, {"id": 506, "w": "収める", "r": "おさめる", "vi": "Thu vào, lọt vào", "en": "Contain / Fit in", "ex": "ルール2：表示領域内に収める場合は一定の間隔で並べること。", "c": "漢字"}, {"id": 507, "w": "切り替え", "r": "きりかえ", "vi": "Chuyển đổi", "en": "Switch / Toggle", "ex": "画面項目状態の切替について下記の通りに進めてください。", "c": "漢字"}, {"id": 508, "w": "トランザクション", "r": "トランザクション", "vi": "Giao dịch (transaction)", "en": "Transaction", "ex": "トランザクション開始.", "c": "外来語"}, {"id": 509, "w": "排他", "r": "はいた", "vi": "Độc quyền, loại trừ lẫn nhau", "en": "Exclusive / Mutual exclusion", "ex": "排他制御", "c": "漢字"}, {"id": 510, "w": "干渉", "r": "かんしょう", "vi": "Can thiệp, giao thoa", "en": "Interference", "ex": "詳細計画初期値干渉のチェックボックス", "c": "漢字"}, {"id": 511, "w": "別件", "r": "べっけん", "vi": "Việc khác, vấn đề riêng biệt", "en": "Separate matter", "ex": "只今、別件で時間を取られていて、まだ対応できておりません。申し訳ございません。", "c": "漢字"}, {"id": 512, "w": "口頭", "r": "こうとう", "vi": "Bằng miệng, bằng lời", "en": "Verbal / Oral", "ex": "口頭で問題なければ、明日の打ち合わせで簡単に説明いたします。", "c": "漢字"}, {"id": 513, "w": "文言", "r": "もんごん", "vi": "Nội dung văn bản, từ ngữ", "en": "Wording / Text", "ex": "エラーメッセージの文言を修正してください。", "c": "漢字"}, {"id": 514, "w": "注意書き", "r": "ちゅういがき", "vi": "Chú thích, lưu ý", "en": "Note / Caution", "ex": "その部分の注意書きであることが分かるようにして頂くことが可能でしょうか。", "c": "漢字"}, {"id": 515, "w": "四捨五入", "r": "ししゃごにゅう", "vi": "Làm tròn (round)", "en": "Rounding", "ex": "小数点以下は四捨五入してください。", "c": "漢字"}, {"id": 516, "w": "追随", "r": "ついずい", "vi": "Theo sau, bắt kịp", "en": "Follow / Keep up with", "ex": "2. ユーザーが　ｍｍ単位の部分を横スクロールさせた場合、kg単位の部分を追随して横スクロールさせる。", "c": "漢字"}, {"id": 517, "w": "吸着", "r": "きゅうちゃく", "vi": "Hấp thụ, dính vào", "en": "Adsorption / Adhesion", "ex": "吸着した部品を取り外してください。", "c": "漢字"}, {"id": 518, "w": "疑念", "r": "ぎねん", "vi": "Nghi ngờ, hoài nghi", "en": "Suspicion / Doubt", "ex": "疑念を抱いています。", "c": "漢字"}, {"id": 519, "w": "選択肢", "r": "せんたくし", "vi": "Lựa chọn, phương án", "en": "Option / Choice", "ex": "ExcelをPDFに交換して再アップロードするという人力での対応は選択肢の一つと考えています。", "c": "漢字"}, {"id": 520, "w": "人力", "r": "じんりき", "vi": "Bằng tay người (manual)", "en": "Manual / Human-powered", "ex": "人力での対応は時間がかかります。", "c": "漢字"}, {"id": 521, "w": "ベース（に）", "r": "ベース", "vi": "Dựa trên, lấy làm nền", "en": "Based on", "ex": "まずはご提案頂いた方法をベースに検討して進めて頂けばと思います。", "c": "その他"}, {"id": 522, "w": "ソフトウェアキーボード", "r": "ソフトウェアキーボード", "vi": "Bàn phím ảo (trên màn hình cảm ứng)", "en": "Software keyboard", "ex": "ログインに失敗した場合のメッセージがソフトウェアキーボードに隠れて、見えない。", "c": "外来語"}, {"id": 523, "w": "兼ねる", "r": "かねる", "vi": "Kiêm, đảm nhiệm nhiều vai trò", "en": "Also serve as / Can't (V+かねる)", "ex": "2. V bỏ ます+かねる＝Vできない：許しかねる", "c": "漢字"}, {"id": 524, "w": "高度", "r": "こうど", "vi": "Nâng cao, cao cấp", "en": "Advanced / Sophisticated", "ex": "高度な情報のチックボックスにチェックを入れたら「重量」項目を表示する。", "c": "漢字"}, {"id": 525, "w": "喚起", "r": "かんき", "vi": "Kêu gọi sự chú ý, cảnh báo", "en": "Call attention to / Alert", "ex": "指定材料（他で流用しないように注意喚起するため）を材料マスタに登録して表示される。", "c": "漢字"}, {"id": 526, "w": "仕掛", "r": "しかけ", "vi": "Đang xử lý, bán thành phẩm (WIP)", "en": "In-progress / Work in process", "ex": "仕掛中のデータなので、ハンディアプリで数量を修正できなくなります。", "c": "漢字"}, {"id": 527, "w": "フリーズ（する）", "r": "フリーズ", "vi": "Đóng băng, treo máy", "en": "Freeze", "ex": "作業実績はデータを登録できず、画面もリリーズしてしまう。", "c": "その他"}, {"id": 528, "w": "踏まえる", "r": "ふまえる", "vi": "Dựa trên, căn cứ vào", "en": "Based on / Taking into account", "ex": "ご意見を踏まえて修正します。", "c": "漢字"}, {"id": 529, "w": "概ね", "r": "おおむね", "vi": "Nhìn chung, về cơ bản", "en": "Generally / Mostly", "ex": "概ね、要求通りにご対応いただきありがとうございます。", "c": "漢字"}, {"id": 530, "w": "無駄", "r": "むだ", "vi": "Lãng phí, vô ích", "en": "Waste / Useless", "ex": "せっかく入力した情報は無駄になってしまう。", "c": "漢字"}, {"id": 531, "w": "一律", "r": "いちりつ", "vi": "Đồng đều, thống nhất", "en": "Uniform / Flat rate", "ex": "距離に関わらず、値段は一律です。", "c": "漢字"}, {"id": 532, "w": "完納", "r": "かんのう", "vi": "Giao hàng đầy đủ, hoàn thành giao", "en": "Full delivery / Complete delivery", "ex": "全数量の完納をご確認ください。", "c": "漢字"}, {"id": 533, "w": "分納", "r": "ぶんのう", "vi": "Giao hàng từng phần", "en": "Partial delivery", "ex": "今回は分納で対応します。", "c": "漢字"}, {"id": 534, "w": "入納", "r": "にゅうのう", "vi": "Nộp vào, nhập kho", "en": "Delivery / Submission", "ex": "入納の確認をお願いします。", "c": "漢字"}, {"id": 535, "w": "相応しい", "r": "ふさわしい", "vi": "Phù hợp, xứng đáng", "en": "Appropriate / Suitable", "ex": "画面タイトルに「帳票集計システム」はシステム名として相応しくないので、「日報集計システム」と変更して頂けますか。", "c": "漢字"}, {"id": 536, "w": "満たす", "r": "みたす", "vi": "Đáp ứng, thỏa mãn điều kiện", "en": "Satisfy / Meet", "ex": "条件を満たさず、Elseの中に分岐しています。その場合は、出庫先のコンボボックスが有効になりますが、倉庫リストが表示されず、出庫先を選択できません。", "c": "漢字"}, {"id": 537, "w": "あくまでも", "r": "あくまでも", "vi": "Đến cùng, nhất định là", "en": "To the last / Absolutely", "ex": "材料発注一覧はあくまでも　材料発注の結果を検索する画面として用意しました。", "c": "その他"}, {"id": 538, "w": "即時", "r": "そくじ", "vi": "Ngay lập tức", "en": "Immediate / Instant", "ex": "すべてハンディアプリは即時アップデートを行っているわけではありません。", "c": "漢字"}, {"id": 539, "w": "洗練", "r": "せんれん", "vi": "Tinh tế, hoàn thiện", "en": "Refined / Polished", "ex": "より洗練されたデザインに改善してください。", "c": "漢字"}, {"id": 540, "w": "単純", "r": "たんじゅん", "vi": "Đơn giản", "en": "Simple", "ex": "単純にI_RM_MATERIAL_IDで比較するだけの処理となります。", "c": "漢字"}, {"id": 541, "w": "差し支える", "r": "さしつかえる", "vi": "Bất tiện, có vấn đề", "en": "Be inconvenient / Matter", "ex": "差し支えなければ　差し支えなければ、先生と奥様の召し上がれないものや、苦手なものがございましたら教えていただけますと幸いです。", "c": "漢字"}, {"id": 542, "w": "納める", "r": "おさめる", "vi": "Nộp vào, cung cấp", "en": "Deliver / Pay", "ex": "弊社が納めているシステムは、お客様が外注業者に渡す中間品を管理する倉庫管理システムです。", "c": "漢字"}, {"id": 543, "w": "均等", "r": "きんとう", "vi": "Đồng đều, cân bằng", "en": "Equal / Uniform", "ex": "作業を均等に分担してください。", "c": "漢字"}, {"id": 544, "w": "割り振る", "r": "わりふる", "vi": "Phân chia, phân công", "en": "Allocate / Assign", "ex": "タスクを均等に割り振ってください。", "c": "漢字"}, {"id": 545, "w": "飛ぶ出す", "r": "とびだす", "vi": "Nhảy ra, xuất hiện đột ngột", "en": "Jump out / Pop up", "ex": "パージョン管理により過去のパージョンを呼び出して　適用可能にする。", "c": "漢字"}, {"id": 546, "w": "行 (９行目）", "r": "ぎょう", "vi": "Hàng (row), dòng", "en": "Row", "ex": "7行目以降を取込する。", "c": "漢字"}, {"id": 547, "w": "おおよそ=ほぼ", "r": "おおよそ/ほぼ", "vi": "Khoảng, xấp xỉ", "en": "Approximately / Roughly", "ex": "おおよその工数で結構です。", "c": "その他"}, {"id": 548, "w": "昇順/インクリメント", "r": "しょうじゅん/インクリメント", "vi": "Tăng dần, tăng thêm 1", "en": "Ascending / Increment", "ex": "データを昇順で表示してください。", "c": "漢字"}, {"id": 549, "w": "降順/デクリメント", "r": "こうじゅん/デクリメント", "vi": "Giảm dần, giảm 1", "en": "Descending / Decrement", "ex": "降順に並び替えてください。", "c": "漢字"}, {"id": 550, "w": "事業 > 営業", "r": "じぎょう/えいぎょう", "vi": "Sự nghiệp, kinh doanh / Kinh doanh bán hàng", "en": "Business / Sales", "ex": "新規事業立案のために市場調査を行います。", "c": "漢字"}, {"id": 551, "w": "いらしてください。/いらっしゃってください。/（来てほしい）", "r": "いらしてください", "vi": "Mời đến thăm (kính ngữ của来てください)", "en": "Please come (honorific)", "ex": "ベトナムはぜひ遊びにいらしてください。", "c": "漢字"}, {"id": 552, "w": "耐える/耐えうる", "r": "たえる", "vi": "Chịu đựng, chịu tải", "en": "Endure / Withstand", "ex": "高い負荷に耐えるシステムを設計してください。", "c": "漢字"}, {"id": 553, "w": "貼付/貼り付ける", "r": "はりつける", "vi": "Dán, gắn vào", "en": "Paste / Attach", "ex": "ラベルを発行してから各材料に貼り付けてください。", "c": "漢字"}, {"id": 554, "w": "見なす/見なされる", "r": "みなす", "vi": "Coi như, được xem là", "en": "Consider as / Regard as", "ex": "発注明細は正式な入荷予定とみなされる。", "c": "漢字"}, {"id": 555, "w": "習熟 (未習熟）", "r": "しゅうじゅく(みしゅうじゅく)", "vi": "Thành thạo / Chưa thành thạo", "en": "Proficiency / Lack of proficiency", "ex": "操作が未習熟であることから、古いバージョンのまま稼働しています。", "c": "漢字"}, {"id": 556, "w": "マスタ", "r": "マスタ", "vi": "Bảng dữ liệu gốc (master), master data", "en": "Master (data)", "ex": "部署マスタに新しい部署を登録してください。", "c": "外来語"}, {"id": 557, "w": "登録", "r": "とうろく", "vi": "Đăng ký, ghi nhận vào hệ thống", "en": "Register / Registration", "ex": "新しいアカウントを登録してください。", "c": "漢字"}, {"id": 558, "w": "役職", "r": "やくしょく", "vi": "Chức vụ, chức danh", "en": "Position / Job title", "ex": "役職ごとにアクセス権限を設定します。", "c": "漢字"}, {"id": 559, "w": "に対して", "r": "にたいして", "vi": "Đối với ~, với ~", "en": "Regarding / Toward", "ex": "登録された役職に対して、承認権限を付与する。", "c": "漢字"}, {"id": 560, "w": "申請", "r": "しんせい", "vi": "Đơn đăng ký, xin (申请)", "en": "Application / Request", "ex": "一般ユーザーが、メールアドレス作成を申請できる。", "c": "漢字"}, {"id": 561, "w": "通知", "r": "つうち", "vi": "Thông báo", "en": "Notification", "ex": "申請内容は、所属部署の承認者へメール通知される。", "c": "漢字"}, {"id": 562, "w": "経路", "r": "けいろ", "vi": "Lộ trình, đường đi", "en": "Route / Path", "ex": "申請経路が不明確で、誰が申請したか分かりにくい。", "c": "漢字"}, {"id": 563, "w": "曖昧", "r": "あいまい", "vi": "Mơ hồ, không rõ ràng", "en": "Ambiguous / Vague", "ex": "初期パスワードやメール情報の管理が曖昧になる。", "c": "漢字"}, {"id": 564, "w": "履歴", "r": "りれき", "vi": "Lịch sử (thao tác)", "en": "History / Log", "ex": "申請・承認・管理者操作の履歴を記録する。", "c": "漢字"}, {"id": 565, "w": "認証", "r": "にんしょう", "vi": "Xác thực", "en": "Authentication", "ex": "社内ポータルのログインユーザーを認証に利用する。", "c": "漢字"}, {"id": 566, "w": "認可", "r": "にんか", "vi": "Phân quyền (authorization)", "en": "Authorization", "ex": "ロールにより画面・操作・項目表示を認可で制御する。", "c": "漢字"}, {"id": 567, "w": "平文", "r": "ひらぶん", "vi": "Văn bản thô (plaintext), chưa mã hóa", "en": "Plaintext", "ex": "パスワードは平文保存せず、暗号化して保存する。", "c": "漢字"}, {"id": 568, "w": "転送", "r": "てんそう", "vi": "Chuyển tiếp (mail)", "en": "Forward / Transfer", "ex": "メールの転送設定は任意で登録できる。", "c": "漢字"}, {"id": 569, "w": "配信", "r": "はいしん", "vi": "Phân phối, gửi đi (mail/tin)", "en": "Distribution / Delivery", "ex": "複数メンバーに配信するメーリングリストを作成する。", "c": "漢字"}, {"id": 570, "w": "命名規則", "r": "めいめいきそく", "vi": "Quy tắc đặt tên", "en": "Naming convention", "ex": "メールアドレス命名規則に合わせた自動チェックが必要です。", "c": "漢字"}, {"id": 571, "w": "代理承認", "r": "だいりしょうにん", "vi": "Phê duyệt thay, ủy quyền duyệt", "en": "Proxy approval", "ex": "承認者不在時の代理承認の有無を決める必要がある。", "c": "漢字"}, {"id": 572, "w": "停止", "r": "ていし", "vi": "Ngừng, dừng lại", "en": "Stop / Suspend", "ex": "退職・異動によるメールアドレス停止申請を追加する。", "c": "漢字"}, {"id": 573, "w": "異動", "r": "いどう", "vi": "Điều chuyển (nhân sự)", "en": "Personnel transfer", "ex": "異動時にメールアドレスを停止する運用を決める。", "c": "漢字"}, {"id": 574, "w": "退職", "r": "たいしょく", "vi": "Nghỉ việc, thôi việc", "en": "Resignation / Retirement", "ex": "退職者のメールアドレスは停止申請で対応する。", "c": "漢字"}, {"id": 575, "w": "控え", "r": "ひかえ", "vi": "Bản lưu, bản sao giữ lại", "en": "Copy / Record", "ex": "作成完了時、メール管理者へ完了控えを送信する。", "c": "漢字"}, {"id": 576, "w": "可用性", "r": "かようせい", "vi": "Tính khả dụng (availability)", "en": "Availability", "ex": "メール送信失敗時も申請データは保持し、可用性を確保する。", "c": "漢字"}, {"id": 577, "w": "再送", "r": "さいそう", "vi": "Gửi lại", "en": "Resend", "ex": "通知メール送信失敗時に管理者が再送できるようにする。", "c": "漢字"}, {"id": 578, "w": "一貫性", "r": "いっかんせい", "vi": "Tính nhất quán", "en": "Consistency", "ex": "ステータス遷移に従わない更新はできないようにし、一貫性を保つ。", "c": "漢字"}, {"id": 579, "w": "保守性", "r": "ほしゅせい", "vi": "Tính bảo trì (maintainability)", "en": "Maintainability", "ex": "申請は共通ワークフローで実装し、保守性を高める。", "c": "漢字"}, {"id": 580, "w": "拡張性", "r": "かくちょうせい", "vi": "Tính mở rộng (extensibility)", "en": "Extensibility", "ex": "将来、変更申請を追加できる拡張性のある構造にする。", "c": "漢字"}, {"id": 581, "w": "事前条件", "r": "じぜんじょうけん", "vi": "Điều kiện tiên quyết (precondition)", "en": "Precondition", "ex": "事前条件はログイン済みで、承認者が設定済みであること。", "c": "漢字"}, {"id": 582, "w": "例外", "r": "れいがい", "vi": "Ngoại lệ (exception)", "en": "Exception", "ex": "例外として、必須未入力やメールアドレス重複がある。", "c": "漢字"}, {"id": 583, "w": "実体", "r": "じったい", "vi": "Thực thể (entity), bản thể", "en": "Entity / Substance", "ex": "作成完了後の実体情報はテーブルを分けて管理する。", "c": "漢字"}, {"id": 584, "w": "望ましい", "r": "のぞましい", "vi": "Nên có, đáng mong muốn, tốt hơn", "en": "Desirable / Preferable", "ex": "利用者氏名は社員マスタから選択できると望ましい。", "c": "漢字"}, {"id": 585, "w": "任意", "r": "にんい", "vi": "Tùy chọn, không bắt buộc", "en": "Optional / Arbitrary", "ex": "備考は任意入力の項目です。", "c": "漢字"}, {"id": 586, "w": "必須", "r": "ひっす", "vi": "Bắt buộc, thiết yếu", "en": "Mandatory / Required", "ex": "必須項目が未入力の場合は登録不可とする。", "c": "漢字"}, {"id": 587, "w": "連携", "r": "れんけい", "vi": "Liên kết, tích hợp (hệ thống)", "en": "Integration / Linkage", "ex": "社員マスタ連携がある場合は社員番号を表示する。", "c": "漢字"}, {"id": 588, "w": "区分", "r": "くぶん", "vi": "Phân loại, phân biệt", "en": "Classification / Category", "ex": "申請種別を2種類の区分に分ける。", "c": "漢字"}, {"id": 589, "w": "種別", "r": "しゅべつ", "vi": "Chủng loại, loại", "en": "Type / Kind", "ex": "通知処理は申請種別ごとにテンプレートを切り替える。", "c": "漢字"}, {"id": 590, "w": "対応", "r": "たいおう", "vi": "Xử lý, ứng phó, hỗ trợ", "en": "Handling / Support", "ex": "承認済み申請の対応はメール管理者が行う。", "c": "漢字"}, {"id": 591, "w": "検証", "r": "けんしょう", "vi": "Kiểm chứng, xác minh", "en": "Verification / Validation", "ex": "SQLインジェクションや不正入力を防ぐため入力検証を行う。", "c": "漢字"}, {"id": 592, "w": "不正", "r": "ふせい", "vi": "Gian lận, không hợp lệ", "en": "Fraud / Invalid", "ex": "フォーム送信時の不正操作対策を行う。", "c": "漢字"}, {"id": 593, "w": "下書き", "r": "したがき", "vi": "Bản nháp", "en": "Draft", "ex": "下書きは申請者が作成中のステータスです。", "c": "漢字"}, {"id": 594, "w": "属人化", "r": "ぞくじんか", "vi": "Sự phụ thuộc vào cá nhân", "en": "Personalization / Siloing", "ex": "登録状況の属人化により、現状の確認がしづらい。", "c": "漢字"}, {"id": 595, "w": "セキュリティ", "r": "セキュリティ", "vi": "Bảo mật, an ninh", "en": "Security", "ex": "システムのセキュリティを強化するため、二段階認証を導入します。", "c": "外来語"}, {"id": 596, "w": "脆弱性", "r": "ぜいじゃくせい", "vi": "Lỗ hổng bảo mật, điểm yếu", "en": "Vulnerability", "ex": "定期的なセキュリティ診断で脆弱性を早期に発見することが重要です。", "c": "漢字"}];
const GYOUMU = /*__GYOUMU__*/[{"track": 1, "chapter": 1, "unit": 1, "unitJp": "求人ポスター", "unitVi": "Bảng tin tuyển dụng", "type": "聞き取り練習 (Luyện nghe)", "chars": "DJ (quảng cáo radio)", "hasTranscript": true, "lines": [{"spk": "DJ", "t": "夢の世界へようこそ！ アルクテクノロジー社は秋葉原に本社があり、シリコンバレーにも支社のあるロボット開発企業です。日本とアメリカで活躍するエンジニアたちは合計3,500人！ あなたもここで未来を作る仲間に入りませんか。私たちは、夢のある若い技術者たちを応援しています。あなたに熱い夢があるなら、ぜひ、当社へ！「ロボットとともに明るい未来を」。アルクテクノロジー。"}], "note": ""}, {"track": 2, "chapter": 1, "unit": 2, "unitJp": "電話で問い合わせる", "unitVi": "Gọi điện hỏi thông tin tuyển dụng", "type": "モデル会話 (Hội thoại mẫu)", "chars": "受付 (Lễ tân) / リー (Li) / 田口 (Taguchi)", "hasTranscript": true, "lines": [{"spk": "受付", "t": "はい、未来創造社でございます。"}, {"spk": "リー", "t": "私、リーと申しますが、御社の求人ポスターを拝見しまして……。エンジニアの募集について、お尋ねしてもよろしいでしょうか。"}, {"spk": "受付", "t": "求人の件ですね。担当の者に代わりますので、少々お待ちください。"}, {"spk": "田口", "t": "お電話代わりました。人事部の田口と申します。"}, {"spk": "リー", "t": "お忙しいところ失礼いたします。リーと申しますが、エンジニアの応募資格の件で、質問させていただけますか。"}, {"spk": "田口", "t": "はい、どうぞ。"}, {"spk": "リー", "t": "あの、日本の情報処理技術者試験を受けたことがないんですが、日本で働くには、この試験に合格していなければなりませんか。"}, {"spk": "田口", "t": "失礼ですが、どちらからおかけですか。"}, {"spk": "リー", "t": "中国の大連です。"}, {"spk": "田口", "t": "ああ、中国の場合は、情報産業部の試験に合格していれば大丈夫ですよ。"}, {"spk": "リー", "t": "そうですか。プログラマーの部門でもいいですか。"}, {"spk": "田口", "t": "プログラマー部門でもビザは出ます。でも、採用試験には技術関連の問題がありますから、まずはそれに合格しなければなりませんね。"}, {"spk": "リー", "t": "技術的な内容も試験されるんですね。ほかにどんな試験がありますか。"}, {"spk": "田口", "t": "一次試験では、技術試験のほかに、日本語テストがあります。それに合格したら2次試験の面接を受けてもらいます。2次試験に合格すれば採用です。"}, {"spk": "リー", "t": "そうですか。応募書類は郵送するのでしょうか。"}, {"spk": "田口", "t": "メールに添付してもいいですよ。"}, {"spk": "リー", "t": "よくわかりました。ありがとうございました。"}], "note": ""}, {"track": 3, "chapter": 1, "unit": 2, "unitJp": "電話で問い合わせる", "unitVi": "Gọi điện hỏi thông tin tuyển dụng", "type": "聞き取り練習 (Luyện nghe)", "chars": "田口 (Taguchi) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "田口", "t": "はい、お電話替わりました。人事部の田口です。"}, {"spk": "ラジュ", "t": "あ、おはようございます。ラジュと申します。求人の件でお聞きしたいことがあるんですが。"}, {"spk": "田口", "t": "何でしょうか。"}, {"spk": "ラジュ", "t": "私はインドのバンガロールで働いているんですが、こちらの資格は日本でも有効ですか。"}, {"spk": "田口", "t": "インドの資格というとドアックですか。"}, {"spk": "ラジュ", "t": "そうです。"}, {"spk": "田口", "t": "どのレベルですか。"}, {"spk": "ラジュ", "t": "レベルCです。"}, {"spk": "田口", "t": "レベルCなら日本の資格と同じように扱われますから、大丈夫ですよ。"}, {"spk": "ラジュ", "t": "そうですか。安心しました。"}, {"spk": "田口", "t": "うちのウェブサイトから資料はダウンロードしましたか。"}, {"spk": "ラジュ", "t": "はい、しました。でも、まだ資格のところまでしか読んでいないんです。"}, {"spk": "田口", "t": "じゃあ、半分ぐらい読んだんですね。まずは全部読んでみて、わからないことがあったら、また電話してください。"}, {"spk": "ラジュ", "t": "わかりました。ありがとうございます。"}], "note": ""}, {"track": 4, "chapter": 1, "unit": 3, "unitJp": "職務経歴書", "unitVi": "Sơ yếu lý lịch làm việc (Résumé)", "type": "聞き取り練習 (Luyện nghe)", "chars": "リー (Li) - độc thoại", "hasTranscript": true, "lines": [{"spk": "リー", "t": "私は御社でシステムエンジニアとしてのキャリアを積みたいと考えております。私は2001年に大連情報技術大学ソフトウェア工学学院に入学しました。専攻はプログラミングでしたが、2年生の時に日本語強化コースが開設されるのと同時に、日本語を履修し始めました。2005年に同大学を卒業し、大連市にある大連e-コマースシステムズに入社しました。主な案件は中国企業の日本市場向け広報サイトの製作でした。2006年から現在まで、オフショア部門に配属され、日本企業のオンラインショップの開発に関わっています。ここではPHPによるe-コマースの技術のみならず、日本の基礎的な商習慣を身に付けることができました。このように、これまでずっと日本市場向けウェブサイトの開発に関わって参りました。そのため、日本市場に最適で実用的なシステム開発に貢献することができると自負しています。"}], "note": ""}, {"track": 5, "chapter": 1, "unit": 4, "unitJp": "面接", "unitVi": "Phỏng vấn", "type": "モデル会話 (Hội thoại mẫu)", "chars": "田口 (Taguchi) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "田口", "t": "次の方、どうぞ。"}, {"spk": "リー", "t": "はい、失礼します。"}, {"spk": "田口", "t": "おかけください。少し緊張しているようですね。大丈夫ですか。"}, {"spk": "リー", "t": "はい、大丈夫です。"}, {"spk": "田口", "t": "まず、今の仕事ですが、大連で日本向けのシステムを開発しているんですね。"}, {"spk": "リー", "t": "そうです。大連e-コマースシステムズという会社に勤めています。"}, {"spk": "田口", "t": "開発環境を教えてください。"}, {"spk": "リー", "t": "主にエクリプスで開発しています。ソースはPHPで書いています。"}, {"spk": "田口", "t": "うーん、PHPですか。Javaはどうですか。"}, {"spk": "リー", "t": "あまり使っていません。"}, {"spk": "田口", "t": "日本で働くのなら、Javaも勉強しておいた方がいいですよ。"}, {"spk": "リー", "t": "はい、がんばります。"}, {"spk": "田口", "t": "日本に行きたいという希望は、もうご家族に話してありますか。"}, {"spk": "リー", "t": "はい、話してあります。"}, {"spk": "田口", "t": "日本で働きたいというのは、どうしてですか。"}, {"spk": "リー", "t": "私は大学でプログラミングと日本語を勉強しましたので、これからも日本向けのサービスに関わっていきたいと思います。そのためにも、20代のうちに日本で働くことを経験しておきたいのです。"}, {"spk": "田口", "t": "中国にある日系企業でも、役に立つ経験は得られるのではありませんか。"}, {"spk": "リー", "t": "もちろん、中国にある日系企業でも、日本の会社のことは勉強できると思います。ただ、私は会社の中のことだけでなく、お客さまのことも知りたいのです。そのためには日本へ行って生活してみることが必要だと思っています。"}, {"spk": "田口", "t": "なるほど。"}], "note": ""}, {"track": 6, "chapter": 1, "unit": 4, "unitJp": "面接", "unitVi": "Phỏng vấn", "type": "聞き取り練習 (Luyện nghe)", "chars": "田口 (Taguchi) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "失礼します。ラジュ・タルクダールと申します。よろしくお願いいたします。"}, {"spk": "田口", "t": "はい、どうぞ。おかけください。さて、まず筆記試験ですが、どうでしたか。"}, {"spk": "ラジュ", "t": "技術試験はそれほど難しくありませんでしたが、日本語のテストは難しかったです。"}, {"spk": "田口", "t": "日本語はどちらで勉強したんですか。"}, {"spk": "ラジュ", "t": "自分で勉強しました。"}, {"spk": "田口", "t": "それはすごいですね。では、どうして日本で働きたいんですか。"}, {"spk": "ラジュ", "t": "私が昔やっていた研究が日本で実用化されてきたので、その現場に行って、この目で見てみたいんです。"}, {"spk": "田口", "t": "ご研究というのはグリッドコンピューティングのことですよね。"}, {"spk": "ラジュ", "t": "はい。今は特に、御社のネット銀行のプロジェクトに注目しています。"}, {"spk": "田口", "t": "なるほど。ただ、うちはいろいろなプロジェクトがあって、ネット銀行のプロジェクト以外にも参加していただきたいと思っているんですよ。そのあたりはいかがですか。"}, {"spk": "ラジュ", "t": "もちろん、ほかの仕事もやらせていただきます。"}, {"spk": "田口", "t": "そうですか。それは頼もしいです。"}], "note": ""}, {"track": 7, "chapter": 1, "unit": 5, "unitJp": "ビザの取得", "unitVi": "Xin thị thực (Visa)", "type": "モデル会話 (Hội thoại mẫu)", "chars": "田口 (Taguchi) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "田口", "t": "はい、お電話替わりました。田口です。"}, {"spk": "ラジュ", "t": "あ、田口さん。ラジュです。"}, {"spk": "田口", "t": "ああ、ラジュさん。ドアックの証明書はもう出ましたか。"}, {"spk": "ラジュ", "t": "ええ。IT省の友達が手配してくれました。"}, {"spk": "田口", "t": "そうですか。それはよかった。じゃあ、渡航手続きは順調に進んでいますね。"}, {"spk": "ラジュ", "t": "それが、一つ問題がありまして……。実は、日本大使館から会社の書類が足りないと言われています。"}, {"spk": "田口", "t": "え、本当？ どんな書類ですか。"}, {"spk": "ラジュ", "t": "法人登記簿の謄本だそうです。"}, {"spk": "田口", "t": "法人登記簿？ この前の封筒に入っていませんでしたか。"}, {"spk": "ラジュ", "t": "入っていましたが、あれは抄本でした。大使館では法人登記簿の謄本が必要なんだそうです。"}, {"spk": "田口", "t": "ああ、そうなんですか。それは困ったなあ。"}, {"spk": "ラジュ", "t": "謄本がないと、ビザが出せないそうです。お手数ですが、送っていただけませんか。"}, {"spk": "田口", "t": "わかりました。急いで送ります。"}, {"spk": "ラジュ", "t": "ありがとうございます。"}], "note": ""}, {"track": 8, "chapter": 1, "unit": 5, "unitJp": "ビザの取得", "unitVi": "Xin thị thực (Visa)", "type": "聞き取り練習 (Luyện nghe)", "chars": "田口 (Taguchi) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "田口", "t": "はい、お電話替わりました。人事部の田口です。"}, {"spk": "リー", "t": "あ、田口さんですね。大連のリーです。"}, {"spk": "田口", "t": "ああ、リーさん。渡航手続きは無事に進んでいますか。"}, {"spk": "リー", "t": "それが……。今日、領事館に行ったら、会社の書類が足りないって言われたんです。"}, {"spk": "田口", "t": "足りないのは法人登記簿の謄本ですか。"}, {"spk": "リー", "t": "いえ、それはちゃんとありました。足りないのは会社の決算書です。"}, {"spk": "田口", "t": "決算書？ おかしいなあ。決算書は確かに封筒に入れたはずですが……。"}, {"spk": "リー", "t": "でも、見つからなくて……。決算書がないと、ビザが出せないそうです。"}, {"spk": "田口", "t": "そうですよね。とにかく、すぐに送りますから。"}, {"spk": "リー", "t": "あ、でも時間がないので、ウェブサイトからダウンロードしたものでも、特別に受け取ってくれるそうです。でも、ちょっとサイトが探せないんです……。"}, {"spk": "田口", "t": "じゃ、すぐにこちらからメールでURLを知らせます。"}, {"spk": "リー", "t": "ありがとうございます。"}], "note": ""}, {"track": 9, "chapter": 2, "unit": 1, "unitJp": "自己紹介", "unitVi": "Tự giới thiệu bản thân", "type": "モデル会話 (Hội thoại mẫu)", "chars": "", "hasTranscript": false, "lines": [], "note": "KHÔNG CÓ trong file PDF được cung cấp (trang bị thiếu trong bản scan, PDF nhảy từ trang 31 sang trang 38). Không thể trích transcript cho track này."}, {"track": 10, "chapter": 2, "unit": 1, "unitJp": "自己紹介", "unitVi": "Tự giới thiệu bản thân", "type": "聞き取り練習 (Luyện nghe)", "chars": "リー (Li) / 大沢 (Osawa)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "すみません、ちょっとよろしいですか。"}, {"spk": "大沢", "t": "はい、何か。"}, {"spk": "リー", "t": "私、リーと申します。本日よりこちらでお世話になります。よろしくお願いいたします。"}, {"spk": "大沢", "t": "新入社員の方ですね。私は上級SEの大沢です。よろしく。"}, {"spk": "リー", "t": "大沢さんですね。"}, {"spk": "大沢", "t": "そうです。リーさん、ご出身はどちらですか。"}, {"spk": "リー", "t": "中国の大連です。"}, {"spk": "大沢", "t": "大連ですか。日本の企業がたくさん進出していますよね。大連では、どんな言語で開発していたんですか。"}, {"spk": "リー", "t": "PHPが多かったですが、最近はJavaの仕事が多くなってきましたね。"}, {"spk": "大沢", "t": "なるほど。では、OSは？ こちらはUNIXの仕事が多いんですが、大丈夫ですか。"}, {"spk": "リー", "t": "UNIXで動くアプリは、今までもたくさん作ってきました。"}, {"spk": "大沢", "t": "そうですか。データベースは？ こちらでは、オラクルのものが多いんですが。"}, {"spk": "リー", "t": "オラクルはまだ勉強中です。PostgreSQLならだいたいわかるんですが。"}, {"spk": "大沢", "t": "じゃあ、すぐ慣れるでしょう。PostgreSQLはどんなシステムで使ったんですか。"}, {"spk": "リー", "t": "食品会社のオンラインショップなんかで使っていました。"}, {"spk": "大沢", "t": "そうですか。じゃあ、うちのプロジェクトでも大丈夫ですね。でも、何かあったら、いつでも聞いてください。"}, {"spk": "リー", "t": "ありがとうございます。よろしくお願いします。"}], "note": ""}, {"track": 11, "chapter": 2, "unit": 2, "unitJp": "要件定義書の読解", "unitVi": "Đọc hiểu tài liệu định nghĩa yêu cầu", "type": "モデル会話 (Hội thoại mẫu)", "chars": "井出 (Ide) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "井出", "t": "リーさん、今、ちょっといい？"}, {"spk": "リー", "t": "はい、3時の定例会議までは空いています。"}, {"spk": "井出", "t": "では、手短に。これは今度のプロジェクトの資料で、要件定義書と外部設計書です。"}, {"spk": "リー", "t": "はい。これに目を通しておくんですね。期限はいつですか。"}, {"spk": "井出", "t": "明日です。内部設計書ももうできますから。"}, {"spk": "リー", "t": "明日ですか。すみません、私の日本語力では、かなり厳しいのですが……。"}, {"spk": "井出", "t": "そうですか。じゃあ、三日でお願いします。"}, {"spk": "リー", "t": "三日ですか。ちょっと心配ですが、がんばります。"}, {"spk": "井出", "t": "リーさんなら大丈夫ですよ。みんなも協力するし。"}, {"spk": "リー", "t": "読んでもわからないところは、どうすればいいでしょうか。"}, {"spk": "井出", "t": "まず、自分で推測してみてください。自信がなかったら本棚に辞書もあります。辞書にない言葉は、大沢さんに聞いてください。大沢さんが席を外しているときは、私に聞いてください。"}, {"spk": "リー", "t": "はい、わかりました。ありがとうございます。"}, {"spk": "井出", "t": "くれぐれも、設計の理解があやふやなまま実装の段階に入らないようにね。じゃあ、大変だけど、よろしく。"}, {"spk": "リー", "t": "はい、がんばります。"}], "note": ""}, {"track": 12, "chapter": 2, "unit": 2, "unitJp": "要件定義書の読解", "unitVi": "Đọc hiểu tài liệu định nghĩa yêu cầu", "type": "聞き取り練習 (Luyện nghe)", "chars": "大沢 (Osawa) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "ラジュさん、ちょっといいですか。"}, {"spk": "ラジュ", "t": "はい。"}, {"spk": "大沢", "t": "内部設計書、届いていますよ。"}, {"spk": "ラジュ", "t": "あ、はい。これを読むんですね。いつまでですか。"}, {"spk": "大沢", "t": "明日から実装だから、今日中に読んでおいた方がいいんじゃないかな。"}, {"spk": "ラジュ", "t": "え、今日中ですか。実は私、話すのは大丈夫なんですが、読むのは苦手で……。"}, {"spk": "大沢", "t": "じゃあ、今週中ぐらいには読めそうですか。"}, {"spk": "ラジュ", "t": "はい、それなら何とかできると思います。"}, {"spk": "大沢", "t": "でも、実装はスケジュールどおりに始まりますから、とりあえず最初の方は読んでおいてくださいね。"}, {"spk": "ラジュ", "t": "わかりました。知らない言葉があったらお聞きしてもいいですか。"}, {"spk": "大沢", "t": "もちろん。でも、まずは辞書を見てくださいね。辞書にない言葉は、私に聞けばいいですから。"}, {"spk": "ラジュ", "t": "ありがとうございます。よろしくお願いします。"}], "note": ""}, {"track": 13, "chapter": 2, "unit": 3, "unitJp": "内容確認", "unitVi": "Xác nhận nội dung", "type": "モデル会話 (Hội thoại mẫu)", "chars": "リー (Li) / 新山 (Niiyama)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "新山さん、今ちょっとよろしいでしょうか。実は外部設計書で、わからないところがあるんですが……。"}, {"spk": "新山", "t": "あ、はい。要件定義書はもう読みましたか。"}, {"spk": "リー", "t": "はい、読みました。"}, {"spk": "新山", "t": "わからないところはどこですか。"}, {"spk": "リー", "t": "この言葉です。この漢字は何と読みますか。"}, {"spk": "新山", "t": "「にゅうしゅつりょく」と読みます。"}, {"spk": "リー", "t": "え、「にゅうしゅつりょく」って何ですか。"}, {"spk": "新山", "t": "ちょっと見せて。ああ、「入出力インターフェース」ですね。これは、ほかのシステムと情報をやりとりするときの規格のことです。"}, {"spk": "リー", "t": "うーん……。"}, {"spk": "新山", "t": "たとえば、ほら、APIとか。"}, {"spk": "リー", "t": "なるほど！ インプットとアウトプットのインターフェースということですね。"}, {"spk": "新山", "t": "そうです。"}, {"spk": "リー", "t": "それから、この漢字は何と読みますか。"}, {"spk": "新山", "t": "「上書き」と読みます。オーバーライトのことですね。"}, {"spk": "リー", "t": "なるほど。ありがとうございました。よくわかりました。"}, {"spk": "新山", "t": "また何かあったら、何でも遠慮なく聞いてください。"}, {"spk": "リー", "t": "はい、よろしくお願いします。"}], "note": ""}, {"track": 14, "chapter": 2, "unit": 3, "unitJp": "内容確認", "unitVi": "Xác nhận nội dung", "type": "聞き取り練習 (Luyện nghe)", "chars": "ラジュ (Raju) / 新山 (Niiyama)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "新山さん、ちょっと時間ありますか。"}, {"spk": "新山", "t": "あ、はい。"}, {"spk": "ラジュ", "t": "実は、外部設計書を読んでいるんですが、辞書を見てもわからない言葉があって。これなんですが……。"}, {"spk": "新山", "t": "ああ、「親クラス」ですね。これはね、継承する基のクラスっていうことです。"}, {"spk": "ラジュ", "t": "え、けいしょう、ですか。うーん……。"}, {"spk": "新山", "t": "例えば、そうだなあ……ルートクラスってわかります？"}, {"spk": "ラジュ", "t": "はい、わかります。"}, {"spk": "新山", "t": "ルートクラスには親クラスがないんですよ。"}, {"spk": "ラジュ", "t": "ん？ ということは、親クラスってスーパークラスのことですか。"}, {"spk": "新山", "t": "あ、そうそう。英語で言うとスーパークラスです。"}, {"spk": "ラジュ", "t": "じゃあ、子クラスっていうのはサブクラスのことですね。"}, {"spk": "新山", "t": "その通りです。"}], "note": ""}, {"track": 15, "chapter": 2, "unit": 4, "unitJp": "担当業務の通知", "unitVi": "Thông báo công việc phụ trách", "type": "モデル会話 (Hội thoại mẫu)", "chars": "大沢 (Osawa) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "ラジュさん、仕事の内容は、もう聞いていますか。"}, {"spk": "ラジュ", "t": "はい、だいたいは。"}, {"spk": "大沢", "t": "要件定義書と基本設計書はもう読んでいますね。"}, {"spk": "ラジュ", "t": "はい。"}, {"spk": "大沢", "t": "では、予定どおり仕入管理モジュールの発注データを担当してもらうことになります。"}, {"spk": "ラジュ", "t": "はい。えーっと、発注データは四つの機能がありますが、これを全部やるんですね。"}, {"spk": "大沢", "t": "そうです。仕入管理の開発は、やったことがありますか。"}, {"spk": "ラジュ", "t": "はい、あります。詳細設計書はもうできていますか。"}, {"spk": "大沢", "t": "はい、できています。これです。"}, {"spk": "ラジュ", "t": "拝見します。どれから始めてもいいのですか。"}, {"spk": "大沢", "t": "どれから始めてもいいですが、発注伝票出力だけ締め切りが早いですから、遅れないようにしてください。"}, {"spk": "ラジュ", "t": "発注伝票出力ですね。では、この機能から始めます。"}, {"spk": "大沢", "t": "じゃあ、発注伝票出力だけでも終わったら報告してください。"}, {"spk": "ラジュ", "t": "わかりました。ほかの機能ができていなくても、ご報告するんですね。"}, {"spk": "大沢", "t": "そのとおりです。よろしくお願いします。"}], "note": ""}, {"track": 16, "chapter": 2, "unit": 4, "unitJp": "担当業務の通知", "unitVi": "Thông báo công việc phụ trách", "type": "聞き取り練習 (Luyện nghe)", "chars": "大沢 (Osawa) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "リーさん、今、いいですか。"}, {"spk": "リー", "t": "はい、大丈夫です。"}, {"spk": "大沢", "t": "詳細設計書ができたので、リーさんは顧客管理モジュールの取引履歴のところをお願いします。"}, {"spk": "リー", "t": "わかりました。顧客管理の、取引履歴ですね。"}, {"spk": "大沢", "t": "そうです。顧客管理系の開発はしたことがありますか。"}, {"spk": "リー", "t": "はい。中国にいたときに、顧客関連モジュールに関わったことがあります。"}, {"spk": "大沢", "t": "じゃ、安心ですね。ただ、今回は帳票の仕様に変更が出そうなので、帳票出力は最後にしてください。"}, {"spk": "リー", "t": "わかりました。帳票出力以外から始めるんですね。締め切りはいつですか。"}, {"spk": "大沢", "t": "今月中にお願いします。"}, {"spk": "リー", "t": "今月中ですね。わかりました。"}], "note": ""}, {"track": 17, "chapter": 2, "unit": 5, "unitJp": "詳細設計書を書く", "unitVi": "Viết tài liệu thiết kế chi tiết", "type": "モデル会話 (Hội thoại mẫu)", "chars": "ラジュ (Raju) / 新山 (Niiyama)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "新山さん、ちょっといいですか。"}, {"spk": "新山", "t": "はい、どうぞ。"}, {"spk": "ラジュ", "t": "実は、詳細設計書を書いたんですが……。"}, {"spk": "新山", "t": "はい。"}, {"spk": "ラジュ", "t": "どうも日本語に自信がないんです。"}, {"spk": "新山", "t": "辞書は引いたんですか。"}, {"spk": "ラジュ", "t": "もちろん引きました。"}, {"spk": "新山", "t": "そうですか。じゃあ、私が見てみましょうか。"}, {"spk": "ラジュ", "t": "いいですか？ 助かります。"}, {"spk": "新山", "t": "えーっと、この「店」っていうのは、なんか変ですね。こういうときは「店舗」と書くことが多いですよ。"}, {"spk": "ラジュ", "t": "そうですか。"}, {"spk": "新山", "t": "基本設計書では、どうなっていましたっけ。"}, {"spk": "ラジュ", "t": "あ、まだ確認していません。"}, {"spk": "新山", "t": "え、まだなんですか。じゃあ、まず基本設計書を確認した方がいいですね。"}, {"spk": "ラジュ", "t": "そうですね。うっかりしていました。"}, {"spk": "新山", "t": "確認して、まだ心配だったら声をかけてください。また見てあげますから。"}, {"spk": "ラジュ", "t": "ありがとうございます。よろしくお願いします。"}], "note": ""}, {"track": 18, "chapter": 2, "unit": 5, "unitJp": "詳細設計書を書く", "unitVi": "Viết tài liệu thiết kế chi tiết", "type": "聞き取り練習 (Luyện nghe)", "chars": "リー (Li) / 大沢 (Osawa)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "大沢さん、ちょっとお聞きしたいことがあるんですが……。"}, {"spk": "大沢", "t": "はい、何でしょう。"}, {"spk": "リー", "t": "実は今、内部設計書を書いているんですが、日本語を見ていただけませんか。"}, {"spk": "大沢", "t": "ああ、いいですよ。国語辞典とかは見ました？"}, {"spk": "リー", "t": "はい、一応、見ながら書きました。"}, {"spk": "大沢", "t": "そうですか。どれどれ。えーっと、この「お客さま」っていうのはシステムの発注者のことじゃないですよね。"}, {"spk": "リー", "t": "あ、それは、このシステムで管理するお客さまです。"}, {"spk": "大沢", "t": "それじゃ、「顧客」っていうのが普通ですね。"}, {"spk": "リー", "t": "あ、そうですね。"}, {"spk": "大沢", "t": "外部設計書でもそうなっていると思いますよ。見ました？"}, {"spk": "リー", "t": "あ、まだです。うっかりしてました。"}, {"spk": "大沢", "t": "「顧客」で間違いないと思いますけど、念のため、確認しておいてください。"}, {"spk": "リー", "t": "わかりました。ありがとうございます。"}, {"spk": "大沢", "t": "いえいえ。ほかにもありそうだから、午後のミーティングの後で、また見てあげますよ。"}, {"spk": "リー", "t": "ありがとうございます。よろしくお願いします。"}], "note": ""}, {"track": 19, "chapter": 2, "unit": 6, "unitJp": "仕様変更", "unitVi": "Thay đổi yêu cầu (spec)", "type": "モデル会話 (Hội thoại mẫu)", "chars": "井出 (Ide) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "井出", "t": "ラジュさん、ちょっといい？"}, {"spk": "ラジュ", "t": "はい。"}, {"spk": "井出", "t": "実は、また仕様が変更になりました。"}, {"spk": "ラジュ", "t": "え、またですか。どんな変更ですか。"}, {"spk": "井出", "t": "従業員マスターの主キーのデータ桁数を一つ増やすんだそうです。"}, {"spk": "ラジュ", "t": "つまり、9桁にするということですね。でも、それでは従業員マスターを参照するすべてのモジュールに影響が出ますね。"}, {"spk": "井出", "t": "そうですね。"}, {"spk": "ラジュ", "t": "単体テストだって、もうほとんど終わっていますし……。"}, {"spk": "井出", "t": "気持ちはわかります。"}, {"spk": "ラジュ", "t": "納期は延びるのでしょうか。"}, {"spk": "井出", "t": "いや、契約どおりです。"}, {"spk": "ラジュ", "t": "それはちょっと……。今だって毎日残業ですし……。"}, {"spk": "井出", "t": "大変なのはわかります。でも、やるしかないんです。人員は増やしますから、がんばってください。"}, {"spk": "ラジュ", "t": "わかりました……。"}], "note": ""}, {"track": 20, "chapter": 2, "unit": 6, "unitJp": "仕様変更", "unitVi": "Thay đổi yêu cầu (spec)", "type": "聞き取り練習 (Luyện nghe)", "chars": "リー (Li) / 大沢 (Osawa)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "リーさん、悪いニュースです。"}, {"spk": "リー", "t": "もしかして……仕様変更ですか。"}, {"spk": "大沢", "t": "その通りです。金額のデータ型を、倍精度実数型にしたいそうです。"}, {"spk": "リー", "t": "それだと、テストの仕様も変えなくてはなりませんね。"}, {"spk": "大沢", "t": "そうですね。"}, {"spk": "リー", "t": "でも、テストデータももう作ってしまいましたし……。納期は延びるんですか。"}, {"spk": "大沢", "t": "いや、契約通りです。"}, {"spk": "リー", "t": "それはちょっと……。今だってほとんど家に帰っていないんです。"}, {"spk": "大沢", "t": "気持ちはわかりますが、やるしかないんです。テストの日程は1日だけ延ばしてもいいですから、がんばってください。"}, {"spk": "リー", "t": "わかりました……。"}], "note": ""}, {"track": 21, "chapter": 2, "unit": 7, "unitJp": "単体テスト終了報告", "unitVi": "Báo cáo hoàn thành Unit Test", "type": "モデル会話 (Hội thoại mẫu)", "chars": "", "hasTranscript": false, "lines": [], "note": "KHÔNG CÓ trong file PDF được cung cấp (2 trang - hội thoại mẫu và giải thích - bị thiếu trong bản scan, PDF nhảy từ trang 57 sang trang 60). Không thể trích transcript cho track này."}, {"track": 22, "chapter": 2, "unit": 7, "unitJp": "単体テスト終了報告", "unitVi": "Báo cáo hoàn thành Unit Test", "type": "聞き取り練習 (Luyện nghe)", "chars": "ラジュ (Raju) / 大沢 (Osawa)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "大沢さん、すみません。発注データ処理のモジュールなんですが、ようやく単体テストが終わりました。"}, {"spk": "大沢", "t": "ああ、終わりましたか。まあ、1日しか遅れていないので、まだ取り返せるでしょう。"}, {"spk": "ラジュ", "t": "はい、がんばります。それと、ソースはサブバージョンにチェックインしておきました。"}, {"spk": "大沢", "t": "ありがとう。では、新山さんにもそう伝えておきます。"}, {"spk": "ラジュ", "t": "次はどのモジュールを作りましょうか。"}, {"spk": "大沢", "t": "勘定コード表をお願いします。勘定コード体系編集モジュールが依存していますので。"}, {"spk": "ラジュ", "t": "わかりました。では、すぐに始めます。"}, {"spk": "大沢", "t": "よろしく。"}], "note": ""}, {"track": 23, "chapter": 2, "unit": 8, "unitJp": "進捗状況の報告", "unitVi": "Báo cáo tiến độ", "type": "モデル会話 (Hội thoại mẫu)", "chars": "大沢 (Osawa) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "リーさん、進捗状況はどうですか。"}, {"spk": "リー", "t": "えーっと、担当モジュール四つのうち、半分は終わっています。"}, {"spk": "大沢", "t": "そうでしたね。三つ目のモジュールはどうですか。"}, {"spk": "リー", "t": "全体のコーディングは終わったんですが、単体テストはまだまだです。"}, {"spk": "大沢", "t": "試験項目は、どのぐらい終わりましたか。"}, {"spk": "リー", "t": "だいたい3割ぐらいです。"}, {"spk": "大沢", "t": "じゃ、実装段階は予定どおりに終われそうですね。"}, {"spk": "リー", "t": "そうですねえ。今のところ大きなバグも出ていないので、何とか間に合うと思います。"}, {"spk": "大沢", "t": "いいですね。その調子でがんばってください。何か困っていることはありますか。"}, {"spk": "リー", "t": "実はエクリプスに新しいプラグインを入れたら、ときどき落ちるようになってしまいました。こういう状況が続くようでしたら、外してみます。"}, {"spk": "大沢", "t": "そうですか。もし、スケジュールに影響しそうだと思ったら、遅れが出る前に教えてくださいね。"}, {"spk": "リー", "t": "わかりました。"}], "note": ""}, {"track": 24, "chapter": 2, "unit": 8, "unitJp": "進捗状況の報告", "unitVi": "Báo cáo tiến độ", "type": "聞き取り練習 (Luyện nghe)", "chars": "ラジュ (Raju) / 井出 (Ide)", "hasTranscript": true, "lines": [{"spk": "井出", "t": "ラジュさん、どのぐらい進んでいますか。"}, {"spk": "ラジュ", "t": "最初のモジュールは、試験項目が2割ほど残っているだけです。"}, {"spk": "井出", "t": "そうですか。早いですね。"}, {"spk": "ラジュ", "t": "モジュールはあと二つありますが、それほど時間はかからないと思います。"}, {"spk": "井出", "t": "全部終わるのに、どのぐらい掛かりそうですか。"}, {"spk": "ラジュ", "t": "予定より三日ぐらい早く終われると思います。"}, {"spk": "井出", "t": "それはよかった。何か問題はありませんか。"}, {"spk": "ラジュ", "t": "実はビジュアルスタジオのメニューがわかりにくくて少し困っているんですが、でも、まあ、すぐに慣れると思います。"}, {"spk": "井出", "t": "そうですね。ラジュさんなら大丈夫ですよ。でも、どうしてもわからないところは言ってください。"}, {"spk": "ラジュ", "t": "はい、お願いします。"}], "note": ""}, {"track": 25, "chapter": 2, "unit": 9, "unitJp": "遅延報告", "unitVi": "Báo cáo chậm tiến độ", "type": "モデル会話 (Hội thoại mẫu)", "chars": "リー (Li) / 井出 (Ide)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "あのう、ちょっとよろしいでしょうか。"}, {"spk": "井出", "t": "はい、何でしょうか。"}, {"spk": "リー", "t": "実は、申し訳ありませんが、今のままでは予定に遅れそうなんです。"}, {"spk": "井出", "t": "原因は何ですか。"}, {"spk": "リー", "t": "依存先のモジュールがまだ上がってこないんです。"}, {"spk": "井出", "t": "ああ、それは困りましたね。では、増員しましょう。どんな要員が必要ですか。"}, {"spk": "リー", "t": "スタブとテストデータだけでも作ってくれる人がいたら助かります。コーディングは、私一人でやるしかありませんので。"}, {"spk": "井出", "t": "スタブとテストデータですね。わかりました。この二つがあれば、予定どおりに終わりそうですか。"}, {"spk": "リー", "t": "はい。何とか終わると思います。"}, {"spk": "井出", "t": "では、スタブは、簡単な仕様だったら私が作りましょう。気分転換にいいしね。テストデータは、誰かに頼んでみます。"}, {"spk": "リー", "t": "すみません。すごく助かります。"}, {"spk": "井出", "t": "まあ、この遅れはリーさんのせいじゃないから心配しないで。じゃあ、スタブとテストデータのことは昼食後に連絡しますので。"}, {"spk": "リー", "t": "ありがとうございます。よろしくお願いします。"}], "note": ""}, {"track": 26, "chapter": 2, "unit": 9, "unitJp": "遅延報告", "unitVi": "Báo cáo chậm tiến độ", "type": "聞き取り練習 (Luyện nghe)", "chars": "ラジュ (Raju) / 井出 (Ide)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "井出さん、ちょっとよろしいですか。"}, {"spk": "井出", "t": "はい、何でしょうか。"}, {"spk": "ラジュ", "t": "実は、少し遅れが出そうで……。"}, {"spk": "井出", "t": "先週は風邪で二日も休みましたからね。どのぐらい遅れそうですか。"}, {"spk": "ラジュ", "t": "週末までの締め切りを、週明けにしていただければ助かります。"}, {"spk": "井出", "t": "土日も働くんですか。体調はもういいの？"}, {"spk": "ラジュ", "t": "まだよくないんですが、私の責任ですから。"}, {"spk": "井出", "t": "いや、週末はよく休んでください。締め切りは水曜日まで延ばせますから。"}, {"spk": "ラジュ", "t": "すみません、助かります。"}, {"spk": "井出", "t": "でも、今後は体調管理をしっかりやってくださいね。"}, {"spk": "ラジュ", "t": "わかりました。気を付けます。"}], "note": ""}, {"track": 27, "chapter": 2, "unit": 10, "unitJp": "担当モジュール完成報告", "unitVi": "Báo cáo hoàn thành module phụ trách", "type": "モデル会話 (Hội thoại mẫu)", "chars": "リー (Li) / 大沢 (Osawa)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "大沢さん、すみません。"}, {"spk": "大沢", "t": "はい。"}, {"spk": "リー", "t": "私が担当していた四つのモジュールですが、すべて単体テストが終わりました。"}, {"spk": "大沢", "t": "お疲れさまでした。早かったですね。えーっと、リーさんの担当はどこでしたっけ。"}, {"spk": "リー", "t": "店舗情報管理です。"}, {"spk": "大沢", "t": "そうでしたね。では、テスト結果報告書とバグ票の提出をお願いします。"}, {"spk": "リー", "t": "はい、これです。"}, {"spk": "大沢", "t": "それから、ラジュさんがちょっと遅れているので、彼の担当を手伝ってください。"}, {"spk": "リー", "t": "わかりました。ラジュさんの担当はどこですか。"}, {"spk": "大沢", "t": "仕入管理機能です。仕入マスタ処理はラジュさんが終わらせますから、発注データ処理の方をお願いします。"}, {"spk": "リー", "t": "仕入管理機能の発注データ処理のモジュールですね。詳細設計書をいただけますか。"}, {"spk": "大沢", "t": "ちょっと手元にないので、ラジュさんが持っているのを、自分でコピーしてください。"}, {"spk": "リー", "t": "わかりました。"}, {"spk": "大沢", "t": "じゃ、よろしく。"}], "note": ""}, {"track": 28, "chapter": 2, "unit": 10, "unitJp": "担当モジュール完成報告", "unitVi": "Báo cáo hoàn thành module phụ trách", "type": "聞き取り練習 (Luyện nghe)", "chars": "ラジュ (Raju) / 大沢 (Osawa)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "大沢さん、ちょっとよろしいですか。"}, {"spk": "大沢", "t": "はい。"}, {"spk": "ラジュ", "t": "ようやくできました。"}, {"spk": "大沢", "t": "お疲れさま。"}, {"spk": "ラジュ", "t": "1日遅れてしまいまして、申し訳ありません。"}, {"spk": "大沢", "t": "いや、体調が悪かったのに、よくがんばりましたよ。担当は仕入管理でしたよね。テスト結果報告書とバグ票をお願いします。"}, {"spk": "ラジュ", "t": "はい。こちらです。"}, {"spk": "大沢", "t": "あれ？ 発注データ処理は？"}, {"spk": "ラジュ", "t": "発注データ処理はリーさんがやってくれました。"}, {"spk": "大沢", "t": "ああ、そうそう。そうでしたね。じゃ、次は結合テストなので、とりあえずテスト仕様書を読んでおいてください。"}, {"spk": "ラジュ", "t": "はい。"}, {"spk": "大沢", "t": "それから、結合テスト結果報告書とバグ票の書式は後でメールで送ります。結合テストの後で持ってきてください。"}, {"spk": "ラジュ", "t": "わかりました。"}], "note": ""}, {"track": 29, "chapter": 2, "unit": 11, "unitJp": "結合テスト", "unitVi": "Kiểm thử tích hợp (Combination Test)", "type": "モデル会話 (Hội thoại mẫu)", "chars": "大沢 (Osawa) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "リーさん、ちょっといいですか。"}, {"spk": "リー", "t": "はい。"}, {"spk": "大沢", "t": "店舗情報管理機能を担当したのはリーさんでしたよね。"}, {"spk": "リー", "t": "はい、私です。"}, {"spk": "大沢", "t": "実は今、店舗情報管理機能と販売管理機能の結合テストをしているんですが、店舗マスターを参照するとエラーが出てしまうんです。"}, {"spk": "リー", "t": "そうなんですか。店舗情報側の問題ですか。"}, {"spk": "大沢", "t": "そうかもしれません。それでちょっと確認したいんですが、店舗マスターの主キーは店舗コードに設定されていますか。"}, {"spk": "リー", "t": "はい、そうしてあります。"}, {"spk": "大沢", "t": "そうですか。じゃ、店舗コードのデータ型は、どうなっていますか。"}, {"spk": "リー", "t": "整数型にしてあると思いますが。"}, {"spk": "大沢", "t": "仕様書ではテキスト型になっているので、仕様書のとおりにしてください。"}, {"spk": "リー", "t": "え、そうでしたか。すみません。すぐ直します。"}, {"spk": "大沢", "t": "お願いします。"}, {"spk": "リー", "t": "つまり、店舗名だけでなく、店舗コードもテキスト型にするということですね。"}, {"spk": "大沢", "t": "そのとおりです。よろしく。"}], "note": ""}, {"track": 30, "chapter": 2, "unit": 11, "unitJp": "結合テスト", "unitVi": "Kiểm thử tích hợp (Combination Test)", "type": "聞き取り練習 (Luyện nghe)", "chars": "大沢 (Osawa) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "大沢", const LS_KEY = "jp_learn_v1";
const INTERVALS = [0, 1, 2, 4, 7, 15, 30];
let store = load();
if(!store.deckDone) store.deckDone={}; // migrate: user cũ chưa có field này
if(!store.favorites) store.favorites={}; // migrate: user cũ chưa có field này
function load(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || defaultStore(); }
  catch(e){ return defaultStore(); }
}
function defaultStore(){ return {cards:{},stats:{studied:0,streak:0,lastDay:null},deckDone:{},favorites:{}}; }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
function today(){ return new Date().toISOString().slice(0,10); }
function cardState(id){
  if(!store.cards[id]) store.cards[id] = {box:0, due:today(), correct:0, seen:0, mastered:false};
  return store.cards[id];
}
function isMastered(id){ var c=store.cards[id]; return !!(c && c.mastered); }
function toggleMastered(id){ var c=cardState(id); c.mastered=!c.mastered; save(); return c.mastered; }
function isFavorite(id){ return !!store.favorites[id]; }
function toggleFavorite(id){
  if(store.favorites[id]) delete store.favorites[id]; else store.favorites[id]=true;
  save();
  return isFavorite(id);
}
function isDue(id){
  const c = store.cards[id];
  if(!c) return true;
  return c.due <= today();
}
function reviewCard(id, quality){
  const c = cardState(id);
  c.seen++;
  if(quality===0){ c.box=Math.max(0,c.box-1); }
  else if(quality===1){ /* stay */ }
  else if(quality===2){ c.box=Math.min(INTERVALS.length-1,c.box+1); c.correct++; }
  else { c.box=Math.min(INTERVALS.length-1,c.box+2); c.correct++; }
  const d = new Date(); d.setDate(d.getDate()+INTERVALS[c.box]);
  c.due = d.toISOString().slice(0,10);
  bumpStudied();
  save();
}
function bumpStudied(){
  const t=today();
  if(store.stats.lastDay!==t){
    const y=new Date(); y.setDate(y.getDate()-1);
    store.stats.streak = (store.stats.lastDay===y.toISOString().slice(0,10))? store.stats.streak+1 : 1;
    store.stats.lastDay=t;
  }
  store.stats.studied++;
}
function learnedCount(){ return Object.values(store.cards).filter(c=>c.box>=3||c.mastered).length; }
function dueCount(list){ return list.filter(v=>isDue(v.id)).length; }

/* Đánh dấu 1 bộ (deck) đã hoàn thành 1 mode — ns = namespace (category, hoặc '_reading'/'_kaiwa') */
function markDeckDone(ns, deckIdx, mode){
  if(!store.deckDone[ns]) store.deckDone[ns]={};
  if(!store.deckDone[ns][deckIdx]) store.deckDone[ns][deckIdx]={};
  store.deckDone[ns][deckIdx][mode]=true;
  save();
}
function deckDoneModes(ns, deckIdx){
  return (store.deckDone[ns] && store.deckDone[ns][deckIdx]) || {};
}

/* ═══════════════ SPEECH (Google Translate TTS + Device fallback) ═══════════════ */
let allJaVoices=[];
let jaVoice=null;
let currentAudio=null;
let currentGyoumuAudio=null;

function loadJaVoices(){
  if(!('speechSynthesis' in window)) return;
  var vs=speechSynthesis.getVoices();
  allJaVoices = vs.filter(function(v){return v.lang==='ja-JP'||v.lang.startsWith('ja');});
  pickVoiceByGender();
}
function pickVoiceByGender(){
  if(allJaVoices.length===0){ jaVoice=null; return; }
  // Try to use saved voiceName first
  if(ttsSettings.voiceName){
    var saved = allJaVoices.find(function(v){return v.name===ttsSettings.voiceName;});
    if(saved){ jaVoice=saved; return; }
  }
  // Heuristic: female names often contain keywords
  var femaleKw = ['female','woman','haruka','kyoko','nanami','o-ren','misaki','ren','女'];
  var maleKw = ['male','man','ichiro','keita','otoya','takumi','男'];
  var kw = ttsSettings.gender==='male' ? maleKw : femaleKw;
  var match = allJaVoices.find(function(v){
    var n=v.name.toLowerCase();
    return kw.some(function(k){return n.indexOf(k)>=0;});
  });
  jaVoice = match || allJaVoices[0];
}
if('speechSynthesis' in window){
  loadJaVoices();
  speechSynthesis.onvoiceschanged=loadJaVoices;
  setTimeout(loadJaVoices, 500);
}

function stopSpeech(){
  if(currentAudio){ try{currentAudio.pause();currentAudio.currentTime=0;}catch(e){} currentAudio=null; }
  if(currentGyoumuAudio){ try{currentGyoumuAudio.pause();}catch(e){} }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

/* Google Translate TTS — using googleapis.com/gtx endpoint (more reliable) */
function gTranslateTTSUrl(text, speed){
  var t = encodeURIComponent(text.substring(0,200));
  var spd = speed || ttsSettings.speed || 0.9;
  // googleapis endpoint supports ttsspeed parameter
  return 'https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=ja&client=gtx&ttsspeed='+spd+'&q='+t;
}

/* Split long text into chunks for Google TTS (max ~200 chars per request) */
function splitText(text, maxLen){
  if(text.length<=maxLen) return [text];
  var chunks=[], remaining=text;
  while(remaining.length>0){
    if(remaining.length<=maxLen){ chunks.push(remaining); break; }
    var cut=remaining.lastIndexOf('。', maxLen);
    if(cut<1) cut=remaining.lastIndexOf('、', maxLen);
    if(cut<1) cut=remaining.lastIndexOf(' ', maxLen);
    if(cut<1) cut=maxLen;
    else cut=cut+1;
    chunks.push(remaining.substring(0,cut));
    remaining=remaining.substring(cut);
  }
  return chunks;
}

function playAudioUrl(url){
  return new Promise(function(resolve){
    stopSpeech();
    currentAudio = new Audio(url);
    currentAudio.onended = function(){ currentAudio=null; resolve(); };
    currentAudio.onerror = function(){ currentAudio=null; resolve('error'); };
    currentAudio.play().catch(function(){ resolve('error'); });
  });
}

/* Device voice (offline) — applies speed, pitch, voice settings */
function deviceSpeak(text, rateOverride){
  if(!('speechSynthesis' in window)||!text) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';
  u.rate = rateOverride || ttsSettings.speed || 0.9;
  u.pitch = ttsSettings.pitch || 1.0;
  if(jaVoice) u.voice=jaVoice;
  speechSynthesis.speak(u);
}
function deviceSpeakAsync(text, rateOverride){
  return new Promise(function(resolve){
    if(!('speechSynthesis' in window)||!text){ resolve(); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';
    u.rate = rateOverride || ttsSettings.speed || 0.9;
    u.pitch = ttsSettings.pitch || 1.0;
    if(jaVoice) u.voice=jaVoice;
    u.onend=resolve; u.onerror=resolve;
    speechSynthesis.speak(u);
  });
}

/* Main speak: Google TTS (online) → device fallback (offline) */
async function speak(text, rateOverride){
  if(!text) return;
  stopSpeech();
  var speed = rateOverride || ttsSettings.speed || 0.9;
  if(ttsSettings.mode==='google'){
    var chunks = splitText(text, 200);
    var url = gTranslateTTSUrl(chunks[0], speed);
    var result = await playAudioUrl(url);
    if(result==='error'){
      deviceSpeak(text, speed);
      return;
    }
    for(var ci=1; ci<chunks.length; ci++){
      url = gTranslateTTSUrl(chunks[ci], speed);
      await playAudioUrl(url);
    }
    return;
  }
  deviceSpeak(text, speed);
}

async function speakAsync(text, rateOverride){
  if(!text) return;
  stopSpeech();
  var speed = rateOverride || ttsSettings.speed || 0.9;
  if(ttsSettings.mode==='google'){
    var chunks = splitText(text, 200);
    for(var ci=0; ci<chunks.length; ci++){
      var url = gTranslateTTSUrl(chunks[ci], speed);
      var result = await playAudioUrl(url);
      if(result==='error'){
        await deviceSpeakAsync(text, speed);
        return;
      }
    }
    return;
  }
  await deviceSpeakAsync(text, speed);
}
