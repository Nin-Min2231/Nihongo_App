/* ═══════════════ MICROPHONE / SPEECH RECOGNITION ═══════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micPermission = 'unknown'; // 'unknown' | 'granted' | 'denied' | 'unsupported'

async function checkMicPermission(){
  if(!SR){ micPermission='unsupported'; return micPermission; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    // Older browser or file:// protocol — try SR directly
    micPermission='unknown';
    return micPermission;
  }
  try{
    const result = await navigator.permissions.query({name:'microphone'});
    micPermission = result.state; // 'granted','denied','prompt'
    result.onchange = ()=>{ micPermission=result.state; };
    return micPermission;
  }catch(e){
    // permissions API not supported, try directly
    micPermission='unknown';
    return micPermission;
  }
}

async function requestMicPermission(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    // Fallback: try starting SR directly — it will prompt
    return new Promise(resolve=>{
      if(!SR){ micPermission='unsupported'; resolve(false); return; }
      const test = new SR();
      test.lang='ja-JP';
      test.onresult=()=>{ micPermission='granted'; test.stop(); resolve(true); };
      test.onerror=(e)=>{
        if(e.error==='not-allowed') micPermission='denied';
        resolve(e.error!=='not-allowed');
      };
      test.onend=()=>resolve(micPermission==='granted');
      try{ test.start(); setTimeout(()=>{try{test.stop();}catch(e){}},2000); }
      catch(e){ resolve(false); }
    });
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop()); // release immediately
    micPermission='granted';
    return true;
  }catch(e){
    micPermission='denied';
    return false;
  }
}

/* Android WebView (app đóng gói Capacitor) không hề implement Web Speech API —
   dùng native plugin @capgo/capacitor-speech-recognition khi chạy trong app,
   fallback Web Speech API khi chạy trên trình duyệt (desktop/Android Chrome/iOS Safari) */
function isNativeApp(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
function nativeSR(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechRecognition; }
let activeWebRec=null;

async function ensureMicReady(){
  if(isNativeApp() && nativeSR()){
    var p=nativeSR();
    var perm = await p.checkPermissions();
    if(perm.speechRecognition==='granted') return true;
    perm = await p.requestPermissions();
    return perm.speechRecognition==='granted';
  }
  if(micPermission==='granted') return true;
  return await requestMicPermission();
}

/* Ghi âm 1 câu, trả về Promise<string[]> danh sách transcript ứng viên */
async function recognizeOnce(lang){
  if(isNativeApp() && nativeSR()){
    var res = await nativeSR().start({language:lang, maxResults:3, partialResults:false, popup:false});
    return res.matches || [];
  }
  return new Promise(function(resolve,reject){
    if(!SR){ reject('unsupported'); return; }
    var rec=new SR(); rec.lang=lang; rec.interimResults=false; rec.maxAlternatives=3; rec.continuous=false;
    activeWebRec=rec;
    rec.onresult=function(e){ resolve([].slice.call(e.results[0]).map(function(r){return r.transcript;})); };
    rec.onerror=function(e){ reject(e.error); };
    rec.onend=function(){ activeWebRec=null; };
    try{ rec.start(); }catch(err){ reject('start-failed'); }
  });
}
function cancelRecognition(){
  if(isNativeApp() && nativeSR()){ try{ nativeSR().stop(); }catch(e){} }
  else if(activeWebRec){ try{ activeWebRec.stop(); }catch(e){} activeWebRec=null; }
}

function hasSR(){ return !!SR || (isNativeApp() && !!nativeSR()); }

function micBannerHTML(){
  if(micPermission==='granted' || micPermission==='unsupported') return '';
  if(micPermission==='denied') return '<div class="mic-banner">Quyền microphone bị từ chối. Vào <b>Cài đặt trình duyệt → Quyền trang web</b> để bật lại mic cho trang này.</div>';

}

/* text similarity for pronunciation scoring */
function normJa(s){ return (s||'').replace(/[、。「」『』（）\(\)\s.,!?！？・ー〜~]/g,''); }
function similarity(a,b){
  a=normJa(a); b=normJa(b);
  if(!a||!b) return 0;
  if(a===b) return 100;
  const m=a.length,n=b.length,dp=Array(n+1).fill(0);
  for(let i=1;i<=m;i++){let prev=0;for(let j=1;j<=n;j++){const t=dp[j];dp[j]=a[i-1]===b[j-1]?prev+1:Math.max(dp[j],dp[j-1]);prev=t;}}
  return Math.round(dp[n]/Math.max(m,n)*100);
}

/* Luyện đọc/Kaiwa không lọc theo chủ đề — luôn dùng toàn bộ từ có câu ví dụ, không phụ thuộc curCat */
function allWithEx(){ return VOCAB.filter(function(v){return v.ex && v.ex.trim().length>4;}); }
/* Chia đều một mảng thành các "bộ" ~DECK_SIZE phần tử, dồn số dư rải đều thay vì dồn hết bộ cuối */
function splitDecks(arr, target){
  target = target || DECK_SIZE;
  var n = arr.length;
  if(n===0) return [];
  var numDecks = Math.max(1, Math.round(n/target));
  var base = Math.floor(n/numDecks), extra = n % numDecks;
  var decks = [], idx = 0;
  for(var i=0;i<numDecks;i++){
    var size = base + (i<extra?1:0);
    decks.push(arr.slice(idx, idx+size));
    idx += size;
  }
  return decks;
}
function deckPool(){
  var p = pool();
  if(curDeck==='ALL') return p;
  var decks = splitDecks(p);
  return decks[parseInt(curDeck,10)] || p;
}

const DECK_GRID_PAGE_SIZE=4;
/* Lưới thẻ bộ dùng chung (IT専門 dashboard + Reading/Kaiwa library) — items:[{key,label,icons:[{icon,done}]}]
   Thẻ tự chuyển xanh lá (.done) khi TẤT CẢ icon truyền vào đều đã hoàn thành (IT専門: đủ 4 mode; Reading/Kaiwa: mode duy nhất của nó) */
function deckGridHTML(idPrefix, items, page){
  var totalPages = Math.max(1, Math.ceil(items.length/DECK_GRID_PAGE_SIZE));
  page = Math.max(0, Math.min(page, totalPages-1));
  var pageItems = items.slice(page*DECK_GRID_PAGE_SIZE, page*DECK_GRID_PAGE_SIZE+DECK_GRID_PAGE_SIZE);
  return '<div class="deck-grid-wrap">'+
    '<button class="pager-btn" id="'+idPrefix+'Prev"'+(page<=0?' disabled':'')+'>‹</button>'+
    '<div class="deck-grid">'+
      pageItems.map(function(it){
        var icons = it.icons.filter(function(i){return i.done;}).map(function(i){return '<span>'+i.icon+'</span>';}).join('');
        var allDone = it.icons.every(function(i){return i.done;});
        return '<button class="deck-card'+(allDone?' done':'')+(it.selected?' on':'')+'" data-key="'+it.key+'">'+
          '<div class="deck-icons">'+icons+'</div>'+
          '<div class="deck-label">'+it.label+'</div>'+
        '</button>';
      }).join('')+
    '</div>'+
    '<button class="pager-btn" id="'+idPrefix+'Next"'+(page>=totalPages-1?' disabled':'')+'>›</button>'+
  '</div>';
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n,exclude){ return shuffle(arr.filter(x=>x!==exclude)).slice(0,n); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function gyoumuTrackDetail(trackId){
  var track = GYOUMU.find(function(t){return t.track===trackId;});
  if(!track){ gyoumuDashboard(); return; }
  onBack=function(){ gyoumuTrackList(track.chapter, track.unit); };
  setHeader('Track '+track.track, esc(track.unitJp)+' · '+esc(track.type), true);

  var fname=(track.track<10?'0':'')+track.track+' Track '+track.track+'.mp3';
  var src=encodeURI('audio/'+fname);
  var showTranscript=false;

  function fmtTime(s){
    if(!isFinite(s)) return '0:00';
    var m=Math.floor(s/60), sec=Math.floor(s%60);
    return m+':'+(sec<10?'0':'')+sec;
  }

  var transcriptHtml = track.hasTranscript ?
    track.lines.map(function(l){
      return '<div class="transcript-line">'+(l.spk?'<b>'+esc(l.spk)+'：</b>':'')+esc(l.t)+'</div>';
    }).join('') : '';

  main.innerHTML=
    '<div class="player-card">'+
      '<span class="tag">'+esc(track.type)+'</span>'+
      (track.chars?'<div style="font-size:13px;color:var(--sub);margin-top:6px">'+esc(track.chars)+'</div>':'')+
      '<div><button class="play-btn" id="playBtn">▶️</button></div>'+
      '<div class="progress-row">'+
        '<span class="ptime" id="curT">0:00</span>'+
        '<input type="range" id="seek" min="0" max="1000" value="0">'+
        '<span class="ptime" id="durT">0:00</span>'+
      '</div>'+
      '<div class="player-controls">'+
        '<button class="speed-btn" data-rate="0.75">0.75x</button>'+
        '<button class="speed-btn on" data-rate="1">1x</button>'+
        '<button class="speed-btn" data-rate="1.25">1.25x</button>'+
        '<button class="btn btn-ghost" id="replayBtn" style="padding:8px 12px;font-size:13px;width:auto">↺ Nghe lại</button>'+
      '</div>'+
    '</div>'+
    '<button class="btn btn-ghost" id="toggleTranscript" style="width:100%"'+(track.hasTranscript?'':' disabled')+'>'+
      (track.hasTranscript ? '🔒 Hiện transcript' : '🔒 Transcript không khả dụng') +
    '</button>'+
    (track.hasTranscript ?
      '<div class="transcript-panel hidden" id="transcriptPanel">'+transcriptHtml+'</div>'
      : '<div class="note">Transcript không khả dụng cho track này (thiếu trang trong bản scan gốc). Bạn vẫn có thể nghe audio bình thường.</div>')+
    (track.hasTranscript ?
      '<button class="btn btn-primary" id="toReading" style="margin-top:16px">🎤 Luyện đọc câu</button>'
      : '')+
    '<audio id="gaEl" preload="none"></audio>';

  var audioEl=$('#gaEl'), playBtn=$('#playBtn'), seek=$('#seek'), curT=$('#curT'), durT=$('#durT');
  audioEl.src=src;
  currentGyoumuAudio=audioEl;
  var seeking=false;

  audioEl.addEventListener('loadedmetadata',function(){ durT.textContent=fmtTime(audioEl.duration); });
  audioEl.addEventListener('timeupdate',function(){
    if(seeking) return;
    curT.textContent=fmtTime(audioEl.currentTime);
    if(audioEl.duration) seek.value=Math.round(audioEl.currentTime/audioEl.duration*1000);
  });
  audioEl.addEventListener('ended',function(){
    playBtn.textContent='▶️';
    gyStore.listened[track.track]=true; saveGyoumu();
  });
  audioEl.addEventListener('error',function(){
    $('.player-card').insertAdjacentHTML('beforeend',
      '<div class="note">Không tải được file audio. Kiểm tra thư mục audio/ có nằm cạnh file HTML không.</div>');
  });

  playBtn.onclick=function(){
    if(audioEl.paused){ stopSpeech(); currentGyoumuAudio=audioEl; audioEl.play(); playBtn.textContent='⏸'; }
    else { audioEl.pause(); playBtn.textContent='▶️'; }
  };
  seek.addEventListener('input',function(){
    seeking=true;
    curT.textContent=fmtTime(seek.value/1000*(audioEl.duration||0));
  });
  seek.addEventListener('change',function(){
    if(audioEl.duration) audioEl.currentTime=seek.value/1000*audioEl.duration;
    seeking=false;
  });
  $('#replayBtn').onclick=function(){ audioEl.currentTime=0; audioEl.play(); playBtn.textContent='⏸'; };
  main.querySelectorAll('.speed-btn').forEach(function(b){
    b.onclick=function(){
      main.querySelectorAll('.speed-btn').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      audioEl.playbackRate=parseFloat(b.dataset.rate);
    };
  });

  if(track.hasTranscript){
    $('#toggleTranscript').onclick=function(){
      showTranscript=!showTranscript;
      $('#transcriptPanel').classList.toggle('hidden',!showTranscript);
      $('#toggleTranscript').textContent = showTranscript? '👁 Ẩn transcript' : '🔒 Hiện transcript';
    };
    $('#toReading').onclick=function(){ audioEl.pause(); gyoumuReadingMode(track); };
  }
}

function gyoumuReadingMode(track){
  onBack=function(){ gyoumuTrackDetail(track.track); };
  var queue=track.lines.filter(function(l){return l.t && l.t.trim().length>0;});
  if(!queue.length){
    setHeader('Luyện đọc','',true);
    main.innerHTML='<div class="note">Track này không có dòng hội thoại để luyện đọc.</div>';
    return;
  }
  var i=0, total=0, sum=0, slowMode=false;

  function render(){
    if(i>=queue.length) return gyoumuReadingFinish(track, queue.length, total?Math.round(sum/total):0);
    var l=queue[i];
    setHeader('Luyện đọc',(i+1)+' / '+queue.length,true);
    var micSupport = hasSR() && micPermission!=='denied' && micPermission!=='unsupported';
    main.innerHTML=
      '<div class="counter">Nghe → Đọc to → Kiểm tra phát âm</div>'+
      '<div class="sent-card">'+
        (l.spk?'<div class="sent-word">🗣 '+esc(l.spk)+'</div>':'')+
        '<div class="sent-jp">'+esc(l.t)+'</div>'+
        '<div class="sent-controls">'+
          '<button class="speaker" id="spk" style="margin:0">🔊</button>'+
          '<button class="speed-btn '+(slowMode?'on':'')+'" id="slowBtn">🐢 Chậm</button>'+
        '</div>'+
      '</div>'+
      (micSupport?
        '<div style="text-align:center;margin-top:14px">'+
          '<button class="btn btn-primary" id="micBtn" style="display:inline-flex;align-items:center;gap:8px;width:auto;padding:14px 28px;font-size:16px;border-radius:99px">'+
            '<span style="font-size:22px">🎤</span> Luyện đọc'+
          '</button>'+
          '<div class="qhint" id="mhint">Chạm để thu giọng và chấm phát âm</div>'+
          '<div class="heard hidden" id="heard"></div>'+
          '<div class="fb" id="fb"></div>'+
        '</div>'
      :'')+
      '<div style="margin-top:16px">'+
        '<button class="btn btn-primary" id="next">Câu tiếp theo →</button>'+
      '</div>';

    $('#spk').onclick=function(){speak(l.t, slowMode?0.65:0.9);};
    setTimeout(function(){speak(l.t, slowMode?0.65:0.9);},300);
    $('#slowBtn').onclick=function(){
      slowMode=!slowMode;
      $('#slowBtn').classList.toggle('on',slowMode);
      speak(l.t, slowMode?0.65:0.9);
    };
    $('#next').onclick=function(){i++;render();};

    if(micSupport && $('#micBtn')) setupMic(l);
  }

  function setupMic(l){
    var micBtn=$('#micBtn'), hint=$('#mhint'), heard=$('#heard'), fb=$('#fb');
    var listening=false;
    micBtn.onclick=async function(){
      if(listening){ cancelRecognition(); return; }
      try{
        var ok = await ensureMicReady();
        if(!ok){ hint.textContent='Mic bị từ chối.'; return; }
        listening=true;
        micBtn.style.background='var(--bad)';
        micBtn.innerHTML='<span style="font-size:22px">⏹</span> Đang nghe...';
        hint.textContent='Hãy đọc to câu này';
        var alts = await recognizeOnce('ja-JP');
        var best=Math.max.apply(null,alts.map(function(a){return similarity(a,l.t);}));
        heard.classList.remove('hidden'); heard.textContent='Bạn đọc: '+alts[0];
        total++; sum+=best;
        fb.innerHTML = best>=80?'<span class="ok">🌟 Tuyệt! '+best+' điểm</span>'
                     : best>=55?'<span class="ok">👍 Khá: '+best+' điểm</span>'
                     : '<span class="no">💪 '+best+' điểm — thử lại</span>';
      }catch(err){
        hint.textContent='Lỗi: '+err;
        if(err==='not-allowed') micPermission='denied';
      }finally{
        micBtn.style.background=''; micBtn.innerHTML='<span style="font-size:22px">🎤</span> Luyện đọc'; listening=false;
      }
    };
  }
  render();
}

function gyoumuReadingFinish(track,total,avgScore){
  var prevBest = (gyStore.read[track.track]||{}).bestAvg||0;
  var bestAvg = Math.max(prevBest, avgScore);
  gyStore.read[track.track] = {bestAvg:bestAvg, attempts:((gyStore.read[track.track]||{}).attempts||0)+1};
  saveGyoumu();
  setHeader('Hoàn thành','',true);
  main.innerHTML=
    '<div class="done">'+
      '<div class="big">📖</div>'+
      '<h2>Xong buổi đọc!</h2>'+
      '<p>Đã luyện đọc <b>'+total+'</b> câu hội thoại</p>'+
      '<p style="color:var(--sub);font-size:14px">Điểm phát âm trung bình: <b>'+avgScore+'</b>/100 · Tốt nhất: '+bestAvg+'/100</p>'+
      '<div class="row" style="margin-top:20px">'+
        '<button class="btn btn-ghost" id="again">Đọc lại</button>'+
        '<button class="btn btn-primary" id="hm">Về danh sách track</button>'+
      '</div>'+
    '</div>';
  $('#hm').onclick=function(){ gyoumuTrackDetail(track.track); };
  $('#again').onclick=function(){ gyoumuReadingMode(track); };
}

      '<div class="stat"><div class="n">'+learned+'</div><div class="l">Đã thuộc</div></div>'+
      '<div class="stat"><div class="n">'+(store.stats.streak||0)+'</div><div class="l">Streak</div></div>'+

      '<div class="t"><span>Tiến độ ghi nhớ</span><span>'+pct+'%</span></div>'+

    '</div>'+
    '<div class="sectitle">Chủ đề</div>'+
    '<div class="chips">'+
      catBtn('ALL','Tất cả ('+VOCAB.length+')')+
      cats.map(function(c){return catBtn(c,c+' ('+VOCAB.filter(function(v){return v.c===c}).length+')');}).join('')+
    '</div>'+
    (decks.length>1?
      '<div class="sectitle">Bộ học</div>'+
      deckGridHTML('deck', deckItems, deckPage)
    :'')+
    '<div class="sectitle">Chế độ học'+(curDeck!=='ALL'?' · Bộ '+(parseInt(curDeck,10)+1):'')+'</div>'+
    '<div class="modes">'+
      '<button class="mode '+(due>0?'due':'')+'" data-due="'+due+' due" data-mode="flash">'+
        '<span class="ico">🗂️</span><div class="mt">Flashcard</div><div class="md">Lật thẻ + SRS</div></button>'+
      '<button class="mode" data-mode="quiz">'+
        '<span class="ico">✍️</span><div class="mt">Quiz</div><div class="md">Trắc nghiệm JP↔VI</div></button>'+
      '<button class="mode" data-mode="listen">'+
        '<span class="ico">🎧</span><div class="mt">Luyện nghe</div><div class="md">Nghe rồi chọn nghĩa</div></button>'+
      '<button class="mode" data-mode="speak">'+
        '<span class="ico">🎤</span><div class="mt">Luyện nói</div><div class="md">Đọc theo, chấm phát âm</div></button>'+
      '<button class="mode" data-mode="favorites">'+
        '<span class="ico">⭐</span><div class="mt">Yêu thích</div><div class="md">'+(Object.keys(store.favorites).length?Object.keys(store.favorites).length+' từ đã lưu':'Chưa có từ nào')+'</div></button>'+

  main.querySelectorAll('.chip[data-cat]').forEach(function(c){c.onclick=function(){curCat=c.dataset.cat;curDeck='ALL';deckPage=0;homeDashboard();};});

    m.onclick=function(){
      if(m.dataset.mode==='favorites') favoritesMode();

function startMode(m){
  const list=deckPool();
  if(list.length<4){ alert('Bộ này cần ít nhất 4 từ.'); return; }
  if(m==='flash') flashMode(list);
  else if(m==='quiz')  quizMode(list);
  else if(m==='listen')listenMode(list);
  else if(m==='speak') speakModeInit(list);
}

/* ═══════════════ FLASHCARD + SRS ═══════════════ */
function flashMode(list){
  onBack=homeDashboard;
  list = list.filter(function(v){return !isMastered(v.id);});
  if(!list.length){ main.innerHTML='<div class="note">Bạn đã thuộc hết từ trong bộ này! 🎉</div>'; setHeader('Flashcard','',true); return; }
  const due=list.filter(function(v){return isDue(v.id);});
  const queue = curDeck==='ALL' ? (due.length?due:shuffle(list)).slice(0,20) : shuffle(list);
  var i=0, flipped=false;
  setHeader('Flashcard','SRS · '+queue.length+' thẻ',true);
  function render(){
    if(i>=queue.length){ return finish('flash', queue.length); }
    var v=queue[i]; flipped=false;
    setHeader('Flashcard', (i+1)+' / '+queue.length, true);
    var masteredCount = list.filter(function(x){return isMastered(x.id);}).length;
    main.innerHTML=
      '<div class="counter">Chạm thẻ để xem nghĩa</div>'+
      '<div class="mastered-link'+(masteredCount>0?'':' hidden')+'" id="masteredLink">✅ <b id="masteredCount">'+masteredCount+'</b> từ đã thuộc trong bộ này</div>'+
      '<div class="card" id="card">'+
        '<span class="tag">'+v.c+' · #'+v.id+'</span>'+
        '<div class="jp">'+esc(v.w)+'</div>'+
        '<div id="answer" class="hidden">'+
          '<div class="reading">'+esc(v.r)+'</div>'+
          '<div class="mean">'+esc(v.vi)+'</div>'+
          '<div class="en">'+esc(v.en)+'</div>'+
          (v.ex?'<div class="ex">'+esc(v.ex)+'</div>':'')+
        '</div>'+
        '<button class="speaker" id="spk">🔊</button>'+
      '</div>'+
      '<div class="card-actions">'+
        '<button class="btn btn-ghost" id="toggleDetail">👁 Xem chi tiết</button>'+
        '<button class="btn btn-ghost" id="favBtn">'+(isFavorite(v.id)?'❤️ Yêu thích':'🤍 Yêu thích')+'</button>'+
        '<button class="btn btn-ghost" id="masterBtn">'+(isMastered(v.id)?'✅ Đã thuộc':'☐ Đã nhớ')+'</button>'+
        '<button class="btn btn-ghost" id="nextBtn">Từ tiếp theo →</button>'+
      '</div>'+
      '<div id="srs" class="srs hidden">'+
        '<button class="btn again" data-q="0">また<span class="sub">Quên</span></button>'+
        '<button class="btn hard" data-q="1">難しい<span class="sub">Khó</span></button>'+
        '<button class="btn good" data-q="2">できた<span class="sub">Được</span></button>'+
        '<button class="btn easy" data-q="3">簡単<span class="sub">Dễ</span></button>'+
      '</div>';

    function setFlipped(state){
      flipped=state;
      $('#answer').classList.toggle('hidden',!flipped);
      $('#srs').classList.toggle('hidden',!flipped);
      $('#toggleDetail').textContent = flipped?'🙈 Ẩn chi tiết':'👁 Xem chi tiết';
      if(flipped) speak(v.w);
    }
    $('#spk').onclick=function(e){e.stopPropagation();speak(v.w);};
    $('#card').onclick=function(){ setFlipped(!flipped); };
    $('#toggleDetail').onclick=function(e){ e.stopPropagation(); setFlipped(!flipped); };
    $('#favBtn').onclick=function(e){
      e.stopPropagation();
      var fav=toggleFavorite(v.id);
      $('#favBtn').textContent = fav?'❤️ Yêu thích':'🤍 Yêu thích';
    };
    $('#masterBtn').onclick=function(e){
      e.stopPropagation();
      var mastered=toggleMastered(v.id);
      $('#masterBtn').textContent = mastered?'✅ Đã thuộc':'☐ Đã nhớ';
      var cnt=list.filter(function(x){return isMastered(x.id);}).length;
      $('#masteredCount').textContent=cnt;
      $('#masteredLink').classList.toggle('hidden',cnt===0);
    };
    $('#nextBtn').onclick=function(e){ e.stopPropagation(); i++; render(); };
    $('#masteredLink').onclick=function(){ masteredListScreen(list, function(){ flashMode(list); }); };
    main.querySelectorAll('#srs .btn').forEach(function(b){b.onclick=function(){ reviewCard(v.id,+b.dataset.q); i++; render(); };});
  }
  render();
}

}

/* ═══════════════ QUIZ ═══════════════ */
function quizMode(list){
  onBack=homeDashboard;
  list = list.filter(function(v){return !isMastered(v.id);});
  if(list.length<4){ main.innerHTML='<div class="note">Bạn đã thuộc gần hết từ trong bộ này, cần ít nhất 4 từ chưa thuộc để tạo Quiz! 🎉</div>'; setHeader('Quiz','',true); return; }
  var queue = curDeck==='ALL' ? shuffle(list).slice(0,15) : shuffle(list);
  var i=0, score=0;
  function render(){
    if(i>=queue.length) return finish('quiz',queue.length,score);
    var v=queue[i];
    var jp2vi=Math.random()<0.5;
    setHeader('Quiz',(i+1)+' / '+queue.length+' · '+score+'đ',true);
    var q = jp2vi? v.w : v.vi;
    var correct = jp2vi? v.vi : v.w;
    var distract = sample(list,3,v).map(function(x){return jp2vi? x.vi : x.w;});
    var opts=shuffle([correct].concat(distract));
    main.innerHTML=
      '<div class="counter">'+(jp2vi?'Chọn NGHĨA của từ':'Chọn TỪ tiếng Nhật')+'</div>'+
      '<div class="card" style="min-height:120px">'+
        '<div class="qword">'+esc(q)+'</div>'+
        (jp2vi?'<button class="speaker" id="spk">🔊</button>':'<div class="qhint">'+esc(v.en)+'</div>')+
      '</div>'+
      '<div class="opts" id="opts">'+
        opts.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>';}).join('')+
      '</div>'+
      '<div class="fb" id="fb"></div>';
    if(jp2vi&&$('#spk')){$('#spk').onclick=function(){speak(v.w);};speak(v.w);}
    main.querySelectorAll('.opt').forEach(function(btn){btn.onclick=function(){
      var chosen=opts[+btn.dataset.k];
      var ok=chosen===correct;
      main.querySelectorAll('.opt').forEach(function(b){
        b.onclick=null;
        var val=opts[+b.dataset.k];
        if(val===correct)b.classList.add('correct');
        else if(b===btn)b.classList.add('wrong');
        else b.classList.add('dim');
      });
      if(ok){score++;reviewCard(v.id,2);}else{reviewCard(v.id,0);}
      $('#fb').innerHTML=ok?'<span class="ok">Chính xác!</span>':'<span class="no">Đáp án: '+esc(correct)+'</span>';
      setTimeout(function(){i++;render();}, ok?750:1600);
    };});
  }
  render();
}

/* ═══════════════ SPEAKING (with mic permission fix) ═══════════════ */
async function speakModeInit(list){
  onBack=homeDashboard;
  if(isNativeApp()){ speakMode(list); return; }
  await checkMicPermission();
  if(micPermission!=='granted' && micPermission!=='unsupported'){
    setHeader('Luyện nói','',true);
    main.innerHTML=micBannerHTML()+
      '<div class="note">Chế độ Luyện nói cần quyền microphone để chấm điểm phát âm.<br>Nếu không cấp quyền, bạn vẫn có thể nghe mẫu và đọc theo.</div>'+
      '<button class="btn btn-primary" id="startAnyway" style="margin-top:14px">Bắt đầu luyện nói</button>';
    if($('#reqMic')) $('#reqMic').onclick=async function(){
      var ok = await requestMicPermission();
      if(ok){ speakMode(list); }
      else { main.querySelector('.mic-banner').innerHTML='Mic bị từ chối. Vào <b>Cài đặt trình duyệt → Quyền</b> để bật lại.'; }
    };

function speakMode(list){
  onBack=homeDashboard;
  list = list.filter(function(v){return !isMastered(v.id);});
  if(!list.length){ main.innerHTML='<div class="note">Bạn đã thuộc hết từ trong bộ này! 🎉</div>'; setHeader('Luyện nói','',true); return; }
  var queue = curDeck==='ALL' ? shuffle(list).slice(0,12) : shuffle(list);
  var i=0, total=0, sum=0, listening=false;
  var supported=hasSR() && micPermission!=='denied';
  function render(){
    if(i>=queue.length) return finish('speak',queue.length, total?Math.round(sum/total):0, true);
    var v=queue[i];
    setHeader('Luyện nói',(i+1)+' / '+queue.length,true);
    main.innerHTML=
      '<div class="card" style="min-height:170px">'+
        '<span class="tag">'+v.c+'</span>'+
        '<div class="jp" style="font-size:34px">'+esc(v.w)+'</div>'+
        '<div class="reading">'+esc(v.r)+'</div>'+
        '<div class="mean" style="font-size:15px">'+esc(v.vi)+'</div>'+
        '<button class="speaker" id="spk">🔊</button>'+
      '</div>'+
      (supported?
        '<button class="mic" id="mic">🎤</button>'+
        '<div class="qhint" id="mhint">Chạm mic rồi đọc to từ này</div>'+
        '<div class="heard hidden" id="heard"></div>'+
        '<div class="fb" id="fb"></div>'
      :
        '<div class="note">Microphone không khả dụng. Hãy nghe mẫu và đọc theo (shadowing).</div>'+
        '<button class="btn btn-primary" id="next" style="margin-top:14px">Từ tiếp theo →</button>'
      );
    $('#spk').onclick=function(){speak(v.w);};
    setTimeout(function(){speak(v.w);},300);
    if(!supported){ $('#next').onclick=function(){i++;render();}; return; }
    var mic=$('#mic'), hint=$('#mhint'), heard=$('#heard'), fb=$('#fb');
    mic.onclick=async function(){
      if(listening){ cancelRecognition(); return; }
      try{
        var ok = await ensureMicReady();
        if(!ok){ hint.textContent='Mic bị từ chối. Vào Cài đặt để bật.'; return; }
        listening=true; mic.classList.add('rec'); mic.textContent='⏹'; hint.textContent='Đang nghe... đọc to lên';
        var alts = await recognizeOnce('ja-JP');
        var best=Math.max.apply(null,alts.map(function(a){return Math.max(similarity(a,v.w),similarity(a,v.r));}));
        heard.classList.remove('hidden'); heard.textContent='Bạn đọc: '+alts[0];
        total++; sum+=best;
        fb.innerHTML = best>=80?'<span class="ok">🌟 Tuyệt! '+best+' điểm</span>'
                     : best>=55?'<span class="ok">👍 Khá ổn: '+best+' điểm</span>'
                     : '<span class="no">💪 '+best+' điểm - thử lại nhé</span>';
        if(best>=55)reviewCard(v.id,2);
        setTimeout(function(){i++;render();},1900);
      }catch(err){
        hint.textContent='Không nghe được ('+err+'). Chạm mic thử lại.';
        if(err==='not-allowed') micPermission='denied';
      }finally{
        mic.classList.remove('rec');mic.textContent='🎤';listening=false;
      }
    };
  }
  render();
}

/* ═══════════════ READING MODE (luyện đọc câu ví dụ) ═══════════════ */
function readingMode(list, deckIdx){

  function render(){
    if(i>=queue.length) return finishReading(queue.length);

        '<div class="sent-jp">'+esc(v.ex)+'</div>'+
        '<div class="sent-word">📘 '+esc(v.w)+' ('+esc(v.r)+') — '+esc(v.vi)+'</div>'+
        '<div class="sent-vi hidden" id="viMean">💡 '+esc(v.vi)+': '+esc(v.en)+'</div>'+
        '<div class="sent-controls">'+
          '<button class="speaker" id="spk" style="margin:0">🔊</button>'+
          '<button class="speed-btn '+(slowMode?'on':'')+'" id="slowBtn">🐢 Chậm</button>'+
          '<button class="btn btn-ghost" id="showVi" style="padding:8px 12px;font-size:13px">Xem nghĩa</button>'+
        '</div>'+
      '</div>'+
      (micSupport?
        '<div style="text-align:center;margin-top:14px">'+
          '<button class="btn btn-primary" id="micBtn" style="display:inline-flex;align-items:center;gap:8px;width:auto;padding:14px 28px;font-size:16px;border-radius:99px">'+
            '<span style="font-size:22px">🎤</span> Luyện đọc'+
          '</button>'+
          '<div class="qhint" id="mhint" style="margin-top:8px">Chạm để thu giọng và chấm phát âm</div>'+
          '<div class="heard hidden" id="heard"></div>'+
          '<div class="fb" id="fb"></div>'+
        '</div>'
      :'')+
      '<div style="margin-top:16px">'+
        '<button class="btn btn-primary" id="next">Câu tiếp theo →</button>'+
      '</div>';

    $('#spk').onclick=function(){speak(v.ex, slowMode?0.65:0.9);};
    setTimeout(function(){speak(v.ex, slowMode?0.65:0.9);},300);
    $('#slowBtn').onclick=function(){
      slowMode=!slowMode;
      $('#slowBtn').classList.toggle('on',slowMode);
      speak(v.ex, slowMode?0.65:0.9);
    };
    $('#showVi').onclick=function(){$('#viMean').classList.remove('hidden');};
    $('#next').onclick=function(){i++;render();};

    if(micSupport && $('#micBtn')) setupReadingMic(v);
  }

  function setupReadingMic(v){
    var micBtn=$('#micBtn'), hint=$('#mhint'), heard=$('#heard'), fb=$('#fb');
    var listening=false;
    micBtn.onclick=async function(){
      if(listening){ cancelRecognition(); return; }
      try{
        var ok = await ensureMicReady();
        if(!ok){ hint.textContent='Mic bị từ chối.'; return; }
        listening=true;
        micBtn.style.background='var(--bad)';
        micBtn.innerHTML='<span style="font-size:22px">⏹</span> Đang nghe...';
        hint.textContent='Hãy đọc to câu này';
        var alts = await recognizeOnce('ja-JP');
        var best=Math.max.apply(null,alts.map(function(a){return similarity(a,v.ex);}));
        heard.classList.remove('hidden'); heard.textContent='Bạn đọc: '+alts[0];
        fb.innerHTML = best>=80?'<span class="ok">🌟 Tuyệt! '+best+' điểm</span>'
                     : best>=55?'<span class="ok">👍 Khá: '+best+' điểm</span>'
                     : '<span class="no">💪 '+best+' điểm — thử lại</span>';
        if(best>=55) reviewCard(v.id,2);
      }catch(err){
        hint.textContent='Lỗi: '+err;
        if(err==='not-allowed') micPermission='denied';
      }finally{
        micBtn.style.background=''; micBtn.innerHTML='<span style="font-size:22px">🎤</span> Luyện đọc'; listening=false;
      }
    };
  }

  function finishReading(total){
    markDeckDone('_reading', deckIdx, 'done');
    setHeader('Hoàn thành','',true);
    main.innerHTML=
      '<div class="done">'+
        '<div class="big">📖</div>'+
        '<h2>Xong buổi đọc!</h2>'+
        '<p>Đã luyện đọc <b>'+total+'</b> câu ví dụ</p>'+
        '<div class="row" style="margin-top:20px">'+
          '<button class="btn btn-ghost" id="again">Đọc tiếp</button>'+
          '<button class="btn btn-primary" id="hm">Về danh sách bộ</button>'+
        '</div>'+
      '</div>';
    $('#hm').onclick=readingLibrary;
    $('#again').onclick=function(){ readingMode(list, deckIdx); };
  }
  render();
}

/* ═══════════════ KAIWA MODE (hội thoại từ câu ví dụ) ═══════════════ */
function kaiwaMode(list, deckIdx){
  onBack=kaiwaLibrary;
  var exVocab = list;
  if(exVocab.length<4){ main.innerHTML='<div class="note">Cần ít nhất 4 từ có câu ví dụ để tạo hội thoại.</div>'; setHeader('Kaiwa','',true); return; }

  // Build mini conversations: pick 4-6 sentences, assign roles A/B alternating
  var allConvos = buildConversations(exVocab);
  if(allConvos.length===0){ main.innerHTML='<div class="note">Không đủ câu ví dụ để tạo hội thoại.</div>'; setHeader('Kaiwa','',true); return; }

  var ci=0; // conversation index
  setHeader('Kaiwa','Hội thoại ngắn',true);

  function renderConvo(){
    if(ci>=allConvos.length) return finishKaiwa();
    var convo=allConvos[ci];
    setHeader('Kaiwa','Hội thoại '+(ci+1)+' / '+allConvos.length,true);

    var bubblesHTML='<div class="kaiwa-container" id="kBubbles">';
    convo.forEach(function(line,idx){
      var side=idx%2===0?'left':'right';
      var role=idx%2===0?'Aさん':'Bさん';
      bubblesHTML+=
        '<div class="kaiwa-bubble '+side+' hidden" data-idx="'+idx+'">'+
          '<div class="kaiwa-role">'+role+'</div>'+
          '<div class="kaiwa-text">'+esc(line.ex)+'</div>'+
          '<div class="kaiwa-vi hidden" data-vi="'+idx+'">'+esc(line.w)+' — '+esc(line.vi)+'</div>'+
          '<div class="sent-controls" style="margin-top:8px">'+
            '<button class="speaker" style="margin:0;width:36px;height:36px;font-size:16px" data-speak="'+idx+'">🔊</button>'+
            '<button class="speed-btn" data-showvi="'+idx+'" style="font-size:11px;padding:4px 10px">Nghĩa</button>'+
          '</div>'+
        '</div>';
    });
    bubblesHTML+='</div>';

    var micSupport = hasSR() && micPermission!=='denied' && micPermission!=='unsupported';

    main.innerHTML=
      '<div class="counter">Hội thoại mẫu — chạm ▶ để bắt đầu</div>'+
      bubblesHTML+
      '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center">'+
        '<button class="btn btn-ghost" id="playAll" style="flex:none;padding:10px 18px">▶ Nghe toàn bộ</button>'+
        '<button class="btn btn-ghost" id="showAll" style="flex:none;padding:10px 18px">👁 Hiện tất cả</button>'+
        '<input type="hidden" id="toggleState" value="hidden">'+
        (micSupport?'<button class="btn btn-ghost" id="practiceBtn" style="flex:none;padding:10px 18px">🎤 Luyện đọc vai</button>':'')+
      '</div>'+
      '<div class="fb" id="fb" style="margin-top:10px"></div>'+
      '<button class="btn btn-primary" id="nextConvo" style="margin-top:14px">Hội thoại tiếp →</button>';

    // Show bubbles one by one with animation
    var bubbles=main.querySelectorAll('.kaiwa-bubble');
    var shown=0;
    function showNext(){
      if(shown<bubbles.length){
        bubbles[shown].classList.remove('hidden');
        bubbles[shown].style.opacity='0';
        bubbles[shown].style.transform='translateY(10px)';
        requestAnimationFrame(function(){
          bubbles[shown-1>=0?shown:0].style.transition='opacity .3s,transform .3s';
          bubbles[shown].style.opacity='1';
          bubbles[shown].style.transform='translateY(0)';
        });
        shown++;
      }
    }
    // Show first bubble immediately
    showNext();

    // Play all: show bubbles sequentially with TTS
    var playing=false;
    $('#playAll').onclick=async function(){
      if(playing) return;
      playing=true;
      $('#playAll').textContent='⏸ Đang phát...';
      for(var j=0;j<convo.length;j++){
        if(j>=shown) showNext();
        bubbles[j].style.background = j%2===0? '#dbeafe':'#dcfce7';
        await speakAsync(convo[j].ex, 0.85);
        bubbles[j].style.background='';
        await new Promise(function(r){setTimeout(r,400);});
      }
      playing=false;
      $('#playAll').textContent='▶ Nghe lại';
    };

    // Toggle show/hide all bubbles
    $('#showAll').onclick=function(){
      var state=$('#toggleState').value;
      if(state==='hidden'){
        // Show all bubbles + meanings
        for(var k=0;k<bubbles.length;k++){
          bubbles[k].classList.remove('hidden');
          bubbles[k].style.opacity='1';
          bubbles[k].style.transform='none';
          bubbles[k].style.transition='none';
        }
        shown=bubbles.length;
        main.querySelectorAll('[data-vi]').forEach(function(el){el.classList.remove('hidden');});
        $('#showAll').textContent='🙈 Ẩn tất cả';
        $('#toggleState').value='shown';
      } else {
        // Hide all except first bubble, hide all meanings
        for(var k=1;k<bubbles.length;k++){
          bubbles[k].classList.add('hidden');
        }
        shown=1;
        main.querySelectorAll('[data-vi]').forEach(function(el){el.classList.add('hidden');});
        $('#showAll').textContent='👁 Hiện tất cả';
        $('#toggleState').value='hidden';
      }
    };

    // Individual speak buttons
    main.querySelectorAll('[data-speak]').forEach(function(btn){
      btn.onclick=function(){
        var idx=+btn.dataset.speak;
        if(idx>=shown){ while(shown<=idx) showNext(); }
        speak(convo[idx].ex, 0.85);
      };
    });
    // Individual meaning buttons
    main.querySelectorAll('[data-showvi]').forEach(function(btn){
      btn.onclick=function(){
        var el=main.querySelector('[data-vi="'+btn.dataset.showvi+'"]');
        if(el) el.classList.remove('hidden');
      };
    });

    // Practice: read each line with mic
    if(micSupport && $('#practiceBtn')){
      $('#practiceBtn').onclick=function(){ practiceKaiwa(convo); };
    }

    $('#nextConvo').onclick=function(){ci++;renderConvo();};
  }

  function practiceKaiwa(convo){
    var pi=0;
    var bubbles=main.querySelectorAll('.kaiwa-bubble');
    // Show all bubbles
    bubbles.forEach(function(b){b.classList.remove('hidden');b.style.opacity='1';b.style.transform='none';});

    function highlightLine(){
      bubbles.forEach(function(b,idx){
        if(idx===pi) b.style.boxShadow='0 0 0 3px var(--brand)';
        else b.style.boxShadow='';
      });
      if(pi>=convo.length){
        $('#fb').innerHTML='<span class="ok">Hoàn thành hội thoại!</span>';
        return;
      }
      speak(convo[pi].ex, 0.85);
      $('#fb').innerHTML='Nghe xong → Chạm 🎤 để đọc theo dòng '+(pi+1);
      // Replace buttons with single mic
      var ctrl=main.querySelector('#practiceArea');
      if(!ctrl){
        var area=document.createElement('div');
        area.id='practiceArea';
        area.style.textAlign='center';
        area.innerHTML=
          '<button class="mic" id="pMic" style="width:72px;height:72px;font-size:30px;margin:10px auto">🎤</button>'+
          '<div class="heard hidden" id="pHeard"></div>';
        main.querySelector('#nextConvo').before(area);
      }
      setupPracticeMic(convo[pi]);
    }

    function setupPracticeMic(line){
      var mic=$('#pMic'), heard=$('#pHeard'), fb=$('#fb');
      var listening=false;
      mic.onclick=async function(){
        if(listening){cancelRecognition();return;}
        try{
          var ok=await ensureMicReady();
          if(!ok){fb.innerHTML='Mic bị từ chối.';return;}
          listening=true;mic.classList.add('rec');mic.textContent='⏹';
          var alts = await recognizeOnce('ja-JP');
          var score=Math.max.apply(null,alts.map(function(a){return similarity(a,line.ex);}));
          heard.classList.remove('hidden');heard.textContent='Bạn: '+alts[0]+' ('+score+' điểm)';
          if(score>=50){
            fb.innerHTML='<span class="ok">Tốt! → Dòng tiếp</span>';
            if(score>=55) reviewCard(line.id,2);
            setTimeout(function(){pi++;highlightLine();},1200);
          } else {
            fb.innerHTML='<span class="no">'+score+' điểm — thử lại</span>';
          }
        }catch(err){
          fb.innerHTML='Lỗi: '+err;
          if(err==='not-allowed') micPermission='denied';
        }finally{
          mic.classList.remove('rec');mic.textContent='🎤';listening=false;
        }
      };
    }
    highlightLine();
  }

  function finishKaiwa(){
    markDeckDone('_kaiwa', deckIdx, 'done');
    setHeader('Hoàn thành','',true);
    main.innerHTML=
      '<div class="done">'+
        '<div class="big">💬</div>'+
        '<h2>Xong buổi Kaiwa!</h2>'+
        '<p>Đã luyện <b>'+allConvos.length+'</b> đoạn hội thoại</p>'+
        '<div class="row" style="margin-top:20px">'+
          '<button class="btn btn-ghost" id="again">Kaiwa mới</button>'+
          '<button class="btn btn-primary" id="hm">Về danh sách bộ</button>'+
        '</div>'+
      '</div>';
    $('#hm').onclick=kaiwaLibrary;
    $('#again').onclick=function(){ kaiwaMode(list, deckIdx); };
  }
  renderConvo();
}

/* Build conversations from example sentences */
function buildConversations(exVocab){
  var shuffled=shuffle(exVocab);
  var convos=[];
  var idx=0;
  // Each convo = 4-6 lines
  while(idx+3<shuffled.length && convos.length<5){
    var len = Math.min(4+Math.floor(Math.random()*3), shuffled.length-idx); // 4-6
    convos.push(shuffled.slice(idx,idx+len));
    idx+=len;
  }
  return convos;
}

/* ═══════════════ FINISH SCREEN ═══════════════ */
function finish(mode,total,score,isPct){
  if(curDeck!=='ALL') markDeckDone(curCat, curDeck, mode);
  var learned=learnedCount();
  var msg='';
  if(score!==undefined){
    var val=isPct? score : Math.round(score/total*100);
    msg = isPct? 'Điểm phát âm trung bình: <b>'+score+'</b>/100'
               : 'Đúng <b>'+score+'/'+total+'</b> ('+val+'%)';
  }else msg='Đã ôn <b>'+total+'</b> thẻ';
  setHeader('Hoàn thành','',true);
  main.innerHTML=
    '<div class="done">'+
      '<div class="big">🎉</div>'+
      '<h2>Xong buổi học!</h2>'+
      '<p>'+msg+'</p>'+
      '<p style="color:var(--sub);font-size:14px">Tổng đã thuộc: '+learned+'/'+VOCAB.length+' từ · Streak '+(store.stats.streak||0)+'</p>'+
      '<div class="row" style="margin-top:20px">'+
        '<button class="btn btn-ghost" id="again">Học tiếp</button>'+
        '<button class="btn btn-primary" id="hm">Về trang chủ</button>'+
      '</div>'+
    '</div>';
  $('#hm').onclick=homeDashboard;
  $('#again').onclick=function(){startMode(mode);};
}

/* ═══════════════ INIT ═══════════════ */
checkMicPermission();
if(!VOCAB.length){ main.innerHTML='<div class="note">Chưa có dữ liệu từ vựng. Hãy chạy lại build_app.py.</div>'; }
else home();
</script>
