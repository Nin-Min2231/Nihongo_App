1", "disk": 2, "no": 21, "audio": "sd_2-21.mp3", "dur": 100.41, "pages": [140], "level": "上級", "section": 2, "segments": [{"id": "2-21-1", "no": 1, "page": 140, "start": 0.41, "end": 19.68, "dur": 19.27, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "納期が遅れてますね。状況を説明してください。", "vi": "Các anh giao hàng chậm. Hãy báo cáo tình hình cho tôi."}, {"spk": "B", "jp": "申し訳ありません。現地での船積みが遅れているんです。", "vi": "Rất xin lỗi chị. Việc xếp hàng lên tàu ở hiện trường bị chậm ạ."}, {"spk": "A", "jp": "納期を守っていただかないと、こちらも困ります。", "vi": "Nếu các anh không giữ đúng hạn giao hàng thì cũng làm khó cho chúng tôi."}, {"spk": "B", "jp": "はい。今、最優先でやらせてますので。", "vi": "Vâng ạ. Chúng tôi đang ưu tiên hàng đầu đấy ạ."}]}, {"id": "2-21-2", "no": 2, "page": 140, "start": 19.08, "end": 34.92, "dur": 15.84, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "こちらが提示した条件をクリアしていませんよ。", "vi": "Các anh không đáp ứng hết những điều kiện chúng tôi đặt ra."}, {"spk": "B", "jp": "申し訳ございません。", "vi": "Rất xin lỗi chị."}, {"spk": "A", "jp": "不良品が多すぎますよ。これでは契約を切らざるを得ませんね。", "vi": "Hàng lỗi nhiều quá. Thế này thì chúng tôi đành phải chấm dứt hợp đồng thôi."}, {"spk": "B", "jp": "そんなことおっしゃらずに、もう一度チャンスをいただけませんか。", "vi": "Xin chị đừng nói vậy. Xin hãy cho chúng tôi một cơ hội nữa được không ạ?"}]}, {"id": "2-21-3", "no": 3, "page": 140, "start": 34.32, "end": 47.97, "dur": 13.65, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "もう少しコストダウンできませんか？", "vi": "Có thể giảm giá thêm chút nữa được không?"}, {"spk": "B", "jp": "原料が値上がりしていますからね〜。", "vi": "Vì nguyên liệu tăng giá cho nên..."}, {"spk": "A", "jp": "わかりますが…、再度ご検討願えませんか？", "vi": "Tôi biết... Nhưng nhờ anh tính lại lần nữa được không?"}, {"spk": "B", "jp": "もう打てる手は全部打ったんですよ。", "vi": "Chúng tôi đã làm tất cả những gì có thể rồi ạ."}]}, {"id": "2-21-4", "no": 4, "page": 140, "start": 47.37, "end": 68.69, "dur": 21.32, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "では、こちらの契約書にサインと印鑑をお願いできますでしょうか。", "vi": "Vậy, anh có thể ký và đóng dấu vào bản hợp đồng này được không?"}, {"spk": "B", "jp": "申し訳ありませんが、やっぱりもう一度上司に相談してから、ということにさせてください。", "vi": "Rất xin lỗi chị nhưng quả thực hãy để tôi trao đổi với sếp thêm lần nữa."}, {"spk": "A", "jp": "あー、どの辺りに問題があるんでしょうか。", "vi": "Ồ, có vấn đề ở chỗ nào thế ạ?"}, {"spk": "B", "jp": "いえ、問題というわけではないんですが、金額が大きいので念のためということで。", "vi": "Không, không phải là có vấn đề mà do số tiền lớn nên tôi muốn cho chắc thôi."}]}, {"id": "2-21-5", "no": 5, "page": 140, "start": 68.09, "end": 85.02, "dur": 16.93, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "ご意見、ご提案があれば、お願いいたします。", "vi": "Xin ông cho ý kiến hoặc đề xuất nếu có."}, {"spk": "B", "jp": "そうですね、企画書をよく検討させていただいてからでもよろしいですか？", "vi": "Vâng, để tôi xem kỹ bản kế hoạch đã được không ạ?"}, {"spk": "A", "jp": "はい、どうぞよろしくお願いいたします。", "vi": "Vâng, phiền ông giúp cho."}, {"spk": "B", "jp": "2、3日中には、またご連絡いたしますので。", "vi": "Tôi sẽ liên lạc lại trong 2, 3 ngày tới."}]}, {"id": "2-21-6", "no": 6, "page": 140, "start": 84.42, "end": 98.59, "dur": 14.17, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "見積書、見せていただけますか？", "vi": "Cho tôi xem bản báo giá được không?"}, {"spk": "B", "jp": "はい、こちらです。いかがでしょうか？", "vi": "Vâng, đây ạ. Chị thấy sao ạ?"}, {"spk": "A", "jp": "う〜ん、もう少しコストダウンできませんか？", "vi": "Ừm, có thể giảm giá thêm chút nữa không?"}, {"spk": "B", "jp": "注文数が少ないので、これで目いっぱいなんです。", "vi": "Do số lượng đặt hàng ít nên như vậy đã là cố gắng hết sức rồi ạ."}]}]}, {"track": "2-22", "disk": 2, "no": 22, "audio": "sd_2-22.mp3", "dur": 94.82, "pages": [142], "level": "上級", "section": 2, "segments": [{"id": "2-22-7", "no": 7, "page": 142, "start": 0.46, "end": 16.6, "dur": 16.14, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "たびたびお電話をいただいたそうで、申し訳ありませんでした。", "vi": "Nghe nói anh đã gọi cho tôi mấy lần. Thành thật xin lỗi anh."}, {"spk": "B", "jp": "いえいえ、長いご出張だったそうで。", "vi": "Không sao, không sao. Nghe nói chị đi công tác dài ngày."}, {"spk": "A", "jp": "はい、海外に出ておりましたもので。ご迷惑をおかけしました。", "vi": "Vâng, tôi đi công tác nước ngoài. Rất xin lỗi đã làm phiền anh."}, {"spk": "B", "jp": "とんでもないです。お忙しそうで大変ですね。", "vi": "Không sao. Chị bận thế chắc là vất vả lắm."}]}, {"id": "2-22-8", "no": 8, "page": 142, "start": 16.0, "end": 32.75, "dur": 16.75, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "それで、お仕事はうまくいきましたか？", "vi": "Vậy, công việc của chị có tốt không?"}, {"spk": "B", "jp": "おかげさまで、どうにか契約成立にまでこぎつけました。", "vi": "Ơn trời, cuối cùng thì tôi cũng ký được hợp đồng."}, {"spk": "A", "jp": "それはよかったですね。おめでとうございます。", "vi": "Vậy thì tốt quá nhỉ. Chúc mừng chị."}, {"spk": "B", "jp": "いやー、まだまだ細部を詰めないといけないんですけどね。", "vi": "Chưa đâu. Còn phải bàn đến các nội dung chi tiết nữa kia."}]}, {"id": "2-22-9", "no": 9, "page": 142, "start": 32.15, "end": 52.57, "dur": 20.42, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "恐れ入りますが、折り返しお電話をいただけますか？", "vi": "Xin lỗi, phiền anh nói ông ấy gọi lại cho tôi được không?"}, {"spk": "B", "jp": "承知いたしました。申し訳ございませんが、もう一度、お名前とお電話番号をいただけますか？", "vi": "Vâng ạ. Xin lỗi chị, cho tôi xin lại tên chị và số điện thoại được không ạ?"}, {"spk": "A", "jp": "日本商事営業部の竹中です。", "vi": "Tôi là Takenaka ở phòng kinh doanh công ty thương mại Nihon."}, {"spk": "B", "jp": "はい。日本商事営業部の竹中様ですね。", "vi": "Vâng, chị Takenaka, phòng kinh doanh công ty thương mại Nihon phải không ạ."}, {"spk": "A", "jp": "電話番号は03-……", "vi": "Số điện thoại của tôi là 03-..."}]}, {"id": "2-22-10", "no": 10, "page": 142, "start": 51.97, "end": 93.02, "dur": 41.05, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "片桐さんは、もともと企画部にいらっしゃったんですね。", "vi": "Katagiri này, hóa ra trước anh ở phòng kế hoạch đấy à?"}, {"spk": "B", "jp": "ええ、営業に配属が決まった当初は、嫌々外まわりやってたんですよ。", "vi": "Đúng vậy, nên hồi đầu khi bị chuyển sang phòng bán hàng, tôi cứ vật và vật vờ suốt."}, {"spk": "A", "jp": "え、本当ですか？　凄腕の営業マンの片桐さんが？", "vi": "Sao? Thật á? Một nhân viên bán hàng cự phách như anh mà vậy á, Katagiri?"}, {"spk": "B", "jp": "ええ。でも、ほら営業って、結果が数字っていう目に見える形で出てくるでしょう。だから、「何くそ負けるものか」ってやってたら、いつからかその魅力にすっかりはまっちゃって。", "vi": "Đúng vậy đấy. Nhưng, chị biết đấy, bán hàng thì kết quả nào sẽ thấy ngay qua các con số phải không nào! Thế nên khi tôi tự nhủ \"Không lẽ mình chịu thua?\" và làm việc thì lại bị công việc đó cuốn hút lúc nào không hay."}, {"spk": "A", "jp": "そうですか。確かに、その点はやりがいがありますよね。でも、ノルマもあって、毎日大変でしょう。", "vi": "Ra là vậy à? Quả thực công việc đó cũng có ý nghĩa để thực hiện. Nhưng còn doanh số được giao nữa nên chắc ngày nào cũng mệt lắm đúng không?"}, {"spk": "B", "jp": "ええ、大変は大変なんですが…。営業の魅力に取りつかれちゃったんでしょうね。", "vi": "Vâng, mệt thì đúng là mệt thật... Nhưng chắc có lẽ tôi mê cái hấp dẫn của việc bán hàng mất rồi."}]}]}, {"track": "2-23", "disk": 2, "no": 23, "audio": "sd_2-23.mp3", "dur": 118.96, "pages": [144, 146], "level": "上級", "section": 2, "segments": [{"id": "2-23-11", "no": 11, "page": 144, "start": 0.39, "end": 25.15, "dur": 24.76, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あ、見積もり見させてもらいました。", "vi": "Tôi xem báo giá rồi."}, {"spk": "B", "jp": "あ、そうですか。どうですか、この線で。", "vi": "Ồ, thế ạ? Chị thấy định hướng đó của chúng tôi thế nào ạ?"}, {"spk": "A", "jp": "う〜ん、この部品の単価、もう少し何とかなりませんかねー。", "vi": "Ồ, đơn giá của linh kiện này, liệu còn làm gì thêm được không?"}, {"spk": "B", "jp": "勘弁してくださいよ。うちもこれで目いっぱいなんですから。", "vi": "Xin chị hiểu cho. Vì đến mức này là chúng tôi cũng đã cố hết sức rồi ạ."}, {"spk": "A", "jp": "まー、それはわかってるんですがね〜。そこを何とか…。", "vi": "Ừm, chuyện đó tôi biết nhưng... Hãy xem chỗ đó có cách gì hơn không..."}, {"spk": "B", "jp": "う〜ん、まいったなー。", "vi": "Ôi, tôi biết làm sao đây!"}]}, {"id": "2-23-12", "no": 12, "page": 144, "start": 24.55, "end": 56.03, "dur": 31.48, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "本日はお忙しいなか、突然おじゃまいたしまして、恐縮に存じます。", "vi": "Rất xin lỗi ông hôm nay tôi đã đường đột làm phiền ông trong lúc công việc bận rộn."}, {"spk": "B", "jp": "まー、どうぞ、そちらにおかけください。", "vi": "Không sao. Mời cô ngồi!"}, {"spk": "A", "jp": "本日は、先日の契約の件に関して、おうかがいさせていただきました。", "vi": "Hôm nay tôi đến là về việc hợp đồng hôm trước ạ."}, {"spk": "B", "jp": "あ、そうですか。それなら営業部長の高橋も同席させたほうが良いかもしれませんね。", "vi": "À, vậy à? Thế thì có lẽ nên có trưởng phòng kinh doanh Takahashi họp cùng nhỉ?"}, {"spk": "A", "jp": "あ、高橋部長がいらっしゃるのでしたら、ぜひそうお願いしたいのですが。", "vi": "Ồ, nếu trưởng phòng Takahashi cũng có ở đây thì tôi cũng rất muốn được gặp."}, {"spk": "B", "jp": "わかりました、それでは高橋を呼びますので、少々お待ちください。", "vi": "Được rồi. Tôi sẽ gọi Takahashi. Phiền cô đợi một lát nhé."}]}, {"id": "2-23-13", "no": 13, "page": 144, "start": 55.43, "end": 71.49, "dur": 16.06, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "早速ですが、志望動機をうかがわせてください。", "vi": "Trước hết, hãy cho biết nguyện vọng và động cơ của anh."}, {"spk": "B", "jp": "はい。とにかく御社の車に関わる仕事がしたいからです。", "vi": "Vâng. Vì tôi muốn làm công việc liên quan đến ô tô của công ty bà."}, {"spk": "A", "jp": "じゃー、例えばどんな仕事がしたいんですか？", "vi": "Vậy, chẳng hạn anh muốn làm công việc như thế nào?"}, {"spk": "B", "jp": "はい、ハイブリッドカーの開発に携わるのが夢です。", "vi": "Vâng, được tham gia vào việc phát triển xe hydbrid là giấc mơ của tôi ạ."}]}, {"id": "2-23-14", "no": 14, "page": 146, "start": 70.89, "end": 90.32, "dur": 19.43, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "いろいろな仕事をされてきたんですね。", "vi": "Anh đã từng trải qua rất nhiều công việc nhỉ!"}, {"spk": "B", "jp": "はい。私なりにキャリアアップをしてきたと考えています。", "vi": "Vâng, tôi nghĩ mình cũng đã phát triển sự nghiệp theo cách của mình."}, {"spk": "A", "jp": "特に力を入れられたことは何ですか？", "vi": "Anh đã tập trung tâm huyết nhất vào việc gì?"}, {"spk": "B", "jp": "そうですね。ネットワークに関する新規プロジェクトです。立ち上げから運営に携わってきました。", "vi": "Vâng, đó là dự án mới liên quan đến network. Tôi đã tham gia từ lúc lập dự án cho đến khi vận hành."}]}, {"id": "2-23-15", "no": 15, "page": 146, "start": 89.72, "end": 117.08, "dur": 27.36, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "前の会社ではどんなお仕事をされていたんですか？", "vi": "Cô đã làm công việc gì ở công ty trước?"}, {"spk": "B", "jp": "社員の安全と健康の管理が主でした。", "vi": "Tôi chủ yếu là quản lý an toàn và sức khỏe nhân viên công ty."}, {"spk": "A", "jp": "そうですか。例えば？", "vi": "Vậy hả? Ví dụ là gì?"}, {"spk": "B", "jp": "そうですね、工場内での環境改善とか、社員の禁煙プログラムの開発などをやっておりました。", "vi": "Vâng, tôi đã thực hiện cải thiện môi trường trong nhà máy, hay như xúc tiến chương trình cấm hút thuốc trong nhân viên."}, {"spk": "A", "jp": "ほ〜、そうですか。仕事はやりがいがありましたか？", "vi": "Ô, thật vậy à? Cô thấy công việc có ý nghĩa chứ?"}, {"spk": "B", "jp": "はい、自分で工夫したことが実現されていくので、充実感がありました。", "vi": "Vâng, tôi cảm thấy rất có ý nghĩa vì những gì mình dồn công sức đã được thực hiện."}]}]}]}]}, {"unit": 8, "titleJp": "長い会話・スピーチなど", "titleVi": "Hội thoại dài, bài phát biểu", "sections": [{"section": 1, "level": "上級", "tracks": [{"track": "2-24", "disk": 2, "no": 24, "audio": "sd_2-24.mp3", "dur": 101.33, "pages": [150], "level": "上級", "section": 1, "segments": [{"id": "2-24-1", "no": 1, "page": 150, "start": 0.41, "end": 99.55, "dur": 99.14, "title": "クレーム", "titleVi": "Khiếu nại", "lines": [{"spk": "A", "jp": "はい、スピード便新宿配送センターでございます。", "vi": "Vâng, trung tâm chuyển phát nhanh Speed Shinjuku nghe ạ."}, {"spk": "B", "jp": "あ、昨日不在連絡票が入ってて、今日の3時までに届けてもらえるように連絡したんですけど、まだ届かないんです。", "vi": "À, hôm qua lúc về tôi thấy có phiếu thông báo chưa phát bưu phẩm do vắng mặt chủ nhà nên đã liên lạc yêu cầu phát trước 3 giờ hôm nay mà giờ vẫn chưa nhận được."}, {"spk": "A", "jp": "申し訳ございません。ただいまお調べいたします。お客様のお手もとに不在連絡票がございますか？", "vi": "Rất xin lỗi bà. Tôi sẽ kiểm tra ngay bây giờ. Bà có giữ phiếu thông báo ở đó không?"}, {"spk": "B", "jp": "あー、あります。", "vi": "Có, có đây."}, {"spk": "A", "jp": "右上にある、8桁の配達番号をお願いいたします。", "vi": "Phiền bà đọc cho tôi mã số chuyển phát có 8 chữ số ở phía trên bên trái phiếu thông báo."}, {"spk": "B", "jp": "えっとー、465-6-9241です。", "vi": "Xem nào… 465-6-9241."}, {"spk": "A", "jp": "はい、中村様ですね。確かに本日3時までとうけたまわっております。ただいま、ドライバーと連絡を取って確かめまして、こちらから中村様のお宅に折り返しお電話差し上げます。", "vi": "Vâng, bà Nakamura phải không ạ? Đúng là bà có yêu cầu phát trước 3 giờ chiều nay. Ngay bây giờ, tôi sẽ liên lạc với lái xe để xác nhận và gọi lại cho bà."}, {"spk": "B", "jp": "えっと、これから出かけなくちゃいけないんで、あんまり待っていられないんですが。", "vi": "Ừm, tôi lại sắp phải đi bây giờ nên không đợi lâu được."}, {"spk": "A", "jp": "2、3分ですぐお電話差し上げられますが…。", "vi": "Tôi có thể gọi lại cho bà sau 2, 3 phút nữa…"}, {"spk": "B", "jp": "あー、わかりました。じゃー、お願いします。", "vi": "Ù, được rồi. Vậy gọi lại cho tôi nhé."}, {"spk": "", "jp": "【2、3分後】", "vi": "【2, 3 phút sau】"}, {"spk": "A", "jp": "中村様、たいへん申し訳ございませんが、ただいま事故の影響で道路が渋滞しておりまして、そちらにお届けできるのが30分後ぐらいになるということなんですが…。", "vi": "Thưa bà Nakamura, rất xin lỗi bà nhưng tình hình là đang bị tắc đường do tai nạn giao thông nên chúng tôi chỉ có thể phát sau 30 phút nữa…"}, {"spk": "B", "jp": "あー、あの、私もう家を出なきゃいけないんで、それはちょっと無理ですね。明日の3時までにしてもらえますか？", "vi": "Ờ… Thế thì không được rồi vì tôi phải đi bây giờ. Các anh chuyển sang phát trước 3 giờ chiều mai được không?"}, {"spk": "A", "jp": "かしこまりました。では、明日1時から3時の間にお届けいたします。ご迷惑をおかけしてたいへん申し訳ございませんでした。", "vi": "Vâng, thưa bà. Vậy chúng tôi sẽ phát trong khoảng từ 1 giờ đến 3 giờ chiều mai. Chúng tôi thành thực xin lỗi vì đã làm phiền bà."}, {"spk": "B", "jp": "わかりました。じゃー、その時間でお願いします。あ、明日も3時すぎには出かけるんで、絶対3時までに届けてもらいたいんですけど。", "vi": "Được rồi. Vậy hãy phát vào giờ đó nhé. Mà ngày mai tôi cũng phải đi lúc hơn 3 giờ nên tôi muốn chắc chắn sẽ nhận được trước 3 giờ."}, {"spk": "A", "jp": "はい、明日は大丈夫でございます。", "vi": "Vâng, ngày mai sẽ không có vấn đề gì đâu ạ."}, {"spk": "B", "jp": "はい。じゃあよろしくお願いします。", "vi": "Được rồi. Vậy nhờ các anh nhé."}]}]}]}, {"section": 2, "level": "上級", "tracks": [{"track": "2-25", "disk": 2, "no": 25, "audio": "sd_2-25.mp3", "dur": 114.78, "pages": [152], "level": "上級", "section": 2, "segments": [{"id": "2-25-1", "no": 1, "page": 152, "start": 0.41, "end": 112.89, "dur": 112.48, "title": "恋愛トーク", "titleVi": "Chuyện tình cảm", "lines": [{"spk": "A", "jp": "ね、りか。この間の合コンどうだった？", "vi": "Rika này. Buổi đi chơi chung hôm trước thế nào?"}, {"spk": "B", "jp": "それがさ、一人イケメンがいて、この人がけっこういい人だったんだ。", "vi": "Ù, hôm đó có một anh rất bảnh, lại là người khá tốt nữa."}, {"spk": "A", "jp": "えー、いいなー。それで？", "vi": "Ô, hay quá! Rồi sao nữa?"}, {"spk": "B", "jp": "早速メアド交換したんだけど、いくら待っても全然音沙汰なし…。", "vi": "Tớ ngay lập tức trao đổi địa chỉ e-mail nhưng đợi mãi không thấy hồi âm…"}, {"spk": "A", "jp": "そりゃ、脈ないよ。", "vi": "Thế thì hết hy vọng rồi."}, {"spk": "B", "jp": "そうかな～。けっこういい感じだったんだけどな～。", "vi": "Chẳng biết nữa. Nhưng bọn tớ đã nói chuyện khá vui đấy."}, {"spk": "A", "jp": "もうあきらめたほうがいいんじゃない？", "vi": "Có lẽ cậu không nên cố thêm nữa."}, {"spk": "B", "jp": "う～ん、商社マンで、バリバリ仕事してる人だから、今度こそ玉の輿って思ったんだけど…。", "vi": "Ờ, anh ấy ở một công ty thương mại, lại giỏi việc nên tớ cứ nghĩ mình là chuột sa chĩnh gạo rồi kia…"}, {"spk": "A", "jp": "ま、そのうち、また合コンあるじゃない。いつかきっとこれだって人が現れると思うよ。", "vi": "Thôi, rồi sẽ lại có những buổi đi chơi chung khác mà. Tớ nghĩ sẽ đến lúc cậu gặp người vừa ý thôi."}, {"spk": "B", "jp": "そうだね、「下手な鉄砲数撃ちゃ当たる」って言うしね。ところで、由美のほうはどう？　うわさの彼とは上手くいってるの？", "vi": "Ù, có câu \"Trăm bó đuốc cũng phải bắt được một con ếch\" mà nhỉ! Còn cậu thì sao hả Yumi? Cậu với anh chàng mà mọi người hay nói đến ấy vẫn ổn cả chứ?"}, {"spk": "A", "jp": "えっ、どうって。まー、ぼちぼち、かな。", "vi": "Hả, sao ấy à? Ờ thì cũng túc tắc."}, {"spk": "B", "jp": "ぼちぼちって？", "vi": "\"Túc tắc\" là sao?"}, {"spk": "A", "jp": "まあまあ上手くいってるってこと。でもね、実はこの間、彼にプロポーズされたんだ。", "vi": "Là cũng tàm tạm ổn. Mà này, thực ra là mới đây anh ấy đã cầu hôn tớ đấy."}, {"spk": "B", "jp": "えー、すごい。やったじゃない！　で、なんて言われたの？", "vi": "Ôi, tuyệt thật đấy. Nhất cậu còn gì! Thế, anh ấy nói gì với cậu?"}, {"spk": "A", "jp": "それがね、フフフ…。", "vi": "Lại kể đến chuyện ấy… Hi hi hi,…"}, {"spk": "B", "jp": "え、何？", "vi": "Sao? Có chuyện gì?"}, {"spk": "A", "jp": "この間、神社の前を通りかかったら、ちょうど結婚式をやってて、白無垢姿のお嫁さんが見えたのね。そしたら、彼が「あれ、着てみない？」って急に言い出して…。私、びっくりしちゃった。", "vi": "Hôm ấy, đúng lúc bọn tớ đi ngang qua một ngôi đền thì gặp ngay một đám cưới và trông thấy một cô dâu mặc bộ đồ trắng muốt. Bỗng nhiên anh ấy nói \"Em...có muốn thử mặc bộ đồ đó không?\" khiến tớ ngạc nhiên quá."}, {"spk": "B", "jp": "それってプロポーズなの？　彼ってシャイなんだね。", "vi": "Thế là cầu hôn ư? Anh ấy nhút nhát quá nhỉ!"}, {"spk": "A", "jp": "うん、そうなの。でも、もっと気の利いたこと言ってほしいよね。", "vi": "Ừ, đúng vậy đấy. Dù sao tớ vẫn muốn anh ấy nói điều gì đó khéo khéo hơn một chút."}, {"spk": "B", "jp": "まー、いいじゃない。贅沢言わないの！　で、由美、何て答えたの？", "vi": "Thôi, thế cũng tốt mà. Đừng đòi hỏi quá nhiều! Thế, cậu trả lời sao, Yumi?"}, {"spk": "A", "jp": "「私はウェディングドレスのほうがいいんだけどな…」って答えたんだけどね。", "vi": "Tớ trả lời là \"Em thích mặc váy cưới hơn cơ...\""}, {"spk": "B", "jp": "へー、で、彼は何て？", "vi": "Ôi, thế anh ấy nói sao?"}, {"spk": "A", "jp": "「君がウェディングドレスがいいなら、僕もタキシードにするよ」だって。", "vi": "Anh ấy nói \"Nếu em muốn mặc váy cưới thì anh cũng sẽ mặc vét đuôi tôm\"."}, {"spk": "B", "jp": "ふーん、そうなんだ。じゃ、プロポーズ成立ってわけか。", "vi": "Ồ, thế à. Vậy là lời cầu hôn được chấp nhận rồi."}]}]}]}, {"section": 3, "level": "上級", "tracks": [{"track": "2-26", "disk": 2, "no": 26, "audio": "sd_2-26.mp3", "dur": 101.12, "pages": [154], "level": "上級", "section": 3, "segments": [{"id": "2-26-1", "no": 1, "page": 154, "start": 0.0, "end": 99.3, "dur": 99.3, "title": "野球観戦", "titleVi": "Xem đấu bóng chày", "lines": [{"spk": "アナウンス", "jp": "ブルータイガースとホワイトソックス、3対2、9回の裏、ホワイトソックスの攻撃。ピッチャー振りかぶって、第一球投げたー！　バッター空振り三振。", "vi": "Blue Tigers đấu với White Sox, tỷ số đang là 3-2, giờ là nửa sau của lượt đấu thứ 9. Đến lượt White Sox tấn công. Cầu thủ ném bóng giơ bóng lên, lượt ném đầu... Ném...! Cầu thủ đánh bóng đánh trượt rồi!"}, {"spk": "A", "jp": "もう、あのバッターなんだっけ？　そうだ、松田だよ！　おい、ちゃんと球見ろよ！　早く引っ込め、こら。", "vi": "\"Hùm, tay đánh bóng ấy tên gì nhỉ? Phải rồi, Matsuda! Ê, nhìn bóng cho kỹ vào!"}, {"spk": "B", "jp": "そうだそうだ。野球なんてやめちまえ。ツーアウトだぞ。もう後がないぞー。", "vi": "Thôi, biến cho sớm đi!\""}, {"spk": "A", "jp": "お、次は清川か。あいつは今調子がいいから、頼むぞー、打ってくれ。", "vi": "Đúng đấy, đúng đấy! Thôi chơi bóng chày luôn đi! Trượt 2 phát rồi. Còn nước gì nữa!"}, {"spk": "A", "jp": "かっ飛ばせー、清川！　フレー、フレー、ホワイトソックス！", "vi": "Ồ, tiếp theo là Kiyokawa à? Tay này phong độ đang ngon. Cố lên nhé! Phang cho trúng vào. Đánh bay bóng đê! Kiyokawa! Cố lên, cố lên! White Sox!"}, {"spk": "B", "jp": "あと一点で同点か。打て打て、清川！　あんなへなちょこピッチャー、こてんぱんにやっちまえ！　おっ、打った打った！　伸びてる。入るかー？", "vi": "Chỉ còn 1 điểm nữa là hòa. Đánh đê, đánh đê, Kiyokawa! Thằng ném bóng chíp hôi ấy, cho nó biết tay đê! Ô, trúng rồi, trúng rồi! Bay cao quá. Có được không đây...?"}, {"spk": "A", "jp": "あー、おしいなー。ファールか。次はちゃーんと球見ていけ。", "vi": "Ôi, tiếc quá! Lỗi rồi! Quả sau phải nhắm cho kỹ vào!"}, {"spk": "B", "jp": "次はどうだ？　おー、落ちついて打ってくれよ。", "vi": "Để xem quả sau nào. Hừm, bình tĩnh mà đánh đấy!"}, {"spk": "A", "jp": "そうだ。やれっ、やれっ！　またファールか。もっとバットの芯に当てないと。", "vi": "Phải rồi! Đánh đê, đánh đê! Lại lỗi rồi! Phải nhắm vào giữa gậy kia."}, {"spk": "B", "jp": "ピッチャーも今日はコントロールがさえてるし。", "vi": "Mà tay ném bóng hôm nay cũng khéo nữa."}, {"spk": "A", "jp": "あー。ツーストライクか。追い込まれたなー。", "vi": "Ôi, two-strike cơ à? Vậy là xong rồi còn gì..."}, {"spk": "B", "jp": "はあ～、なんだよ。見逃しの三振か、まったく情けないな。", "vi": "Hừm... Thế này là sao! Bị loại vì đánh trượt ư? Thật là quá tệ!"}, {"spk": "A", "jp": "肝心な時に打てないんじゃ、だめだな、あれは。また負けたよ。", "vi": "Lúc cần nhất mà không đánh được thì vứt thôi. Lại thua nữa rồi!"}, {"spk": "B", "jp": "こんな調子じゃ、優勝なんて夢のまた夢だな。いつになったらうまいビールが飲めるんだよ、まったく。", "vi": "Cứ thế này thì chức vô địch chỉ là mơ trong mơ thôi. Biết đến bao giờ mới được uống bia mừng chiến thắng đây."}, {"spk": "A", "jp": "も、帰ろ帰ろ。", "vi": "Thôi, về thôi!"}]}]}]}, {"section": 4, "level": "上級", "tracks": [{"track": "2-27", "disk": 2, "no": 27, "audio": "sd_2-27.mp3", "dur": 108.33, "pages": [156], "level": "上級", "section": 4, "segments": [{"id": "2-27-1", "no": 1, "page": 156, "start": 0.52, "end": 106.43, "dur": 105.91, "title": "上司と部下", "titleVi": "Cấp trên với cấp dưới", "lines": [{"spk": "A", "jp": "山田君、ちょっと、今いいかな。", "vi": "Yamada này, giờ có rảnh chút không?"}, {"spk": "B", "jp": "はい、部長。", "vi": "Vâng, thưa trưởng phòng."}, {"spk": "A", "jp": "急で悪いんだけど、山田君に頼みたいことがあるんだよ。", "vi": "Xin lỗi cậu hơi đột xuất một chút nhưng có việc này tôi muốn nhờ cậu."}, {"spk": "B", "jp": "はい、どのようなことでしょうか。", "vi": "Vâng, việc gì thế ạ?"}, {"spk": "A", "jp": "うちの九州地区のお得意様のＫＢＢ電機さんの接待の件なんだけどね…。", "vi": "Về việc đón tiếp công ty thiết bị điện KBB - khách hàng quan trọng của chúng ta ở khu vực Kyushu ấy mà..."}, {"spk": "B", "jp": "あ、はい。", "vi": "À, vâng ạ."}, {"spk": "A", "jp": "うちの社長にうかがったんだけど、山田君はＫＢＢ電機さんの社長のお孫さんなんだって？", "vi": "Tôi nghe giám đốc nói, cậu là cháu của ngài giám đốc KBB phải không?"}, {"spk": "B", "jp": "はい…。私の母方の祖父ですが…。", "vi": "Vâng... Đó là ông ngoại em ạ..."}, {"spk": "A", "jp": "いや～、知らなかったよー。ところで、実は、今週の金曜日にＫＢＢ電機さんの社長とうちの社長が会食をする予定になっていてね。", "vi": "Ôi trời, tôi đâu có biết. Thực ra thì thứ Sáu tuần này, giám đốc công ty chúng ta định dùng bữa cùng ngài giám đốc công ty thiết bị điện KBB."}, {"spk": "B", "jp": "あ、そうなんですか。", "vi": "Ô, thế ạ?"}, {"spk": "A", "jp": "それで、せっかくだから、会食の時に山田君にも出席してもらったらどうかとうちの社長がおっしゃるんだよ。", "vi": "Cũng chẳng mấy khi có dịp như vậy nên giám đốc công ty chúng ta hỏi không biết cậu có tham dự bữa đó được không."}, {"spk": "B", "jp": "私がですか？", "vi": "Em ấy ạ?"}, {"spk": "A", "jp": "うん、ＫＢＢ電機さんの社長はめったに上京なさらないそうだし…、山田君とも久しぶりにお会いになりたいんじゃないかな？", "vi": "Ừ, nghe nói ngài giám đốc KBB chẳng mấy khi lên Tokyo... Và chắc lâu lâu cũng muốn gặp cậu đúng không?"}, {"spk": "B", "jp": "はあ…。しかし、部長、こんなことを申し上げては何ですが、祖父には仕事とプライベートを混同してはいけないといつも言われていますが…。", "vi": "Ôi... Thưa trưởng phòng, xin lỗi em nói điều này nhưng ông em luôn bảo em không được lẫn lộn công việc với đời tư ạ..."}, {"spk": "A", "jp": "あー、それは十分承知してるんだが、まあ今回は特別ということで。", "vi": "Ồ, tôi rất hiểu điều đó, nhưng thôi, cứ coi lần này là ngoại lệ."}, {"spk": "B", "jp": "わかりました。それでは、お言葉に甘えて出席させていただきます。", "vi": "Vâng. Vậy em xin nghe lời trưởng phòng, tham dự bữa đó ạ."}, {"spk": "A", "jp": "頼むよ。何てったって、うちの社長のご提案なんだからね。", "vi": "Nhờ cậu đấy nhé. Dù sao chăng nữa, đây cũng là đề xuất của giám đốc công ty chúng ta mà."}, {"spk": "B", "jp": "光栄です。では、祖父にはサプライズということにして…。", "vi": "Cảm ơn đã chiếu cố đến em. Vậy cứ coi như một sự ngạc nhiên em giành cho ông ngoại..."}, {"spk": "A", "jp": "うん。ところで、お祖父様はどんなものがお好きなのかな？", "vi": "Ù. Mà này, ông cậu thích món gì vậy?"}, {"spk": "B", "jp": "そうですねー。祖父は「今十」の牛肉が好きで、母がよく送ったりしてますけど…。", "vi": "Để xem nào... Ông em thích thịt bò Imagyu nên mẹ em vẫn hay gửi cho ông..."}, {"spk": "A", "jp": "じゃっ、それで決まりだな。うちの社長も「今十」好きだし、ちょうどよかった。じゃー、細かいことは後で連絡するから、頼んだよ。", "vi": "Vậy là quyết định rồi. Vừa hay, giám đốc công ty ta cũng thích Imagyu. Được rồi, cụ thể tôi sẽ báo cho cậu sau. Cứ vậy nhé!"}, {"spk": "B", "jp": "はい、承知しました。", "vi": "Vâng, rõ rồi ạ!"}]}]}]}, {"section": 5, "level": "上級", "tracks": [{"track": "2-28", "disk": 2, "no": 28, "audio": "sd_2-28.mp3", "dur": 142.29, "pages": [158], "level": "上級", "section": 5, "segments": [{"id": "2-28-1", "no": 1, "page": 158, "start": 0.51, "end": 140.48, "dur": 139.97, "title": "就職面接", "titleVi": "Phỏng vấn tuyển dụng", "lines": [{"spk": "A", "jp": "では、李さんが弊社でやりたいと思っていることを話してください。", "vi": "Nào, cô Lee hãy trình bày việc cô muốn làm ở công ty của chúng tôi."}, {"spk": "B", "jp": "はい。えー、近年、韓国ドラマブームをきっかけに、日本では韓国に対する関心が高まっていると思います。韓国へ旅行に来る日本の方もずいぶん増えました。", "vi": "Vâng. Những năm gần đây, nhờ phim truyền hình Hàn Quốc mà có vẻ như ở Nhật Bản, mọi người ngày càng quan tâm hơn tới Hàn Quốc, du khách Nhật Bản đến Hàn Quốc đã tăng lên đáng kể."}, {"spk": "A", "jp": "そうですね。", "vi": "Đúng vậy."}, {"spk": "B", "jp": "はい。そこで、そういう日本の方に、韓国の家庭にホームステイしてもらえるようなツアーを開発してみたいと思っています。", "vi": "Vâng. Vì vậy tôi muốn thử mở tour cho du khách Nhật Bản đến ở home-stay trong gia đình Hàn Quốc."}, {"spk": "A", "jp": "ははあ。韓国の家庭にホームステイですか。今までに李さんは外国でホームステイしたり、反対に受け入れたりした経験があるんですか？", "vi": "Hay đấy! Home-stay trong gia đình Hàn Quốc đúng không? Thế cô đã bao giờ home-stay ở nước ngoài, hoặc nhận khách home-stay ở nhà mình bao giờ chưa?"}, {"spk": "B", "jp": "いいえ、残念ながらありません。", "vi": "Chưa ạ. Rất tiếc là chưa ạ."}, {"spk": "A", "jp": "あー、ではホームステイについてのノウハウとか、プランを立てる際のツボとかを研究したことは？", "vi": "Ừm, thế cô đã bao giờ nghiên cứu về cách home-stay hay các bí quyết khi lập kế hoạch chưa?"}, {"spk": "B", "jp": "いいえ、まだありませんが、これから勉強するつもりです。夏休みには北海道の農家にホームステイする予定です。また、日本人を受け入れたことがある韓国人の友人から、そのときの経験について聞き取りをする約束をしました。そして、気がついたことをまとめていこうと思っています。", "vi": "Chưa, cũng chưa, nhưng tôi sẽ học. Kỳ nghỉ hè tới, tôi định sẽ home-stay ở một gia đình nông dân Hokkaido. Ngoài ra, tôi cũng đã hẹn sẽ phỏng vấn về kinh nghiệm của một người bạn Hàn Quốc đã từng nhận khách Nhật Bản home-stay. Sau đó, tôi sẽ tổng kết lại những gì mình thu nhận được."}, {"spk": "A", "jp": "うん。まー、おもしろい発想だとは思うんですがね。あー、こういうプランは留学斡旋会社なんかでやってみたほうがいいんじゃないかな。うちではまだやったことないし、未知数だね。", "vi": "Ừm. Tôi thấy ý tưởng của cô cũng hay đấy. Có lẽ cô nên thử kế hoạch này ở một công ty hỗ trợ lưu học xem sao. Chúng tôi chưa làm việc này bao giờ và cũng nhiều yếu tố chưa chắc chắn."}, {"spk": "B", "jp": "そうかもしれませんが、留学斡旋専門の会社では、学生が中心だと思うんです。でも、私は、学生よりもむしろ一般の社会人の方、高齢の方などを対象にしたものを作ってみたいと考えています。", "vi": "Có thể đúng như vậy, nhưng các công ty chuyên hỗ trợ lưu học thì họ chú trọng đến sinh viên. Còn tôi muốn thử mở tour nhắm tới đối tượng là những người đã ra trường hoặc người cao tuổi kia."}, {"spk": "A", "jp": "そうですか。ま、ほかでやっているのとどう差別化を図るかが問題でしょうね。", "vi": "Vậy hả? Vấn đề là khác biệt hóa thế nào với những công ty khác kia."}, {"spk": "B", "jp": "はい。そのあたりを研究して、実現に向けて努力したいと思います。", "vi": "Vâng. Tôi muốn cố gắng nghiên cứu để thực hiện chính điều đó đấy ạ."}, {"spk": "A", "jp": "そうですか。ところで李さんはどうして日本で就職しようと思ったんですか？韓国の会社でも同じようなことは出来ると思いますけど。", "vi": "Vậy hả? Mà, tại sao cô lại muốn xin việc ở công ty của Nhật Bản? Tôi nghĩ cô có thể làm được điều tương tự ở một công ty của Hàn Quốc mà."}, {"spk": "B", "jp": "はい。確かに韓国にある会社でも可能だとは思いますが、日本の文化や風土をよく理解することがこの仕事には重要だと思いますので、日本の会社で働きたいと考えています。", "vi": "Vâng. Đúng là cũng có thể làm được điều đó ở một công ty Hàn Quốc, nhưng tôi nghĩ, đối với công việc này, điều quan trọng là hiểu rõ văn hóa, phong tục của Nhật Bản nên tôi muốn được làm việc ở một công ty Nhật Bản."}]}]}]}, {"section": 6, "level": "上級", "tracks": [{"track": "2-29", "disk": 2, "no": 29, "audio": "sd_2-29.mp3", "dur": 140.38, "pages": [160], "level": "上級", "section": 6, "segments": [{"id": "2-29-1", "no": 1, "page": 160, "start": 0.48, "end": 138.51, "dur": 138.03, "title": "テレフォンショッピング", "titleVi": "Telephone shopping", "lines": [{"spk": "", "jp": "さー、「さわやかテレフォンショッピング」の時間がやってまいりました。本日は、「さわやかテレフォンショッピング」をご覧いただいている皆様だけにご紹介させていただく商品のご案内です。早速、メモをご用意の上、商品の素晴らしさをその目でお確かめください。", "vi": "Nào, chúng ta cùng đến với chương trình \"Sawayaka Telephone Shopping\" nhé. Hôm nay, chúng tôi xin giới thiệu một loại sản phẩm chỉ giành riêng cho các khán giả của chương trình \"Sawayaka Telephone Shopping\" mà thôi. Các bạn hãy nhanh tay chuẩn bị ghi chép lại và tận mắt cảm nhận sự tuyệt vời của sản phẩm này nhé."}, {"spk": "", "jp": "梅雨時はジメジメと湿気が多く、お部屋にいても気分がスッキリしない毎日が続きますね。エアコンの送風をお使いのご家庭も多いようですが、けっこう電気代もバカになりません。小さなお子様がいらっしゃるご家庭では、風がお子様の体に直接あたって風邪をひかせてしまった、というようなお話もよく聞きます。", "vi": "Vào mùa mưa, ngày nào chúng ta cũng cảm thấy không thoải mái vì độ ẩm cao khiến mọi thứ nhớp nháp. Nhiều gia đình sử dụng chế độ thông gió của điều hòa nhưng rất tốn tiền điện đúng không? Chúng ta cũng thường nghe mọi người kể nhiều nhà có trẻ con bị gió thổi vào người nên bị cảm."}, {"spk": "", "jp": "そこで、本日ご紹介させていただくのが、こちらの「スーパーフレッシュエアドライ」でございます。この「スーパーフレッシュエアドライ」は、お部屋に置いていただくだけで、ジメジメと湿った空気をグングン吸い取り、高原にいるような爽やかな気分にさせてくれる、まさに奇跡の商品でございます。ご覧のように超小型設計ですから、お部屋の片隅に置いていただいてもまったく邪魔になりません。直径15センチ、高さ30センチで、デザインもシンプルですので、どんなインテリアにもすっきり調和いたします。カラーも、ホワイト・ベージュ・ブラック・ブラウンと4色ご用意いたしました。", "vi": "Và chính vì thế, hôm nay chúng tôi xin giới thiệu với các bạn sản phẩm \"Super Fresh Air Dry\" này. Bạn chỉ cần để hộp \"Super Fresh Air Dry\" trong phòng là nó sẽ liên tục hút không khí ẩm, khiến cho bạn cảm thấy sảng khoái như đang ở giữa cao nguyên vậy. Sản phẩm này đúng là một kỳ tích. Như các bạn thấy, với cấu tạo siêu nhỏ gọn, các bạn có thể đặt nó trong góc phòng mà không hề cảm thấy chướng. Với đường kính 15cm, chiều cao 30cm, thiết kế tối giản, nó có thể hài hòa với bất kỳ thiết kế nội thất nào. Chúng tôi cũng đã chuẩn bị tới bốn màu trắng, be, đen, nâu cho sự lựa chọn của các bạn."}, {"spk": "", "jp": "本体ケースには、当社独自の製法で吸水力50パーセントアップに成功した粉末状の吸水剤が入っております。ご覧ください。こちらは、実際に部屋に置いて一週間後の「スーパーフレッシュエアドライ」の吸水剤です。一週間で空気中の水分が2リ pk": "", "jp": "私がスペインの大学を卒業して21歳で来日したとき、東京には一人の知り合いもいませんでした。日本語も当時は挨拶程度しかできず、せまいアパートで自炊をして日本語学校へ通い、慣れない生活に、夜、暗い部屋に帰りますと本当に寒くて、一人でご飯を食べて…、そういう毎日でした。", "vi": "Khi tôi đến Nhật Bản năm 21 tuổi, sau khi tốt nghiệp đại học ở Tây Ban Nha, tôi không có lấy một người quen ở Tokyo. Hồi ấy tiếng Nhật của tôi chỉ biết chào hỏi, tôi sống trong một căn chung cư nhỏ, tự nấu ăn và theo học một trường tiếng Nhật. Giữa cuộc sống xa lạ, hàng tối, tôi trở về căn phòng tối và rất lạnh, ngồi ăn một mình... Ngày nào cũng vậy..."}, {"spk": "", "jp": "それから少しずつ日本語もわかるようになり、友人もでき、またバイトも始めるようにもなり、東京の生活が軌道に乗りはじめた頃、友人の岩城潤一君、今日も出席してもらっていますが、岩城君の紹介で夕子さんと出逢いました。", "vi": "Rồi dần dần, tôi hiểu tiếng Nhật nhiều hơn, có thêm bạn, bắt đầu đi làm thêm, rồi đúng lúc cuộc sống của tôi ở Tokyo bắt đầu đi vào quỹ đạo thì một người bạn của tôi - anh Junichi Iwaki, hôm nay cũng có mặt tại đây, qua giới thiệu của anh ấy, tôi đã được gặp Yuko."}, {"spk": "", "jp": "今日ここで、人と人との出逢い、つながりの大切さというものを改めて感じております。私たちには財産と呼べるようなものは何もありません。ただ、今日こうして皆様にお越しいただき、お祝いの言葉をいただき、このつながりが私たち二人の掛け替えのない財産だと感じております。", "vi": "Ngày hôm nay, tại nơi này, một lần nữa tôi lại cảm nhận được ý nghĩa quan trọng của những cuộc hội ngộ, của sự gắn kết giữa con người với con người. Hai chúng tôi không có gì đáng để gọi là tài sản. Nhưng tôi cảm thấy sự có mặt của các quý vị ngày hôm nay cùng với những lời chúc tốt đẹp, chính sự gắn kết này là tài sản không gì sánh được của hai chúng tôi."}, {"spk": "", "jp": "これからは、お互い手を取り合って協力し笑顔の絶えない家庭にしていきたいと思います。そして皆様、今後とも私たち二人をお見守り、ご指導くださいますようお願いいたします。本日は、本当に、ありがとうございました。", "vi": "Từ nay về sau, chúng tôi sẽ nắm chặt tay nhau, cùng nhau tạo dựng một gia đình luôn tràn ngập tiếng cười. Mong các quý vị hãy tiếp tục giúp đỡ và chỉ bảo cho chúng tôi. Xin chân thành cảm ơn các quý vị."}]}]}]}, {"section": 8, "level": "上級", "tracks": [{"track": "2-31", "disk": 2, "no": 31, "audio": "sd_2-31.mp3", "dur": 150.91, "pages": [164], "level": "上級", "section": 8, "segments": [{"id": "2-31-1", "no": 1, "page": 164, "sta const LS_KEY = "jp_learn_v1";
const INTERVALS = [0, 1, 2, 4, 7, 15, 30];
let store = load();
if(!store.deckDone) store.deckDone={}; // migrate: user cũ chưa có field này
if(!store.favorites) store.favorites={}; // migrate: user cũ chưa có field này
if(!store.stats.history) store.stats.history={}; // migrate: user cũ chưa có field này (FR_012)
function load(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || defaultStore(); }
  catch(e){ return defaultStore(); }
}
function defaultStore(){ return {cards:{},stats:{studied:0,streak:0,lastDay:null,history:{}},deckDone:{},favorites:{}}; }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
function today(){ return new Date().toISOString().slice(0,10); }
function cardState(id){
  if(!store.cards[id]) store.cards[id] = {box:0, due:today(), correct:0, seen:0, mastered:false};
  return store.cards[id];
}
function isMastered(id){ var c=store.cards[id]; return !!(c && c.mastered); }
function toggleMastered(id){ var c=cardState(id); c.mastered=!c.mastered; save(); return c.mastered; }
function isFavorite(id){ return !!store.favorites[id]; }
function toggleFavorite(id){
  if(store.favorites[id]) delete store.favorites[id]; else store.favorites[id]=true;
  save();
  return isFavorite(id);
}
function isDue(id){
  const c = store.cards[id];
  if(!c) return true;
  return c.due <= today();
}
function reviewCard(id, quality){
  const c = cardState(id);
  c.seen++;
  if(quality===0){ c.box=Math.max(0,c.box-1); }
  else if(quality===1){ /* stay */ }
  else if(quality===2){ c.box=Math.min(INTERVALS.length-1,c.box+1); c.correct++; }
  else { c.box=Math.min(INTERVALS.length-1,c.box+2); c.correct++; }
  const d = new Date(); d.setDate(d.getDate()+INTERVALS[c.box]);
  c.due = d.toISOString().slice(0,10);
  bumpStudied();
  save();
}
/* Streak + lịch sử theo ngày — dùng chung cho mọi hoạt động học (SRS lẫn IT業務編), không riêng lượt ôn thẻ */
function bumpStreak(){
  const t=today();
  if(store.stats.lastDay!==t){
    const y=new Date(); y.setDate(y.getDate()-1);
    store.stats.streak = (store.stats.lastDay===y.toISOString().slice(0,10))? store.stats.streak+1 : 1;
    store.stats.lastDay=t;
  }
  store.stats.history[t] = (store.stats.history[t]||0) + 1;
}
function bumpStudied(){
  bumpStreak();
  store.stats.studied++;
}
function learnedCount(){ return Object.values(store.cards).filter(c=>c.box>=3||c.mastered).length; }
function dueCount(list){ return list.filter(v=>isDue(v.id)).length; }
/* Số ngày đã bỏ lỡ liên tiếp TRƯỚC hôm nay (không tính lastDay/hôm nay) — 0 nếu streak còn nguyên hoặc chưa học lần nào.
   VD: lastDay = 3 ngày trước → 2 ngày ở giữa chưa học → trả về 2. */
function streakGapDays(){
  if(!store.stats.lastDay) return 0;
  var last=new Date(store.stats.lastDay+'T00:00:00');
  var t=new Date(today()+'T00:00:00');
  var diff=Math.round((t-last)/86400000);
  return Math.max(0, diff-1);
}

let allJaVoices=[];
let jaVoice=null;
let currentAudio=null;
let currentGyoumuAudio=null;
let currentShadowAudio=null;

function loadJaVoices(){
  if(!('speechSynthesis' in window)) return;
  var vs=speechSynthesis.getVoices();
  allJaVoices = vs.filter(function(v){return v.lang==='ja-JP'||v.lang.startsWith('ja');});
  pickVoiceByGender();
}
function pickVoiceByGender(){
  if(allJaVoices.length===0){ jaVoice=null; return; }
  // Try to use saved voiceName first
  if(ttsSettings.voiceName){
    var saved = allJaVoices.find(function(v){return v.name===ttsSettings.voiceName;});
    if(saved){ jaVoice=saved; return; }
  }
  // Heuristic: female names often contain keywords
  var femaleKw = ['female','woman','haruka','kyoko','nanami','o-ren','misaki','ren','女'];
  var maleKw = ['male','man','ichiro','keita','otoya','takumi','男'];
  var kw = ttsSettings.gender==='male' ? maleKw : femaleKw;
  var match = allJaVoices.find(function(v){
    var n=v.name.toLowerCase();
    return kw.some(function(k){return n.indexOf(k)>=0;});
  });
  jaVoice = match || allJaVoices[0];
}
if('speechSynthesis' in window){
  loadJaVoices();
  speechSynthesis.onvoiceschanged=loadJaVoices;
  setTimeout(loadJaVoices, 500);
}

}

  var t = encodeURIComponent(text.substring(0,200));
  var spd = speed || ttsSettings.speed || 0.9;
  if(variant==='tw-ob') return 'https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&ttsspeed='+spd+'&q='+t;
  return 'https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=ja&client=gtx&ttsspeed='+spd+'&q='+t;
}

/* Split long text into chunks for Google TTS (max ~200 chars per request) */
function splitText(text, maxLen){
  if(text.length<=maxLen) return [text];
  var chunks=[], remaining=text;
  while(remaining.length>0){
    if(remaining.length<=maxLen){ chunks.push(remaining); break; }
    var cut=remaining.lastIndexOf('。', maxLen);
    if(cut<1) cut=remaining.lastIndexOf('、', maxLen);
    if(cut<1) cut=remaining.lastIndexOf(' ', maxLen);
    if(cut<1) cut=maxLen;
    else cut=cut+1;
    chunks.push(remaining.substring(0,cut));
    remaining=remaining.substring(cut);
  }
  return chunks;
}

/* Timeout mặc định cho 1 request Google TTS — tránh treo vô thời hạn nếu WebView
   (đặc biệt Android native) chặn network tới translate.googleapis.com mà không bắn onerror.
   Tăng lên 8s (từ 5s) vì mạng di động/WebView có thể chậm hơn dự kiến — ưu tiên tránh
   fallback nhầm khi mạng chỉ chậm tạm thời, hơn là timeout gấp gây báo lỗi oan. */
const TTS_TIMEOUT_MS = 8000;
function playAudioUrl(url, timeoutMs){
  timeoutMs = timeoutMs || TTS_TIMEOUT_MS;
  return new Promise(function(resolve){
    stopSpeech();
    currentAudio = new Audio(url);
    var settled=false;
    var timer=setTimeout(function(){
      if(settled) return; settled=true;
      if(currentAudio){ try{currentAudio.pause();}catch(e){} }
      currentAudio=null;
      resolve('error:timeout');
    }, timeoutMs);
    currentAudio.onended = function(){ if(settled)return; settled=true; clearTimeout(timer); currentAudio=null; resolve('ok'); };
    currentAudio.onerror = function(){
      if(settled)return; settled=true; clearTimeout(timer);
      var code = (currentAudio && currentAudio.error) ? currentAudio.error.code : '?';
      currentAudio=null; resolve('error:media'+code);
    };
    currentAudio.play().catch(function(e){ if(settled)return; settled=true; clearTimeout(timer); resolve('error:play('+(e&&e.name||'?')+')'); });
  });
}

/* Toast ngắn — dùng khi cả 2 đường phát âm (Google TTS + device TTS) đều thất bại */
let toastTimer=null;
function showToast(msg, duration){
  duration = duration || 2500;
  var el = document.getElementById('kokoroToast');
  if(!el){
    el = document.createElement('div');
    el.id='kokoroToast';
    el.className='toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, duration);
}

/* Device voice (offline) — applies speed, pitch, voice settings. Trả về false nếu speechSynthesis không khả dụng (VD Android WebView) */
function deviceSpeak(text, rateOverride){
  if(!('speechSynthesis' in window)||!text) return false;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';
  u.rate = rateOverride || ttsSettings.speed || 0.9;
  u.pitch = ttsSettings.pitch || 1.0;
  if(jaVoice) u.voice=jaVoice;
  speechSynthesis.speak(u);
  return true;
}
function deviceSpeakAsync(text, rateOverride){
  return new Promise(function(resolve){
    if(!('speechSynthesis' in window)||!text){ resolve(false); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';
    u.rate = rateOverride || ttsSettings.speed || 0.9;
    u.pitch = ttsSettings.pitch || 1.0;
    if(jaVoice) u.voice=jaVoice;
    u.onend=function(){resolve(true);}; u.onerror=function(){resolve(true);};
    speechSynthesis.speak(u);
  });
}

/* Thử phát 1 chunk qua Google TTS, tự thử lại với endpoint dự phòng (client=tw-ob) nếu endpoint chính (gtx) lỗi.
   Trả về 'ok' hoặc chuỗi lỗi cụ thể ('error:timeout'/'error:media2'/'error:play(NotAllowedError)'...) để hiển thị chẩn đoán. */
async function playTTSChunk(text, speed){
  var result = await playAudioUrl(gTranslateTTSUrl(text, speed, 'gtx'));
  if(result.indexOf('error')===0){
    result = await playAudioUrl(gTranslateTTSUrl(text, speed, 'tw-ob'));
  }
  return result;
}

/* Main speak: trên app native (APK) → dùng thẳng TextToSpeech hệ thống, không qua mạng (đáng tin cậy nhất).
   Trên web/browser → Google TTS (tự thử 2 endpoint) → device fallback (speechSynthesis). Nếu tất cả đều thất bại → toast kèm mã lỗi, không im lặng */
async function speak(text, rateOverride){
  if(!text) return;
  stopSpeech();
  var speed = rateOverride || ttsSettings.speed || 0.9;
  if(isNativeApp() && nativeTTS()){
    if(await nativeSpeak(text, speed)) return;
    showToast('Không phát được âm thanh. Kiểm tra máy đã cài giọng đọc Tiếng Nhật (Cài đặt → Ngôn ngữ → Chuyển văn bản thành giọng nói).');
    return;
  }
  if(ttsSettings.mode==='google'){
    var chunks = splitText(text, 200);
    var result = await playTTSChunk(chunks[0], speed);
    if(result.indexOf('error')===0){
      if(!deviceSpeak(text, speed)) showToast('Không phát được âm thanh ('+result+'). Kiểm tra kết nối mạng.');
      return;
    }
    for(var ci=1; ci<chunks.length; ci++){
      await playTTSChunk(chunks[ci], speed);
    }
    return;
  }
  if(!deviceSpeak(text, speed)) showToast('Không phát được âm thanh, kiểm tra kết nối mạng');
}

async function speakAsync(text, rateOverride){
  if(!text) return;
  stopSpeech();
  var speed = rateOverride || ttsSettings.speed || 0.9;
  if(isNativeApp() && nativeTTS()){
    if(await nativeSpeak(text, speed)) return;
    showToast('Không phát được âm thanh. Kiểm tra máy đã cài giọng đọc Tiếng Nhật (Cài đặt → Ngôn ngữ → Chuyển văn bản thành giọng nói).');
    return;
  }
  if(ttsSettings.mode==='google'){
    var chunks = splitText(text, 200);
    for(var ci=0; ci<chunks.length; ci++){
      var result = await playTTSChunk(chunks[ci], speed);
      if(result.indexOf('error')===0){
        if(!(await deviceSpeakAsync(text, speed))) showToast('Không phát được âm thanh ('+result+'). Kiểm tra kết nối mạng.');
        return;
      }
    }
    return;
  }
  if(!(await deviceSpeakAsync(text, speed))) showToast('Không phát được âm thanh, kiểm tra kết nối mạng');
}

function buildExportPayload(){
  return {
    app:'kokoro_nihongo',
    version:1,
    exportedAt:new Date().toISOString(),
    wordCount:VOCAB.length,
    data:{
      jp_learn_v1:localStorage.getItem('jp_learn_v1'),
      kokoro_gyoumu_v1:localStorage.getItem('kokoro_gyoumu_v1'),
      kokoro_shadow_v1:localStorage.getItem('kokoro_shadow_v1'),
      kokoro_tts_settings:localStorage.getItem('kokoro_tts_settings'),
      kokoro_ui_settings:localStorage.getItem('kokoro_ui_settings')
    }
  };
}
function exportSummaryLine(){
  var withProgress=Object.keys(store.cards).length;
  var learned=learnedCount();
  var streak=store.stats.streak||0;
  return 'Đã xuất: '+withProgress+' từ có tiến độ · '+learned+' từ đã thuộc · streak '+streak+' ngày';
}
function copyToClipboard(text, cb){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){cb(true);}).catch(function(){fallbackCopyFromArea(cb);});
  } else {
    fallbackCopyFromArea(cb);
  }
}
function fallbackCopyFromArea(cb){
  try{
    var ta=document.getElementById('exportArea');
    if(!ta){ cb(false); return; }
    ta.focus(); ta.select();
    cb(document.execCommand('copy'));
  }catch(e){ cb(false); }
}
async function renderExportBox(){
  var payload=buildExportPayload();
  var json=JSON.stringify(payload);
  var box=document.getElementById('pmBox');
  var d=new Date().toISOString().slice(0,10);
  var filename='kokoro_tien_do_'+d+'.json';
  if(isNativeApp()){
    var fs=nativeFilesystem(), sh=nativeShare();
    if(fs && sh){
      box.innerHTML='<div class="export-summary">'+exportSummaryLine()+'</div><div class="hint">Đang tạo file...</div>';
      try{
        var res=await fs.writeFile({path:filename, data:json, directory:'CACHE', encoding:'utf8'});
        await sh.share({title:'Xuất tiến độ Kokoro Nihongo', text:'File tiến độ học '+filename, url:res.uri, dialogTitle:'Lưu file tiến độ vào đâu?'});
        box.innerHTML=
          '<div class="export-summary">'+exportSummaryLine()+'</div>'+
          '<div class="hint">Đã mở hộp thoại lưu/chia sẻ file <b>'+filename+'</b>. Chọn "Lưu vào thiết bị", Drive, Zalo hay Mail để giữ lại bản sao lưu.</div>';
      }catch(e){
        exportFallbackTextarea(box, json, filename, 'Không tạo được file ('+e+'), dùng cách dán thủ công:');
      }
    } else {
      exportFallbackTextarea(box, json, filename, 'Thiếu plugin lưu file, dùng cách dán thủ công:');
    }
  } else {
    var blob=new Blob([json], {type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);}, 3000);
    box.innerHTML=
      '<div class="export-summary">'+exportSummaryLine()+'</div>'+
      '<div class="hint">Đã tải file <b>'+filename+'</b> về máy.</div>';
    showToast('Đã xuất tiến độ');
  }
}

  var newMastered=Object.keys(incCards).filter(function(id){var c=incCards[id];return c.box>=3||c.mastered;}).length;
  var newReviews=incStats.studied||0;
  var newStreak=incStats.streak||0;
  var biggerHere = curMastered>newMastered && curReviews>newReviews && curStreak>newStreak;

  var html=

/* ═══════════════ MICROPHONE / SPEECH RECOGNITION ═══════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micPermission = 'unknown'; // 'unknown' | 'granted' | 'denied' | 'unsupported'

async function checkMicPermission(){
  if(!SR){ micPermission='unsupported'; return micPermission; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    // Older browser or file:// protocol — try SR directly
    micPermission='unknown';
    return micPermission;
  }
  try{
    const result = await navigator.permissions.query({name:'microphone'});
    micPermission = result.state; // 'granted','denied','prompt'
    result.onchange = ()=>{ micPermission=result.state; };
    return micPermission;
  }catch(e){
    // permissions API not supported, try directly
    micPermission='unknown';
    return micPermission;
  }
}

async function requestMicPermission(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    // Fallback: try starting SR directly — it will prompt
    return new Promise(resolve=>{
      if(!SR){ micPermission='unsupported'; resolve(false); return; }
      const test = new SR();
      test.lang='ja-JP';
      test.onresult=()=>{ micPermission='granted'; test.stop(); resolve(true); };
      test.onerror=(e)=>{
        if(e.error==='not-allowed') micPermission='denied';
        resolve(e.error!=='not-allowed');
      };
      test.onend=()=>resolve(micPermission==='granted');
      try{ test.start(); setTimeout(()=>{try{test.stop();}catch(e){}},2000); }
      catch(e){ resolve(false); }
    });
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop()); // release immediately
    micPermission='granted';
    return true;
  }catch(e){
    micPermission='denied';
    return false;
  }
}

/* Android WebView (app đóng gói Capacitor) không hề implement Web Speech API —
   dùng native plugin @capgo/capacitor-speech-recognition khi chạy trong app,
   fallback Web Speech API khi chạy trên trình duyệt (desktop/Android Chrome/iOS Safari) */
function isNativeApp(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
function nativeSR(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechRecognition; }
/* Xuất tiến độ ra file thật (FR_011, bản sửa 2026-09-12): ghi vào bộ nhớ đệm riêng của app rồi
   mở hộp thoại Chia sẻ hệ thống để người dùng chọn nơi lưu (Files/Drive/Zalo/Mail...) —
   tránh phải xin quyền lưu trữ ngoài (Android scoped storage từ API 29+ hạn chế việc này). */
function nativeFilesystem(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem; }
function nativeShare(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share; }
/* TTS native (Android APK) — dùng thẳng engine TextToSpeech của hệ điều hành, không qua mạng/Google Translate
   endpoint. Thay thế hoàn toàn đường Google TTS (vốn không đáng tin cậy trong WebView đóng gói) khi chạy native. */
function nativeTTS(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech; }
async function nativeSpeak(text, rateOverride){
  var tts = nativeTTS();
  if(!tts || !text) return false;
  try{
    await tts.speak({text:text, lang:'ja-JP', rate:rateOverride||ttsSettings.speed||0.9, pitch:ttsSettings.pitch||1.0, volume:1.0});
    return true;
  }catch(e){ return false; }
}
let activeWebRec=null;

async function ensureMicReady(){
  if(isNativeApp() && nativeSR()){
    var p=nativeSR();
    var perm = await p.checkPermissions();
    if(perm.speechRecognition==='granted') return true;
    perm = await p.requestPermissions();
    return perm.speechRecognition==='granted';
  }
  if(micPermission==='granted') return true;
  return await requestMicPermission();
}

/* Ghi âm 1 câu, trả về Promise<string[]> danh sách transcript ứng viên */
async function recognizeOnce(lang){
  if(isNativeApp() && nativeSR()){
    var res = await nativeSR().start({language:lang, maxResults:3, partialResults:false, popup:false});
    return res.matches || [];
  }
  return new Promise(function(resolve,reject){
    if(!SR){ reject('unsupported'); return; }
    var rec=new SR(); rec.lang=lang; rec.interimResults=false; rec.maxAlternatives=3; rec.continuous=false;
    activeWebRec=rec;
    rec.onresult=function(e){ resolve([].slice.call(e.results[0]).map(function(r){return r.transcript;})); };
    rec.onerror=function(e){ reject(e.error); };
    rec.onend=function(){ activeWebRec=null; };
    try{ rec.start(); }catch(err){ reject('start-failed'); }
  });
}
function cancelRecognition(){
  if(isNativeApp() && nativeSR()){ try{ nativeSR().stop(); }catch(e){} }
  else if(activeWebRec){ try{ activeWebRec.stop(); }catch(e){} activeWebRec=null; }
}

/* text similarity for pronunciation scoring */
function normJa(s){ return (s||'').replace(/[、。「」『』（）\(\)\s.,!?！？・ー〜~]/g,''); }
function similarity(a,b){
  a=normJa(a); b=normJa(b);
  if(!a||!b) return 0;
  if(a===b) return 100;
  const m=a.length,n=b.length,dp=Array(n+1).fill(0);
  for(let i=1;i<=m;i++){let prev=0;for(let j=1;j<=n;j++){const t=dp[j];dp[j]=a[i-1]===b[j-1]?prev+1:Math.max(dp[j],dp[j-1]);prev=t;}}
  return Math.round(dp[n]/Math.max(m,n)*100);
}

/* ═══════════════ ÂM THANH PHẢN HỒI CHẤM ĐIỂM PHÁT ÂM (Web Audio API — không cần file âm thanh ngoài) ═══════════════ */
let sfxCtx=null;
function getSfxCtx(){
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!sfxCtx) sfxCtx = new AC();
  if(sfxCtx.state==='suspended') sfxCtx.resume();
  return sfxCtx;
}
function beep(freq, startTime, duration, gain){
  var ctx=getSfxCtx(); if(!ctx) return;
  var osc=ctx.createOscillator(), g=ctx.createGain();
  osc.type='sine'; osc.frequency.value=freq;
  var t0=ctx.currentTime+startTime;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain||0.2, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+duration+0.02);
}
/* Âm thanh theo mức điểm phát âm (LCS similarity): <50 nhắc thử lại (2 nốt trầm) · 51-89 khá tốt (1 nốt) · 90-100 xuất sắc (chuỗi 3 nốt lên) */
function playScoreSound(score){
  try{
    if(score>=90){ beep(784,0,0.12,0.22); beep(988,0.1,0.12,0.22); beep(1175,0.2,0.2,0.24); }
    else if(score>=51){ beep(660,0,0.18,0.2); }
    else { beep(311,0,0.16,0.18); beep(233,0.15,0.2,0.18); }
  }catch(e){}
}

/* ═══════════════ ĐIỀN TỪ VÀO CÂU — dò ô trống (FR_009) ═══════════════ */
/* Sinh các dạng chữ có thể xuất hiện trong câu ví dụ, dài trước ngắn sau */
function clozeCandidates(w){
  var base = w.replace(/[（(][^）)]*[)）]/g,'').replace(/　/g,' ').trim();
  var seeds = {}; seeds[base]=1; seeds[w.trim()]=1;
  base.split(/[\/／=＝]/).forEach(function(p){ p=p.trim(); if(p) seeds[p]=1; });
  var out = {};
  Object.keys(seeds).forEach(function(t){
    t = t.replace(/^[〜～]+/,'').trim(); if(!t) return;
    out[t]=1;
    ['する','です','ます','な','い'].forEach(function(suf){
      if(t.length>suf.length && t.slice(-suf.length)===suf) out[t.slice(0,-suf.length)]=1;
    });
    var m = t.match(/^[一-鿿]{1,6}/); if(m) out[m[0]]=1;
  });
  return Object.keys(out).filter(function(t){return t.length>0 && t.indexOf('✙')<0;})
                         .sort(function(a,b){return b.length-a.length;});
}
/* Trả về [vị trí, độ dài] đoạn cần che trong v.ex, hoặc null nếu không dò được */
function findCloze(v){
  var ex = v.ex||''; if(!ex) return null;
  var cands = clozeCandidates(v.w);
  for(var i=0;i<cands.length;i++){
    var t=cands[i], p=ex.indexOf(t);
    if(p<0) continue;
    if(t.length===1 && !/[一-鿿]/.test(t)) continue;   // 1 ký tự kana thì bỏ, quá dễ nhầm
    return [p,t.length];
  }
  var y=(v.r||'').replace(/[（(][^）)]*[)）]/g,'').trim();
  var ys=[y].concat(y.split(/[\/／・]/)).map(function(s){return s.trim();})
            .filter(function(s){return s.length>=2;})
            .sort(function(a,b){return b.length-a.length;});
  for(var j=0;j<ys.length;j++){ var q=ex.indexOf(ys[j]); if(q>=0) return [q,ys[j].length]; }
  return null;
}

/* Chia đều một mảng thành các "bộ" ~DECK_SIZE phần tử, dồn số dư rải đều thay vì dồn hết bộ cuối.
   Không còn lời gọi nào từ FR_008 (Luyện đọc/Kaiwa dùng hàm này đã bị gỡ) — cố ý giữ lại, xem FR_008 mục 4.3. */
function splitDecks(arr, target){
  target = target || DECK_SIZE;
  var n = arr.length;
  if(n===0) return [];
  var numDecks = Math.max(1, Math.round(n/target));
  var base = Math.floor(n/numDecks), extra = n % numDecks;
  var decks = [], idx = 0;
  for(var i=0;i<numDecks;i++){
    var size = base + (i<extra?1:0);
    decks.push(arr.slice(idx, idx+size));
    idx += size;
  }
  return decks;
}
/* Chia CỐ ĐỊNH mỗi bộ đúng target từ, bắt đầu từ #1, bộ cuối = phần dư còn lại — dùng cho IT専門
   (đơn giản, dễ đoán vị trí, không dồn/san đều số dư như splitDecks()) */
function splitDecksStrict(arr, target){
  target = target || DECK_SIZE;
  var decks=[];
  for(var i=0;i<arr.length;i+=target) decks.push(arr.slice(i,i+target));
  return decks;
}
function deckPool(){

}

function curDeckRangeLabel(){

}

function sample(arr,n,exclude){ return shuffle(arr.filter(x=>x!==exclude)).slice(0,n); }
