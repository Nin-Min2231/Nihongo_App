uá! Trồng được thứ này ở nhà thì thích thật nhỉ!"}, {"spk": "A", "jp": "味は保証できませんが。どうぞ。", "vi": "Tôi không dám đảm bảo vị của nó đâu nhưng mời chị thử."}, {"spk": "B", "jp": "じゃ、遠慮なくいただきます。", "vi": "Vậy tôi không khách sao nữa."}]}]}, {"track": "1-20", "disk": 1, "no": 20, "audio": "sd_1-20.mp3", "dur": 94.8, "pages": [64], "level": "中級", "section": 1, "segments": [{"id": "1-20-7", "no": 7, "page": 64, "start": 0.46, "end": 15.13, "dur": 14.67, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "どうして彼女が怒ってるわけ？", "vi": "Tại sao cô ấy lại giận?"}, {"spk": "B", "jp": "自分でもよくわからないんだけど、口をきいてくれないんです。", "vi": "Tôi cũng không biết nữa, chỉ biết cô ấy không chịu nói gì với tôi cả."}, {"spk": "A", "jp": "彼女の気に障ることを言ったんじゃない？", "vi": "Hay anh nói gì làm cô ấy khó chịu?"}, {"spk": "B", "jp": "う〜ん、思い当たることはないんですけど…。", "vi": "Ừm, tôi không nhớ là đã nói điều gì như thế...."}]}, {"id": "1-20-8", "no": 8, "page": 64, "start": 14.53, "end": 30.81, "dur": 16.28, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "夏バテ対策、何かしていますか？", "vi": "Chị đang làm gì để chống lại cái nóng của mùa hè?"}, {"spk": "B", "jp": "そうですね、うなぎの蒲焼きを食べるとか…。", "vi": "Để tôi nghĩ xem.... Ăn cá trình nướng này..."}, {"spk": "A", "jp": "わー、豪華ですね。僕なんか、アイス食べてしのいでるぐらいです。", "vi": "Chà, sang quá nhỉ. Tôi thì chỉ ăn kem cho mát thôi."}, {"spk": "B", "jp": "冷たいものは体にあんまりよくないんだよ。", "vi": "Đồ lạnh không tốt cho sức khỏe đâu."}]}, {"id": "1-20-9", "no": 9, "page": 64, "start": 30.21, "end": 43.08, "dur": 12.87, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "さー、どうぞ。熱いうちに召し上がってください。", "vi": "Mời chị. Mời chị dùng cho nóng."}, {"spk": "B", "jp": "わー、おいしそう。じゃ、遠慮なくいただきます。", "vi": "Oa, trông ngon quá! Vậy tôi không làm khách nữa."}, {"spk": "A", "jp": "いかがですか？", "vi": "Chị thấy thế nào?"}, {"spk": "B", "jp": "うーん、やっぱりできたてはおいしいですね。", "vi": "Đúng là mới làm xong ăn ngon thật!"}]}, {"id": "1-20-10", "no": 10, "page": 64, "start": 42.48, "end": 60.33, "dur": 17.85, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "これ、福岡のお土産なんですけど、皆さんで召し上がってください。", "vi": "Đây là quà Fukuoka, mời mọi người ăn ạ."}, {"spk": "B", "jp": "あら、ありがとうございます。", "vi": "Chà, cám ơn anh."}, {"spk": "A", "jp": "地元では有名なお菓子なんです。向こうで食べたんですけど、おいしかったんで…。", "vi": "Đây là loại bánh nổi tiếng ở địa phương. Tôi đã ăn ở đó rồi và thấy ngon thật...."}, {"spk": "B", "jp": "じゃあ、早速お茶入れて、いただきますね。", "vi": "Vậy, tôi sẽ đi pha trà rồi thử ngay."}]}, {"id": "1-20-11", "no": 11, "page": 64, "start": 59.73, "end": 74.24, "dur": 14.51, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "いよいよ受験勉強も追い込みですね。", "vi": "Học thi cũng sắp đến giai đoạn nước rút rồi nhỉ."}, {"spk": "B", "jp": "はい。あとがないので、ここで一発決めようと思ってます。", "vi": "Vâng. Không có đường lùi nên cháu quyết thi là phải đỗ."}, {"spk": "A", "jp": "その意気込みなら合格間違いなしですね。頑張ってください。", "vi": "Quyết tâm như vậy chắc chắn sẽ đỗ. Cố lên nhé!"}, {"spk": "B", "jp": "ありがとうございます。頑張ります。", "vi": "Cám ơn cô. Cháu sẽ cố ạ."}]}, {"id": "1-20-12", "no": 12, "page": 64, "start": 73.64, "end": 93.0, "dur": 19.36, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "卒業後は何をしたいですか？", "vi": "Sau khi tốt nghiệp, cháu muốn làm gì?"}, {"spk": "B", "jp": "日本でしばらく仕事をしてみたいんですが…。", "vi": "Cháu muốn thử làm việc ở Nhật Bản một thời gian."}, {"spk": "A", "jp": "外国人の就職はなかなか難しいけど、これをしたいという気持ちがあれば可能性はありますよ。", "vi": "Người nước ngoài khó xin việc ở đây lắm, nhưng nếu cháu có nguyện vọng muốn làm điều này thì cũng có hy vọng đấy."}, {"spk": "B", "jp": "そうですか…。私は一応IT企業を志望しているんですけど。", "vi": "Thế ạ?! Cháu mong được làm việc ở công ty IT ạ."}]}]}, {"track": "1-21", "disk": 1, "no": 21, "audio": "sd_1-21.mp3", "dur": 47.75, "pages": [66], "level": "中級", "section": 1, "segments": [{"id": "1-21-13", "no": 13, "page": 66, "start": 0.45, "end": 23.03, "dur": 22.58, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "来週は箱根ですね。箱根に行ったら、温泉たくさん入りたいですね。", "vi": "Tuần sau là đi Hakone rồi. Đến Hakone, tôi muốn tắm suối nước nóng nhiều lần."}, {"spk": "B", "jp": "ええ。少なくとも5回は入りましょうね。", "vi": "Ừ, ít nhất cũng phải 5 lần nhé."}, {"spk": "A", "jp": "でも、あんまり入りすぎると湯あたりして体に良くないって言いますよ。", "vi": "Nhưng người ta bảo tắm nhiều quá sẽ không tốt cho cơ thể."}, {"spk": "B", "jp": "あー、そうなんですか。てっきり体にいいと思ってました。", "vi": "Ồ, vậy sao? Thế mà tôi cứ tưởng là tốt cho cơ thể cơ đấy."}, {"spk": "A", "jp": "そうでもないみたいですよ。", "vi": "Có vẻ không phải là như thế."}, {"spk": "B", "jp": "何でも過ぎると良くないんでしょうね。", "vi": "Cái gì quá nhiều cũng không tốt nhỉ."}]}, {"id": "1-21-14", "no": 14, "page": 66, "start": 22.43, "end": 45.72, "dur": 23.29, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "最近、松下さんの姿が見えないけど、どうしたのかしら。", "vi": "Dạo này không thấy Matsushita-san nhỉ. Không biết có chuyện gì không?"}, {"spk": "B", "jp": "何でも、ご家族にご不幸があったとかで、大変だったみたい。", "vi": "Hình như chị ấy đang khó khăn vì gia đình có chuyện buồn."}, {"spk": "A", "jp": "あら、そうなの。だから、電話しても出なかったのね。", "vi": "Ôi trời. Thảo nào mà chị ấy không nghe điện thoại."}, {"spk": "B", "jp": "ええ、前はメール入れたらすぐに返事くれたんですけどね。", "vi": "Vâng, nhưng hôm trước tôi gửi mail thì chị ấy trả lời ngay."}, {"spk": "A", "jp": "どなたがお亡くなりになったんでしょうねー。", "vi": "Không biết ai mất vậy nhỉ?"}, {"spk": "B", "jp": "さー、どなたでしょうかねー。", "vi": "Tôi không biết. Là ai được nhỉ?"}]}]}]}, {"section": 2, "level": "上級", "tracks": [{"track": "1-22", "disk": 1, "no": 22, "audio": "sd_1-22.mp3", "dur": 105.69, "pages": [68], "level": "上級", "section": 2, "segments": [{"id": "1-22-1", "no": 1, "page": 68, "start": 0.41, "end": 14.52, "dur": 14.11, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あれっ、石井さんの隣に写ってるこの人、妹さんですか？", "vi": "Ơ, người đứng cạnh là chị gái của chị à?"}, {"spk": "B", "jp": "いえ、赤の他人ですよ。", "vi": "Không người lạ đấy."}, {"spk": "A", "jp": "へー、他人の空似とは、よく言ったもんですね。", "vi": "Chà, người ta thường nói người giống người nhỉ."}, {"spk": "B", "jp": "そうですか？　そんなに似てますかね。", "vi": "Thế á? Giống đến thế sao?"}]}, {"id": "1-22-2", "no": 2, "page": 68, "start": 13.92, "end": 34.14, "dur": 20.22, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "もっと会話を勉強したいんです。", "vi": "Tôi muốn học hội thoại thêm nữa."}, {"spk": "B", "jp": "どうしてですか？　お上手ですよ。", "vi": "Tại sao? Anh đã giỏi rồi mà."}, {"spk": "A", "jp": "う〜ん。でも、聞いてわかっても言いたいことがすぐ言葉にならないんです。", "vi": "Nhưng dù nghe hiểu nhưng tôi không thể nói ra những điều mình muốn nói."}, {"spk": "B", "jp": "じゃ、だまされたと思って、シャドーイングしてみたらどうですか？", "vi": "Vậy anh thử học theo shadowing xem sao. Có mất đâu."}]}, {"id": "1-22-3", "no": 3, "page": 68, "start": 33.54, "end": 52.07, "dur": 18.53, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "企業買収って、最近増えてますよね。", "vi": "Gần đây nhiều vụ thu mua doanh nghiệp nhỉ."}, {"spk": "B", "jp": "そうですね。老舗の企業なんかもどんどん買収の対象になってますしね。", "vi": "Đúng vậy. Những doanh nghiệp lâu đời cũng trở thành đối tượng thu mua."}, {"spk": "A", "jp": "今の時代、地道にやってるだけじゃだめなんでしょうかね。", "vi": "Thời buổi này, có lẽ cứ làm từ từng bước sẽ chẳng được gì nhỉ?!"}, {"spk": "B", "jp": "うーん。これも時代の流れなんじゃないですか？", "vi": "Hừm, điều này cũng là xu thế của thời đại thôi."}]}, {"id": "1-22-4", "no": 4, "page": 68, "start": 51.47, "end": 78.98, "dur": 27.51, "title": "", "titleVi": "", "lines": [{"spk": "", "jp": "【ショールームで】", "vi": "【Tại phòng trưng bày】"}, {"spk": "A", "jp": "この車、ちょっと変わってませんか？", "vi": "Chiếc này hơi khác phải không?"}, {"spk": "B", "jp": "あ、これですか？　水素で走るって書いてありますよ。ふーん、ＣＯ２を出さないで、出すのは水だけか…。", "vi": "À, chiếc này à? Ở đây ghi là chạy bằng hydro. Hừm, không thải ra CO2 mà chỉ thải ra nước à..."}, {"spk": "A", "jp": "へー、エコカーですか。そんなの未来の乗り物だと思ってましたけどねー。", "vi": "Chà, vậy là xe thân thiện với môi trường rồi. Tôi cứ nghĩ đó là phương tiện giao thông của tương lai cơ đấy."}, {"spk": "B", "jp": "そうですね。まー、環境問題にはみんな敏感になってますからね。デザイン的にもなかなかいいんじゃないですか？", "vi": "Đúng vậy. Vì mọi người đang trở nên nhạy cảm với vấn đề môi trường hơn mà. Kiểu dáng cũng được đấy chứ?"}]}, {"id": "1-22-5", "no": 5, "page": 68, "start": 78.38, "end": 103.75, "dur": 25.37, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あ、このお肉、なんかシールがはってありますけど、これ何でしょう？", "vi": "Này, có cái mác gì gắn vào hộp thịt này này. Cái này là gì vậy nhỉ?"}, {"spk": "B", "jp": "あ、それは環境にいい商品だっていう認定みたいですよ。安心っていう付加価値をつけてるんですって。", "vi": "À, hình như đó là chứng nhận sản phẩm tốt cho môi trường đấy. Có nghĩa là tăng thêm giá trị phụ gia là sự an tâm."}, {"spk": "A", "jp": "そうなんですか。最近は、みんな品質にうるさくなってきてますからね。", "vi": "Ra là thế. Vì gần đây mọi người khắt khe với chất lượng hơn."}, {"spk": "B", "jp": "ええ。少し前には偽装問題なんかもたくさん発覚しましたからね。", "vi": "Vâng. Vì mới gần đây thôi đã phát hiện ra nhiều vụ làm giả."}]}]}, {"track": "1-23", "disk": 1, "no": 23, "audio": "sd_1-23.mp3", "dur": 96.68, "pages": [70], "level": "上級", "section": 2, "segments": [{"id": "1-23-6", "no": 6, "page": 70, "start": 0.43, "end": 18.06, "dur": 17.63, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "災害ボランティアに登録したんです。", "vi": "Tôi đã đăng ký tham gia tình nguyện chống thiên tai."}, {"spk": "B", "jp": "それって、何ですか？", "vi": "Cái đó là gì vậy?"}, {"spk": "A", "jp": "地震や台風で被害を受けた場所に行って、被災者を支援するんです。", "vi": "Là hoạt động tới những nơi chịu thiệt hại do động đất hoặc bão để giúp đỡ những người bị hại."}, {"spk": "A", "jp": "へー、そうなんですか。りっぱな社会貢献ですね。僕もなんかやらなくっちゃなー。", "vi": "Ô, ra là vậy! Một sự đóng góp tuyệt vời cho xã hội nhỉ! Tôi cũng phải làm gì đó mới được."}]}, {"id": "1-23-7", "no": 7, "page": 70, "start": 17.46, "end": 31.11, "dur": 13.65, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あ〜あ、親切心で言ったのに、嫌がられちゃった。", "vi": "Chán thật, tôi quan tâm nên mới nói vậy mà lại bị ghét."}, {"spk": "B", "jp": "むなしいですねー。", "vi": "Thật phí công vô ích nhỉ!"}, {"spk": "A", "jp": "世代が違うのかな。", "vi": "Chẳng lẽ là vì khác thế hệ?"}, {"spk": "B", "jp": "いやー、個人の価値観の相違じゃないですか。", "vi": "Không, có lẽ là nhân sinh quan khác nhau."}]}, {"id": "1-23-8", "no": 8, "page": 70, "start": 30.51, "end": 55.96, "dur": 25.45, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "このトロ、召し上がりましたか？　脂が乗っててトロトロですよ。", "vi": "Chị đã ăn món cá ngừ này chưa? Mỡ nhiều ngậy lắm đấy."}, {"spk": "B", "jp": "本当ですね。何ですか、この舌でとろけるまろやかさは…。", "vi": "Đúng vậy. Nói thế nào nhỉ, cảm giác béo ngậy tan ở đầu lưỡi…"}, {"spk": "A", "jp": "でしょう？　それから、このシュウマイも召し上がってみてください。肉汁がジュワッと出てきておいしいですよ。", "vi": "Chính xác. Rồi thử cả món xíu mại này đi. Nước thịt trào ra ngon lắm ấy."}, {"spk": "B", "jp": "うーん、この海老のプリプリッとした食感がたまりませんねー。", "vi": "Ừm, còn cái cảm giác sần sật của món tôm này đúng là ngon hết biết."}]}, {"id": "1-23-9", "no": 9, "page": 70, "start": 55.36, "end": 75.38, "dur": 20.02, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "いじめって、なかなかなくならないようですね。", "vi": "Có vẻ nạn bắt nạt mãi vẫn không hết nhỉ."}, {"spk": "B", "jp": "そうですね。けっこう根が深いんでしょうね。", "vi": "Đúng vậy. Có lẽ nó bắt rễ khá sâu rồi."}, {"spk": "A", "jp": "そうなんでしょうね。それに、いじめは、何も子どもの世界に限ったことじゃありませんしね。", "vi": "Có lẽ vậy. Với lại, bắt nạt không chỉ giới hạn ở thế giới của trẻ con nhỉ."}, {"spk": "B", "jp": "まったくですねー。ひとごとじゃありませんよね。", "vi": "Hoàn toàn chính xác. Đó là vấn đề không của riêng ai."}]}, {"id": "1-23-10", "no": 10, "page": 70, "start": 74.78, "end": 94.65, "dur": 19.87, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "いたいけな子どもをターゲットにした犯罪は、許せませんね。", "vi": "Không thể tha thứ cho hành động tội phạm nhằm vào trẻ nhỏ."}, {"spk": "B", "jp": "まったくですね！　怒りで体がふるえます。", "vi": "Đúng vậy! Khắp người tôi run lên vì tức giận."}, {"spk": "A", "jp": "本当ですね。こんなことは決して起こってはならないことですよね。", "vi": "Vâng. Những chuyện như thế này đáng lẽ không được xảy ra."}, {"spk": "B", "jp": "こういう犯罪が多発しているということは、社会が歪んでいるということですね。", "vi": "Việc loại tội phạm kiểu này ngày càng nhiều chứng tỏ xã hội đang xuống cấp."}]}]}, {"track": "1-24", "disk": 1, "no": 24, "audio": "sd_1-24.mp3", "dur": 119.8, "pages": [72], "level": "上級", "section": 2, "segments": [{"id": "1-24-11", "no": 11, "page": 72, "start": 0.39, "end": 20.18, "dur": 19.79, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "新聞の勧誘を断るとき、何て言ったらいいですか？", "vi": "Tôi nên nói gì để từ chối lời mời mua báo dài hạn?"}, {"spk": "B", "jp": "「もうすぐ国に帰るから、難しいです。」っていうのはどう？", "vi": "Nói \"Tôi sắp về nước rồi nên cũng khó mua\" thử xem."}, {"spk": "A", "jp": "なるほど…。でも勧誘はしつこいから、それで本当に大丈夫ですか？", "vi": "Ý hay đấy….Nhưng họ mời dai lắm nên liệu nói như thế có được không?"}, {"spk": "B", "jp": "とにかく一度試してみたら？", "vi": "Cứ thử một lần xem sao!"}]}, {"id": "1-24-12", "no": 12, "page": 72, "start": 19.58, "end": 38.91, "dur": 19.33, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "どうすれば敬語がうまく使えるようになるんでしょうか？", "vi": "Làm thế nào để có thể sử dụng kính ngữ tốt được?"}, {"spk": "B", "jp": "う〜ん、習うより慣れろって言いますからね。", "vi": "Ừm, người ta vẫn bảo \"Học trên thực tế vẫn hơn học trong sách vở.\""}, {"spk": "A", "jp": "ということは学校で習うより、仕事の現場で覚えるってことですか？", "vi": "Nghĩa là học ở nơi làm việc hơn là học ở trường ạ?"}, {"spk": "B", "jp": "ええ、そうですね。ひたすら実践あるのみですね。", "vi": "Đúng vậy đó. Vì chỉ có mỗi cách là sử dụng trong thực tế mà thôi."}]}, {"id": "1-24-13", "no": 13, "page": 72, "start": 38.31, "end": 63.37, "dur": 25.06, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "すいません。この間お願いした就職の話なんですが、やっぱり結構です。", "vi": "Xin lỗi anh. Về chuyện xin việc lần trước tôi có nhờ anh, giờ không cần nữa đâu ạ."}, {"spk": "B", "jp": "え！　今さら何言ってるの？　もう、先方にも頼んじゃったよ。", "vi": "Ơ! Sao giờ lại nói vậy? Tôi đã nhờ người ta rồi."}, {"spk": "A", "jp": "本当にすいません。急に帰国することになってしまいまして…。", "vi": "Tôi thật sự xin lỗi ạ. Tôi buộc phải về nước gấp…"}, {"spk": "B", "jp": "こんなこと言いたくないけど、日本の常識じゃそんなこと通らないんだよねー。", "vi": "Tôi không muốn nói điều này nhưng điều đó không chấp nhận được ở Nhật Bản."}]}, {"id": "1-24-14", "no": 14, "page": 72, "start": 62.77, "end": 72.26, "dur": 9.49, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "この度はご愁傷さまでした。", "vi": "Tôi xin chia buồn cùng gia đình."}, {"spk": "B", "jp": "ありがとうございます。", "vi": "Cám ơn anh."}, {"spk": "A", "jp": "どうぞお力落としのないように…。", "vi": "Xin chị đừng quá đau buồn mà sinh bệnh…"}, {"spk": "B", "jp": "ありがとうございます。", "vi": "Cám ơn anh."}]}, {"id": "1-24-15", "no": 15, "page": 72, "start": 71.66, "end": 100.65, "dur": 28.99, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "デジカメ、買い替えようかなって思ってるんですよ。", "vi": "Tôi đang định mua máy ảnh kỹ thuật số mới."}, {"spk": "B", "jp": "じゃー、ぶれないできれいに撮れるカメラがいいんじゃない？", "vi": "Vậy thì hãy chọn loại máy không bị rung có thể chụp đẹp."}, {"spk": "A", "jp": "ええ、800万画素ぐらいのにしようかなって思って…。", "vi": "Vâng. Tôi đang định mua loại 8 mega-pixels…."}, {"spk": "B", "jp": "うん、800万画素ぐらいあれば十分だよ。今は1万円ちょっとで買えるしね。", "vi": "Ừ, 8 mega-pixels là được rồi. Bây giờ chỉ hơn 10.000 Yên là mua được."}, {"spk": "A", "jp": "本当、うそみたいに安くなりましたよね。昔のあの値段は何だったんでしょうね。", "vi": "Thật đúng là giờ đã rẻ đến không thể tin được nhỉ. Giá ngày xưa sao lại đắt thế nhỉ!"}]}, {"id": "1-24-16", "no": 16, "page": 72, "start": 100.05, "end": 117.57, "dur": 17.52, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "よく話し合った？", "vi": "Đã nói chuyện với nhau chưa?"}, {"spk": "B", "jp": "話し合うも何も、電話にも出てくれないんですから。", "vi": "Nói gì được đâu. Anh ấy còn không nghe điện thoại."}, {"spk": "A", "jp": "関係修復は難しい？", "vi": "Khó có thể khôi phục lại quan hệ à?"}, {"spk": "B", "jp": "う〜ん、実は、もう別れようって、メールが来ました。", "vi": "Thực ra, tôi nhận được mail đòi chia tay."}, {"spk": "A", "jp": "じゃー、ちょっとね。", "vi": "Vậy thì, không hay rồi."}, {"spk": "B", "jp": "やっぱりそう思いますか…。", "vi": "Đúng là anh cũng nghĩ thế ạ?"}]}]}, {"track": "1-25", "disk": 1, "no": 25, "audio": "sd_1-25.mp3", "dur": 85.86, "pages": [74], "level": "上級", "section": 2, "segments": [{"id": "1-25-17", "no": 17, "page": 74, "start": 0.43, "end": 21.84, "dur": 21.41, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "先日、初めて韓国へ行ったんですよ。韓国料理を堪能してきました！", "vi": "Hôm trước, lần đầu tiên tôi đến Hàn Quốc. Tôi đã ăn thoải mái món ăn Hàn Quốc!"}, {"spk": "B", "jp": "そうですか、韓国の印象はどうでしたか？", "vi": "Vậy sao? Ấn tượng của anh về Hàn Quốc thế nào?"}, {"spk": "A", "jp": "はい、見るものすべてが新鮮で、刺激的でした。それで、あの…。", "vi": "Vâng, tất cả mọi thứ đều tươi mới, kích thích. Và đây là.."}, {"spk": "B", "jp": "はい…。", "vi": "Vâng…."}, {"spk": "A", "jp": "これ、韓国のお土産です。ほんの「キムチ」ですが…。", "vi": "Đây là quà Hàn Quốc. Một chút \"Kim Chi\"…"}, {"spk": "B", "jp": "ほんのきむち…、親父ギャグですね。ははは。", "vi": "Một chút Kim Chi…Cách chơi chữ của các cụ nhỉ! Ha ha ha"}]}, {"id": "1-25-18", "no": 18, "page": 74, "start": 21.24, "end": 56.28, "dur": 35.04, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "「釣った魚に餌はやらない」って言うけど、あれ本当ね。", "vi": "Người ta bảo \"Không cần cho cá đã câu được thức ăn\". Câu đó đúng thật!"}, {"spk": "B", "jp": "へ〜、ご主人プレゼントしてくださらないんですか？", "vi": "Chà, chồng chị không tặng quà cho chị à?"}, {"spk": "A", "jp": "ぜーんぜん。結婚してから誕生日プレゼントなんて一度もなしよ。", "vi": "Hoàn toàn không. Từ lúc cưới đến giờ anh ấy chưa một lần tặng quà sinh nhật cho tôi."}, {"spk": "B", "jp": "優しそうなご主人なのに…、人は見かけによらないもんですね。", "vi": "Trông anh ấy có vẻ hiền lành thế mà…Đúng là không thể dựa vào vẻ bề ngoài được nhỉ!"}, {"spk": "A", "jp": "優しさとかの問題じゃなくて、男はみんなそんなもんなんじゃないの。", "vi": "Hiền hay không không phải là vấn đề.Chẳng phải đàn ông ai cũng vậy sao?"}, {"spk": "B", "jp": "そうですか〜？　僕はちゃんと記念日にはカードとプレゼント贈ってますけどね。", "vi": "Chị nghĩ vậy sao? Tôi vẫn gửi thiệp và quà nhân ngày kỷ niệm đấy chứ."}]}, {"id": "1-25-19", "no": 19, "page": 74, "start": 55.68, "end": 83.91, "dur": 28.23, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "お正月になると、お年寄りが餅を喉に詰まらせたっていうニュースが増えるね。", "vi": "Cứ đến tết là số tin người già bị nghẹn bánh mochi lại tăng nhỉ."}, {"spk": "B", "jp": "年を取ると、飲み込む力が弱くなるんですかねー。", "vi": "Chắc tại càng già khả năng nuốt càng kém."}, {"spk": "A", "jp": "うん。唾液の分泌も減るだろうしねー。", "vi": "Đúng vậy. Có lẽ việc tiết nước bọt cũng giảm."}, {"spk": "B", "jp": "そう言えば、うちの祖母なんて、この間ゼリーを喉に詰まらせたって言ってましたよ。", "vi": "Nói đến mới nhớ, bà tôi kể là hôm nọ bị nghẹn thạch đấy."}, {"spk": "A", "jp": "えーっ、ゼリーで喉が詰まっちゃうの？", "vi": "Ơ, bị nghẹn vì thạch sao?"}, {"spk": "B", "jp": "ええ、急に呼吸ができなくなっちゃって、このまま死んじゃうのかって思ったらしいですよ。", "vi": "Vâng, bà bảo tự dưng nghẹn thở, tưởng rằng chết luôn rồi."}]}]}, {"track": "1-26", "disk": 1, "no": 26, "audio": "sd_1-26.mp3", "dur": 111.83, "pages": [76], "level": "上級", "section": 2, "segments": [{"id": "1-26-20", "no": 20, "page": 76, "start": 0.39, "end": 35.47, "dur": 35.08, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "この前、骨董品屋に行って、初めて鑑定してもらったんですよ。", "vi": "Hôm trước tôi đến cửa hàng đồ cổ, nhờ giám định rồi."}, {"spk": "B", "jp": "へー、何を？", "vi": "Ồ, giám định gì vậy?"}, {"spk": "A", "jp": "うちに代々伝わる皿があって、それがどのぐらい価値があるのか知りたくなって。まー、古いってだけなんですけどね。", "vi": "Nhà tôi có một cái đĩa được truyền từ đời này sang đời khác nên tôi muốn biết nó có giá trị thế nào. Tôi chỉ biết là nó lâu rồi thôi."}, {"spk": "B", "jp": "それで、何て言われたんですか？", "vi": "Thế người ta bảo sao?"}, {"spk": "A", "jp": "「この皿はたいへん貴重なもので、100万円はくだらない」って。", "vi": "Họ bảo \"Cái đĩa này rất quý, giá không dưới 1 triệu Yên\""}, {"spk": "B", "jp": "へー、100万円！そりゃ、すごい。", "vi": "Chà, 1 triệu Yên! Thật giá trị."}, {"spk": "A", "jp": "凡人には一見普通にしか見えないんですけどね。", "vi": "Người thường nhìn qua thì chỉ thấy bình thường thôi."}, {"spk": "B", "jp": "見る人が見れば、本当の価値がわかるんですよ。", "vi": "Người tinh ý mà nhìn sẽ biết giá trị thực sự thôi."}]}, {"id": "1-26-21", "no": 21, "page": 76, "start": 34.87, "end": 56.94, "dur": 22.07, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "だいぶ、日が長くなりましたねー。", "vi": "Ngày dài hơn nhiều rồi nhỉ."}, {"spk": "B", "jp": "ええ、5時でも、まだこの明るさですからねー。", "vi": "Vâng, 5 giờ rồi mà vẫn sáng thế này."}, {"spk": "A", "jp": "もう1月も半ばかー。", "vi": "Đã giữa tháng 1 rồi à?"}, {"spk": "B", "jp": "あと2週間もすれば、もう立春ですよ。", "vi": "Chỉ 2 tuần nữa là lập xuân đấy."}, {"spk": "A", "jp": "立春かー。確か、その前の日が節分でしたよね。", "vi": "Lập xuân à?! Hình như ngày trước đó là Setsubun nhỉ?"}, {"spk": "B", "jp": "節分といっても、豆をまく家は減ってきちゃったんでしょうね。", "vi": "Setsubun nhưng cũng ít nhà vãi đỗ hơn nhỉ?!"}]}, {"id": "1-26-22", "no": 22, "page": 76, "start": 56.34, "end": 85.06, "dur": 28.72, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "一日練習しただけでこれだけ滑れるなんて、なかなか筋がいいですよ。", "vi": "Chỉ tập có một ngày mà trượt được thế này quả là có khiếu đấy."}, {"spk": "B", "jp": "えっ、本当ですか？　スケートって難しいけどおもしろいもんですね。", "vi": "Ơ, thế ạ? Trượt pa - tanh khó nhưng mà thú vị thật đấy!"}, {"spk": "A", "jp": "一生懸命練習すれば、三回転ジャンプも夢じゃありませんよ。", "vi": "Nếu chăm chỉ luyện tập thì nhảy xoay ba vòng không phải là ao ước đâu."}, {"spk": "B", "jp": "えーっ、三回転ジャンプもできるようになるんですか？", "vi": "Thật ạ? Em có thể nhảy xoay 3 vòng ạ?"}, {"spk": "A", "jp": "あなたのやる気次第ですよ。じゃ、今日はここまでにしましょう。", "vi": "Tùy thuộc vào quyết tâm của em thôi. Hôm nay chúng ta tập đến đây thôi."}, {"spk": "B", "jp": "はい。ありがとうございました。", "vi": "Vâng, cám ơn thày ạ."}]}, {"id": "1-26-23", "no": 23, "page": 76, "start": 84.46, "end": 109.58, "dur": 25.12, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "「行間を読む」って言いますけど、なかなか難しいですよね。", "vi": "Người ta nói \"ý tại ngôn ngoại\", nhưng quả là khó nhỉ!"}, {"spk": "B", "jp": "まー、人の感性は一人一人違いますからね。", "vi": "Thì cảm tính mà, mỗi người một khác."}, {"spk": "A", "jp": "読者がとんでもない読み違いをしちゃってることもあるでしょうね。", "vi": "Chắc cũng có khi độc giả hiểu nhầm một cách tai hại ấy nhỉ?"}, {"spk": "B", "jp": "書評を見て、作家が苦笑いするなんてこともあるんじゃないですか。", "vi": "Xem phần nhận xét tác phẩm, chắc cũng có khi tác giả cười như mếu mất."}, {"spk": "A", "jp": "あり得るでしょうねー。", "vi": "Có thể lắm nhỉ."}, {"spk": "B", "jp": "評論家ももっともらしいこと言いますからね。", "vi": "Dù sao các nhà phê bình vẫn nói những điều có lý nhất."}]}]}, {"track": "1-27", "disk": 1, "no": 27, "audio": "sd_1-27.mp3", "dur": 67.11, "pages": [78], "level": "上級", "section": 2, "segments": [{"id": "1-27-24", "no": 24, "page": 78, "start": 0.38, "end": 21.62, "dur": 21.24, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "そうですか。木村さん、弟さんがいらっしゃったんですか。", "vi": "Ra là vậy, hóa ra là chị Kimura có em trai à?"}, {"spk": "B", "jp": "ええ、家業を継いでるんです。", "vi": "Vâng, cậu ấy đang nối nghiệp gia đình ạ."}, {"spk": "A", "jp": "家業というと？", "vi": "Nối nghiệp gia đình?"}, {"spk": "B", "jp": "運送業です。", "vi": "Nhà tôi làm nghề vận tải."}, {"spk": "A", "jp": "へー、運送業ですか。運送業界も、今なかなか難しいみたいですね。", "vi": "Chà, nghề vận tải à? Nghề vận tải giờ cũng có vẻ khó nhỉ!"}, {"spk": "B", "jp": "ええ。原油の高騰のあおりを受けちゃって、相当大変らしいですよ。", "vi": "Vâng, giá dầu thô tăng cao đột ngột làm công việc có vẻ tương đương đối khó khăn."}]}, {"id": "1-27-25", "no": 25, "page": 78, "start": 21.02, "end": 65.19, "dur": 44.17, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "明けましておめでとうございます。今年もよろしくお願いします。", "vi": "Chúc mừng năm mới. Năm nay cũng mong được anh giúp đỡ."}, {"spk": "B", "jp": "あ、おめでとうございます。お正月休みはゆっくりできましたか？", "vi": "Vâng, chúc mừng năm mới chị. Chị nghỉ tết thoải mái chứ?"}, {"spk": "A", "jp": "ええ、今年はちょっと奮発して、家族でハワイに行ったんですよ。", "vi": "Vâng, năm nay gia đình tôi nổi hứng đi Hawaii choi."}, {"spk": "B", "jp": "え、本当ですか。うらやましい限りですね。", "vi": "Ồ, thật vậy sao! Ghen tỵ thật đấy!"}, {"spk": "A", "jp": "えへへ。で、ビーチで一日中寝そべってのんびりしたり、いろいろ買い物したり…。おかげさまでいい骨休めができました。鈴木さんも、どちらかに出かけられたんですか？", "vi": "Hề hề. Chúng tôi suốt ngày hết nằm dài trên bãi cát, lại đi mua sắm…Nhờ vậy mà cũng dãn gân dãn cốt được. Anh Suzuki cũng có đi đâu không?"}, {"spk": "B", "jp": "うちは家族で妻の実家に行ったんですけどね、気を遣ってすっかり肩が凝っちゃって…。羽を伸ばすどころじゃなかったんですよ。", "vi": "Cả nhà tôi về nhà vợ tôi. Phải giữ ý giữ tứ nên mỏi hết cả vai…. Chẳng được nghỉ ngơi thoải mái gì cả."}]}]}]}]}, {"unit": 4, "titleJp": "医者や店員などとの会話", "titleVi": "Hội thoại với bác sĩ, nhân viên cửa hàng", "sections": [{"section": 1, "level": "中級", "tracks": [{"track": "1-28", "disk": 1, "no": 28, "audio": "sd_1-28.mp3", "dur": 95.45, "pages": [82], "level": "中級", "section": 1, "segments": [{"id": "1-28-1", "no": 1, "page": 82, "start": 0.48, "end": 10.19, "dur": 9.71, "title": "", "titleVi": "", "lines": [{"spk": "", "jp": "【映画館で】", "vi": "【Tại rạp chiếu phim】"}, {"spk": "A", "jp": "あのー、そこ空いてますか？", "vi": "Xin lỗi, chỗ đó có trống không ạ?"}, {"spk": "B", "jp": "いえ、連れがあとから来ます。", "vi": "Không, người đi cùng tôi đến sau."}, {"spk": "A", "jp": "じゃー、その隣は？", "vi": "Vậy chỗ bên cạnh?"}, {"spk": "B", "jp": "空いてるみたいですよ。", "vi": "Hình như là trống đấy."}]}, {"id": "1-28-2", "no": 2, "page": 82, "start": 9.59, "end": 22.8, "dur": 13.21, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "どうしましたか？", "vi": "Anh bị làm sao?"}, {"spk": "B", "jp": "最近何だか疲れ気味で、よく頭が痛くなるんです。", "vi": "Gần đây tôi cứ thấy mệt mỏi, hay bị đau đầu."}, {"spk": "A", "jp": "そうですか…。今日は熱がありますか？", "vi": "Vậy sao? Hôm nay anh có bị sốt không?"}, {"spk": "B", "jp": "いや、36度で平熱です。", "vi": "Không, nhiệt độ bình thường, 36 độ."}]}, {"id": "1-28-3", "no": 3, "page": 82, "start": 22.2, "end": 43.07, "dur": 20.87, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "すみません、渋谷まで行きたいんですけど…。", "vi": "Xin lỗi, tôi muốn đến Shibuya…"}, {"spk": "B", "jp": "渋谷ですね、じゃ、この電車で新橋まで行って、そこで地下鉄に乗り換えてください。", "vi": "Subuya à? Vậy chị đi tàu này đến Shinbashi, rồi từ đó đổi sang tàu điện ngầm."}, {"spk": "A", "jp": "はい、新橋で乗り換えですね。", "vi": "Vâng, đổi tàu ở Shinbashi nhỉ?"}, {"spk": "B", "jp": "ええ、そうです。それからこの振替切符を渋谷で駅員に渡してください。", "vi": "Vâng, đúng vậy. Cuối cùng, chị đưa vé thay đổi phương tiện này cho nhân viên nhà ga ở ga Shibuya."}]}, {"id": "1-28-4", "no": 4, "page": 82, "start": 42.47, "end": 62.72, "dur": 20.25, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あのー、この荷物送りたいんですけど…。", "vi": "Tôi muốn gửi đồ này…."}, {"spk": "B", "jp": "はい。では、この送り状にご記入をお願いします。", "vi": "Vâng. Chị điền vào phiếu gửi này."}, {"spk": "A", "jp": "あのー、これ、ワレモノなんですが。", "vi": "Đây là đồ dễ vỡ."}, {"spk": "B", "jp": "はい。では、ワレモノのところに丸を付けてください。", "vi": "Vâng. Vậy chị khoanh tròn vào chỗ đồ dễ vỡ này."}]}, {"id": "1-28-5", "no": 5, "page": 82, "start": 62.12, "end": 76.88, "dur": 14.76, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "高田さん、書留です。ここに認めお願いします。", "vi": "Chị Takada, chị có thử bảo đảm. Xin chị xác nhận vào đây cho."}, {"spk": "B", "jp": "えーと、今ハンコ持ってないんですけど、サインでもいいですか？", "vi": "Ừm, tôi không có dấu. Ký tên có được không?"}, {"spk": "A", "jp": "ええ、結構です。", "vi": "Vâng. Được rồi."}, {"spk": "", "jp": "サインをする――", "vi": "Ký tên——"}, {"spk": "B", "jp": "はい。お世話さまでした。", "vi": "Vâng. Cám ơn chị nhiều."}]}, {"id": "1-28-6", "no": 6, "page": 82, "start": 76.28, "end": 93.57, "dur": 17.29, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "そこを左折すると、突き当たりに銀行があるので、そこで停めてください。", "vi": "Rẽ phải, đi hết đường sẽ có ngân hàng. Anh dừng ở đấy cho tôi."}, {"spk": "B", "jp": "お客さん、左折できませんよ、ここは。一方通行ですから。", "vi": "Ở đây không rẽ trái được. Đây là đường một chiều."}, {"spk": "A", "jp": "え～、じゃ、ここでいいから停めてください。", "vi": "Ơ, vậy dừng ở đây cũng được."}, {"spk": "B", "jp": "はい、わかりました。", "vi": "Vâng."}]}]}, {"track": "1-29", "disk": 1, "no": 29, "audio": "sd_1-29.mp3", "dur": 97.52, "pages": [84], "level": "中級", "section": 1, "segments": [{"id": "1-29-7", "no": 7, "page": 84, "start": 0.46, "end": 16.53, "dur": 16.07, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "今夜8時に予約してある、田中ですが。", "vi": "Tôi là Tanaka đã đặt bàn lúc 8 giờ tối nay."}, {"spk": "B", "jp": "はい、田中様ですね。3名様でうかがっております。", "vi": "Vâng, chị Tanaka ạ. Bàn cho 3 người phải không ạ?"}, {"spk": "A", "jp": "それが、もう一人増えちゃったんだけど、大丈夫ですか？", "vi": "Là chuyện đó. Giờ lại tăng thêm một người, có được không?"}, {"spk": "B", "jp": "ただいま確認いたしますので、少々お待ちください。", "vi": "Tôi sẽ kiểm tra ngay. Xin chị đợi cho một lát."}]}, {"id": "1-29-8", "no": 8, "page": 84, "start": 15.93, "end": 30.7, "dur": 14.77, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "お客様、この商品はただ今在庫切れでして…。", "vi": "Dạ thưa, sản phẩm này hiện không còn trong kho nữa…."}, {"spk": "B", "jp": "じゃ、取り寄せてもらえますか？", "vi": "Vậy tôi có thể đặt không?"}, {"spk": "A", "jp": "一週間ほどお時間かかりますが、よろしいでしょうか？", "vi": "Sẽ mất khoảng một tuần ạ. Ông có chờ được không ạ?"}, {"spk": "B", "jp": "ええ、できるだけ早くお願いします。", "vi": "Được, nếu được thì sớm cho tôi nhé."}]}, {"id": "1-29-9", "no": 9, "page": 84, "start": 30.1, "end": 64.32, "dur": 34.22, "title": "", "titleVi": "", "lines": [{"spk": "A", "jp": "あのー、今、部屋を探してるんですが、駅から歩いて5分以内で家賃が7万円ぐらいのところってありますか。", "vi": "Xin lỗi, tôi đang tìm phòng trọ. Có chỗ nào, cách nhà ga 5 phút đi bộ, tiền thuê khoảng 70.000 Yên không ạ?"}, {"spk": "B", "jp": "そうですね。こちらなどはいかがでしょうか。こちらはたいへん人気の物件なんですよ。", "vi": "Để tôi xem. Chỗ này thế nào ạ? Mọi người thích khu nhà này lắm."}, {"spk": "A", "jp": "そうですか。でも、間取りがちょっと…。1DKでいいんです。", "vi": "Thế ạ? Nhưng số phòng…Tôi chỉ cần 1DK là đủ ạ (1 p
