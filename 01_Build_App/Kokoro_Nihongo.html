  background:var(--bg); color:var(--ink); line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
  font-size:calc(15px * var(--fs-scale,1));
}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{
  background:var(--grad);color:#fff;
  padding:16px 18px;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(15,30,60,.18)
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow>div{min-width:0;flex:1;overflow:hidden}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:11.5px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn{background:var(--soft);border:none;color:var(--brand);border-radius:10px;
  padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.header-logo{width:36px;height:36px;border-radius:50%;flex-shrink:0;object-fit:cover;
  box-shadow:0 0 0 2px rgba(255,255,255,.5)}
main{flex:1;padding:16px;overflow-y:auto}
.hidden{display:none!important}

/* dashboard chính (home) — đổi 2026-09-12 theo bản demo khảo sát: số liệu "hero" nổi bật + CTA hành động ngay,
   thay cho khối 3 ô thống kê phẳng cũ. */
.dash-hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;
  margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.dash-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,var(--soft),transparent 72%);pointer-events:none}
.dash-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);position:relative}
.dash-num{font-size:40px;font-weight:800;line-height:.95;letter-spacing:-.02em;color:var(--ink);
  font-variant-numeric:tabular-nums;margin-top:4px;position:relative}
.dash-num.due{color:var(--bad)}
.dash-numlbl{font-size:14px;font-weight:700;margin-top:2px;position:relative}
.dash-numsub{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.4;position:relative}
.dash-cta{margin-top:10px}
.dash-warn{font-size:12.5px;color:var(--warn);margin-top:6px;line-height:1.4;font-weight:600;position:relative}
.dash-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px;cursor:pointer;position:relative}
.dash-metrics:active{opacity:.85}
.dash-metric{background:var(--card);padding:8px 6px;text-align:center}
.dash-metric b{display:block;font-size:18px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.dash-metric span{font-size:10.5px;color:var(--sub);margin-top:1px;display:block}
.dash-metrics-link{display:block;text-align:center;font-size:12px;color:var(--brand);font-weight:600;
  margin-top:6px;cursor:pointer;position:relative}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat .n{font-size:22px;font-weight:800;color:var(--brand)}
.stat .l{font-size:11px;color:var(--sub);margin-top:2px}

/* màn hình Thống kê (FR_012) */
.stats-hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);text-align:center}
.stats-hero .n{font-size:44px;font-weight:800;color:var(--brand)}
.stats-hero .l{font-size:13px;color:var(--sub);margin-top:4px}
.heatmap-grid{display:inline-grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;gap:3px}
.heatmap-cell{width:12px;height:12px;border-radius:3px;background:var(--line)}
.heatmap-cell.future{background:transparent}
.heatmap-cell.l1{background:#bbf7d0}
.heatmap-cell.l2{background:#4ade80}
.heatmap-cell.l3{background:#15803d}
.forecast-chart{display:flex;align-items:flex-end;gap:8px;margin:14px 0 4px}
.forecast-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center}
.forecast-bar{width:100%;border-radius:6px 6px 0 0;background:var(--brand2);min-height:4px}
.forecast-bar.today{background:var(--brand)}
.forecast-num{font-size:12px;font-weight:700;margin-bottom:4px;color:var(--ink);font-variant-numeric:tabular-nums}
.forecast-label{font-size:10.5px;color:var(--sub);margin-top:6px}
.progwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.progwrap .t{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:8px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#22c55e);border-radius:99px;transition:width .5s}

.sectitle{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin:6px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{background:var(--card);border:1.5px solid var(--line);color:var(--sub);border-radius:99px;
  padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pager-btn{background:var(--soft);border:1.5px solid var(--line);color:var(--brand);border-radius:50%;
  width:34px;height:34px;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;padding:0}
.pager-btn:disabled{opacity:.3;cursor:default}
.deck-grid-wrap{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.deck-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;min-width:0}
.deck-card{background:var(--brand);border:none;color:#fff;border-radius:14px;padding:10px 8px;
  cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;min-width:0;height:66px}
.deck-card:active{transform:scale(.97)}
.deck-card .deck-icons{font-size:13px;line-height:1;min-height:14px;max-height:14px;overflow:hidden;flex-shrink:0}
.deck-card .deck-label{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;flex-shrink:0}
.deck-card.done{background:var(--good)}
.deck-card.on{background:var(--soft);color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 14px;
  cursor:pointer;box-shadow:var(--shadow);transition:.15s;text-align:left;position:relative;overflow:hidden}
.mode:active{transform:scale(.97)}
.mode .ico{font-size:26px;margin-bottom:8px;display:block}
.mode .mt{font-size:15px;font-weight:700}
.mode .md{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.4}
.mode.due::after{content:attr(data-due);position:absolute;top:10px;right:10px;background:var(--warn);
  color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px}
.mode.new-tag::before{content:'MỚI';position:absolute;top:10px;right:10px;background:var(--accent);
  color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:2px 8px}

/* generic button */
.btn{border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;transition:.12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:#fff;width:100%}
.btn-ghost{background:var(--soft);color:var(--brand)}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* card / flashcard */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:26px 20px;text-align:center;min-height:186px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.flash-check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);font-weight:600;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;margin-bottom:10px;
  cursor:pointer;user-select:none}
.flash-check-row input{width:17px;height:17px;accent-color:var(--brand);cursor:pointer;flex-shrink:0}
.jp{font-size:40px;font-weight:800;letter-spacing:1px;line-height:1.25}
.reading{font-size:17px;color:var(--brand2);margin-top:8px;font-weight:600}
.mean{font-size:19px;margin-top:14px;font-weight:600}
.en{font-size:14px;color:var(--sub);margin-top:4px;font-style:italic}
.ex{font-size:calc(15px * var(--fs-scale,1));color:var(--ink);margin-top:16px;background:var(--soft);border-radius:12px;
  padding:12px 14px;line-height:1.7;text-align:left;width:100%}
.tag{font-size:11px;color:var(--sub);background:var(--soft);border-radius:99px;padding:3px 10px;margin-bottom:12px;font-weight:600}
.speaker{background:var(--soft);border:none;border-radius:99px;width:52px;height:52px;font-size:24px;
  cursor:pointer;margin-top:16px;color:var(--brand);transition:.12s}
.speaker:active{transform:scale(.9);background:var(--brand);color:#fff}
.counter{text-align:center;font-size:13px;color:var(--sub);margin-bottom:12px}

.mastered-link{background:var(--soft);border-radius:10px;padding:8px 12px;text-align:center;font-size:13px;
  color:var(--brand);cursor:pointer;margin-bottom:10px;font-weight:600}
.card-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.card-actions .btn{font-size:11px;padding:9px 4px;line-height:1.3;border-width:1.5px;border-style:solid}
.card-actions .next-btn{background:var(--brand);color:#fff;border-color:var(--brand2)}
.card-actions .detail-btn{background:#dcfce7;color:#166534;border-color:#86efac}
.card-actions .fav-btn{background:#fef9c3;color:#854d0e;border-color:#fde047}
.card-actions .master-btn{background:#ffedd5;color:#9a3412;border-color:#fdba74}

/* quiz / listening options */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px;font-size:calc(16px * var(--fs-scale,1));
  text-align:left;cursor:pointer;transition:.12s;font-weight:600}
.opt:active{transform:scale(.99)}
.opt.correct{background:#dcfce7;border-color:var(--good);color:#166534}
.opt.wrong{background:#fee2e2;border-color:var(--bad);color:#991b1b}
.opt.dim{opacity:.5}
.qword{font-size:calc(34px * var(--fs-scale,1));font-weight:800;text-align:center;margin:6px 0}

/* điền từ vào câu (FR_009) */
.cloze-sentence{font-size:calc(18px * var(--fs-scale,1));line-height:2;text-align:left;
  background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.cloze-fill{background:#fef9c3;border-radius:4px;padding:0 3px;font-weight:700}

/* phản xạ 3 giây (FR_010) */
.reflex-ring-wrap{position:relative;width:104px;height:104px;margin:18px auto}
.reflex-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:calc(30px * var(--fs-scale,1));font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.qhint{text-align:center;color:var(--sub);font-size:14px}

/* speaking / mic */
.mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--brand);color:#fff;font-size:40px;
  cursor:pointer;margin:20px auto;display:block;box-shadow:0 6px 20px rgba(37,99,235,.3);transition:.15s}
.mic.rec{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}70%{box-shadow:0 0 0 22px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.heard{background:var(--soft);border-radius:12px;padding:12px;margin-top:14px;font-size:16px;min-height:48px;text-align:center}
.scorebig{font-size:44px;font-weight:800;text-align:center;margin:8px 0}

/* reading / kaiwa */
.sent-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:20px;margin-bottom:14px}
.sent-jp{font-size:22px;font-weight:700;line-height:1.6;letter-spacing:.5px}
.sent-vi{font-size:15px;color:var(--sub);margin-top:8px;line-height:1.5}
.sent-word{font-size:13px;color:var(--brand);margin-top:6px;font-weight:600}
.sent-controls{display:flex;gap:10px;margin-top:12px;align-items:center}
.sent-controls .speaker{margin:0;width:44px;height:44px;font-size:20px}
.speed-btn{background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;
  font-size:13px;font-weight:600;color:var(--brand);cursor:pointer}
.speed-btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}

.kaiwa-bubble{border-radius:16px;padding:14px 16px;margin-bottom:10px;max-width:85%;position:relative;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kaiwa-bubble.left{background:#eff6ff;border:1px solid #bfdbfe;align-self:flex-start;border-bottom-left-radius:4px}
.kaiwa-bubble.right{background:#f0fdf4;border:1px solid #bbf7d0;align-self:flex-end;border-bottom-right-radius:4px}
.kaiwa-role{font-size:11px;font-weight:700;margin-bottom:4px}
.kaiwa-bubble.left .kaiwa-role{color:var(--brand)}
.kaiwa-bubble.right .kaiwa-role{color:var(--accent)}
.kaiwa-text{font-size:18px;font-weight:600;line-height:1.6}
.kaiwa-vi{font-size:13px;color:var(--sub);margin-top:4px}
.kaiwa-container{display:flex;flex-direction:column;gap:4px}
.kaiwa-highlight{background:rgba(37,99,235,.12);border-radius:4px;padding:0 2px}

.mic-sm{width:40px;height:40px;border-radius:50%;border:none;background:var(--brand);color:#fff;
  font-size:18px;cursor:pointer;flex-shrink:0}
.mic-sm.rec{background:var(--bad);animation:pulse 1.2s infinite}

/* toast / feedback */
.fb{text-align:center;font-size:16px;font-weight:700;margin-top:14px;min-height:24px}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.note{font-size:12.5px;color:var(--sub);background:#f0f7ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px 12px;margin-top:14px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:rgba(30,41,59,.94);color:#fff;font-size:13px;font-weight:600;
  padding:10px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:52px} .done h2{margin:10px 0 6px}

/* mic permission banner */
.mic-banner{background:var(--soft);border:1px solid var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:14px;
  font-size:13px;color:var(--warn);line-height:1.5}
.mic-banner button{background:var(--warn);border:none;border-radius:8px;padding:8px 14px;font-size:13px;
  font-weight:700;color:#fff;cursor:pointer;margin-top:8px}

footer{text-align:center;font-size:11px;color:var(--sub);padding:14px}

/* settings */
.settings-btn{background:var(--soft);border:none;color:var(--brand);border-radius:10px;
  padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;
  white-space:nowrap;flex-shrink:0}
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.settings-panel{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;
  max-height:85vh;overflow-y:auto;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
/* Header cố định (title + nút đóng) không cuộn theo nội dung — sticky bên trong .settings-panel (chính nó là scrollport) */
.settings-head{position:sticky;top:0;z-index:2;background:var(--card);border-radius:20px 20px 0 0;
  padding:20px 20px 14px;display:flex;justify-content:space-between;align-items:center}
.settings-body{padding:0 20px 20px}
.settings-panel h3{margin:0;font-size:17px}
.settings-panel label{font-size:13px;font-weight:600;color:var(--sub);display:block;margin-bottom:4px}
.settings-panel select{width:100%;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:10px;font-size:14px;margin-bottom:14px;background:var(--bg)}
.settings-panel .hint{font-size:11px;color:var(--sub);margin:-10px 0 14px;line-height:1.4}
.tts-status{font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:14px}
.tts-ok{background:var(--soft);color:var(--good)}
.tts-no{background:var(--soft);color:var(--sub)}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.slider-row input[type=range]{flex:1;height:6px}
.slider-row .slider-val{min-width:36px;text-align:center;font-weight:700;font-size:14px;color:var(--brand)}
.gender-btns{display:flex;gap:8px;margin-bottom:14px}
.gender-btn{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;
  font-weight:600;cursor:pointer;text-align:center;background:var(--bg);color:var(--sub)}
.gender-btn.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.reflex-btns{display:flex;gap:8px;margin-bottom:14px}
.reflex-btn{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;
  font-weight:600;cursor:pointer;text-align:center;background:var(--bg);color:var(--sub)}
.reflex-btn.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

/* xuất / nhập tiến độ (FR_011) */
.export-summary{font-size:12.5px;color:var(--sub);margin:-8px 0 12px;line-height:1.5}
.export-area{width:100%;min-height:110px;font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;
  padding:10px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;resize:vertical;background:var(--bg);color:var(--ink)}
.compare-table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.compare-table td,.compare-table th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.compare-table th:first-child,.compare-table td:first-child{text-align:left;color:var(--sub);font-weight:600}
.compare-warn{color:var(--bad);font-weight:700;font-size:13px;margin:8px 0 4px;line-height:1.5}

/* topic selection */
.topics{display:flex;flex-direction:column;gap:12px}
.topic-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
  cursor:pointer;box-shadow:var(--shadow);transition:.15s;display:flex;align-items:center;gap:14px;position:relative}
.topic-card:hover{border-color:var(--brand2)}
.topic-card:active{transform:scale(.98)}
.topic-card .tc-icon{font-size:22px;min-width:44px;height:44px;border-radius:12px;background:var(--soft);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topic-card .tc-body{flex:1;min-width:0}
.topic-card .tc-title{font-size:16px;font-weight:700}
.topic-card .tc-sub{font-size:12.5px;color:var(--sub);margin-top:2px}
.topic-card .tc-badge{position:absolute;top:10px;right:12px;font-size:10px;font-weight:700;border-radius:99px;padding:3px 10px}
.topic-card.active .tc-badge{background:var(--soft);color:var(--good)}
.topic-card.soon{opacity:.65;cursor:default}
.topic-card.soon:active{transform:none}
.topic-card.soon .tc-badge{background:var(--soft);color:var(--sub)}

/* IT業務編 + シャドウイング — 3 màu nền theo tiến độ (dashboard: theo % đã nghe của Unit; trong Unit:
   theo % đã luyện nói/đọc của từng Track/Đoạn) — hex tint pha nhẹ từ --warn/--good, không thêm biến
   :root mới. Đặt TRƯỚC .gy-track-row để rule .gy-track-row.open (định nghĩa sau) luôn thắng khi 1
   dòng vừa mở vừa có tint. Dùng chung cho cả 2 module (đặt tên trung lập, không theo module cụ thể). */
.topic-card.tint-partial{background:#F6ECD9;border-color:var(--warn)}
.topic-card.tint-done{background:#E3EEE4;border-color:var(--good)}
.unit-iconwrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.unit-progress{font-size:10px;font-weight:700;color:var(--sub);text-align:center;white-space:nowrap}

ớp, trùng khớp", "en": "Match / Coincide", "ex": "車台番号が不一致の場合、取込をしない。", "c": "漢字"}, {"id": 75, "w": "ファイル形式/フォーマット", "r": "ファイルけいしき/フォーマット", "vi": "Định dạng file", "en": "File format", "ex": "このファイル形式はシステムに対応していません。", "c": "漢字"}, {"id": 76, "w": "併せる", "r": "あわせる", "vi": "Kết hợp, đồng thời", "en": "Combine / Along with", "ex": "こちらも併せて、工数の算出をお願いします。", "c": "漢字"}, {"id": 77, "w": "記入", "r": "きにゅう", "vi": "Ghi, điền vào", "en": "Fill in / Write", "ex": "記入出しましたら、ご連絡いたします。", "c": "漢字"}, {"id": 78, "w": "工数", "r": "こうすう", "vi": "Nhân công, công sức (man-hours)", "en": "Man-hours / Effort", "ex": "赤枠に工数を記載してください", "c": "漢字"}, {"id": 79, "w": "一括", "r": "いっかつ", "vi": "Một lần, đồng loạt", "en": "Batch / All at once", "ex": "フェーズ3が完了した後、一括でSTG環境にデプロイすればよいと思います。", "c": "漢字"}, {"id": 80, "w": "論理削除", "r": "ろんりさくじょ", "vi": "Xóa logic (đánh dấu xóa, không xóa thật)", "en": "Logical delete / Soft delete", "ex": "このシステムでは物理削除ではなく、論理削除で対応しています。", "c": "漢字"}, {"id": 81, "w": "物理削除", "r": "ぶつりさくじょ", "vi": "Xóa vật lý (xóa hoàn toàn khỏi DB)", "en": "Physical delete / Hard delete", "ex": "物理削除を行うと、データを復元できません。", "c": "漢字"}, {"id": 82, "w": "拡張子", "r": "かくちょうし", "vi": "Phần mở rộng (extension) của file", "en": "File extension", "ex": "ファイルの拡張子が正しいかご確認ください。", "c": "漢字"}, {"id": 83, "w": "いずれ", "r": "いずれ", "vi": "Sớm muộn, một lúc nào đó", "en": "Someday / Eventually", "ex": "いずれ、新しいシステムに移行する予定です。", "c": "その他"}, {"id": 84, "w": "いずれか", "r": "いずれか", "vi": "Một trong số, hoặc là", "en": "Either / Any of", "ex": "2019年7月1日の場合、次のいずれかで記述。", "c": "その他"}, {"id": 85, "w": "いずれも", "r": "いずれも", "vi": "Tất cả, cả hai đều", "en": "Both / All", "ex": "下記の権限設定について　システムファイルに記述してありますので、ご確認ください。", "c": "その他"}, {"id": 86, "w": "いずれにしても", "r": "いずれにしても", "vi": "Dù thế nào đi nữa", "en": "In any case / Either way", "ex": "いずれにしても、非常に見難しい画面ではなく、しかしながら　最小の工数に対応していただけばいいと思います。", "c": "その他"}, {"id": 87, "w": "しかしながら", "r": "しかしながら", "vi": "Tuy nhiên, nhưng mà", "en": "However / Nevertheless", "ex": "システムは完成しました。しかしながら、いくつかの不具合が残っています。", "c": "その他"}, {"id": 88, "w": "負数", "r": "ふすう", "vi": "Số âm", "en": "Negative number", "ex": "在庫に負数になるのは異常ですよ。", "c": "漢字"}, {"id": 89, "w": "放置", "r": "ほうち", "vi": "Bỏ mặc, để nguyên", "en": "Neglect / Leave as is", "ex": "その問い合わせは放置せず、すぐに対応してください。", "c": "漢字"}, {"id": 90, "w": "見落とす", "r": "みおとす", "vi": "Bỏ sót, không để ý", "en": "Overlook / Miss", "ex": "ヘッダー部分見落としておりました。申し訳ありませんが、ヘッダーのロケーションを使用するようにしてください。", "c": "漢字"}, {"id": 91, "w": "帳票", "r": "ちょうひょう", "vi": "Chứng từ, mẫu biểu in", "en": "Form / Report (printed)", "ex": "帳票の出力内容を確認してください。", "c": "漢字"}, {"id": 92, "w": "共有", "r": "きょうゆう", "vi": "Chia sẻ", "en": "Share", "ex": "ファイルを共有してください。", "c": "漢字"}, {"id": 93, "w": "共通", "r": "きょうつう", "vi": "Chung, dùng chung", "en": "Common / Shared", "ex": "共通の機能は一か所に集約してください。", "c": "漢字"}, {"id": 94, "w": "共同", "r": "きょうどう", "vi": "Hợp tác, cùng nhau", "en": "Joint / Collaborative", "ex": "共同で開発を進めましょう。", "c": "漢字"}, {"id": 95, "w": "一覧", "r": "いちらん", "vi": "Danh sách, bảng liệt kê", "en": "List / Overview", "ex": "顧客一覧画面を表示してください。", "c": "漢字"}, {"id": 96, "w": "監査", "r": "かんさ", "vi": "Kiểm toán, kiểm tra", "en": "Audit", "ex": "システムログを使って監査を行います。", "c": "漢字"}, {"id": 97, "w": "列", "r": "れつ", "vi": "Cột (column)", "en": "Column", "ex": "1～6行目は取込不要の行である。", "c": "漢字"}, {"id": 98, "w": "セット", "r": "セット", "vi": "Bộ, tập hợp, thiết lập", "en": "Set", "ex": "必要なデータをセットしてから処理を実行してください。", "c": "外来語"}, {"id": 99, "w": "挿入", "r": "そうにゅう", "vi": "Chèn vào", "en": "Insert", "ex": "新しい行を挿入してください。", "c": "漢字"}, {"id": 100, "w": "レコード", "r": "レコード", "vi": "Bản ghi (record trong database)", "en": "Record", "ex": "このレコードは既に削除されています。", "c": "外来語"}, {"id": 101, "w": "フロート表示", "r": "フロートひょうじ", "vi": "Hiển thị nổi (float display)", "en": "Float display", "ex": "ボタンのフロート表示が崩れています。", "c": "漢字"}, {"id": 102, "w": "タイト", "r": "タイト", "vi": "Chặt chẽ, gấp rút (về thời gian)", "en": "Tight", "ex": "納期はタイトと言うこともあります。", "c": "外来語"}, {"id": 103, "w": "そもそも", "r": "  "マス", "vi": "Ô (cell/square)", "en": "Cell / Square", "ex": "このマスに上のマス　＋　下のマスの結果を表示する", "c": "外来語"}, {"id": 487, "w": "余る", "r": "あまる", "vi": "Thừa ra", "en": "Surplus / Be left over", "ex": "情報量がそんなに多くなくて　領域が余りそうので　許す限り　大きくしてほしいです。", "c": "漢字"}, {"id": 488, "w": "欲張る", "r": "よくばる", "vi": "Tham lam, đòi nhiều", "en": "Be greedy", "ex": "あれもこれも欲しがるなて、ちょっと欲張りすぎだよ。", "c": "漢字"}, {"id": 489, "w": "刻印", "r": "こくいん", "vi": "Dấu in, ký hiệu in", "en": "Stamp / Marking", "ex": "透明の袋にある刻印は　OCRで読み取れない と判断しています。", "c": "漢字"}, {"id": 490, "w": "透明", "r": "とうめい", "vi": "Trong suốt", "en": "Transparent", "ex": "透明のラベルを使用してください。", "c": "漢字"}, {"id": 491, "w": "関数", "r": "かんすう", "vi": "Hàm (function)", "en": "Function", "ex": "JavaScriptからBlazorの画面遷移に使う変数を呼び出して、試してみてください。", "c": "漢字"}, {"id": 492, "w": "コール", "r": "コール", "vi": "Gọi hàm (call), cuộc gọi", "en": "Call", "ex": "この関数をコールしてください。", "c": "外来語"}, {"id": 493, "w": "妥当", "r": "だとう", "vi": "Hợp lý, xác đáng", "en": "Reasonable / Appropriate", "ex": "ご共有いただいた見積もりについて　こちらで対応した各画面の工数を比較した結果、金額が妥当であると考えております。", "c": "漢字"}, {"id": 494, "w": "見解", "r": "けんかい", "vi": "Quan điểm, ý kiến", "en": "Opinion / View", "ex": "わたくし個人の見解としては　金額が高いとは思いません。", "c": "漢字"}, {"id": 495, "w": "見送り", "r": "みおくり", "vi": "Tiễn đưa / Hoãn lại", "en": "See off / Postpone", "ex": "①　友達を空港まで見送りに行くんだ。", "c": "漢字"}, {"id": 496, "w": "デベロッパー", "r": "デベロッパー", "vi": "Nhà phát triển, developer", "en": "Developer", "ex": "初回起動時に「このアプリは最新のバージョンに対応していません。アップデートを更新するか、デベロッパーにお問い合わせください。」と言うメッセージが出力されません。", "c": "外来語"}, {"id": 497, "w": "削減", "r": "さくげん", "vi": "Cắt giảm, giảm", "en": "Reduce / Cut", "ex": "工数を削減するために、Delphiによる画面設計を先に行ってください。", "c": "漢字"}, {"id": 498, "w": "特化", "r": "とっか", "vi": "Chuyên biệt hóa, tập trung vào", "en": "Specialize", "ex": "このシステムはタスク管理とバグ対応に特化して利用しています。", "c": "漢字"}, {"id": 499, "w": "放念", "r": "ほうねん", "vi": "Cho qua, không cần bận tâm", "en": "Disregard / No need to worry", "ex": "本件につきまして　ご放念ください。", "c": "漢字"}, {"id": 500, "w": "防  629, "w": "仕様変更", "r": "しようへんこう", "vi": "Thay đổi đặc tả / yêu cầu", "en": "Specification change", "ex": "仕様変更があるため、確認してください。", "c": "漢字"}, {"id": 630, "w": "バグ修正", "r": "バグしゅうせい", "vi": "Sửa lỗi / Khắc phục lỗi", "en": "Bug fix", "ex": "バグ修正を完了しました。", "c": "漢字"}, {"id": 631, "w": "コーディング", "r": "コーディング", "vi": "Viết code / Lập trình", "en": "Coding", "ex": "コーディングを開始します。", "c": "外来語"}, {"id": 632, "w": "デプロイ", "r": "デプロイ", "vi": "Triển khai / Deploy", "en": "Deployment", "ex": "デプロイは完了です。", "c": "外来語"}, {"id": 633, "w": "細かい", "r": "こまかい", "vi": "Chi tiết, phức tạp", "en": "detailed, small", "ex": "細かい点を確認しましょう。", "c": "漢字"}, {"id": 634, "w": "課題", "r": "かだい", "vi": "Task, vấn đề", "en": "task, issue", "ex": "課題が報告されました。", "c": "漢字"}, {"id": 635, "w": "対象外", "r": "たいしょうがい", "vi": "Ngoài phạm vi, được loại trừ", "en": "out of scope, excluded", "ex": "この項目は対象外です。", "c": "漢字"}, {"id": 636, "w": "カード", "r": "カード", "vi": "Thẻ", "en": "Card", "ex": "加工カードには材料ロット情報が記載されています。", "c": "外来語"}, {"id": 637, "w": "独立", "r": "どくりつ", "vi": "Độc lập", "en": "Independent", "ex": "AとBはそれぞれ独立した一覧情報となる。", "c": "漢字"}, {"id": 638, "w": "脱却", "r": "だっきゃく", "vi": "Thoát khỏi, thoát ly (khỏi hiện trạng cũ)", "en": "Break away from / Move away from", "ex": "古いシステムからの脱却を目指しています。", "c": "漢字"}, {"id": 639, "w": "スケジューラ", "r": "スケジューラ", "vi": "Bộ lập lịch", "en": "Scheduler", "ex": "生産スケジューラを導入する予定です。", "c": "外来語"}, {"id": 640, "w": "流れ図", "r": "ながれず", "vi": "Sơ đồ luồng (thông tin/công việc)", "en": "Flow diagram", "ex": "情報の流れ図を作成してください。", "c": "漢字"}, {"id": 641, "w": "マトリックス", "r": "マトリックス", "vi": "Ma trận", "en": "Matrix", "ex": "CRUDマトリックスを使って機能を整理します。", "c": "外来語"}, {"id": 642, "w": "関連図", "r": "かんれんず", "vi": "Sơ đồ liên kết, sơ đồ quan hệ", "en": "Relationship diagram", "ex": "システム関連図を作成し、全体像を把握します。", "c": "漢字"}, {"id": 643, "w": "精査", "r": "せいさ", "vi": "Rà soát kỹ, xem xét cẩn thận", "en": "Careful examination / Scrutiny", "ex": "必要な機能を精査してください。", "c": "漢字"}, {"id": 644, "w": "取捨選択", "r": "しゅしゃせんたく", "vi": "Chọn lọc (giữ lại cái cần, bỏ cái không cần)", "en": "Selection / Picking and choosing", "ex": "必要な機能を取捨選択します。", "c": "漢字"}, {"id": 645, "w": "内示", "r": "ないじ", "vi": "Thông báo nội bộ/dự kiến (trước khi có chỉ thị chính thức)", "en": "Informal/preliminary notice", "ex": "来月の生産内示を確認してください。", "c": "漢字"}, {"id": 646, "w": "部番", "r": "ぶばん", "vi": "Mã số phụ tùng/linh kiện", "en": "Part number", "ex": "部品の部番を確認してください。", "c": "漢字"}, {"id": 647, "w": "構想", "r": "こうそう", "vi": "Định hướng, ý tưởng tổng thể", "en": "Concept / Vision", "ex": "今後のシステム構想資料を共有します。", "c": "漢字"}, {"id": 648, "w": "流出", "r": "りゅうしゅつ", "vi": "Rò rỉ, thất thoát (lỗi lọt ra ngoài công đoạn kiểm soát)", "en": "Outflow / Leakage", "ex": "流出不良を防ぐための対策を検討します。", "c": "漢字"}, {"id": 649, "w": "フラグ", "r": "フラグ", "vi": "Cờ đánh dấu (biến đánh dấu trạng thái)", "en": "Flag", "ex": "対象フラグにチェックを入れてください。", "c": "外来語"}, {"id": 650, "w": "破壊検査", "r": "はかいけんさ", "vi": "Kiểm tra phá hủy", "en": "Destructive inspection/test", "ex": "破壊検査を行った部品は再使用できません。", "c": "漢字"}, {"id": 651, "w": "計上", "r": "けいじょう", "vi": "Ghi nhận, hạch toán (tính vào số liệu)", "en": "Record / Account for", "ex": "不良数として計上してください。", "c": "漢字"}, {"id": 652, "w": "以下", "r": "いか", "vi": "Trở xuống, dưới (mức nào đó)", "en": "Or less / below", "ex": "在庫数が10個以下になったら、自動で発注してください。", "c": "漢字"}, {"id": 653, "w": "減算", "r": "げんさん", "vi": "Phép trừ, trừ đi", "en": "Subtraction", "ex": "不良品が見つかった場合、在庫数から減算する処理が必要です。", "c": "漢字"}, {"id": 654, "w": "発生量", "r": "はっせいりょう", "vi": "Số lượng phát sinh", "en": "Amount generated / occurred quantity", "ex": "今月の不良品の発生量は先月より減少しました。", "c": "漢字"}, {"id": 655, "w": "台", "r": "だい", "vi": "(Lượng từ đếm máy móc, thiết bị)", "en": "Counter for machines/units", "ex": "新しい設備を3台導入する予定です。", "c": "漢字"}, {"id": 656, "w": "不良", "r": "ふりょう", "vi": "Lỗi, hàng không đạt, khuyết tật", "en": "Defective", "ex": "検査の結果、不良として1個計上されました。", "c": "漢字"}, {"id": 657, "w": "加算", "r": "かさん", "vi": "Phép cộng, cộng thêm", "en": "Addition", "ex": "条件を満たした場合、ポイントを加算してください。", "c": "漢字"}, {"id": 658, "w": "品質", "r": "ひんしつ", "vi": "Chất lượng", "en": "Quality", "ex": "品質を維持するために、検査工程を強化してください。", "c": "漢字"}, {"id": 659, "w": "部門", "r": "ぶもん", "vi": "Bộ phận, phòng ban", "en": "Department", "ex": "この件については、利用部門に確認する必要があります。", "c": "漢字"}, {"id": 660, "w": "不確実性", "r": "ふかくじつせい", "vi": "Tính không chắc chắn, tính bất định", "en": "Uncertainty", "ex": "市場の不確実性が高いため、慎重に計画を立てるべきです。", "c": "漢字"}, {"id": 661, "w": "要求定義", "r": "ようきゅうていぎ", "vi": "Định nghĩa yêu cầu", "en": "Requirements definition", "ex": "要求定義の段階で、利用者の意見を十分に聞くことが重要です。", "c": "漢字"}, {"id": 662, "w": "仕様", "r": "しよう", "vi": "Đặc tả, quy cách, thông số kỹ thuật", "en": "Specification", "ex": "この仕様では、対応できない機能があります。", "c": "漢字"}, {"id": 663, "w": "プロトタイプ", "r": "プロトタイプ", "vi": "Nguyên mẫu, bản thử nghiệm", "en": "Prototype", "ex": "プロトタイプを作成してから、利用者にレビューしてもらいます。", "c": "外来語"}, {"id": 664, "w": "レビュー", "r": "レビュー", "vi": "Rà soát, đánh giá, xem xét lại", "en": "Review", "ex": "コードをリリースする前に、必ずレビューを受けてください。", "c": "外来語"}, {"id": 665, "w": "利用者", "r": "りようしゃ", "vi": "Người sử dụng, người dùng", "en": "User", "ex": "システムの利用者からフィードバックを集めています。", "c": "漢字"}, {"id": 666, "w": "繰り返す", "r": "くりかえす", "vi": "Lặp lại, tái diễn", "en": "Repeat", "ex": "同じミスを繰り返さないように、原因を分析しましょう。", "c": "漢字"}, {"id": 667, "w": "高める", "r": "たかめる", "vi": "Nâng cao, làm tăng lên", "en": "To raise / increase", "ex": "品質を高めるために、テストの回数を増やしました。", "c": "漢字"}, {"id": 668, "w": "抜け", "r": "ぬけ", "vi": "Sự thiếu sót, bỏ sót", "en": "Omission / gap", "ex": "仕様書に抜けがないか、もう一度確認してください。", "c": "漢字"}, {"id": 669, "w": "支援", "r": "しえん", "vi": "Hỗ trợ, trợ giúp", "en": "Support / assistance", "ex": "新人の業務を支援するため、先輩社員が指導しています。", "c": "漢字"}];
const GYOUMU = /*__GYOUMU__*/[{"track": 1, "chapter": 1, "unit": 1, "unitJp": "求人ポスター", "unitVi": "Bảng tin tuyển dụng", "type": "聞き取り練習 (Luyện nghe)", "chars": "DJ (quảng cáo radio)", "hasTranscript": true, "lines": [{"spk": "DJ", "t": "夢の世界へようこそ！ アルクテクノロジー社は秋葉原に本社があり、シリコンバレーにも支社のあるロボット開発企業です。日本とアメリカで活躍するエンジニアたちは合計3,500人！ あなたもここで未来を作る仲間に入りませんか。私たちは、夢のある若い技術者たちを応援しています。あなたに熱い夢があるなら、ぜひ、当社へ！「ロボットとともに明るい未来を」。アルクテクノロジー。"}], "note": ""}, {"track": 2, "chapter": 1, "unit": 2, "unitJp": "電話で問い合わせる", "unitVi": "Gọi điện hỏi thông tin tuyển dụng", "type": "モデル会話 (Hội thoại mẫu)", "chars": "受付 (Lễ tân) / リー (Li) / 田口 (Taguchi)", "hasTranscript": true, "lines": [{"spk": "受付", "t": "はい、未来創造社でございます。"}, {"spk": "リー", "t": "私、リーと申しますが、御社の求人ポスターを拝見しまして……。エンジニアの募集について、お尋ねしてもよろしいでしょうか。"}, {"spk": "受付", "t": "求人の件ですね。担当の者に代わりますので、少々お待ちください。"}, {"spk": "田口", "t": "お電話代わりました。人事部の田口と申します。"}, {"spk": "リー", "t": "お忙しいところ失礼いたします。リーと申しますが、エンジニアの応募資格の件で、質問させていただけますか。"}, {"spk": "田口", "t": "はい、どうぞ。"}, {"spk": "リー", "t": "あの、日本の情報処理技術者試験を受けたことがないんですが、日本で働くには、この試験に合格していなければなりませんか。"}, {"spk": "田口", "t": "失礼ですが、どちらからおかけですか。"}, {"spk": "リー", "t": "中国の大連です。"}, {"spk": "田口", "t": "ああ、中国の場合は、情報産業部の試験に合格していれば大丈夫ですよ。"}, {"spk": "リー", "t": "そうですか。プログラマーの部門でもいいですか。"}, {"spk": "田口", "t": "プログラマー部門でもビザは出ます。でも、採用試験には技術関連の問題がありますから、まずはそれに合格しなければなりませんね。"}, {"spk": "リー", "t": "技術的な内容も試験されるんですね。ほかにどんな試験がありますか。"}, {"spk": "田口", "t": "一次試験では、技術試験のほかに、日本語テストがあります。それに合格したら2次試験の面接を受けてもらいます。2次試験に合格すれば採用です。"}, {"spk": "リー", "t": "そうですか。応募書類は郵送するのでしょうか。"}, {"spk": "田口", "t": "メールに添付してもいいですよ。"}, {"spk": "リー", "t": "よくわかりました。ありがとうございました。"}], "note": ""}, {"track": 3, "chapter": 1, "unit": 2, "unitJp": "電話で問い合わせる", "unitVi": "Gọi điện hỏi thông tin tuyển dụng", "type": "聞き取り練習 (Luyện nghe)", "chars": "田口 (Taguchi) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "田口", "t": "はい、お電話替わりました。人事部の田口です。"}, {"spk": "ラジュ", "t": "あ、おはようございます。ラジュと申します。求人の件でお聞きしたいことがあるんですが。"}, {"spk": "田口", "t": "何でしょうか。"}, {"spk": "ラジュ", "t": "私はインドのバンガロールで働いているんですが、こちらの資格は日本でも有効ですか。"}, {"spk": "田口", "t": "インドの資格というとドアックですか。"}, {"spk": "ラジュ", "t": "そうです。"}, {"spk": "田口", "t": "どのレベルですか。"}, {"spk": "ラジュ", "t": "レベルCです。"}, {"spk": "田口", "t": "レベルCなら日本の資格と同じように扱われますから、大丈夫ですよ。"}, {"spk": "ラジュ", "t": "そうですか。安心しました。"}, {"spk": "田口", "t": "うちのウェブサイトから資料はダウンロードしましたか。"}, {"spk": "ラジュ", "t": "はい、しました。でも、まだ資格のところまでしか読んでいないんです。"}, {"spk": "田口", "t": "じゃあ、半分ぐらい読んだんですね。まずは全部読んでみて、わからないことがあったら、また電話してください。"}, {"spk": "ラジュ", "t": "わかりました。ありがとうございます。"}], "note": ""}, {"track": 4, "chapter": 1, "unit": 3, "unitJp": "職務経歴書", "unitVi": "Sơ yếu lý lịch làm việc (Résumé)", "type": "聞き取り練習 (Luyện nghe)", "chars": "リー (Li) - độc thoại", "hasTranscript": true, "lines": [{"spk": "リー", "t": "私は御社でシステムエンジニアとしてのキャリアを積みたいと考えております。私は2001年に大連情報技術大学ソフトウェア工学学院に入学しました。専攻はプログラミングでしたが、2年生の時に日本語強化コースが開設されるのと同時に、日本語を履修し始めました。2005年に同大学を卒業し、大連市にある大連e-コマースシステムズに入社しました。主な案件は中国企業の日本市場向け広報サイトの製作でした。2006年から現在まで、オフショア部門に配属され、日本企業のオンラインショップの開発に関わっています。ここではPHPによるe-コマースの技術のみならず、日本の基礎的な商習慣を身に付けることができました。このように、これまでずっと日本市場向けウェブサイトの開発に関わって参りました。そのため、日本市場に最適で実用的なシステム開発に貢献することができると自負しています。"}], "note": ""}, {"track": 5, "chapter": 1, "unit": 4, "unitJp": "面接", "unitVi": "Phỏng vấn", "type": "モデル会話 (Hội thoại mẫu)", "chars": "田口 (Taguchi) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "田口", "t": "次の方、どうぞ。"}, {"spk": "リー", "t": "はい、失礼します。"}, {"spk": "田口", "t": "おかけください。少し緊張しているようですね。大丈夫ですか。"}, {"spk": "リー", "t": "はい、大丈夫です。"}, {"spk": "田口", "t": "まず、今の仕事ですが、大連で日本向けのシステムを開発しているんですね。"}, {"spk": "リー", "t": "そうです。大連e-コマースシステムズという会社に勤めています。"}, {"spk": "田口", "t": "開発環境を教えてください。"}, {"spk": "リー", "t": "主にエクリプスで開発しています。ソースはPHPで書いています。"}, {"spk": "田口", "t": "うーん、PHPですか。Javaはどうですか。"}, {"spk": "リー", "t": "あまり使っていません。"}, {"spk": "田口", "t": "日本で働くのなら、Javaも勉強しておいた方がいいですよ。"}, {"spk": "リー", "t": "はい、がんばります。"}, {"spk": "田口", "t": "日本に行きたいという希望は、もうご家族に話してありますか。"}, {"spk": "リー", "t": "はい、話してあります。"}, {"spk": "田口", "t": "日本で働きたいというのは、どうしてですか。"}, {"spk": "リー", "t": "私は大学でプログラミングと日本語を勉強しましたので、これからも日本向けのサービスに関わっていきたいと思います。そのためにも、20代のうちに日本で働くことを経験しておきたいのです。"}, {"spk": "田口", "t": "中国にある日系企業でも、役に立つ経験は得られるのではありませんか。"}, {"spk": "リー", "t": "もちろん、中国にある日系企業でも、日本の会社のことは勉強できると思います。ただ、私は会社の中のことだけでなく、お客さまのことも知りたいのです。そのためには日本へ行って生活してみることが必要だと思っています。"}, {"spk": "田口", "t": "なるほど。"}], "note": ""}, {"track": 6, "chapter": 1, "unit": 4, "unitJp": "面接", "unitVi": "Phỏng vấn", "type": "聞き取り練習 (Luyện nghe)", "chars": "田口 (Taguchi) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "失礼します。ラジュ・タルクダールと申します。よろしくお願いいたします。"}, {"spk": "田口", "t": "はい、どうぞ。おかけください。さて、まず筆記試験ですが、どうでしたか。"}, {"spk": "ラジュ", "t": "技術試験はそれほど難しくありませんでしたが、日本語のテストは難しかったです。"}, {"spk": "田口", "t": "日本語はどちらで勉強したんですか。"}, {"spk": "ラジュ", "t": "自分で勉強しました。"}, {"spk": "田口", "t": "それはすごいですね。では、どうして日本で働きたいんですか。"}, {"spk": "ラジュ", "t": "私が昔やっていた研究が日本で実用化されてきたので、その現場に行って、この目で見てみたいんです。"}, {"spk": "田口", "t": "ご研究というのはグリッドコンピューティングのことですよね。"}, {"spk": "ラジュ", "t": "はい。今は特に、御社のネット銀行のプロジェクトに注目しています。"}, {"spk": "田口", "t": "なるほど。ただ、うちはいろいろなプロジェクトがあって、ネット銀行のプロジェクト以外にも参加していただきたいと思っているんですよ。そのあたりはいかがですか。"}, {"spk": "ラジュ", "t": "もちろん、ほかの仕事もやらせていただきます。"}, {"spk": "田口", "t": "そうですか。それは頼もしいです。"}], "note": ""}, {"track": 7, "chapter": 1, "unit": 5, "unitJp": "ビザの取得", "unitVi": "Xin thị thực (Visa)", "type": "モデル会話 (Hội thoại mẫu)", "chars": "田口 (Taguchi) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "田口", "t": "はい、お電話替わりました。田口です。"}, {"spk": "ラジュ", "t": "あ、田口さん。ラジュです。"}, {"spk": "田口", "t": "ああ、ラジュさん。ドアックの証明書はもう出ましたか。"}, {"spk": "ラジュ", "t": "ええ。IT省の友達が手配してくれました。"}, {"spk": "田口", "t": "そうですか。それはよかった。じゃあ、渡航手続きは順調に進んでいますね。"}, {"spk": "ラジュ", "t": "それが、一つ問題がありまして……。実は、日本大使館から会社の書類が足りないと言われています。"}, {"spk": "田口", "t": "え、本当？ どんな書類ですか。"}, {"spk": "ラジュ", "t": "法人登記簿の謄本だそうです。"}, {"spk": "田口", "t": "法人登記簿？ この前の封筒に入っていませんでしたか。"}, {"spk": "ラジュ", "t": "入っていましたが、あれは抄本でした。大使館では法人登記簿の謄本が必要なんだそうです。"}, {"spk": "田口", "t": "ああ、そうなんですか。それは困ったなあ。"}, {"spk": "ラジュ", "t": "謄本がないと、ビザが出せないそうです。お手数ですが、送っていただけませんか。"}, {"spk": "田口", "t": "わかりました。急いで送ります。"}, {"spk": "ラジュ", "t": "ありがとうございます。"}], "note": ""}, {"track": 8, "chapter": 1, "unit": 5, "unitJp": "ビザの取得", "unitVi": "Xin thị thực (Visa)", "type": "聞き取り練習 (Luyện nghe)", "chars": "田口 (Taguchi) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "田口", "t": "はい、お電話替わりました。人事部の田口です。"}, {"spk": "リー", "t": "あ、田口さんですね。大連のリーです。"}, {"spk": "田口", "t": "ああ、リーさん。渡航手続きは無事に進んでいますか。"}, {"spk": "リー", "t": "それが……。今日、領事館に行ったら、会社の書類が足りないって言われたんです。"}, {"spk": "田口", "t": "足りないのは法人登記簿の謄本ですか。"}, {"spk": "リー", "t": "いえ、それはちゃんとありました。足りないのは会社の決算書です。"}, {"spk": "田口", "t": "決算書？ おかしいなあ。決算書は確かに封筒に入れたはずですが……。"}, {"spk": "リー", "t": "でも、見つからなくて……。決算書がないと、ビザが出せないそうです。"}, {"spk": "田口", "t": "そうですよね。とにかく、すぐに送りますから。"}, {"spk": "リー", "t": "あ、でも時間がないので、ウェブサイトからダウンロードしたものでも、特別に受け取ってくれるそうです。でも、ちょっとサイトが探せないんです……。"}, {"spk": "田口", "t": "じゃ、すぐにこちらからメールでURLを知らせます。"}, {"spk": "リー", "t": "ありがとうございます。"}], "note": ""}, {"track": 9, "chapter": 2, "unit": 1, "unitJp": "自己紹介", "unitVi": "Tự giới thiệu bản thân", "type": "モデル会話 (Hội thoại mẫu)", "chars": "", "hasTranscript": false, "lines": [], "note": "KHÔNG CÓ trong file PDF được cung cấp (trang bị thiếu trong bản scan, PDF nhảy từ trang 31 sang trang 38). Không thể trích transcript cho track này."}, {"track": 10, "chapter": 2, "unit": 1, "unitJp": "自己紹介", "unitVi": "Tự giới thiệu bản thân", "type": "聞き取り練習 (Luyện nghe)", "chars": "リー (Li) / 大沢 (Osawa)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "すみません、ちょっとよろしいですか。"}, {"spk": "大沢", "t": "はい、何か。"}, {"spk": "リー", "t": "私、リーと申します。本日よりこちらでお世話になります。よろしくお願いいたします。"}, {"spk": "大沢", "t": "新入社員の方ですね。私は上級SEの大沢です。よろしく。"}, {"spk": "リー", "t": "大沢さんですね。"}, {"spk": "大沢", "t": "そうです。リーさん、ご出身はどちらですか。"}, {"spk": "リー", "t": "中国の大連です。"}, {"spk": "大沢", "t": "大連ですか。日本の企業がたくさん進出していますよね。大連では、どんな言語で開発していたんですか。"}, {"spk": "リー", "t": "PHPが多かったですが、最近はJavaの仕事が多くなってきましたね。"}, {"spk": "大沢", "t": "なるほど。では、OSは？ こちらはUNIXの仕事が多いんですが、大丈夫ですか。"}, {"spk": "リー", "t": "UNIXで動くアプリは、今までもたくさん作ってきました。"}, {"spk": "大沢", "t": "そうですか。データベースは？ こちらでは、オラクルのものが多いんですが。"}, {"spk": "リー", "t": "オラクルはまだ勉強中です。PostgreSQLならだいたいわかるんですが。"}, {"spk": "大沢", "t": "じゃあ、すぐ慣れるでしょう。PostgreSQLはどんなシステムで使ったんですか。"}, {"spk": "リー", "t": "食品会社のオンラインショップなんかで使っていました。"}, {"spk": "大沢", "t": "そうですか。じゃあ、うちのプロジェクトでも大丈夫ですね。でも、何かあったら、いつでも聞いてください。"}, {"spk": "リー", "t": "ありがとうございます。よろしくお願いします。"}], "note": ""}, {"track": 11, "chapter": 2, "unit": 2, "unitJp": "要件定義書の読解", "unitVi": "Đọc hiểu tài liệu định nghĩa yêu cầu", "type": "モデル会話 (Hội thoại mẫu)", "chars": "井出 (Ide) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "井出", "t": "リーさん、今、ちょっといい？"}, {"spk": "リー", "t": "はい、3時の定例会議までは空いています。"}, {"spk": "井出", "t": "では、手短に。これは今度のプロジェクトの資料で、要件定義書と外部設計書です。"}, {"spk": "リー", "t": "はい。これに目を通しておくんですね。期限はいつですか。"}, {"spk": "井出", "t": "明日です。内部設計書ももうできますから。"}, {"spk": "リー", "t": "明日ですか。すみません、私の日本語力では、かなり厳しいのですが……。"}, {"spk": "井出", "t": "そうですか。じゃあ、三日でお願いします。"}, {"spk": "リー", "t": "三日ですか。ちょっと心配ですが、がんばります。"}, {"spk": "井出", "t": "リーさんなら大丈夫ですよ。みんなも協力するし。"}, {"spk": "リー", "t": "読んでもわからないところは、どうすればいいでしょうか。"}, {"spk": "井出", "t": "まず、自分で推測してみてください。自信がなかったら本棚に辞書もあります。辞書にない言葉は、大沢さんに聞いてください。大沢さんが席を外しているときは、私に聞いてください。"}, {"spk": "リー", "t": "はい、わかりました。ありがとうございます。"}, {"spk": "井出", "t": "くれぐれも、設計の理解があやふやなまま実装の段階に入らないようにね。じゃあ、大変だけど、よろしく。"}, {"spk": "リー", "t": "はい、がんばります。"}], "note": ""}, {"track": 12, "chapter": 2, "unit": 2, "unitJp": "要件定義書の読解", "unitVi": "Đọc hiểu tài liệu định nghĩa yêu cầu", "type": "聞き取り練習 (Luyện nghe)", "chars": "大沢 (Osawa) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "ラジュさん、ちょっといいですか。"}, {"spk": "ラジュ", "t": "はい。"}, {"spk": "大沢", "t": "内部設計書、届いていますよ。"}, {"spk": "ラジュ", "t": "あ、はい。これを読むんですね。いつまでですか。"}, {"spk": "大沢", "t": "明日から実装だから、今日中に読んでおいた方がいいんじゃないかな。"}, {"spk": "ラジュ", "t": "え、今日中ですか。実は私、話すのは大丈夫なんですが、読むのは苦手で……。"}, {"spk": "大沢", "t": "じゃあ、今週中ぐらいには読めそうですか。"}, {"spk": "ラジュ", "t": "はい、それなら何とかできると思います。"}, {"spk": "大沢", "t": "でも、実装はスケジュールどおりに始まりますから、とりあえず最初の方は読んでおいてくださいね。"}, {"spk": "ラジュ", "t": "わかりました。知らない言葉があったらお聞きしてもいいですか。"}, {"spk": "大沢", "t": "もちろん。でも、まずは辞書を見てくださいね。辞書にない言葉は、私に聞けばいいですから。"}, {"spk": "ラジュ", "t": "ありがとうございます。よろしくお願いします。"}], "note": ""}, {"track": 13, "chapter": 2, "unit": 3, "unitJp": "内容確認", "unitVi": "Xác nhận nội dung", "type": "モデル会話 (Hội thoại mẫu)", "chars": "リー (Li) / 新山 (Niiyama)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "新山さん、今ちょっとよろしいでしょうか。実は外部設計書で、わからないところがあるんですが……。"}, {"spk": "新山", "t": "あ、はい。要件定義書はもう読みましたか。"}, {"spk": "リー", "t": "はい、読みました。"}, {"spk": "新山", "t": "わからないところはどこですか。"}, {"spk": "リー", "t": "この言葉です。この漢字は何と読みますか。"}, {"spk": "新山", "t": "「にゅうしゅつりょく」と読みます。"}, {"spk": "リー", "t": "え、「にゅうしゅつりょく」って何ですか。"}, {"spk": "新山", "t": "ちょっと見せて。ああ、「入出力インターフェース」ですね。これは、ほかのシステムと情報をやりとりするときの規格のことです。"}, {"spk": "リー", "t": "うーん……。"}, {"spk": "新山", "t": "たとえば、ほら、APIとか。"}, {"spk": "リー", "t": "なるほど！ インプットとアウトプットのインターフェースということですね。"}, {"spk": "新山", "t": "そうです。"}, {"spk": "リー", "t": "それから、この漢字は何と読みますか。"}, {"spk": "新山", "t": "「上書き」と読みます。オーバーライトのことですね。"}, {"spk": "リー", "t": "なるほど。ありがとうございました。よくわかりました。"}, {"spk": "新山", "t": "また何かあったら、何でも遠慮なく聞いてください。"}, {"spk": "リー", "t": "はい、よろしくお願いします。"}], "note": ""}, {"track": 14, "chapter": 2, "unit": 3, "unitJp": "内容確認", "unitVi": "Xác nhận nội dung", "type": "聞き取り練習 (Luyện nghe)", "chars": "ラジュ (Raju) / 新山 (Niiyama)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "新山さん、ちょっと時間ありますか。"}, {"spk": "新山", "t": "あ、はい。"}, {"spk": "ラジュ", "t": "実は、外部設計書を読んでいるんですが、辞書を見てもわからない言葉があって。これなんですが……。"}, {"spk": "新山", "t": "ああ、「親クラス」ですね。これはね、継承する基のクラスっていうことです。"}, {"spk": "ラジュ", "t": "え、けいしょう、ですか。うーん……。"}, {"spk": "新山", "t": "例えば、そうだなあ……ルートクラスってわかります？"}, {"spk": "ラジュ", "t": "はい、わかります。"}, {"spk": "新山", "t": "ルートクラスには親クラスがないんですよ。"}, {"spk": "ラジュ", "t": "ん？ ということは、親クラスってスーパークラスのことですか。"}, {"spk": "新山", "t": "あ、そうそう。英語で言うとスーパークラスです。"}, {"spk": "ラジュ", "t": "じゃあ、子クラスっていうのはサブクラスのことですね。"}, {"spk": "新山", "t": "その通りです。"}], "note": ""}, {"track": 15, "chapter": 2, "unit": 4, "unitJp": "担当業務の通知", "unitVi": "Thông báo công việc phụ trách", "type": "モデル会話 (Hội thoại mẫu)", "chars": "大沢 (Osawa) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "ラジュさん、仕事の内容は、もう聞いていますか。"}, {"spk": "ラジュ", "t": "はい、だいたいは。"}, {"spk": "大沢", "t": "要件定義書と基本設計書はもう読んでいますね。"}, {"spk": "ラジュ", "t": "はい。"}, {"spk": "大沢", "t": "では、予定どおり仕入管理モジュールの発注データを担当してもらうことになります。"}, {"spk": "ラジュ", "t": "はい。えーっと、発注データは四つの機能がありますが、これを全部やるんですね。"}, {"spk": "大沢", "t": "そうです。仕入管理の開発は、やったことがありますか。"}, {"spk": "ラジュ", "t": "はい、あります。詳細設計書はもうできていますか。"}, {"spk": "大沢", "t": "はい、できています。これです。"}, {"spk": "ラジュ", "t": "拝見します。どれから始めてもいいのですか。"}, {"spk": "大沢", "t": "どれから始めてもいいですが、発注伝票出力だけ締め切りが早いですから、遅れないようにしてください。"}, {"spk": "ラジュ", "t": "発注伝票出力ですね。では、この機能から始めます。"}, {"spk": "大沢", "t": "じゃあ、発注伝票出力だけでも終わったら報告してください。"}, {"spk": "ラジュ", "t": "わかりました。ほかの機能ができていなくても、ご報告するんですね。"}, {"spk": "大沢", "t": "そのとおりです。よろしくお願いします。"}], "note": ""}, {"track": 16, "chapter": 2, "unit": 4, "unitJp": "担当業務の通知", "unitVi": "Thông báo công việc phụ trách", "type": "聞き取り練習 (Luyện nghe)", "chars": "大沢 (Osawa) / リー (Li)", "hasTranscript": true, "lines": [{"spk": "大沢", "t": "リーさん、今、いいですか。"}, {"spk": "リー", "t": "はい、大丈夫です。"}, {"spk": "大沢", "t": "詳細設計書ができたので、リーさんは顧客管理モジュールの取引履歴のところをお願いします。"}, {"spk": "リー", "t": "わかりました。顧客管理の、取引履歴ですね。"}, {"spk": "大沢", "t": "そうです。顧客管理系の開発はしたことがありますか。"}, {"spk": "リー", "t": "はい。中国にいたときに、顧客関連モジュールに関わったことがあります。"}, {"spk": "大沢", "t": "じゃ、安心ですね。ただ、今回は帳票の仕様に変更が出そうなので、帳票出力は最後にしてください。"}, {"spk": "リー", "t": "わかりました。帳票出力以外から始めるんですね。締め切りはいつですか。"}, {"spk": "大沢", "t": "今月中にお願いします。"}, {"spk": "リー", "t": "今月中ですね。わかりました。"}], "note": ""}, {"track": 17, "chapter": 2, "unit": 5, "unitJp": "詳細設計書を書く", "unitVi": "Viết tài liệu thiết kế chi tiết", "type": "モデル会話 (Hội thoại mẫu)", "chars": "ラジュ (Raju) / 新山 (Niiyama)", "hasTranscript": true, "lines": [{"spk": "ラジュ", "t": "新山さん、ちょっといいですか。"}, {"spk": "新山", "t": "はい、どうぞ。"}, {"spk": "ラジュ", "t": "実は、詳細設計書を書いたんですが……。"}, {"spk": "新山", "t": "はい。"}, {"spk": "ラジュ", "t": "どうも日本語に自信がないんです。"}, {"spk": "新山", "t": "辞書は引いたんですか。"}, {"spk": "ラジュ", "t": "もちろん引きました。"}, {"spk": "新山", "t": "そうですか。じゃあ、私が見てみましょうか。"}, {"spk": "ラジュ", "t": "いいですか？ 助かります。"}, {"spk": "新山", "t": "えーっと、この「店」っていうのは、なんか変ですね。こういうときは「店舗」と書くことが多いですよ。"}, {"spk": "ラジュ", "t": "そうですか。"}, {"spk": "新山", "t": "基本設計書では、どうなっていましたっけ。"}, {"spk": "ラジュ", "t": "あ、まだ確認していません。"}, {"spk": "新山", "t": "え、まだなんですか。じゃあ、まず基本設計書を確認した方がいいですね。"}, {"spk": "ラジュ", "t": "そうですね。うっかりしていました。"}, {"spk": "新山", "t": "確認して、まだ心配だったら声をかけてください。また見てあげますから。"}, {"spk": "ラジュ", "t": "ありがとうございます。よろしくお願いします。"}], "note": ""}, {"track": 18, "chapter": 2, "unit": 5, "unitJp": "詳細設計書を書く", "unitVi": "Viết tài liệu thiết kế chi tiết", "type": "聞き取り練習 (Luyện nghe)", "chars": "リー (Li) / 大沢 (Osawa)", "hasTranscript": true, "lines": [{"spk": "リー", "t": "大沢さん、ちょっとお聞きしたいことがあるんですが……。"}, {"spk": "大沢", "t": "はい、何でしょう。"}, {"spk": "リー", "t": "実は今、内部設計書を書いているんですが、日本語を見ていただけませんか。"}, {"spk": "大沢", "t": "ああ、いいですよ。国語辞典とかは見ました？"}, {"spk": "リー", "t": "はい、一応、見ながら書きました。"}, {"spk": "大沢", "t": "そうですか。どれどれ。えーっと、この「お客さま」っていうのはシステムの発注者のことじゃないですよね。"}, {"spk": "リー", "t": "あ、それは、このシステムで管理するお客さまです。"}, {"spk": "大沢", "t": "それじゃ、「顧客」っていうのが普通ですね。"}, {"spk": "リー", "t": "あ、そうですね。"}, {"spk": "大沢", "t": "外部設計書でもそうなっていると思いますよ。見ました？"}, {"spk": "リー", "t": "あ、まだです。うっかりしてました。"}, {"spk": "大沢", "t": "「顧客」で間違いないと思いますけど、念のため、確認しておいてください。"}, {"spk": "リー", "t": "わかりました。ありがとうございます。"}, {"spk": "大沢", "t": "いえいえ。ほかにもありそうだから、午後のミーティングの後で、また見てあげますよ。"}, {"spk": "リー", "t": "ありがとうございます。よろしくお願いします。"}], "note": ""}, {"track": 19, "chapter": 2, "unit": 6, "unitJp": "仕様変更", "unitVi": "Thay đổi yêu cầu (spec)", "type": "モデル会話 (Hội thoại mẫu)", "chars": "井出 (Ide) / ラジュ (Raju)", "hasTranscript": true, "lines": [{"spk": "井出", "t": "ラジュさん、ちょっといい？"}, {"spk": "ラジュ", "t": "はい。"}, {"spk": "井出", "t": "実は、また仕様が変更になりました。"}, {"spk": "ラジュ", "t": "え、またですか。どんな変更ですか。"}, {"spk": "井出", "t": "従業員マスターの主キーのデータ桁数を一つ増やすんだそうです。"}, {"spk": "ラジュ", "t": "つまり、9桁にするということですね。でも、それでは従業員マスターを参照するすべてのモジュールに影響が出ますね。"}, {"spk": "井出", "t": "そうですね。"}, {"spk": "ラジュ", "t": "単体テストだって、もうほとんど終わっていますし……。"}, {"s
