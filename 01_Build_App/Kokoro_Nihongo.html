  for(var c=0;c<13;c++){
    for(var r=0;r<7;r++){
      var d=new Date(startMonday); d.setDate(d.getDate()+c*7+r);
      var ds=d.toISOString().slice(0,10);
      if(ds>todayStr){
        cellsHtml+='<div class="heatmap-cell future"></div>';
      } else {
        var n=store.stats.history[ds]||0;
        cellsHtml+='<div class="heatmap-cell '+heatmapTier(n)+'" title="'+ds+': '+n+' lượt"></div>';
      }
    }
  }
  return '<div style="overflow-x:auto"><div class="heatmap-grid">'+cellsHtml+'</div></div>';
}
/* Mỗi từ chỉ đếm vào đúng 1 nhóm — thứ tự ưu tiên: Đã thuộc > Từ khó > Đang học > Chưa học (tổng luôn = VOCAB.length) */
function computeDistribution(){
  var daxthuoc=0, tukhoi=0, danghoc=0, chuahoc=0;
  VOCAB.forEach(function(v){
    var c=store.cards[v.id];
    if(!c){ chuahoc++; return; }
    if(c.box>=3 || c.mastered){ daxthuoc++; return; }
    if(c.seen>=5 && (c.correct/c.seen)<0.5){ tukhoi++; return; }
    danghoc++;
  });
  return {daxthuoc:daxthuoc, tukhoi:tukhoi, danghoc:danghoc, chuahoc:chuahoc};
}
function buildDistBarsHTML(dist){
  var total=VOCAB.length||1;
  var rows=[
    {label:'Đã thuộc', n:dist.daxthuoc, color:'var(--good)'},
    {label:'Đang học', n:dist.danghoc, color:'var(--brand)'},
    {label:'Từ khó', n:dist.tukhoi, color:'#ea580c'},
    {label:'Chưa học', n:dist.chuahoc, color:'var(--sub)'}
  ];
  return rows.map(function(r){
    var pct=Math.round(r.n/total*100);
    return '<div style="margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">'+
        '<span>'+r.label+'</span><span style="color:var(--sub)">'+r.n+' ('+pct+'%)</span>'+
      '</div>'+
      '<div class="bar"><i style="width:'+pct+'%;background:'+r.color+'"></i></div>'+
    '</div>';
  }).join('');
}
/* Số thẻ due mỗi ngày trong 7 ngày tới — thẻ quá hạn gộp hết vào cột Hôm nay */
function computeForecast(){
  var todayStr=today();
  var dayStrs=[];
  for(var k=0;k<7;k++){
    var d=new Date(); d.setDate(d.getDate()+k);
    dayStrs.push(d.toISOString().slice(0,10));
  }
  var counts=[0,0,0,0,0,0,0], overdue=0;
  Object.keys(store.cards).forEach(function(id){
    var c=store.cards[id];
    if(!c || !c.due) return;
    if(c.due<todayStr){ overdue++; counts[0]++; return; }
    var idx=dayStrs.indexOf(c.due);
    if(idx>=0) counts[idx]++;
  });
  return {counts:counts, overdue:overdue};
}
function statsScreen(){
  onBack=home;
  setHeader('Thống kê', 'Thống kê và lịch sử học', true);
  var totalDaysStudied=Object.keys(store.stats.history).length;
  var dist=computeDistribution();
  var fc=computeForecast();
  var maxCount=Math.max(1, fc.counts.reduce(function(a,b){return Math.max(a,b);},0));
  var dayLabels=['Hôm nay','+1','+2','+3','+4','+5','+6'];

  main.innerHTML=
    '<div class="stats-hero">'+
      '<div class="n">'+(store.stats.streak||0)+'</div>'+
      '<div class="l">ngày liên tiếp · tổng '+totalDaysStudied+' ngày có học</div>'+
    '</div>'+

    '<div class="sectitle">Lịch sử 12 tuần</div>'+
    buildHeatmapHTML()+
    '<div class="hint" style="margin-top:8px">Lịch sử bắt đầu ghi từ ngày cập nhật app, các ngày trước đó không có dữ liệu.</div>'+

    '<div class="sectitle" style="margin-top:18px">Phân bố từ theo trạng thái</div>'+
    buildDistBarsHTML(dist)+

    '<div class="sectitle" style="margin-top:18px">Dự báo tải ôn 7 ngày tới</div>'+
    '<div class="forecast-chart">'+
      fc.counts.map(function(n,idx){
        var h=Math.round(n/maxCount*90)+10;
        return '<div class="forecast-bar-wrap">'+
          '<div class="forecast-num">'+n+'</div>'+
          '<div class="forecast-bar'+(idx===0?' today':'')+'" style="height:'+h+'px"></div>'+
          '<div class="forecast-label">'+dayLabels[idx]+'</div>'+
        '</div>';
      }).join('')+
    '</div>'+
    (fc.overdue>0?'<div class="hint">Trong đó <b>'+fc.overdue+'</b> thẻ đã quá hạn</div>':'');
}

/* ═══════════════ IT業務編 — Unit/Track browsing + Player + Reading ═══════════════ */
function gyoumuUnits(){
  var units=[], seen={};
  GYOUMU.forEach(function(t){
    var key=t.chapter+'-'+t.unit;
    if(!seen[key]){
      seen[key]=true;
      units.push({
        chapter:t.chapter, unit:t.unit, unitJp:t.unitJp, unitVi:t.unitVi,
        tracks:GYOUMU.filter(function(x){return x.chapter===t.chapter && x.unit===t.unit;})
      });
    }
  });
  units.sort(function(a,b){ return a.chapter-b.chapter || a.unit-b.unit; });
  return units;
}

/* Điểm của 1 câu = điểm LẦN GHI ÂM GẦN NHẤT (không phải cao nhất) — cùng quy tắc シャドウイング (FR_013 redesign) */
function gyoumuReadQueue(t){ return t.lines.filter(function(l){return l.t && l.t.trim().length>0;}); }
function gyoumuLineScore(t, i){
  var rec=gyStore.read[t.track];
  var ls=rec && rec.lines && rec.lines[i];
  return ls? ls.score : null;
}
function gyoumuTrackStats(t){
  var queue=gyoumuReadQueue(t);
  var scores=[];
  queue.forEach(function(l,i){ var s=gyoumuLineScore(t,i); if(s!=null) scores.push(s); });
  var total=queue.length, done=scores.length;
  var avg=done? Math.round(scores.reduce(function(a,b){return a+b;},0)/done) : 0;
  return {done:done, total:total, avg:avg};
}
function gyoumuUnitListenedCount(u){
  var n=0;
  u.tracks.forEach(function(t){ if(gyStore.listened[t.track]) n++; });
  return n;
}

function gyoumuDashboard(){
  onBack=home;
  var units=gyoumuUnits();
  var listenedCount=Object.keys(gyStore.listened).length;
  setHeader('IT業務編','Hội thoại công việc IT · '+GYOUMU.length+' track',true);
  var html=
    '<div class="stats">'+
      '<div class="stat"><div class="n">'+units.length+'</div><div class="l">Unit</div></div>'+
      '<div class="stat"><div class="n">'+GYOUMU.length+'</div><div class="l">Track</div></div>'+
      '<div class="stat"><div class="n">'+listenedCount+'</div><div class="l">聴取済み</div></div>'+
    '</div>';
  var curChapter=null;
  units.forEach(function(u){
    if(u.chapter!==curChapter){
      if(curChapter!==null) html+='</div>';
      curChapter=u.chapter;
      html+='<div class="sectitle">第'+curChapter+'章</div><div class="topics">';
    }
    var ln=gyoumuUnitListenedCount(u);
    var tier = ln<=0? '' : (ln>=u.tracks.length? ' tint-done':' tint-partial');
    html+=
      '<div class="topic-card active'+tier+'" data-chapter="'+u.chapter+'" data-unit="'+u.unit+'">'+
        '<div class="unit-iconwrap">'+
          '<div class="tc-icon">📗</div>'+
          '<div class="unit-progress">'+ln+'/'+u.tracks.length+' 聴取済み</div>'+
        '</div>'+
        '<div class="tc-body">'+
          '<div class="tc-title">Unit '+u.unit+' · '+esc(u.unitJp)+'</div>'+
          '<div class="tc-sub">'+esc(u.unitVi)+' · '+u.tracks.length+' track</div>'+
        '</div>'+
      '</div>';
  });
  html+='</div>';
  main.innerHTML=html;
  main.querySelectorAll('[data-unit]').forEach(function(card){
    card.onclick=function(){ gyoumuUnitScreen(+card.dataset.chapter, +card.dataset.unit); };
  });
}

/* Dừng mọi nguồn audio IT業務編 đang phát (player nghe, audio đọc nguyên track, TTS còn sót)
   trước khi phát nguồn mới — chỉ 1 nguồn phát tại 1 thời điểm (FR_007) */
function stopAllGyoumuAudio(){ stopSpeech(); }
function gyoumuTrackAudioSrc(trackNum){
  var fname=(trackNum<10?'0':'')+trackNum+' Track '+trackNum+'.mp3';
  return encodeURI('audio/'+fname);
}
function gyoumuFmtTime(s){
  if(!isFinite(s)) return '0:00';
  var m=Math.floor(s/60), sec=Math.floor(s%60);
  return m+':'+(sec<10?'0':'')+sec;
}
/* t.type/t.chars trong GYOUMU_DATA là 1 chuỗi gộp "tiếng Nhật (chú thích tiếng Việt hoặc romaji tên riêng)"
   ngay từ cột Excel gốc — không tách riêng field JP/VI như unitJp/unitVi. Bỏ đúng phần tiếng Việt (nhận
   diện bằng dấu tiếng Việt), GIỮ LẠI romaji tên riêng không dấu (VD "(Taguchi)", "(Li)") vì đó là phiên âm
   đọc tên, không phải bản dịch — không phải "text tiếng Việt" cần đổi. */
var VI_DIACRITIC_RE=/[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;
function stripViGloss(s){
  if(!s) return s;
  s=s.replace(/\s*[（(]([^）)]*)[）)]/g, function(whole,inner){ return VI_DIACRITIC_RE.test(inner)?'':whole; });
  s=s.replace(/\s*-\s*([^-]+)$/, function(whole,tail){ return VI_DIACRITIC_RE.test(tail)?'':whole; });
  return s.replace(/\s{2,}/g,' ').trim();
}

/* Màn hình Unit — mỗi Track là 1 accordion, mở ra có đúng 2 tab con 🎧 Luyện nghe / 🎤 Luyện đọc lồng
   chung 1 chỗ (redesign theo mẫu シャドウイング/FR_013, thay cho bản FR_007 tách 2 khối rời nhau).
   Chỉ 1 track mở + 1 tab hiện + 1 nguồn audio phát tại 1 thời điểm — đổi track/đổi tab đều
   stopAllGyoumuAudio() trước khi vẽ lại. Track không có transcript (9, 21) vẫn nghe được, chỉ tab
   Luyện đọc bị khoá (disabled). */
function gyoumuUnitScreen(chapter,unit){
  var tracks=GYOUMU.filter(function(t){return t.chapter===chapter && t.unit===unit;});
  if(!tracks.length){ gyoumuDashboard(); return; }
  onBack=gyoumuDashboard;
  setHeader('Unit '+unit+' · '+esc(tracks[0].unitJp), esc(tracks[0].unitVi), true);

  var openTrack=null;      // track number đang mở (chỉ 1 tại 1 thời điểm)
  var openTab='listen';    // 'listen' | 'read'
  var readI=0, readSlow=false;

  function findTrack(trackNum){ return tracks.find(function(t){return t.track===trackNum;}); }

  function trackRowTier(t){
    var st=gyoumuTrackStats(t);
    if(st.total>0 && st.done>=st.total) return ' tint-done';
    if(st.done>0) return ' tint-partial';
    return '';
  }

  function trackListHTML(){
    var html='';
    tracks.forEach(function(t){
      var isOpen=openTrack===t.track;
      var ico=t.type.indexOf('聞き取り')===0?'🎧':'💬';
      var st=gyoumuTrackStats(t);
      var statTag = st.total>0 && st.done>0?
        ' <span style="font-weight:400;font-size:12.5px;color:'+scoreColorTier(st.avg)+'">('+st.done+'/'+st.total+' · '+st.avg+'点)</span>' : '';
      html+='<div class="topic-card active gy-track-row compact-row'+(isOpen?' open':'')+trackRowTier(t)+'" data-track="'+t.track+'">'+
          '<div class="tc-icon">'+ico+'</div>'+
          '<div class="tc-body">'+
            '<div class="tc-title">Track '+t.track+' · '+esc(stripViGloss(t.type))+statTag+'</div>'+
            '<div class="tc-sub">'+(t.chars?esc(stripViGloss(t.chars)):'')+(t.hasTranscript?'':' · ⚠ スクリプトなし')+'</div>'+
          '</div>'+
          (gyStore.listened[t.track]?'<span class="tc-badge">✅</span>':'')+
        '</div>';
      if(isOpen) html+='<div class="gy-track-body compact-body" id="gySegBody">'+trackBodyHTML(t)+'</div>';
    });
    return html;
  }

  function trackBodyHTML(t){
    var counterHtml='';
    if(openTab==='read'){
      var queue=gyoumuReadQueue(t);
      if(readI<queue.length) counterHtml='<span style="margin-left:auto;align-self:center;font-size:13px;color:var(--sub)">'+(readI+1)+' / '+queue.length+'</span>';
    }
    return '<div class="gy-read-tabs">'+
        '<button class="speed-btn gy-read-tab'+(openTab==='listen'?' on':'')+'" data-tab="listen">🎧 聞き取り</button>'+
        '<button class="speed-btn gy-read-tab'+(openTab==='read'?' on':'')+'" data-tab="read"'+(t.hasTranscript?'':' disabled')+'>🎤 音読練習</button>'+
        counterHtml+
      '</div>'+
      (openTab==='listen'? listenPaneHTML(t) : readPaneHTML(t));
  }

  function listenPaneHTML(t){
    var transcriptHtml = t.hasTranscript ?
      t.lines.map(function(l){ return '<div class="transcript-line">'+(l.spk?'<b>'+esc(l.spk)+'：</b>':'')+esc(l.t)+'</div>'; }).join('') : '';
    return '<div class="player-card">'+
        '<span class="tag">'+esc(stripViGloss(t.type))+'</span>'+
        (t.chars?'<div style="font-size:13px;color:var(--sub);margin-top:6px">'+esc(stripViGloss(t.chars))+'</div>':'')+
        '<div><button class="play-btn" id="gyPlayBtn">▶️</button></div>'+
        '<div class="progress-row">'+
          '<span class="ptime" id="gyCurT">0:00</span>'+
          '<input type="range" id="gySeek" min="0" max="1000" value="0">'+
          '<span class="ptime" id="gyDurT">0:00</span>'+
        '</div>'+
        '<div class="player-controls">'+
          '<button class="speed-btn" data-rate="0.75">0.75x</button>'+
          '<button class="speed-btn on" data-rate="1">1x</button>'+
          '<button class="speed-btn" data-rate="1.25">1.25x</button>'+
          '<button class="btn btn-ghost" id="gyReplayBtn" style="padding:8px 12px;font-size:13px;width:auto">↺ もう一度再生</button>'+
        '</div>'+
      '</div>'+
      (t.hasTranscript ?
        '<button class="btn btn-ghost" id="gyToggleTranscript" style="width:100%">👁 スクリプトを表示</button>'+
        '<div class="transcript-panel hidden" id="gyTranscriptPanel">'+transcriptHtml+'</div>'
        : '<div class="note">このTrackはスクリプトがありません（元のスキャンにページが欠けているため）。音声は通常通り聞けます。</div>')+
      '<audio id="gaEl2" preload="none"></audio>';
  }

  function readPaneHTML(t){
    if(!t.hasTranscript) return '<div class="note">このTrackには音読練習用のスクリプトがありません。</div>';
    var queue=gyoumuReadQueue(t);
    if(!queue.length) return '<div class="note">このTrackには練習できるセリフがありません。</div>';
    if(readI>=queue.length){
      var st=gyoumuTrackStats(t);
      return '<div class="done" style="padding:10px 0">'+
          '<div class="big">📖</div>'+
          '<h3 style="margin:8px 0 4px">終了！</h3>'+
          '<p style="color:var(--sub);font-size:13.5px">平均点：<b style="color:'+scoreColorTier(st.avg)+'">'+st.avg+'</b>/100（'+st.done+'/'+st.total+'）</p>'+
          '<button class="btn btn-ghost" id="gyReadAgain" style="margin-top:10px">もう一度練習</button>'+
        '</div>';
    }
    var l=queue[readI];
    var lineScore=gyoumuLineScore(t, readI);
    var micSupport=hasSR() && micPermission!=='denied' && micPermission!=='unsupported';
    return '<div class="sent-card">'+
        '<div style="display:flex;justify-content:space-between;align-items:center">'+
          (l.spk?'<div class="sent-word">🗣 '+esc(l.spk)+'</div>':'<span></span>')+
          '<span class="tag" id="gyLineScoreTag" style="'+(lineScore!=null?'':'display:none;')+'color:'+(lineScore!=null?scoreColorTier(lineScore):'inherit')+'">'+(lineScore!=null?lineScore+'点':'')+'</span>'+
        '</div>'+
        '<div class="sent-jp">'+esc(l.t)+'</div>'+
        '<div class="sent-controls">'+
          '<button class="speaker" id="gySpk" style="margin:0">🔊</button>'+
          '<button class="speed-btn '+(readSlow?'on':'')+'" id="gySlowBtn">🐢 ゆっくり</button>'+
          '<button class="btn btn-ghost" id="gyRealAudio" style="width:auto;padding:8px 12px;font-size:12.5px">🎧 会話全体を聞く</button>'+
        '</div>'+
      '</div>'+
      (micSupport?
        '<div style="text-align:center;margin-top:10px">'+
          '<button class="btn btn-primary" id="gyMicBtn" style="display:inline-flex;align-items:center;gap:8px;width:auto;padding:12px 24px;font-size:15px;border-radius:99px">'+
            '<span style="font-size:20px">🎤</span> 発音練習'+
          '</button>'+
          '<div class="qhint" id="gyMhint">タップして録音・採点</div>'+
          '<div class="heard hidden" id="gyHeard"></div>'+
          '<div class="fb" id="gyFb"></div>'+
        '</div>'
      :'')+
      '<div style="margin-top:14px">'+
        '<button class="btn btn-primary" id="gyReadNext">次へ →</button>'+
      '</div>';
  }

  function renderShell(){
    main.innerHTML='<div id="gyListWrap"></div>';
    renderList();
  }
  function renderList(){ $('#gyListWrap').innerHTML=trackListHTML(); bindList(); }

  function markTrackListened(t){
    var was=!!gyStore.listened[t.track];
    gyStore.listened[t.track]=true; saveGyoumu();
    /* Tính vào streak/lịch sử (không tính vào store.stats.studied — đó là lượt ôn thẻ SRS riêng) — chỉ lần đầu nghe xong track này */
    if(!was){ bumpStreak(); save(); }
  }

  function bindList(){
    main.querySelectorAll('#gyListWrap .gy-track-row').forEach(function(row){
      row.onclick=function(){
        var tid=+row.dataset.track;
        stopAllGyoumuAudio();
        if(openTrack===tid){ openTrack=null; }
        else { openTrack=tid; openTab='listen'; readI=0; }
        renderList();
      };
    });
    if(openTrack==null) return;
    var t=findTrack(openTrack);
    if(!t){ openTrack=null; return; }

    main.querySelectorAll('#gySegBody .gy-read-tab').forEach(function(b){
      b.onclick=function(){
        if(b.disabled) return;
        var tab=b.dataset.tab;
        if(tab===openTab) return;
        stopAllGyoumuAudio();
        openTab=tab; readI=0;
        renderList();
      };
    });

    if(openTab==='listen') bindListenPane(t);
    else bindReadPane(t);
  }

  function bindListenPane(t){
    var audioEl=$('#gaEl2'), playBtn=$('#gyPlayBtn'), seek=$('#gySeek'), curT=$('#gyCurT'), durT=$('#gyDurT');
    audioEl.src=gyoumuTrackAudioSrc(t.track);
    var seeking=false;
    audioEl.addEventListener('loadedmetadata',function(){ durT.textContent=gyoumuFmtTime(audioEl.duration); });
    audioEl.addEventListener('timeupdate',function(){
      if(seeking) return;
      curT.textContent=gyoumuFmtTime(audioEl.currentTime);
      if(audioEl.duration) seek.value=Math.round(audioEl.currentTime/audioEl.duration*1000);
    });
    audioEl.addEventListener('ended',function(){
      playBtn.textContent='▶️';
      markTrackListened(t);
    });
    audioEl.addEventListener('error',function(){
      $('#gySegBody .player-card').insertAdjacentHTML('beforeend',
        '<div class="note">音声ファイルを読み込めませんでした。audio/ フォルダを確認してください。</div>');
    });
    playBtn.onclick=function(){
      if(audioEl.paused){ stopAllGyoumuAudio(); currentGyoumuAudio=audioEl; audioEl.play(); playBtn.textContent='⏸'; }
      else { audioEl.pause(); playBtn.textContent='▶️'; }
    };
    seek.addEventListener('input',function(){ seeking=true; curT.textContent=gyoumuFmtTime(seek.value/1000*(audioEl.duration||0)); });
    seek.addEventListener('change',function(){ if(audioEl.duration) audioEl.currentTime=seek.value/1000*audioEl.duration; seeking=false; });
    $('#gyReplayBtn').onclick=function(){ stopAllGyoumuAudio(); currentGyoumuAudio=audioEl; audioEl.currentTime=0; audioEl.play(); playBtn.textContent='⏸'; };
    $('#gySegBody').querySelectorAll('.speed-btn[data-rate]').forEach(function(b){
      b.onclick=function(){
        $('#gySegBody').querySelectorAll('.speed-btn[data-rate]').forEach(function(x){x.classList.remove('on');});
        b.classList.add('on');
        audioEl.playbackRate=parseFloat(b.dataset.rate);
      };
    });
    if(t.hasTranscript){
      $('#gyToggleTranscript').onclick=function(){
        var panel=$('#gyTranscriptPanel'), show=panel.classList.contains('hidden');
        panel.classList.toggle('hidden',!show);
        $('#gyToggleTranscript').textContent = show? '👁 スクリプトを隠す' : '👁 スクリプトを表示';
      };
    }
  }

  function bindReadPane(t){
    if(!t.hasTranscript) return;
    var queue=gyoumuReadQueue(t);
    if(!queue.length) return;
    if(readI>=queue.length){
      var again=$('#gyReadAgain');
      if(again) again.onclick=function(){ readI=0; renderList(); };
      return;
    }
    var l=queue[readI];
    $('#gySpk').onclick=function(){ stopAllGyoumuAudio(); speak(l.t, readSlow?0.65:0.9); };
    $('#gySlowBtn').onclick=function(){
      readSlow=!readSlow;
      $('#gySlowBtn').classList.toggle('on',readSlow);
      stopAllGyoumuAudio(); speak(l.t, readSlow?0.65:0.9);
    };
    $('#gyRealAudio').onclick=function(){
      stopAllGyoumuAudio();
      var a=new Audio(gyoumuTrackAudioSrc(t.track));
      currentGyoumuAudio=a; a.play();
    };
    $('#gyReadNext').onclick=function(){ stopAllGyoumuAudio(); readI++; renderList(); };
    var micSupport=hasSR() && micPermission!=='denied' && micPermission!=='unsupported';
    if(micSupport && $('#gyMicBtn')){
      var micBtn=$('#gyMicBtn'), hint=$('#gyMhint'), heard=$('#gyHeard'), fb=$('#gyFb');
      var listening=false;
      micBtn.onclick=async function(){
        if(listening){ cancelRecognition(); return; }
        try{
          var ok=await ensureMicReady();
          if(!ok){ hint.textContent='マイクが拒否されました。'; return; }
          listening=true;
          micBtn.style.background='var(--bad)';
          micBtn.innerHTML='<span style="font-size:20px">⏹</span> 録音中...';
          hint.textContent='この文を声に出して読んでください';
          var alts=await recognizeOnce('ja-JP');
          var best=Math.max.apply(null,alts.map(function(a){return similarity(a,l.t);}));
          heard.classList.remove('hidden'); heard.textContent='認識結果：'+alts[0];
          playScoreSound(best);
          fb.innerHTML = best>90?'<span class="ok">🌟 素晴らしい！'+best+'点</span>'
                       : best>=60?'<span class="ok">👍 まずまず：'+best+'点</span>'
                       : '<span class="no">💪 '+best+'点 — もう一度</span>';
          /* Lưu điểm LẦN GHI ÂM GẦN NHẤT cho đúng câu này (không phải điểm cao nhất) — cùng quy tắc シャドウイング */
          var rec=gyStore.read[t.track]||{lines:{}};
          if(!rec.lines) rec.lines={};
          var prevLine=rec.lines[readI]||{attempts:0};
          rec.lines[readI]={score:best, attempts:prevLine.attempts+1};
          gyStore.read[t.track]=rec;
          saveGyoumu();
          bumpStreak(); save();
          var tag=$('#gyLineScoreTag');
          if(tag){ tag.style.display=''; tag.style.color=scoreColorTier(best); tag.textContent=best+'点'; }
        }catch(err){
          hint.textContent='エラー：'+err;
          if(err==='not-allowed') micPermission='denied';
        }finally{
          micBtn.style.background=''; micBtn.innerHTML='<span style="font-size:20px">🎤</span> 発音練習'; listening=false;
        }
      };
    }
  }

  renderShell();
}

/* ═══════════════ シャドウイング — Shadowing 中〜上級編 (FR_013) ═══════════════ */
/* Dừng mọi nguồn audio Shadowing đang phát (player nghe theo đoạn, audio nghe thật của đoạn, TTS còn sót)
   trước khi phát nguồn mới — chỉ 1 nguồn phát tại 1 thời điểm, cùng nguyên tắc FR_007. */
function stopAllShadowAudio(){ stopSpeech(); }
function shadowTrackAudioSrc(t){ return encodeURI('audio/shadowing/'+t.audio); }

function shadowSegsOfSection(sec){
  var out=[];
  sec.tracks.forEach(function(t){
    t.segments.forEach(function(seg){ out.push({track:t, seg:seg}); });
  });
  return out;
}
function shadowUnitStats(u){
  var trackCount=0, segCount=0;
  u.sections.forEach(function(s){
    trackCount+=s.tracks.length;
    s.tracks.forEach(function(t){ segCount+=t.segments.length; });
  });
  return {trackCount:trackCount, segCount:segCount};
}
function shadowUnitListenedCount(u){
  var n=0;
  u.sections.forEach(function(s){
    s.tracks.forEach(function(t){
      t.segments.forEach(function(seg){ if(sdStore.listened[seg.id]) n++; });
    });
  });
  return n;
}
/* Dòng ghi chú tình huống trong transcript (【…】/［…］/〈…〉, spk rỗng) — chỉ hiển thị, không luyện mic (mục 9.2) */
function shadowIsNoteLine(l){ return !l.spk && /^[【［〈]/.test(l.jp); }
function shadowSpeakQueue(seg){ return seg.lines.filter(function(l){ return !shadowIsNoteLine(l); }); }
/* Điểm của 1 lượt thoại = điểm LẦN GHI ÂM GẦN NHẤT (không phải điểm cao nhất) — theo đúng yêu cầu PM */
function shadowLineScore(seg, i){
  var rec=sdStore.spoken[seg.id];
  var ls=rec && rec.lines && rec.lines[i];
  return ls? ls.score : null;
}
/* Thống kê 1 đoạn: bao nhiêu lượt đã ghi âm / tổng lượt, điểm trung bình = TB của điểm-gần-nhất từng lượt đã ghi */
function shadowSegStats(seg){
  var queue=shadowSpeakQueue(seg);
  var scores=[];
  queue.forEach(function(l,i){ var s=shadowLineScore(seg,i); if(s!=null) scores.push(s); });
  var total=queue.length, done=scores.length;
  var avg=done? Math.round(scores.reduce(function(a,b){return a+b;},0)/done) : 0;
  return {done:done, total:total, avg:avg};
}
/* Ngưỡng màu điểm riêng cho Shadowing (khác ngưỡng chấm mic chung ≥90/≥51 của app — theo đúng số PM yêu cầu) */
function scoreColorTier(score){
  if(score>90) return 'var(--good)';
  if(score>=60) return 'var(--warn)';
  return 'var(--bad)';
}

function shadowDashboard(){
  onBack=home;
  var listened=Object.keys(sdStore.listened).length;
  var trackTotal=0;
  SHADOW.forEach(function(u){ u.sections.forEach(function(s){ trackTotal+=s.tracks.length; }); });
  setHeader('シャドウイング', 'Shadowing 中〜上級編 · '+SHADOW.length+' Unit · '+trackTotal+' track', true);
  var html='<div class="stats">'+
      '<div class="stat"><div class="n">'+SHADOW.length+'</div><div class="l">Unit</div></div>'+
      '<div class="stat"><div class="n">'+SHADOW_SEGCOUNT+'</div><div class="l">段落</div></div>'+
      '<div class="stat"><div class="n">'+listened+'</div><div class="l">聴取済み</div></div>'+
    '</div><div class="topics">';
  SHADOW.forEach(function(u){
    var st=shadowUnitStats(u), ln=shadowUnitListenedCount(u);
    var tier = ln<=0? '' : (ln>=st.segCount? ' tint-done':' tint-partial');
    html+=
      '<div class="topic-card active'+tier+'" data-unit="'+u.unit+'">'+
        '<div class="unit-iconwrap">'+
          '<div class="tc-icon">🗣️</div>'+
          '<div class="unit-progress">'+ln+'/'+st.segCount+' 聴取済み</div>'+
        '</div>'+
        '<div class="tc-body">'+
          '<div class="tc-title">Unit '+u.unit+' · '+esc(u.titleJp)+'</div>'+
          '<div class="tc-sub">'+esc(u.titleVi)+' · '+st.trackCount+' track · '+st.segCount+'段落</div>'+
        '</div>'+
      '</div>';
  });
  html+='</div>';
  main.innerHTML=html;
  main.querySelectorAll('[data-unit]').forEach(function(card){
    card.onclick=function(){ shadowUnitScreen(+card.dataset.unit); };
  });
}

/* Màn hình Unit — mỗi Đoạn là 1 accordion, mở ra có đúng 2 tab con 🎧 nghe / 🎤 luyện nói lồng chung
   1 chỗ (đổi theo phản hồi PM sau khi test bản đầu tách 2 khối rời nhau, bất tiện trên điện thoại).
   Chỉ 1 đoạn mở + 1 tab hiện + 1 nguồn audio phát tại 1 thời điểm — đổi Section/đổi tab/đổi đoạn đều
   dừng audio trước (stopAllShadowAudio) rồi mới vẽ lại. UI trong màn này dùng tiếng Nhật (label/nút),
   khác quy ước chung "UI tiếng Việt" của app — theo đúng yêu cầu PM cho riêng module luyện nói này. */
function shadowUnitScreen(unit){
  var u=SHADOW.find(function(x){return x.unit===unit;});
  if(!u){ shadowDashboard(); return; }
  onBack=shadowDashboard;
  setHeader('Unit '+u.unit+' · '+esc(u.titleJp), esc(u.titleVi), true);

  var curSection=u.sections[0];
  var openSeg=null;        // id đoạn đang mở (chỉ 1 tại 1 thời điểm)
  var openTab='listen';    // 'listen' | 'speak' — tab đang xem trong đoạn đang mở
  var loopOn=false;
  var spI=0, spSlow=false; // vị trí lượt thoại đang luyện trong tab Luyện nói của đoạn đang mở

  function findSeg(segId){
    var found=null;
    shadowSegsOfSection(curSection).forEach(function(r){ if(r.seg.id===segId) found=r; });
    return found;
  }

  function sectionTabsHTML(){
    if(u.sections.length<2) return '';
    return '<div class="gy-read-tabs">'+
      u.sections.map(function(s){
        return '<button class="speed-btn gy-read-tab'+(curSection===s?' on':'')+'" data-section="'+s.section+'">'+
          'Section '+s.section+' ('+esc(s.level)+')'+
        '</button>';
      }).join('')+
    '</div>';
  }

  function segRowTier(seg){
    var st=shadowSegStats(seg);
    if(st.total>0 && st.done>=st.total) return ' tint-done';
    if(st.done>0) return ' tint-partial';
    return '';
  }

  function segListHTML(){
    var rows=shadowSegsOfSection(curSection);
    if(!rows.length) return '<div class="note">このセクションには段落がありません。</div>';
    var html='';
    rows.forEach(function(r){
      var seg=r.seg, t=r.track, isOpen=openSeg===seg.id;
      var st=shadowSegStats(seg);
      var statTag = st.done>0?
        ' <span style="font-weight:400;font-size:12.5px;color:'+scoreColorTier(st.avg)+'">('+st.done+'/'+st.total+' · '+st.avg+'点)</span>' : '';
      html+='<div class="topic-card active gy-track-row compact-row'+(isOpen?' open':'')+segRowTier(seg)+'" data-seg="'+seg.id+'">'+
          '<div class="tc-icon">🎧</div>'+
          '<div class="tc-body">'+
            '<div class="tc-title">段落 '+seg.no+(seg.title?' · '+esc(seg.title):'')+statTag+'</div>'+
            '<div class="tc-sub">'+gyoumuFmtTime(seg.dur)+' · Track '+t.track+'</div>'+
          '</div>'+
          (sdStore.listened[seg.id]?'<span class="tc-badge">✅</span>':'')+
        '</div>';
      if(isOpen) html+='<div class="gy-track-body compact-body" id="sdSegBody">'+segBodyHTML(t,seg)+'</div>';
    });
    return html;
  }

  function segBodyHTML(t, seg){
    var counterHtml='';
    if(openTab==='speak'){
      var queue=shadowSpeakQueue(seg);
      if(spI<queue.length) counterHtml='<span style="margin-left:auto;align-self:center;font-size:13px;color:var(--sub)">'+(spI+1)+' / '+queue.length+'</span>';
    }
    return '<div class="gy-read-tabs">'+
        '<button class="speed-btn gy-read-tab'+(openTab==='listen'?' on':'')+'" data-tab="listen">🎧 聞き取り</button>'+
        '<button class="speed-btn gy-read-tab'+(openTab==='speak'?' on':'')+'" data-tab="speak">🎤 シャドウイング</button>'+
        counterHtml+
      '</div>'+
      (openTab==='listen'? listenPaneHTML(t,seg) : speakPaneHTML(t,seg));
  }

  function listenPaneHTML(t, seg){
    var hasVi=seg.lines.some(function(l){return l.vi;});
    var scriptHtml=seg.lines.map(function(l){
      var note=shadowIsNoteLine(l);
      return '<div class="transcript-line">'+
          (note? '<i>'+esc(l.jp)+'</i>' : ((l.spk?'<b>'+esc(l.spk)+'：</b>':'')+esc(l.jp)))+
          (l.vi?'<div class="sd-vi hidden" style="font-size:12.5px;color:var(--sub);margin-top:2px">'+esc(l.vi)+'</div>':'')+
        '</div>';
    }).join('');
    return '<div class="player-card">'+
        '<span class="tag">Track '+t.track+' · '+esc(t.level)+'</span>'+
        '<div><button class="play-btn" id="sdPlayBtn">▶️</button></div>'+
        '<div class="progress-row">'+
          '<span class="ptime" id="sdCurT">0:00</span>'+
          '<input type="range" id="sdSeek" min="0" max="1000" value="0">'+
          '<span class="ptime" id="sdDurT">'+gyoumuFmtTime(seg.dur)+'</span>'+
        '</div>'+
        '<div class="player-controls">'+
          '<button class="speed-btn" id="sdLoopBtn">🔁 リピート再生</button>'+
        '</div>'+
      '</div>'+
      '<button class="btn btn-ghost" id="sdToggleScript" style="width:100%">👁 スクリプトを表示</button>'+
      '<div class="transcript-panel hidden" id="sdScriptPanel">'+
        (hasVi?'<button class="btn btn-ghost" id="sdToggleVi" style="width:100%;margin-bottom:8px">🇻🇳 訳を表示</button>':'')+
        scriptHtml+
      '</div>'+
      '<audio id="sdListenEl" preload="none"></audio>';
  }

  function speakPaneHTML(t, seg){
    var queue=shadowSpeakQueue(seg);
    if(!queue.length) return '<div class="note">この段落には練習できるセリフがありません。</div>';
    if(spI>=queue.length){
      var st=shadowSegStats(seg);
      return '<div class="done" style="padding:10px 0">'+
          '<div class="big">🎤</div>'+
          '<h3 style="margin:8px 0 4px">終了！</h3>'+
          '<p style="color:var(--sub);font-size:13.5px">平均点：<b style="color:'+scoreColorTier(st.avg)+'">'+st.avg+'</b>/100（'+st.done+'/'+st.total+'）</p>'+
          '<button class="btn btn-ghost" id="sdSpeakAgain" style="margin-top:10px">もう一度練習</button>'+
        '</div>';
    }
    var l=queue[spI];
    var lineScore=shadowLineScore(seg, spI);
    var micSupport=hasSR() && micPermission!=='denied' && micPermission!=='unsupported';
    var progHtml = queue.length>4?
      '<div class="bar" style="margin-bottom:6px"><i style="width:'+Math.round(spI/queue.length*100)+'%;background:var(--brand)"></i></div>'
      : '';
    return progHtml+
      '<div class="sent-card">'+
        (seg.title?'<span class="tag">'+esc(seg.title)+'</span>':'')+
        '<div style="display:flex;justify-content:space-between;align-items:center;'+(seg.title?'margin-top:8px':'')+'">'+
          (l.spk?'<div class="sent-word">🗣 '+esc(l.spk)+'</div>':'<span></span>')+
          '<span class="tag" id="sdLineScoreTag" style="'+(lineScore!=null?'':'display:none;')+'color:'+(lineScore!=null?scoreColorTier(lineScore):'inherit')+'">'+(lineScore!=null?lineScore+'点':'')+'</span>'+
        '</div>'+
        '<div class="sent-jp">'+esc(l.jp)+'</div>'+
        (l.vi?'<div class="hint hidden" id="sdLineVi" style="margin-top:6px">'+esc(l.vi)+'</div>':'')+
        (l.vi?'<button class="btn btn-ghost" id="sdToggleLineVi" style="width:auto;padding:6px 10px;font-size:12px;margin-top:6px">🇻🇳 訳を表示</button>':'')+
        '<div class="sent-controls">'+
          '<button class="speaker" id="sdSpk" style="margin:0">🔊</button>'+
          '<button class="speed-btn '+(spSlow?'on':'')+'" id="sdSlowBtn">🐢 ゆっくり</button>'+
          '<button class="btn btn-ghost" id="sdRealAudio" style="width:auto;padding:8px 12px;font-size:12.5px">🎧 実際の音声を聞く</button>'+
        '</div>'+
      '</div>'+
      (micSupport?
        '<div style="text-align:center;margin-top:10px">'+
          '<button class="btn btn-primary" id="sdMicBtn" style="display:inline-flex;align-items:center;gap:8px;width:auto;padding:12px 24px;font-size:15px;border-radius:99px">'+
            '<span style="font-size:20px">🎤</span> 発音練習'+
          '</button>'+
          '<div class="qhint" id="sdMhint">タップして録音・採点</div>'+
          '<div class="heard hidden" id="sdHeard"></div>'+
          '<div class="fb" id="sdFb"></div>'+
        '</div>'
      :'')+
      '<div style="margin-top:14px">'+
        '<button class="btn btn-primary" id="sdSpeakNext">次へ →</button>'+
      '</div>';
  }

  function renderShell(){
    main.innerHTML='<div id="sdTabWrap"></div><div id="sdListWrap"></div>';
    renderSectionTabs();
    renderList();
  }
  function renderSectionTabs(){
    $('#sdTabWrap').innerHTML=sectionTabsHTML();
    main.querySelectorAll('#sdTabWrap [data-section]').forEach(function(b){
      b.onclick=function(){
        var sec=u.sections.find(function(s){return String(s.section)===b.dataset.section;});
        if(!sec || sec===curSection) return;
        stopAllShadowAudio();
        curSection=sec; openSeg=null; openTab='listen'; loopOn=false; spI=0;
        renderSectionTabs(); renderList();
      };
    });
  }
  function renderList(){ $('#sdListWrap').innerHTML=segListHTML(); bindList(); }

  function markSegListened(seg){
    var was=!!sdStore.listened[seg.id];
    sdStore.listened[seg.id]=Date.now();
    saveShadow();
    if(!was){ bumpStreak(); save(); }
  }

  function bindList(){
    main.querySelectorAll('#sdListWrap .gy-track-row').forEach(function(row){
      row.onclick=function(){
        var sid=row.dataset.seg;
        stopAllShadowAudio();
        if(openSeg===sid){ openSeg=null; }
        else { openSeg=sid; openTab='listen'; loopOn=false; spI=0; }
        renderList();
      };
    });
    if(openSeg==null) return;
    var found=findSeg(openSeg);
    if(!found){ openSeg=null; return; }
    var t=found.track, seg=found.seg;

    main.querySelectorAll('#sdSegBody .gy-read-tab').forEach(function(b){
      b.onclick=function(){
        var tab=b.dataset.tab;
        if(tab===openTab) return;
        stopAllShadowAudio();
        openTab=tab; spI=0;
        renderList();
      };
    });

    if(openTab==='listen') bindListenPane(t,seg);
    else bindSpeakPane(t,seg);
  }

  function bindListenPane(t, seg){
    var audioEl=$('#sdListenEl'), playBtn=$('#sdPlayBtn'), seek=$('#sdSeek'), curT=$('#sdCurT'), durT=$('#sdDurT'), loopBtn=$('#sdLoopBtn');
    audioEl.src=shadowTrackAudioSrc(t);
    var seeking=false;

    function seekToStart(){
      if(audioEl.readyState>=1){ audioEl.currentTime=seg.start; }
      else { audioEl.addEventListener('loadedmetadata', function once(){ audioEl.currentTime=seg.start; audioEl.removeEventListener('loadedmetadata',once); }); }
    }
    var doneOnce=false;
    function finishSeg(){
      if(doneOnce) return; doneOnce=true;
      playBtn.textContent='▶️';
      markSegListened(seg);
    }
    audioEl.addEventListener('loadedmetadata',function(){ durT.textContent=gyoumuFmtTime(seg.dur); });
    audioEl.addEventListener('timeupdate',function(){
      if(seeking) return;
      var rel=Math.max(0, Math.min(seg.dur, audioEl.currentTime-seg.start));
      curT.textContent=gyoumuFmtTime(rel);
      if(seg.dur) seek.value=Math.round(rel/seg.dur*1000);
      if(audioEl.currentTime>=seg.end){
        if(loopOn){ doneOnce=false; audioEl.currentTime=seg.start; }
        else { audioEl.pause(); finishSeg(); }
      }
    });
    /* Đoạn cuối track: seg.end===dur, sự kiện 'ended' có thể bắn trước khi timeupdate kịp xử lý (mục 10 E4) */
    audioEl.addEventListener('ended',finishSeg);
    audioEl.addEventListener('error',function(){
      $('#sdSegBody .player-card').insertAdjacentHTML('beforeend',
        '<div class="note">音声ファイルを読み込めませんでした。audio/shadowing/ フォルダを確認してください。</div>');
    });
    playBtn.onclick=function(){
      if(audioEl.paused){
        stopAllShadowAudio(); currentShadowAudio=audioEl;
        if(audioEl.currentTime<seg.start || audioEl.currentTime>=seg.end){ doneOnce=false; seekToStart(); }
        audioEl.play(); playBtn.textContent='⏸';
      } else { audioEl.pause(); playBtn.textContent='▶️'; }
    };
    seek.addEventListener('input',function(){ seeking=true; curT.textContent=gyoumuFmtTime(seek.value/1000*seg.dur); });
    seek.addEventListener('change',function(){ audioEl.currentTime=seg.start+seek.value/1000*seg.dur; doneOnce=false; seeking=false; });
    loopBtn.onclick=function(){ loopOn=!loopOn; loopBtn.classList.toggle('on',loopOn); };

    $('#sdToggleScript').onclick=function(){
      var panel=$('#sdScriptPanel'), show=panel.classList.contains('hidden');
      panel.classList.toggle('hidden',!show);
      $('#sdToggleScript').textContent = show? '👁 スクリプトを隠す':'👁 スクリプトを表示';
    };
    var viBtn=$('#sdToggleVi');
    if(viBtn){
      viBtn.onclick=function(){
        var vis=main.querySelectorAll('#sdScriptPanel .sd-vi');
        var show=vis.length>0 && vis[0].classList.contains('hidden');
        vis.forEach(function(v){ v.classList.toggle('hidden',!show); });
        viBtn.textContent = show? '🇻🇳 訳を隠す':'🇻🇳 訳を表示';
      };
    }
  }

  function bindSpeakPane(t, seg){
    var queue=shadowSpeakQueue(seg);
    if(!queue.length) return;
    if(spI>=queue.length){
      var again=$('#sdSpeakAgain');
      if(again) again.onclick=function(){ spI=0; renderList(); };
      return;
    }
    var l=queue[spI];
    var viBtn=$('#sdToggleLineVi');
    if(viBtn){
      viBtn.onclick=function(){
        var el=$('#sdLineVi'), show=el.classList.contains('hidden');
        el.classList.toggle('hidden',!show);
        viBtn.textContent = show? '🇻🇳 訳を隠す':'🇻🇳 訳を表示';
      };
    }
    $('#sdSpk').onclick=function(){ stopAllShadowAudio(); speak(l.jp, spSlow?0.65:0.9); };
    $('#sdSlowBtn').onclick=function(){
      spSlow=!spSlow;
      $('#sdSlowBtn').classList.toggle('on',spSlow);
      stopAllShadowAudio(); speak(l.jp, spSlow?0.65:0.9);
    };
    $('#sdRealAudio').onclick=function(){
      stopAllShadowAudio();
      var a=new Audio(shadowTrackAudioSrc(t));
      currentShadowAudio=a;
      var onReady=function(){ a.currentTime=seg.start; a.play(); };
      if(a.readyState>=1) onReady(); else a.addEventListener('loadedmetadata', onReady, {once:true});
      a.addEventListener('timeupdate',function(){ if(a.currentTime>=seg.end) a.pause(); });
    };
    $('#sdSpeakNext').onclick=function(){ stopAllShadowAudio(); spI++; renderList(); };
    var micSupport=hasSR() && micPermission!=='denied' && micPermission!=='unsupported';
    if(micSupport && $('#sdMicBtn')){
      var micBtn=$('#sdMicBtn'), hint=$('#sdMhint'), heard=$('#sdHeard'), fb=$('#sdFb');
      var listening=false;
      micBtn.onclick=async function(){
        if(listening){ cancelRecognition(); return; }
        try{
          var ok=await ensureMicReady();
          if(!ok){ hint.textContent='マイクが拒否されました。'; return; }
          listening=true;
          micBtn.style.background='var(--bad)';
          micBtn.innerHTML='<span style="font-size:20px">⏹</span> 録音中...';
          hint.textContent='この文を声に出して読んでください';
          var alts=await recognizeOnce('ja-JP');
          var best=Math.max.apply(null,alts.map(function(a){return similarity(a,l.jp);}));
          heard.classList.remove('hidden'); heard.textContent='認識結果：'+alts[0];
          playScoreSound(best);
          fb.innerHTML = best>90?'<span class="ok">🌟 素晴らしい！'+best+'点</span>'
                       : best>=60?'<span class="ok">👍 まずまず：'+best+'点</span>'
                       : '<span class="no">💪 '+best+'点 — もう一度</span>';
          /* Lưu điểm LẦN GHI ÂM GẦN NHẤT cho đúng lượt thoại này (không phải điểm cao nhất) */
          var rec=sdStore.spoken[seg.id]||{lines:{}};
          if(!rec.lines) rec.lines={};
          var prevLine=rec.lines[spI]||{attempts:0};
          rec.lines[spI]={score:best, attempts:prevLine.attempts+1};
          sdStore.spoken[seg.id]=rec;
          saveShadow();
          bumpStreak(); save();
          /* Cập nhật ngay badge điểm cạnh câu, không rebuild cả pane để không mất thông báo vừa chấm */
          var tag=$('#sdLineScoreTag');
          if(tag){ tag.style.display=''; tag.style.color=scoreColorTier(best); tag.textContent=best+'点'; }
        }catch(err){
          hint.textContent='エラー：'+err;
          if(err==='not-allowed') micPermission='denied';
        }finally{
          micBtn.style.background=''; micBtn.innerHTML='<span style="font-size:20px">🎤</span> 発音練習'; listening=false;
        }
      };
    }
  }

  renderShell();
}

/* ═══════════════ IT専門 DASHBOARD ═══════════════ */
/* FR_006: Bộ nhỏ nhất (index 0-based) chưa hoàn thành đủ 4 chế độ Flashcard/Quiz/Luyện nghe/Luyện nói.
   Hoàn thành hết thì trả về Bộ cuối cùng để tiện ôn tập. */
function autoFocusDeckIndex(decks){
  for(var i=0;i<decks.length;i++){
    var done=deckDoneModes(curCat,i);
    if(!(done.flash && done.quiz && done.cloze && done.listen && done.speak && done.reflex)) return i;
  }
  return decks.length-1;
}
/* keepDeck=true: giữ nguyên curDeck/deckPage hiện tại (dùng khi tự re-render do người dùng
   chọn Bộ khác/lật trang trong chính màn hình này) — mặc định (không truyền hoặc falsy) luôn
   tính lại auto-focus, áp dụng cho mọi lượt "vào IT専門" từ Home hoặc quay lại sau khi học xong. */
function homeDashboard(keepDeck){
  onBack=home;
  const catPool=pool();
  const decks=splitDecksStrict(catPool);
  if(!keepDeck && decks.length){
    var focusIdx=autoFocusDeckIndex(decks);
    curDeck=String(focusIdx);
    deckPage=Math.floor(focusIdx/DECK_GRID_PAGE_SIZE);
  }
  setHeader('IT専門', 'Từ vựng IT chuyên ngành · '+VOCAB.length+' từ', true);
  const list=deckPool();
  const due=dueCount(list);
  var deckOffset=0;
  const deckItems=decks.map(function(d,i){
    var startNum=deckOffset+1, endNum=deckOffset+d.length;
    deckOffset+=d.length;
    var done=deckDoneModes(curCat,i);
    return {
      key:String(i),
      label:'Bộ '+(i+1)+' ('+startNum+'-'+endNum+')',
      selected: curDeck===String(i),
      icons:[
        {icon:'🗂️',done:!!done.flash},
        {icon:'✍️',done:!!done.quiz},
        {icon:'🧩',done:!!done.cloze},
        {icon:'🎧',done:!!done.listen},
        {icon:'🎤',done:!!done.speak},
        {icon:'⚡',done:!!done.reflex}
      ]
    };
  });
  main.innerHTML=
    (decks.length>1?
      '<div class="sectitle">Bộ học</div>'+
      deckGridHTML('deck', deckItems, deckPage)
    :'')+
    '<div class="sectitle">Chế độ học'+(curDeck!=='ALL'?' · Bộ '+(parseInt(curDeck,10)+1):'')+'</div>'+
    '<div class="modes">'+
      '<button class="mode '+(due>0?'due':'')+'" data-due="'+due+' due" data-mode="flash">'+
        '<span class="ico">🗂️</span><div class="mt">Flashcard</div><div class="md">Lật thẻ + SRS</div></button>'+
      '<button class="mode" data-mode="quiz">'+
        '<span class="ico">✍️</span><div class="mt">Quiz</div><div class="md">Trắc nghiệm JP↔VI</div></button>'+
      '<button class="mode" data-mode="cloze">'+
        '<span class="ico">🧩</span><div class="mt">Điền từ</div><div class="md">Điền vào câu ví dụ</div></button>'+
      '<button class="mode" data-mode="listen">'+
        '<span class="ico">🎧</span><div class="mt">Luyện nghe</div><div class="md">Nghe rồi chọn nghĩa</div></button>'+
      '<button class="mode" data-mode="speak">'+
        '<span class="ico">🎤</span><div class="mt">Luyện nói</div><div class="md">Đọc theo, chấm phát âm</div></button>'+
      '<button class="mode" data-mode="reflex">'+
        '<span class="ico">⚡</span><div class="mt">Phản xạ '+((typeof uiSettings!=='undefined'&&uiSettings.reflexSec)||3)+'s</div><div class="md">Thấy nghĩa, nói ra từ</div></button>'+
      '<button class="mode" data-mode="favorites">'+
        '<span class="ico">⭐</span><div class="mt">Yêu thích</div><div class="md">'+(Object.keys(store.favorites).length?Object.keys(store.favorites).length+' từ đã lưu':'Chưa có từ nào')+'</div></button>'+
    '</div>';
  if(decks.length>1){
    $('#deckPrev').onclick=function(){ deckPage=Math.max(0,deckPage-1); homeDashboard(true); };
    $('#deckNext').onclick=function(){ deckPage=deckPage+1; homeDashboard(true); };
    main.querySelectorAll('.deck-card').forEach(function(c){
      c.onclick=function(){ curDeck=c.dataset.key; homeDashboard(true); };
    });
  }
  main.querySelectorAll('.mode').forEach(function(m){
    m.onclick=function(){
      if(m.dataset.mode==='favorites') favoritesMode();
      else startMode(m.dataset.mode);
    };
  });
}
function startMode(m){
  const list=deckPool();
  if(list.length<4){ alert('Bộ này cần ít nhất 4 từ.'); return; }
  if(m==='flash'){ flashIncludeMastered=false; flashMode(list); }
  else if(m==='quiz')  quizMode(list);
  else if(m==='cloze') clozeMode(list);
  else if(m==='listen')listenMode(list);
  else if(m==='speak') speakModeInit(list);
  else if(m==='reflex')reflexMode(list);
}

    };

      /* Đánh dấu "Đã nhớ" đồng thời tính là 1 lượt SRS mức "Được" (quality 2) — thay cho hàng nút Quên/Khó/Được/Dễ đã bỏ */

/* ═══════════════ QUIZ ═══════════════ */
function quizMode(list){
  onBack=homeDashboard;
  var deckLabel = curDeckRangeLabel();
  list = list.filter(function(v){return !isMastered(v.id);});
  if(list.length<4){ main.innerHTML='<div class="note">Bạn đã thuộc gần hết từ trong bộ này, cần ít nhất 4 từ chưa thuộc để tạo Quiz! 🎉</div>'; setHeader('Quiz','',true); return; }
  var queue = curDeck==='ALL' ? shuffle(list).slice(0,15) : shuffle(list);
  var i=0, score=0;
  function render(){
    if(i>=queue.length) return finish('quiz',queue.length,score);
    var v=queue[i];
    var jp2vi=Math.random()<0.5;
    setHeader('Quiz',(deckLabel?deckLabel+' · ':'')+(i+1)+' / '+queue.length+' · '+score+'đ',true);
    var q = jp2vi? v.w : v.vi;

    var opts=shuffle([correct].concat(distract));

      main.querySelectorAll('.opt').forEach(function(b){
        b.onclick=null;

      setTimeout(function(){i++;render();}, ok?750:1600);

  }
  render();
}

/* ═══════════════ ĐIỀN TỪ VÀO CÂU (穴埋め — FR_009) ═══════════════ */
function clozeMode(list){
  onBack=homeDashboard;
  var deckLabel = curDeckRangeLabel();
  /* setHeader trước mọi return sớm — tránh header còn giữ tên màn trước đó */
  setHeader('Điền từ','',true);
  list = list.filter(function(v){return !isMastered(v.id);});
  var usable=[];
  for(var k=0;k<list.length;k++){
    var pos=findCloze(list[k]);
    if(pos) usable.push({v:list[k], pos:pos});
  }
  if(usable.length<4){
    main.innerHTML='<div class="note">Bộ này không đủ 4 từ có câu ví dụ dùng được để tạo bài Điền từ. Hãy thử Quiz hoặc Flashcard nhé!</div>';
    return;
  }
  var queue = curDeck==='ALL' ? shuffle(usable).slice(0,15) : shuffle(usable);
  var i=0, score=0;
  function render(){
    if(i>=queue.length) return finish('cloze', queue.length, score);
    var item=queue[i], v=item.v, pos=item.pos[0], len=item.pos[1];
    var before=v.ex.slice(0,pos), after=v.ex.slice(pos+len);
    setHeader('Điền từ',(deckLabel?deckLabel+' · ':'')+(i+1)+' / '+queue.length+' · '+score+'đ',true);
    var correct=v.w;
    var distract=sample(list,3,v).map(function(x){return x.w;});
    var opts=shuffle([correct].concat(distract));
    var hintLevel=0;
    main.innerHTML=
      '<div class="counter">Điền từ còn thiếu vào câu</div>'+
      '<div style="text-align:center"><span class="tag">'+v.c+' · #'+v.id+'</span></div>'+
      '<div class="cloze-sentence">'+esc(before)+'＿＿＿'+esc(after)+'</div>'+
      '<div id="hintBox"></div>'+
      '<button class="btn btn-ghost" id="hintBtn" style="width:100%;margin-bottom:14px">💡 Gợi ý</button>'+
      '<div class="opts" id="opts">'+
        opts.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>';}).join('')+
      '</div>'+
      '<div class="fb" id="fb"></div>';

    function renderHints(){
      var lines=[];
      if(hintLevel>=1) lines.push('💡 Nghĩa: '+esc(v.vi));
      if(hintLevel>=2) lines.push('💡 Ký tự đầu: '+esc(v.w.charAt(0))+'…');
      if(hintLevel>=3) lines.push('💡 Cách đọc: '+esc(v.r));
      $('#hintBox').innerHTML = lines.map(function(l){return '<div class="note" style="margin-top:8px">'+l+'</div>';}).join('');
      if(hintLevel>=3) $('#hintBtn').classList.add('hidden');
    }
    $('#hintBtn').onclick=function(){ hintLevel++; renderHints(); };

    main.querySelectorAll('.opt').forEach(function(btn){btn.onclick=function(){
      var chosen=opts[+btn.dataset.k];
      var ok=chosen===correct;
      main.querySelectorAll('.opt').forEach(function(b){
        b.onclick=null;
        var val=opts[+b.dataset.k];
        if(val===correct)b.classList.add('correct');
        else if(b===btn)b.classList.add('wrong');
        else b.classList.add('dim');
      });
      if(ok){score++;reviewCard(v.id,2);}else{reviewCard(v.id,0);}
      $('#hintBtn').classList.add('hidden');
      var full = esc(before)+'<span class="cloze-fill">'+esc(v.ex.slice(pos,pos+len))+'</span>'+esc(after);
      var hasJp = /[぀-ヿ一-鿿]/.test(v.ex);
      $('#fb').innerHTML=
        (ok?'<span class="ok">Chính xác!</span>':'<span class="no">Đáp án: '+esc(correct)+'</span>')+
        '<div class="cloze-sentence" style="margin-top:10px">'+full+
          (hasJp?' <button class="speaker" id="clozeSpk" style="width:36px;height:36px;font-size:16px;margin:0;vertical-align:middle">🔊</button>':'')+
        '</div>';
      if(hasJp && $('#clozeSpk')) $('#clozeSpk').onclick=function(){speak(v.ex);};
      setTimeout(function(){i++;render();}, ok?750:1600);
    };});
  }
  render();
}

/* ═══════════════ LISTENING ═══════════════ */
function listenMode(list){
  onBack=homeDashboard;
  var deckLabel = curDeckRangeLabel();
  /* setHeader ngay đầu hàm (trước mọi return) — tránh header còn giữ tên màn trước đó nếu có early-return.
     Không gác cổng bằng speechSynthesis nữa: luồng nghe chính là Google TTS qua <audio>, không phụ thuộc
     Web Speech API — Android WebView thường thiếu speechSynthesis nhưng vẫn phát <audio> bình thường. */
  setHeader('Luyện nghe','',true);
  list = list.filter(function(v){return !isMastered(v.id);});
  if(list.length<4){ main.innerHTML='<div class="note">Bạn đã thuộc gần hết từ trong bộ này, cần ít nhất 4 từ chưa thuộc để luyện nghe! 🎉</div>'; setHeader('Luyện nghe','',true); return; }
  var queue = curDeck==='ALL' ? shuffle(list).slice(0,15) : shuffle(list);
  var i=0, score=0;
  function render(){
    if(i>=queue.length) return finish('listen',queue.length,score);
    var v=queue[i];
    setHeader('Luyện nghe',(deckLabel?deckLabel+' · ':'')+(i+1)+' / '+queue.length+' · '+score+'đ',true);
    var useEx = v.ex && v.ex.length>4 && Math.random()<0.5;
    var audio = useEx? v.ex : v.w;
    var correct=v.vi;
    var distract=sample(list,3,v).map(function(x){return x.vi;});
    var opts=shuffle([correct].concat(distract));
    main.innerHTML=
      '<div class="counter">Nghe rồi chọn nghĩa đúng</div>'+
      '<div class="card" style="min-height:130px">'+
        '<span class="tag">'+v.c+' · #'+v.id+'</span>'+
        '<button class="mic" id="play" style="animation:none;background:var(--brand)">🔊</button>'+
        '<div class="qhint">Chạm để nghe lại '+(useEx?'(câu ví dụ)':'(từ)')+'</div>'+
      '</div>'+
      '<div class="opts">'+opts.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>';}).join('')+'</div>'+
      '<div class="fb" id="fb"></div>';
    var playFn=function(){speak(audio, useEx?0.95:0.85);};
    $('#play').onclick=playFn; setTimeout(playFn,400);
    main.querySelectorAll('.opt').forEach(function(btn){btn.onclick=function(){
      var chosen=opts[+btn.dataset.k], ok=chosen===correct;
      main.querySelectorAll('.opt').forEach(function(b){b.onclick=null;var val=opts[+b.dataset.k];
        if(val===correct)b.classList.add('correct');else if(b===btn)b.classList.add('wrong');else b.classList.add('dim');});
      if(ok){score++;reviewCard(v.id,2);}else reviewCard(v.id,0);
      $('#fb').innerHTML=(ok?'<span class="ok">✓ ':'<span class="no">✗ ')+esc(v.w)+' ('+esc(v.r)+')</span>';
      setTimeout(function(){i++;render();},ok?900:1800);
    };});
  }
  render();
}

/* ═══════════════ SPEAKING (with mic permission fix) ═══════════════ */
async function speakModeInit(list){
  onBack=homeDashboard;
  if(isNativeApp()){ speakMode(list); return; }
  await checkMicPermission();
  if(micPermission!=='granted' && micPermission!=='unsupported'){
    setHeader('Luyện nói','',true);
    main.innerHTML=micBannerHTML()+
      '<div class="note">Chế độ Luyện nói cần quyền microphone để chấm điểm phát âm.<br>Nếu không cấp quyền, bạn vẫn có thể nghe mẫu và đọc theo.</div>'+
      '<button class="btn btn-primary" id="startAnyway" style="margin-top:14px">Bắt đầu luyện nói</button>';
    if($('#reqMic')) $('#reqMic').onclick=async function(){
      var ok = await requestMicPermission();
      if(ok){ speakMode(list); }
      else { main.querySelector('.mic-banner').innerHTML='Mic bị từ chối. Vào <b>Cài đặt trình duyệt → Quyền</b> để bật lại.'; }
    };
    $('#startAnyway').onclick=function(){ speakMode(list); };
    return;
  }
  speakMode(list);
}

function speakMode(list){
  onBack=homeDashboard;
  var deckLabel = curDeckRangeLabel();
  list = list.filter(function(v){return !isMastered(v.id);});
  if(!list.length){ main.innerHTML='<div class="note">Bạn đã thuộc hết từ trong bộ này! 🎉</div>'; setHeader('Luyện nói','',true); return; }
  var queue = curDeck==='ALL' ? shuffle(list).slice(0,12) : shuffle(list);
  var i=0, total=0, sum=0, listening=false;
  var supported=hasSR() && micPermission!=='denied';
  function render(){
    if(i>=queue.length) return finish('speak',queue.length, total?Math.round(sum/total):0, true);
    var v=queue[i];
    setHeader('Luyện nói',(deckLabel?deckLabel+' · ':'')+(i+1)+' / '+queue.length,true);
    main.innerHTML=
      '<div class="card" style="min-height:170px">'+
        '<span class="tag">'+v.c+' · #'+v.id+'</span>'+
        '<div class="jp" style="font-size:34px">'+esc(v.w)+'</div>'+
        '<div class="reading">'+esc(v.r)+'</div>'+
        '<div class="mean" style="font-size:15px">'+esc(v.vi)+'</div>'+
        '<button class="speaker" id="spk">🔊</button>'+
      '</div>'+
      (supported?
        '<button class="mic" id="mic">🎤</button>'+
        '<div class="qhint" id="mhint">Chạm mic rồi đọc to từ này (≥90 điểm mới tự động qua từ tiếp theo)</div>'+
        '<div class="heard hidden" id="heard"></div>'+
        '<div class="fb" id="fb"></div>'
      :
        '<div class="note">Microphone không khả dụng. Hãy nghe mẫu và đọc theo (shadowing).</div>'
      )+
      '<button class="btn btn-primary" id="next" style="margin-top:14px">Tiếp theo →</button>';
    $('#spk').onclick=function(){speak(v.w);};
    setTimeout(function(){speak(v.w);},300);
    $('#next').onclick=function(){ if(listening) cancelRecognition(); i++; render(); };
    if(!supported){ return; }
    var mic=$('#mic'), hint=$('#mhint'), heard=$('#heard'), fb=$('#fb');
    mic.onclick=async function(){
      if(listening){ cancelRecognition(); return; }
      try{
        var ok = await ensureMicReady();
        if(!ok){ hint.textContent='Mic bị từ chối. Vào Cài đặt để bật.'; return; }
        listening=true; mic.classList.add('rec'); mic.textContent='⏹'; hint.textContent='Đang nghe... đọc to lên';
        var alts = await recognizeOnce('ja-JP');
        var best=Math.max.apply(null,alts.map(function(a){return Math.max(similarity(a,v.w),similarity(a,v.r));}));
        heard.classList.remove('hidden'); heard.textContent='Bạn đọc: '+alts[0];
        total++; sum+=best;
        playScoreSound(best);
        /* Chỉ tự động qua từ tiếp theo khi đạt ≥90 điểm — dưới đó phải bấm "Tiếp theo" thủ công hoặc thử lại mic */
        fb.innerHTML = best>=90?'<span class="ok">🌟 Tuyệt! '+best+' điểm — tự động qua từ tiếp theo...</span>'
                     : best>=51?'<span class="ok">👍 Khá ổn: '+best+' điểm — thử lại hoặc bấm "Tiếp theo" để qua</span>'
                     : '<span class="no">💪 '+best+' điểm — thử lại hoặc bấm "Tiếp theo" để qua</span>';
        if(best>=51)reviewCard(v.id,2);
        if(best>=90){ setTimeout(function(){i++;render();},1900); }
      }catch(err){
        hint.textContent='Không nghe được ('+err+'). Chạm mic thử lại.';
        if(err==='not-allowed') micPermission='denied';
      }finally{
        mic.classList.remove('rec');mic.textContent='🎤';listening=false;
      }
    };
  }
  render();
}

/* ═══════════════ PHẢN XẠ N GIÂY (瞬間作文 — FR_010) ═══════════════ */
function reflexMode(list){
  onBack=homeDashboard;
  var deckLabel = curDeckRangeLabel();
  /* setHeader trước mọi return sớm */
  setHeader('Phản xạ','',true);
  list = list.filter(function(v){return !isMastered(v.id);});
  if(list.length<4){ main.innerHTML='<div class="note">Bộ này cần ít nhất 4 từ chưa thuộc.</div>'; return; }
  /* Đọc phòng thủ — nếu FR_011 vì lý do gì đó chưa chạy trước, vẫn không lỗi undefined */
  var sec = (typeof uiSettings!=='undefined' && uiSettings.reflexSec) || 3;
  var queue = curDeck==='ALL' ? shuffle(list).slice(0,12) : shuffle(list);
  var i=0, score=0, timer=null;
  var R=44, C=2*Math.PI*R;

  function render(){
    if(timer){ clearInterval(timer); timer=null; }
    if(i>=queue.length) return finish('reflex', queue.length, score);
    renderPhase1(queue[i]);
  }

  function renderPhase1(v){
    setHeader('Phản xạ '+sec+' giây', (deckLabel?deckLabel+' · ':'')+(i+1)+' / '+queue.length, true);
    main.innerHTML=
      '<div class="qhint" style="text-align:center">Đọc to từ tiếng Nhật trước khi hết giờ</div>'+
      '<div class="mean" style="font-size:calc(23px * var(--fs-scale,1));text-align:center;margin:14px 0">'+esc(v.vi)+'</div>'+
      '<div class="reflex-ring-wrap">'+
        '<svg width="104" height="104" viewBox="0 0 104 104" style="transform:rotate(-90deg)">'+
          '<circle cx="52" cy="52" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="8"/>'+
          '<circle id="reflexRing" cx="52" cy="52" r="'+R+'" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="0"/>'+
        '</svg>'+
        '<div class="reflex-ring-num" id="reflexNum">'+sec+'</div>'+
      '</div>'+
      '<div style="text-align:center"><button class="btn btn-ghost" id="skipBtn">Xem đáp án ngay</button></div>';

    var start=Date.now();
    var ring=$('#reflexRing'), numEl=$('#reflexNum');
    timer=setInterval(function(){
      /* Chống chạy tiếp khi user đã rời màn — kiểm tra phần tử SVG còn trong DOM không */
      if(!document.body.contains(ring)){ clearInterval(timer); timer=null; return; }
      var elapsed=(Date.now()-start)/1000;
      var remain=Math.max(0, sec-elapsed);
      ring.setAttribute('stroke-dashoffset', C*(1-remain/sec));
      numEl.textContent=Math.ceil(remain);
      if(remain<=0){ clearInterval(timer); timer=null; renderPhase2(v); }
    }, 60);
    $('#skipBtn').onclick=function(){
      if(timer){ clearInterval(timer); timer=null; }
      renderPhase2(v);
    };
  }

  function renderPhase2(v){
    if(timer){ clearInterval(timer); timer=null; }
    setHeader('Phản xạ '+sec+' giây', (deckLabel?deckLabel+' · ':'')+(i+1)+' / '+queue.length, true);
    main.innerHTML=
      '<div class="card" style="min-height:170px">'+
        '<span class="tag">'+v.c+' · #'+v.id+'</span>'+
        '<div class="jp" style="font-size:34px">'+esc(v.w)+'</div>'+
        '<div class="reading">'+esc(v.r)+'</div>'+
        '<div class="mean" style="font-size:15px">'+esc(v.vi)+'</div>'+
        (v.en?'<div class="en">'+esc(v.en)+'</div>':'')+
        '<button class="speaker" id="spk">🔊</button>'+
      '</div>'+
      '<div class="qhint" style="margin-top:14px;text-align:center">Anh có bật ra được từ này trong '+sec+' giây không?</div>'+
      '<div class="row" style="margin-top:12px">'+
        '<button class="btn btn-ghost" id="noBtn">Chưa bật ra được</button>'+
        '<button class="btn btn-primary" id="yesBtn">Bật ra được</button>'+
      '</div>';
    $('#spk').onclick=function(){speak(v.w);};
    setTimeout(function(){speak(v.w);},300);
    $('#noBtn').onclick=function(){ reviewCard(v.id,0); i++; render(); };
    $('#yesBtn').onclick=function(){ reviewCard(v.id,2); score++; i++; render(); };
  }

  render();
}

/* ═══════════════ FINISH SCREEN ═══════════════ */
function finish(mode,total,score,isPct){
  if(curDeck!=='ALL') markDeckDone(curCat, curDeck, mode);
  var learned=learnedCount();
  var msg='';
  if(score!==undefined){
    var val=isPct? score : Math.round(score/total*100);
    msg = isPct? 'Điểm phát âm trung bình: <b>'+score+'</b>/100'
               : 'Đúng <b>'+score+'/'+total+'</b> ('+val+'%)';
  }else msg='Đã ôn <b>'+total+'</b> thẻ';
  setHeader('Hoàn thành','',true);
  main.innerHTML=
    '<div class="done">'+
      '<div class="big">🎉</div>'+
      '<h2>Xong buổi học!</h2>'+
      '<p>'+msg+'</p>'+
      '<p style="color:var(--sub);font-size:14px">Tổng đã thuộc: '+learned+'/'+VOCAB.length+' từ · Streak '+(store.stats.streak||0)+'</p>'+
      '<div class="row" style="margin-top:20px">'+
        '<button class="btn btn-ghost" id="again">Học tiếp</button>'+
        '<button class="btn btn-primary" id="hm">Về trang chủ</button>'+
      '</div>'+
    '</div>';
  $('#hm').onclick=function(){homeDashboard();};
  $('#again').onclick=function(){startMode(mode);};
}

/* ═══════════════ INIT ═══════════════ */
checkMicPermission();
if(!VOCAB.length){ main.innerHTML='<div class="note">Chưa có dữ liệu từ vựng. Hãy chạy lại build_app.py.</div>'; }
else home();
</script>
